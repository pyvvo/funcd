# funcdconfig.yaml — the funcd daemon config (ADR-0061). This file documents EVERY available key:
# the values used to run the examples locally are uncommented; the rest are commented out, each
# showing its built-in default so you can see the whole surface at a glance.
#
# Start the daemon against it:   funcd --config examples/funcdconfig.yaml
# The file is OPTIONAL — every key has a default, so `funcd` runs with no config at all. Precedence
# is flag > env (FUNCD_*) > this file > default, so a FUNCD_* env var still overrides any value here.
# EVERY key but auth.credentials (file-only, ADR-0171) also has a FUNCD_* env override (ADR-0062): e.g. server.listenAddr ← FUNCD_LISTEN_ADDR,
# storage.dataDir ← FUNCD_DATA_DIR, log.level ← FUNCD_LOG_LEVEL, runtime.mode ← FUNCD_RUNTIME.
#
# As shipped this is a zero-infra DEV config: in-memory substrate (nothing on disk) + the process
# runtime (the embedded Node/Python shim), control plane + data plane on localhost. For a real
# deployment, switch storage.mode → file, runtime.mode → containerd, set auth.credentials, and a
# secrets.encryptionKeyFile (see the commented blocks).
apiVersion: funcd.io/v1alpha1     # optional envelope (validated only if present)
kind: FuncdConfig                 # optional

# --- server: the control-plane + data-plane bind addresses (code-only before ADR-0061) ----------
server:
  listenAddr: 127.0.0.1:8080      # control-plane API. default: 0.0.0.0:8080
  dataPlaneAddr: 127.0.0.1:8081   # function-invoke ingress. default: 127.0.0.1:0 (ephemeral)
  # tls:                          # HTTPS on both listeners (ADR-0111)
  #   enabled: false              # default: false (plaintext)
  #   mode: selfsigned            # selfsigned | provided | acme. default: selfsigned
  #   hosts:                      # extra certificate hosts, merged with the routed hosts. default: none
  #   certFile: ""                # PEM cert (chain), mode: provided. default: ""
  #   keyFile: ""                 # PEM key, mode: provided. default: ""
  #   email: ""                   # ACME account email, mode: acme. default: ""
  #   caDir: ""                   # ACME directory URL, mode: acme. default: "" ⇒ Let's Encrypt
  # limits:                       # data-plane ingress limits (ADR-0112)
  #   ratePerMin: 0               # requests per minute per key. default: 0 (rate limit off)
  #   burst: 0                    # token-bucket depth. default: 0 ⇒ ratePerMin
  #   key: clientIP               # clientIP | function. default: clientIP
  #   maxBodyBytes: 0             # request body cap. default: 0 (off)
  #   maxInFlight: 0              # concurrent request cap. default: 0 (off)
  #   maxKeys: 4096               # rate-limit buckets kept. default: 4096
  # auth:
  #   edge: false                 # enforce each target's auth stance on the data plane (ADR-0113). default: false
  # observability:                # edge observability (ADR-0114)
  #   metrics: false              # RED metrics. default: false
  #   accessLog: false            # access log. default: false
  #   trace: false                # edge trace span. default: false
  # shaping:                      # edge response shaping (ADR-0114)
  #   cors:
  #     allowOrigins:             # setting origins turns CORS on. default: none (CORS off)
  #     allowMethods:             # default: none
  #     allowHeaders:             # default: none
  #     maxAgeSeconds: 0          # preflight cache lifetime. default: 0 (no Access-Control-Max-Age)
  #   headers:
  #     set:                      # header → value, set on every response. default: none
  #     remove:                   # headers removed from every response. default: none
  #   compression: false          # gzip responses. default: false
  # network:                      # worker egress isolation (ADR-0115/0117); Linux + containerd only
  #   egress: false               # default-deny worker egress. default: false
  #   egressGatewayPort: 0        # egress gateway host port; required when egress is on. default: 0
  #   dnsForwarderPort: 0         # DNS forwarder host port; 0 ⇒ no egress gateway. default: 0
  #   dnsResolver: ""             # upstream resolver host:port; required when egress is on. default: ""
  #   internalAllow:              # node-service host:port addresses workers may reach. default: none
  #   workerSyncInterval: 2s      # egress WorkerIndex sync cadence (ADR-0163). default: 2s
  # shutdownTimeout: 15s          # HTTP, Sensor and workflow-run drain at shutdown. default: 15s; it + runtime.process.stopGrace (or containerd's 10s) + the 5s close must fit the unit's TimeoutStopSec (30s)

# --- storage: the blob+bus substrate (ADR-0043) + the data root --------------------------------
storage:
  mode: memory                    # file | memory. default: file (memory = ephemeral, nothing on disk)
  dataDir: /tmp/funcd-demo        # data root (process shim + file-mode blob/nats). default: /var/lib/funcd
  # metastoreDir: ""              # control-plane metastore Badger dir (ADR-0065). default: <dataDir>/store

# --- per-service stores: each service owns its OWN dedicated Badger instance (restore-class +
#     service-ownership — never merged). Each store dir defaults under <dataDir>; uncomment to
#     relocate one or to tune a service. In storage.mode: memory the dirs are unused (in-memory
#     engines). ----------------------------------------------------------------------------------
# kvstore:                        # function-facing KV service (ADR-0066)
#   engine: memory                # memory | badger. default: memory (ephemeral)
#   dataDir: ""                   # KV Badger dir when engine: badger. default: <dataDir>/kv
#   maxStoresPerNamespace: 100    # KVStore count cap per namespace (ADR-0072); negative ⇒ no cap. default: 100
#   backup:                       # DR export to object storage (ADR-0067); engine: badger only
#     enabled: false              # default: false
#     target: ""                  # bucket URL; required when enabled. default: ""
#     interval: 30s               # incremental export cadence. default: 30s
#     rebaseline: 24h             # full re-baseline cadence. default: 24h
#     rebaselineRetry: 1h         # delay before retrying a failed re-baseline. default: 1h
#     chunkBytes: 67108864        # max bytes per exported object. default: 67108864 (64 MiB)
#   cdc:                          # change feed to the bus (ADR-0068); engine: badger only
#     enabled: false              # default: false
#     sink: ""                    # bus subject; required when enabled. default: ""
#     retention: 24h              # how long the feed's stream keeps a change. default: 24h
# backup:                         # platform backup target (ADR-0203); ADR-0205 runs the backups
#   target: ""                    # s3://<bucket>?region=…&endpoint=…&prefix=<p>/ or file:///<absolute dir>. default: ""
#   credentialsFile: ""           # s3:// only: AWS shared credentials file, its [default] profile the only source. default: "" (the SDK chain)
#   singleWriter: false           # one funcd writes here: a target without If-None-Match then warns, not fails. default: false
#   retention:                    # expiries of the lifecycle rules funcd logs at start (examples/backup-lifecycle.md)
#     hourly: 48                  # hours. default: 48
#     daily: 30                   # days; 0 = no daily class. default: 30
#     weekly: 12                  # weeks; 0 = no weekly class. default: 12
#     verified: 2                 # days a gen/verified/ copy is kept. default: 2
#     preUpgrade: 3               # complete pre-upgrade generations funcd upgrade keeps; older ones it lists to prune (ADR-0207). default: 3
#   encryption:                   # ADR-0204; the escrow set and rotation: examples/backup-escrow.md
#     recipients:                 # age recipients files (age1… or age1pq1…), at least 2 distinct recipients. default: none
#       - /etc/funcd/backup-recipients.txt
#     none: false                 # store unsealed; needs no recipients and secrets.encryptionKeyFile. default: false
#   interval: 1h                  # time between run starts (ADR-0205). default: 1h
#   retryInterval: 5m             # wait after a failed run before the next attempt. default: 5m
#   objectives:
#     rpo: 2h                     # rpoRisk once the newest verified generation is this old. default: 2h
# recovery:                       # safe mode after repeated unclean starts (ADR-0207)
#   safeMode:
#     afterCrashes: 3             # unclean starts in a row before a held start; twice it stops with exit status 70. default: 3
#     stableAfter: 10m            # continuous run that makes a start clean; at least 1ms. default: 10m
# workflow:                       # workflow engine (ADR-0094)
#   dataDir: ""                   # run-state Badger dir. default: <dataDir>/workflow
#   defaultStepTimeout: 300s      # per-step invocation timeout. default: 300s
#   defaultRetry: 1               # per-step attempt cap when a step declares no retry. default: 1
#   retention: 720h               # how long a terminal run is kept. default: 720h
#   payloadLimit: 262144          # max run input / step output bytes. default: 262144 (256 KiB)
#   maxStepsInFlight: 64          # function-step calls in flight across all runs; 0 = no cap. default: 64
#   artifactPollInterval: 5s      # re-check of a Workflow whose step artifact is not pushed (ADR-0163). default: 5s
#   defaultRetryBackoff: 0s       # first retry gap of a step with no retry.backoff, doubled up to 1h. default: 0s (none)
# eventing:                       # Sensor delivery reliability (ADR-0118)
#   deliveryAttempts: 3           # attempts before a failed action is dead-lettered. default: 3
#   maxDeliveriesInFlight: 32     # delivery workers across all targets (ADR-0156). default: 32
#   maxInFlightPerTarget: 4       # deliveries in flight to one Function or Workflow. default: 4
#   maxQueuedPerSensor: 4096      # undelivered deliveries per Sensor; more are dead-lettered. default: 4096
#   blobPollInterval: 15s         # poll cadence of blob: EventSources (ADR-0119). default: 15s
#   bucketRecheckInterval: 15s    # re-check of every blob EventSource's Bucket (ADR-0163). default: 15s
#   deliveryBackoffInitial: 100ms # first Sensor delivery retry wait, doubled. default: 100ms
#   deliveryBackoffMax: 10s       # cap of that wait; at least the initial wait. default: 10s (or the initial wait when larger)
#   deadletter:
#     dataDir: ""                 # event store Badger dir: dead letters and blob seen lists (ADR-0201). default: <dataDir>/deadletter
#     retention: 720h             # how long a parked entry is kept (dead letters only). default: 720h
#     maxEntries: 1000            # parked entries per namespace (dead letters only). default: 1000

# invoke:                         # function invocation (ADR-0147, ADR-0151)
#   maxNestedInFlight: 10         # nested (fn-to-fn) calls in flight to one Function; 0 = default 10; cannot be disabled
#   defaultTimeout: 60s           # how long an external invoke waits for its response to start when the Function sets no spec.timeout; at most 1h. default: 60s
#   activationTimeout: 30s        # longest cold-start hold of a wake, then 503 (ADR-0163). default: 30s
#   reclaimInterval: 30s          # idle-reclaim (scale-to-zero) cadence. default: 30s

# --- auth: control-plane and edge credentials (ADR-0028, ADR-0171) -----------------------------
auth:
  token: funcd-dev-token          # one developer credential. default: a built-in dev token (with a warning)
  namespaces:                     # namespaces the token grants. default: [default]
    - default
  # credentials:                  # role-scoped tokens, one file each, read at startup. default: none
  #                               #   with it, remove token and non-default namespaces (and unset FUNCD_TOKEN)
  #   - tokenFile: /etc/funcd/tokens/ops    # umask 077; openssl rand -hex 32 > /etc/funcd/tokens/ops
  #     role: admin                         # admin | developer | viewer; an admin takes no namespaces
  #   - tokenFile: /etc/funcd/tokens/team-a # mode 0600 or 0400, owned by funcd's user or root
  #     role: developer
  #     namespaces:                         # developer or viewer scope. default: default; quote a numeric name
  #       - team-a

# --- runtime: the function-execution lane (ADR-0036/0054) --------------------------------------
runtime:
  mode: process                   # process | containerd. default: process (embedded shim; containerd = prod lane)
  bootBackoffInitial: 10s         # wait before a worker that crashed while booting is created again (ADR-0160). default: 10s
  bootBackoffMax: 5m              # the wait doubles per crash in a row up to this. default: 5m (or the initial wait when larger)
  # supervisionPeriod: 10s        # steady re-check of a Ready Function or CatalogService; crash replacement (ADR-0163). default: 10s
  # bootTimeout: 1m               # a replica not ready this long after creation is stopped; above invoke.activationTimeout. default: 1m
  # drainGrace: 30s               # longest drain of a demoted revision. default: 30s
  # handOutSettle: 2s             # idle-after-hand-out wait; at most drainGrace. default: 2s
  # drainPollInterval: 1s         # longest gap between drain passes. default: 1s
  # livenessTimeout: 30s          # a listening replica silent on /health/liveness this long is restarted (ADR-0215); when set, at least twice supervisionPeriod. default: 30s, or three supervisionPeriod when larger
  process:
    stopGrace: 3s                 # SIGTERM-to-SIGKILL wait for stop, shutdown and the boot reap (ADR-0167); 0 < d <= 10s. default: 3s; server.shutdownTimeout + stopGrace + 5s must fit TimeoutStopSec
  # containerd:                   # used only when mode: containerd
  #   socket: ""                  # external containerd socket. default: "" (funcd manages a private one, ADR-0054)
  #   root: ""                    # containerd state root. default: <dataDir>/containerd
  #   snapshotter: overlayfs      # default: overlayfs
  #   cniBinDir: /opt/cni/bin     # CNI plugin dir. default: /opt/cni/bin
  #   cniConfDir: ""              # CNI conflist dir. default: <dataDir>/cni
  #   stateDir: ""                # files funcd bind-mounts into workers (e.g. resolv.conf). default: <dataDir>/run
  #   subnetCIDR: 10.63.0.0/16    # lateral bridge subnet. default: 10.63.0.0/16
  #   imagePrefix: funcd/runtime- # runtime image prefix; a custom one is pulled from its registry. default: funcd/runtime- (embedded images only)
  #   imageOverride:              # runtimeFamily → image ref, pulled instead of the embedded tar. default: none

# --- secrets: at-rest encryption of Secret values (ADR-0022) -----------------------------------
# secrets:
#   encryptionKeyFile: /etc/funcd/secret.key   # path to a 32-byte AES-256 key. default: "" ⇒ Secret values
#                                              #   are NOT encrypted (a startup warning). Never inline the key.

# --- log: structured logging (ADR-0009) --------------------------------------------------------
log:
  format: text                    # json | text. default: json (text is the dev default)
  level: info                     # debug | info | warn | error. default: info

# --- telemetry: OpenTelemetry export (empty endpoint ⇒ disabled) -------------------------------
# telemetry:
#   endpoint: localhost:4317      # OTLP gRPC collector. default: "" ⇒ telemetry disabled
#   insecure: true                # plaintext OTLP (no TLS), for a local collector. default: false

# --- funclog: structured function-log capture (ADR-0081) + its traces signal (ADR-0101) ---------
# funclog:
#   enabled: true                 # capture function logs; if false, raw stdout/stderr is only tailed. default: true
#   segmentMaxBytes: 8388608      # seal + Put a log segment at this size. default: 8388608 (8 MiB)
#   segmentMaxAge: 10s            # ...or after this age, whichever comes first. default: 10s
#   bucket: funcd-system          # the observability bucket; funcd-system is the only value. default: funcd-system
#   traces: true                  # capture per-invocation spans (moot when enabled: false). default: true
#   maxRecordBytes: 65536         # bound on one shim log record; 1024..1048576, 0 = default. default: 65536

# --- s3gateway: the S3-protocol frontend over the blob substrate (ADR-0080/0085) ----------------
# s3gateway:
#   enabled: false                # default: false (no listener)
#   listenAddr: 127.0.0.1:9000    # default: 127.0.0.1:9000
#   endpoint: ""                  # S3 URL given to spec.blob workers; a node address under containerd. default: "" ⇒ http://<listenAddr>
#   maxUploadBytes: 1073741824    # buffered-object cap; multipart buffers ≤ 3× it daemon-wide, ≤ 1× per principal. default: 1073741824 (1 GiB)
#   masterSecretFile: ""          # node master secret, used gateway on or off. default: "" ⇒ generated under <dataDir>/s3gateway

# --- catalog: the per-CatalogService query proxies (ADR-0137) ----------------------------------
# catalog:
#   proxyHost: ""                 # host the proxies publish to functions; a node address under containerd. default: "" ⇒ 127.0.0.1
#   enginePollInterval: 2s        # re-check of an engine not answering its probe yet (ADR-0163). default: 2s
#   engineProbeTimeout: 2s        # bound of one engine probe. default: 2s

# --- controller: the platform controllers (ADR-0170) --------------------------------------------
# controller:
#   gcSweepInterval: 5m           # owner garbage collector sweep period; positive. default: 5m
#   retryBackoffMax: 1s           # cap of the failed-reconcile and re-Watch retry; at least 5ms (ADR-0163). default: 1s
#   referentPollInterval: 2s      # re-check of an object waiting for a referent. default: 2s
#   routeResyncInterval: 10s      # re-check of every live Route. default: 10s

# --- site: declarative static web apps (ADR-0139) ----------------------------------------------
# site:
#   defaultIndex: index.html      # document served for "/" when a Site sets no spec.index. default: index.html

# --- app: App revisions, upgrade timeout and history (ADR-0200) ---------------------------------
# app:
#   upgradeTimeout: 5m            # an upgrade not Ready this long fails its AppRevision; more than runtime.bootTimeout. default: 5m, or twice runtime.bootTimeout when larger
#   revisionHistory: 10           # AppRevisions kept besides the current one; 1..100. default: 10

# --- health: the storage probes behind KVStore and Bucket status (ADR-0215) ---------------------
# health:
#   storageProbeInterval: 10s     # how often the KV engine and blob store are read. default: 10s
#   storageProbeTimeout: 2s       # bound of one storage probe; less than storageProbeInterval. default: 2s
