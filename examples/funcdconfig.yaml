# funcdconfig.yaml — the funcd daemon config (ADR-0061). This file documents EVERY available key:
# the values used to run the examples locally are uncommented; the rest are commented out, each
# showing its built-in default so you can see the whole surface at a glance.
#
# Start the daemon against it:   funcd --config examples/funcdconfig.yaml
# The file is OPTIONAL — every key has a default, so `funcd` runs with no config at all. Precedence
# is flag > env (FUNCD_*) > this file > default, so a FUNCD_* env var still overrides any value here.
# EVERY key also has a FUNCD_* env override (ADR-0062): e.g. server.listenAddr ← FUNCD_LISTEN_ADDR,
# storage.dataDir ← FUNCD_DATA_DIR, log.level ← FUNCD_LOG_LEVEL, runtime.mode ← FUNCD_RUNTIME.
#
# As shipped this is a zero-infra DEV config: in-memory substrate (nothing on disk) + the process
# runtime (the embedded Node/Python shim), control plane + data plane on localhost. For a real
# deployment, switch storage.mode → file, runtime.mode → containerd, set a real auth.token, and a
# secrets.encryptionKeyFile (see the commented blocks).
apiVersion: funcd.io/v1alpha1     # optional envelope (validated only if present)
kind: FuncdConfig                 # optional

# --- server: the control-plane + data-plane bind addresses (code-only before ADR-0061) ----------
server:
  listenAddr: 127.0.0.1:8080      # control-plane API. default: 0.0.0.0:8080
  dataPlaneAddr: 127.0.0.1:8081   # function-invoke ingress. default: 127.0.0.1:0 (ephemeral)
  # tls:                          # HTTPS on both listeners (ADR-0111)
  #   enabled: false              # default: false (plaintext)
  #   mode: selfsigned            # selfsigned | provided | acme. default: selfsigned
  #   hosts:                      # extra certificate hosts, merged with the routed hosts. default: none
  #   certFile: ""                # PEM cert (chain), mode: provided. default: ""
  #   keyFile: ""                 # PEM key, mode: provided. default: ""
  #   email: ""                   # ACME account email, mode: acme. default: ""
  #   caDir: ""                   # ACME directory URL, mode: acme. default: "" ⇒ Let's Encrypt
  # limits:                       # data-plane ingress limits (ADR-0112)
  #   ratePerMin: 0               # requests per minute per key. default: 0 (rate limit off)
  #   burst: 0                    # token-bucket depth. default: 0 ⇒ ratePerMin
  #   key: clientIP               # clientIP | function. default: clientIP
  #   maxBodyBytes: 0             # request body cap. default: 0 (off)
  #   maxInFlight: 0              # concurrent request cap. default: 0 (off)
  # auth:
  #   edge: false                 # enforce each target's auth stance on the data plane (ADR-0113). default: false
  # observability:                # edge observability (ADR-0114)
  #   metrics: false              # RED metrics. default: false
  #   accessLog: false            # access log. default: false
  #   trace: false                # edge trace span. default: false
  # shaping:                      # edge response shaping (ADR-0114)
  #   cors:
  #     allowOrigins:             # setting origins turns CORS on. default: none (CORS off)
  #     allowMethods:             # default: none
  #     allowHeaders:             # default: none
  #     maxAgeSeconds: 0          # preflight cache lifetime. default: 0 (no Access-Control-Max-Age)
  #   headers:
  #     set:                      # header → value, set on every response. default: none
  #     remove:                   # headers removed from every response. default: none
  #   compression: false          # gzip responses. default: false
  # network:                      # worker egress isolation (ADR-0115/0117); Linux + containerd only
  #   egress: false               # default-deny worker egress. default: false
  #   egressGatewayPort: 0        # egress gateway host port; required when egress is on. default: 0
  #   dnsForwarderPort: 0         # DNS forwarder host port; 0 ⇒ no egress gateway. default: 0
  #   dnsResolver: ""             # upstream resolver host:port; required when egress is on. default: ""
  #   internalAllow:              # node-service host:port addresses workers may reach. default: none

# --- storage: the blob+bus substrate (ADR-0043) + the data root --------------------------------
storage:
  mode: memory                    # file | memory. default: file (memory = ephemeral, nothing on disk)
  dataDir: /tmp/funcd-demo        # data root (process shim + file-mode blob/nats). default: /var/lib/funcd
  # metastoreDir: ""              # control-plane metastore Badger dir (ADR-0065). default: <dataDir>/store

# --- per-service stores: each service owns its OWN dedicated Badger instance (restore-class +
#     service-ownership — never merged). Each store dir defaults under <dataDir>; uncomment to
#     relocate one or to tune a service. In storage.mode: memory the dirs are unused (in-memory
#     engines). ----------------------------------------------------------------------------------
# kvstore:                        # function-facing KV service (ADR-0066)
#   engine: memory                # memory | badger. default: memory (ephemeral)
#   dataDir: ""                   # KV Badger dir when engine: badger. default: <dataDir>/kv
#   maxStoresPerNamespace: 100    # KVStore count cap per namespace (ADR-0072); negative ⇒ no cap. default: 100
#   backup:                       # DR export to object storage (ADR-0067); engine: badger only
#     enabled: false              # default: false
#     target: ""                  # bucket URL; required when enabled. default: ""
#     interval: 30s               # incremental export cadence. default: 30s
#     rebaseline: 24h             # full re-baseline cadence. default: 24h
#     chunkBytes: 67108864        # max bytes per exported object. default: 67108864 (64 MiB)
#   cdc:                          # change feed to the bus (ADR-0068); engine: badger only
#     enabled: false              # default: false
#     sink: ""                    # bus subject; required when enabled. default: ""
#     retention: 24h              # change-log retention. default: 24h
# workflow:                       # workflow engine (ADR-0094)
#   dataDir: ""                   # run-state Badger dir. default: <dataDir>/workflow
#   defaultStepTimeout: 300s      # per-step invocation timeout. default: 300s
#   defaultRetry: 1               # per-step attempt cap when a step declares no retry. default: 1
#   retention: 720h               # how long a terminal run is kept. default: 720h
#   payloadLimit: 1048576         # max run input / step output bytes. default: 1048576 (1 MiB)
# eventing:                       # Sensor delivery reliability (ADR-0118)
#   deliveryAttempts: 3           # attempts before a failed action is dead-lettered. default: 3
#   blobPollInterval: 15s         # poll cadence of blob: EventSources (ADR-0119). default: 15s
#   deadletter:
#     dataDir: ""                 # dead-letter-queue Badger dir. default: <dataDir>/deadletter
#     retention: 720h             # how long a parked entry is kept. default: 720h
#     maxEntries: 1000            # parked entries per namespace. default: 1000

# --- auth: the control-plane dev credential (ADR-0028) ------------------------------------------
auth:
  token: funcd-dev-token          # control-plane credential. default: a built-in dev token (with a warning)
  namespaces:                     # namespaces the token grants. default: [default]
    - default

# --- runtime: the function-execution lane (ADR-0036/0054) --------------------------------------
runtime:
  mode: process                   # process | containerd. default: process (embedded shim; containerd = prod lane)
  # containerd:                   # used only when mode: containerd
  #   socket: ""                  # external containerd socket. default: "" (funcd manages a private one, ADR-0054)
  #   root: ""                    # containerd state root. default: <dataDir>/containerd
  #   snapshotter: overlayfs      # default: overlayfs
  #   cniBinDir: /opt/cni/bin     # CNI plugin dir. default: /opt/cni/bin
  #   cniConfDir: ""              # CNI conflist dir. default: <dataDir>/cni
  #   stateDir: ""                # files funcd bind-mounts into workers (e.g. resolv.conf). default: <dataDir>/run
  #   subnetCIDR: 10.63.0.0/16    # lateral bridge subnet. default: 10.63.0.0/16
  #   imagePrefix: funcd/runtime- # curated image prefix. default: funcd/runtime-
  #   imageOverride:              # runtimeFamily → image ref, pulled instead of the embedded tar. default: none

# --- secrets: at-rest encryption of Secret values (ADR-0022) -----------------------------------
# secrets:
#   encryptionKeyFile: /etc/funcd/secret.key   # path to a 32-byte AES-256 key. default: "" ⇒ Secret values
#                                              #   are NOT encrypted (a startup warning). Never inline the key.

# --- log: structured logging (ADR-0009) --------------------------------------------------------
log:
  format: text                    # json | text. default: json (text is the dev default)
  level: info                     # debug | info | warn | error. default: info

# --- telemetry: OpenTelemetry export (empty endpoint ⇒ disabled) -------------------------------
# telemetry:
#   endpoint: localhost:4317      # OTLP gRPC collector. default: "" ⇒ telemetry disabled
#   insecure: true                # plaintext OTLP (no TLS), for a local collector. default: false

# --- funclog: structured function-log capture (ADR-0081) + its traces signal (ADR-0101) ---------
# funclog:
#   enabled: true                 # capture function logs (raw stdout/stderr still flows if false). default: true
#   segmentMaxBytes: 8388608      # seal + Put a log segment at this size. default: 8388608 (8 MiB)
#   segmentMaxAge: 10s            # ...or after this age, whichever comes first. default: 10s
#   bucket: funcd-system          # the observability bucket; funcd-system is the only value. default: funcd-system
#   traces: true                  # capture per-invocation spans (moot when enabled: false). default: true

# --- s3gateway: the S3-protocol frontend over the blob substrate (ADR-0080/0085) ----------------
# s3gateway:
#   enabled: false                # default: false (no listener)
#   listenAddr: 127.0.0.1:9000    # default: 127.0.0.1:9000
#   endpoint: ""                  # S3 URL given to spec.blob workers; a node address under containerd. default: "" ⇒ http://<listenAddr>
#   maxUploadBytes: 1073741824    # buffered-object cap. default: 1073741824 (1 GiB)
#   masterSecretFile: ""          # IAM master secret. default: "" ⇒ generated under <dataDir>/s3gateway

# --- catalog: the per-CatalogService query proxies (ADR-0137) ----------------------------------
# catalog:
#   proxyHost: ""                 # host the proxies publish to functions; a node address under containerd. default: "" ⇒ 127.0.0.1

# --- site: declarative static web apps (ADR-0139) ----------------------------------------------
# site:
#   defaultIndex: index.html      # document served for "/" when a Site sets no spec.index. default: index.html
