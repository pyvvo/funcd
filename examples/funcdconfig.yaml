# funcdconfig.yaml — the funcd daemon config (ADR-0061). This file documents EVERY available key:
# the values used to run the examples locally are uncommented; the rest are commented out, each
# showing its built-in default so you can see the whole surface at a glance.
#
# Start the daemon against it:   funcd --config examples/funcdconfig.yaml
# The file is OPTIONAL — every key has a default, so `funcd` runs with no config at all. Precedence
# is flag > env (FUNCD_*) > this file > default, so a FUNCD_* env var still overrides any value here.
# EVERY key also has a FUNCD_* env override (ADR-0062): e.g. server.listenAddr ← FUNCD_LISTEN_ADDR,
# storage.dataDir ← FUNCD_DATA_DIR, log.level ← FUNCD_LOG_LEVEL, runtime.mode ← FUNCD_RUNTIME.
#
# As shipped this is a zero-infra DEV config: in-memory substrate (nothing on disk) + the process
# runtime (the embedded Node/Python shim), control plane + data plane on localhost. For a real
# deployment, switch storage.mode → file, runtime.mode → containerd, set a real auth.token, and a
# secrets.encryptionKeyFile (see the commented blocks).
apiVersion: funcd.io/v1alpha1     # optional envelope (validated only if present)
kind: FuncdConfig                 # optional

# --- server: the control-plane + data-plane bind addresses (code-only before ADR-0061) ----------
server:
  listenAddr: 127.0.0.1:8080      # control-plane API. default: 0.0.0.0:8080
  dataPlaneAddr: 127.0.0.1:8081   # function-invoke ingress. default: 127.0.0.1:0 (ephemeral)

# --- storage: the blob+bus substrate (ADR-0043) + the data root --------------------------------
storage:
  mode: memory                    # file | memory. default: file (memory = ephemeral, nothing on disk)
  dataDir: /tmp/funcd-demo        # data root (process shim + file-mode blob/nats). default: /var/lib/funcd
  # metastoreDir: ""              # control-plane metastore Badger dir (ADR-0065). default: <dataDir>/store

# --- per-service store dirs: each service owns its OWN dedicated Badger instance (restore-class +
#     service-ownership — never merged). Each defaults under <dataDir>; uncomment to relocate one.
#     In storage.mode: memory these are unused (in-memory engines). --------------------------------
# kvstore:                        # function-facing KV service (ADR-0066)
#   engine: memory                # memory | badger. default: memory (ephemeral)
#   dataDir: ""                   # KV Badger dir when engine: badger. default: <dataDir>/kv
# workflow:                       # workflow engine (ADR-0094)
#   dataDir: ""                   # run-state Badger dir. default: <dataDir>/workflow
# eventing:                       # Sensor delivery reliability (ADR-0118)
#   deadletter:
#     dataDir: ""                 # dead-letter-queue Badger dir. default: <dataDir>/deadletter

# --- auth: the control-plane dev credential (ADR-0028) ------------------------------------------
auth:
  token: funcd-dev-token          # control-plane credential. default: a built-in dev token (with a warning)
  namespaces: [default]           # namespaces the token grants. default: [default]

# --- runtime: the function-execution lane (ADR-0036/0054) --------------------------------------
runtime:
  mode: process                   # process | containerd. default: process (embedded shim; containerd = prod lane)
  # containerd:                   # used only when mode: containerd
  #   socket: ""                  # external containerd socket. default: "" (funcd manages a private one, ADR-0054)
  #   root: ""                    # containerd state root. default: <dataDir>/containerd
  #   snapshotter: overlayfs      # default: overlayfs
  #   cniBinDir: /opt/cni/bin     # CNI plugin dir. default: /opt/cni/bin
  #   cniConfDir: ""              # CNI conflist dir. default: <dataDir>/cni
  #   subnetCIDR: 10.63.0.0/16    # lateral bridge subnet. default: 10.63.0.0/16
  #   imagePrefix: funcd/runtime- # curated image prefix. default: funcd/runtime-
  #   imageOverride: {}           # map[runtimeFamily]ref — pull a runtime from a registry instead of the embedded tar

# --- secrets: at-rest encryption of Secret values (ADR-0022) -----------------------------------
# secrets:
#   encryptionKeyFile: /etc/funcd/secret.key   # path to a 32-byte AES-256 key. default: "" ⇒ Secret values
#                                              #   are NOT encrypted (a startup warning). Never inline the key.

# --- log: structured logging (ADR-0009) --------------------------------------------------------
log:
  format: text                    # json | text. default: json (text is the dev default)
  level: info                     # debug | info | warn | error. default: info

# --- telemetry: OpenTelemetry export (empty endpoint ⇒ disabled) -------------------------------
# telemetry:
#   endpoint: localhost:4317      # OTLP gRPC collector. default: "" ⇒ telemetry disabled
#   insecure: true                # plaintext OTLP (no TLS), for a local collector. default: false
