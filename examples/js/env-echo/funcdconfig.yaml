# Daemon config for the env-echo demo on real containerd (ADR-0093/0057). Part of the mounted example
# bundle — the Lima demo (scripts/lima-env-echo.yaml + the `just lima-example-env-echo` recipe) runs funcd
# against it: file storage and the containerd runtime. No KV engine is needed (this lane only proves
# config/secret env injection).
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
  # Ingress protection (ADR-0112, F75): a body-size cap proves the limiter on real containerd. The
  # cap is generous (existing invokes send tiny `{"data":null}` bodies), so an oversized POST → 413
  # without disturbing the other cases. (Rate limiting is timing-sensitive in a VM — proven by the Go
  # e2e on the real listener instead.)
  limits:
    maxBodyBytes: 1024
  # Edge authn PEP (ADR-0113, F77): enable per-target auth-stance enforcement. The default namespace
  # stays `open` (no edgeDefaults.auth), so /function/env-echo + /echo remain anonymous; only the
  # secure-echo Route (auth: authenticated) requires a bearer.
  auth:
    edge: true
  # Edge observability (ADR-0114, F76): access log + RED metrics on real containerd. Trace stays off
  # (no OTLP collector in the VM); the access log lands on stdout, the metrics on the no-op meter.
  observability:
    metrics: true
    accessLog: true
  # Edge shaping (ADR-0114, F78): CORS + gzip prove the shaping middleware on real containerd. A curl
  # with an allowed `Origin:` gets `Access-Control-Allow-Origin` back; `curl --compressed` a response
  # gets a gzipped body (`Content-Encoding: gzip`). Both are exercised by the env-echo Venom lane.
  shaping:
    cors:
      allowOrigins:
        - https://demo.example
      allowMethods:
        - GET
        - POST
    compression: true
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd
log:
  format: text
  level: info
