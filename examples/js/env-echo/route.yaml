# A Route (ADR-0110, F79) exposing env-echo at path `/echo` (host-less ⇒ any host — valid because the
# default namespace stays implicit; host matching is covered by the Go tests). `/function/env-echo`
# keeps working. This proves the declarative front door serves a matched path on real containerd: a
# request to `/echo` is resolved by the edge router to env-echo and served through the activator (the
# matched `/echo` prefix is stripped, so the solo shim sees "/").
apiVersion: funcd.io/v1alpha1
kind: Route
metadata:
  name: env-echo
  namespace: default
  resourceGroup: rg1
spec:
  rules:
    - path: /echo
      backend:
        function: env-echo
