# A Route (ADR-0113, F77) exposing env-echo at /secure with an `authenticated` stance. With
# server.auth.edge enabled, a request to /secure requires a valid bearer (401 without one); a
# namespace-scoped token (the dev token, scoped to `default`) is authorized. The default namespace
# stays `open`, so /function/env-echo + /echo remain anonymous — no cascade.
apiVersion: funcd.io/v1alpha1
kind: Route
metadata:
  name: secure-echo
  namespace: default
  resourceGroup: rg1
spec:
  auth:
    mode: authenticated
  rules:
    - path: /secure
      backend:
        function: env-echo
