# The sensitive configuration env-echo binds via spec.secrets (ADR-0057). Secret.Spec.Data is a
# map[string][]byte, so YAML values are base64-encoded. API_KEY proves a secret-only value reaches the
# handler; SHARED is deliberately ALSO present in the ConfigMap — the Secret wins it (config-then-secrets
# merge order, ADR-0092/0093).
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: app-secret
  namespace: default
  resourceGroup: rg1
spec:
  type: Opaque   # the SecretType enum is capitalized (ADR-0022)
  data:
    API_KEY: czNjcjN0           # base64("s3cr3t")
    SHARED: ZnJvbS1zZWNyZXQ=    # base64("from-secret")
