# The non-sensitive configuration env-echo binds via spec.config (ADR-0093). ConfigMap Data is a plain
# string map (unlike a Secret, whose Data is base64-encoded []byte). APP_MODE proves a config-only value
# reaches the handler; SHARED is deliberately ALSO present in the Secret — the Secret must win it
# (config-then-secrets merge order, ADR-0092/0093).
apiVersion: funcd.io/v1alpha1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
  resourceGroup: rg1
spec:
  data:
    APP_MODE: prod
    SHARED: from-config
