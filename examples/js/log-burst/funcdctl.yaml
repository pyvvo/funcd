# funcdctl.yaml (ADR-0122) — the colocated CLIENT push/dev config for the Node log-burst (the
# client-side analogue of wrangler.toml), NOT a deploy manifest. It declares only what the client
# tooling needs: the runtime, the handler, and the inline I/O contract. There are no bindings — the
# console.* logs the function emits ARE the point of this example (Path B capture, ADR-0081).
# `funcdctl push . <ref>` bakes the schema-only contract + records the runtime; `funcdctl types` emits
# a .d.ts for FuncInput/FuncOutput; `funcdctl dev` (later) runs it locally.
# Deploy concerns (name, namespace, scaling, placement) live on the hand-written Function CRD
# (burst.yaml, which sits alongside this file) — this config never replaces it.
runtime: nodejs22
handler: handle
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      items:
        type: number
      batch:
        type: string
  output:
    type: object
    additionalProperties: false
    properties:
      emitted:
        type: number
    required:
      - emitted
