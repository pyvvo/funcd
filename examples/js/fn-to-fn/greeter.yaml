# greeter — the CALLEE. An ordinary Function with no links; it doesn't know it's being called.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: greeter
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:greeter   # funcdctl push greeter.mjs (built from src/greeter.ts)
  replicas: 1
  scaling:
    minReplicas: 1            # keep one warm worker (no cold start)
