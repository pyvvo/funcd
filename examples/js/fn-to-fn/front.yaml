# front — the CALLER. Declares a link to greeter and calls it with context.invoke("greeter", …).
# The link IS the capability: with no matching link, context.invoke fails closed (default-deny).
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: front
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  artifact:
    uri: oci-layout:///mnt/funcd-deps/registry:front       # funcdcli push front.mjs (built from src/front.ts)
  replicas: 1
  scaling:
    minReplicas: 1
  links:
    - alias: greeter          # the local name front's handler passes to context.invoke
      target: greeter         # the Function it resolves to (same namespace, latest-Ready revision)
