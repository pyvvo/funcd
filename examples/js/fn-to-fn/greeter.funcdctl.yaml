# greeter.funcdctl.yaml (ADR-0122/ADR-0124) — the colocated CLIENT push/dev config for the Node greeter
# function (the client-side analogue of wrangler.toml), NOT a deploy manifest. This directory holds
# several single-file functions, so each carries its own <stem>.funcdctl.yaml (ADR-0124): `funcdctl push
# greeter.mjs <ref>` resolves THIS file by the `greeter` stem, never front's. greeter is the CALLEE — an
# ordinary Function with no bindings; it doesn't know it's being called. `funcdctl push` bakes the
# schema-only contract + records the runtime; `funcdctl types` emits a .d.ts for FuncInput/FuncOutput.
# Deploy concerns (name, namespace, scaling) live on the hand-written Function CRD (greeter.yaml, beside
# this file) — this config never replaces it.
runtime: nodejs22
handler: handle
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
    required:
      - name
  output:
    type: object
    additionalProperties: false
    properties:
      greeting:
        type: string
    required:
      - greeting
