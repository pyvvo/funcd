# funcdctl.yaml (ADR-0122) — the colocated CLIENT push/dev config for the Node kv-counter (the
# client-side analogue of wrangler.toml), NOT a deploy manifest. It declares only what the client
# tooling needs: the runtime, the handler, the KV binding the code uses, and the inline I/O contract.
# `funcdctl push . <ref>` bakes the schema-only contract + records the runtime; `funcdctl types` emits
# a .d.ts for FuncInput/FuncOutput + the typed KV binding context; `funcdctl dev` (later) runs it locally.
# Deploy concerns (name, namespace, scaling, placement) live on the hand-written Function CRD
# (counter.yaml, which sits alongside this file) — this config never replaces it.
runtime: nodejs22
handler: handle
bindings:
  kv:
    - alias: counters     # the in-code handle: ctx.kv.*('counters', …)
      store: counters-kv  # the KVStore (domain)
      table: table-counters   # the sub-domain counter owns (single writer)
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
  output:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      count:
        type: number
    required:
      - name
      - count
