# kv-counter WITHOUT its spec.kv binding — the fail-closed e2e fixture (ADR-0076). Identical to
# counter.yaml but with no `kv:` block, so the function declares no KV binding. Applying this over the
# bound counter REMOVES the read capability: with no binding, the principal's kvBindings Set is empty,
# so context.kv.get is default-deny (Forbidden). The Venom suite (e2e/kv-counter.venom.yml) applies this
# before its negative testcase to prove binding-as-read-grant is bound-only, not default-allow.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: counter
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:counter
  replicas: 1
  scaling:
    minReplicas: 1
  # no kv: block — the binding (and thus the kv::read capability) is gone.
