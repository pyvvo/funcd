# The owned KVStore the kv-counter function writes to (ADR-0073). The store is a domain; its "table-counters"
# table is a sub-domain owned by the counter function (its single writer). Deletion-protected (bound by
# counter's spec.kv) and quota-bounded; per-op caps default (1 MiB value / 1 KiB key).
apiVersion: funcd.io/v1alpha1
kind: KVStore
metadata:
  name: counters-kv
  namespace: default
  resourceGroup: rg1
spec:
  tables:
    - name: table-counters
      owner: counter
