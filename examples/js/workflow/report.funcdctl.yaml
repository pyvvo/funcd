# report.funcdctl.yaml (ADR-0122/ADR-0124) — the colocated CLIENT push/dev config for the Node report
# step (the client-side analogue of wrangler.toml), NOT a deploy manifest. This directory holds several
# single-file workflow steps, so each carries its own <stem>.funcdctl.yaml (ADR-0124): `funcdctl push
# report.mjs <ref>` resolves THIS file by the `report` stem. report is the join step (join: any) — its
# input is the fan-in composite keyed by parent step name (exactly one of hi/lo present) and it has no
# bindings; its leaf output is the run output. `funcdctl push` bakes the schema-only contract + records
# the runtime; `funcdctl types` emits a .d.ts for FuncInput/FuncOutput.
# Deploy/orchestration concerns (name, namespace, scaling, DAG wiring) live on the hand-written Function
# CRD and workflow.yaml, beside this file — this config never replaces them.
runtime: nodejs22
handler: handle
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      hi:
        type: object
        additionalProperties: false
        properties:
          amount:
            type: number
          score:
            type: number
          tier:
            type: string
        required:
          - amount
          - score
          - tier
      lo:
        type: object
        additionalProperties: false
        properties:
          amount:
            type: number
          score:
            type: number
          tier:
            type: string
        required:
          - amount
          - score
          - tier
  output:
    type: object
    additionalProperties: false
    properties:
      done:
        type: boolean
      tier:
        type: string
    required:
      - done
      - tier
