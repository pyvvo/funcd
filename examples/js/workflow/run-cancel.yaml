# A WorkflowRun applied already-paused, then cancelled from Paused (ADR-0094: cancel is allowed
# from Paused). The Venom suite observes Paused, runs `funcdctl workflow cancel orders-cancel`
# (which sets spec.cancel), and the reconciler terminates it Cancelled — no step ever dispatched.
apiVersion: funcd.io/v1alpha1
kind: WorkflowRun
metadata:
  name: orders-cancel
  namespace: default
  resourceGroup: rg1
spec:
  workflow: orders
  paused: true
  input:
    n: 2
