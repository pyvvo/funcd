# scorer — a small CHILD workflow used as a sub-workflow step by pipeline.yaml (F70/ADR-0099). It has one
# function step (the `score` image) so its derived contract is {amount} → {amount, score}. A parent runs
# it as a `workflow:` step and receives its run output across the boundary.
apiVersion: funcd.io/v1alpha1
kind: Workflow
metadata:
  name: scorer
  namespace: default
  resourceGroup: rg1
spec:
  pooling:
    mode: isolated
    minReplicas: 1
  steps:
    - name: s
      function:
        image: oci-layout:///mnt/funcd-deps/registry:score
