# pipeline — a PARENT workflow with a `workflow:` sub-workflow step (F70/ADR-0099): feed (a function step)
# → sub (runs the child workflow `scorer` inline; its run output = the step output). The engine drives the
# child inline over the same engine; typed edges hold across the boundary via F65 (sub's contract IS the
# child's derived status.contract), and `describe` shows sub Succeeded once the child terminated.
apiVersion: funcd.io/v1alpha1
kind: Workflow
metadata:
  name: pipeline
  namespace: default
  resourceGroup: rg1
spec:
  pooling:
    mode: isolated
    minReplicas: 1
  steps:
    - name: feed
      function:
        image: oci-layout:///mnt/funcd-deps/registry:ingest   # outputs {amount}
    - name: sub
      workflow:
        ref: scorer                                           # runs the child inline; output flows up
      dependsOn: [feed]
