# orders — a Workflow mixing dispatched functions with engine-native built-ins (ADR-0094 + ADR-0096).
# The engine materializes each `function.image` step into an owned Function (orders-<step>) that pulls
# + serves on containerd, and runs the built-in `wait`/`pass` steps in-process (no container):
#
#   ingest ── score ──┬── hi  (when score > 30) ──┐
#                     └── lo  (when score <= 30) ──┴── report (join: any) ── settle (wait) ── summary (pass)
#
# A `function` step is sourced from an `image:` (materialized) or a `ref:` to an existing Function.
# All dispatch knobs (retry/timeout/kv/pooling) live under `function`. A `builtin` step is engine-native:
# `wait` parks the run on a durable timer (StepWaiting + wakeAt) between reconciles; `pass` transforms
# data via a goja Select expression. Chaining passes a parent's output verbatim; the fan-out branches are
# exclusive via `when` (ADR-0095); `report` joins whichever branch survived. Owned Functions cascade with
# the Workflow (delete-owner); they are per-workflow, kept warm (minReplicas: 1).
apiVersion: funcd.io/v1alpha1
kind: Workflow
metadata:
  name: orders
  namespace: default
  resourceGroup: rg1
spec:
  pooling:
    mode: isolated        # one solo container per step (no shared pool worker on this lane)
    minReplicas: 1        # keep each materialized step warm — no cold-start race in the e2e
  steps:
    - name: ingest
      function:
        image: oci-layout:///mnt/funcd-deps/registry:ingest
    - name: score
      function:
        image: oci-layout:///mnt/funcd-deps/registry:score
      dependsOn: [ingest]
    - name: hi
      function:
        image: oci-layout:///mnt/funcd-deps/registry:hi
      dependsOn: [score]
      when:
        condition: "${{ step.score.output.score > 30 }}"
    - name: lo
      function:
        image: oci-layout:///mnt/funcd-deps/registry:lo
      dependsOn: [score]
      when:
        condition: "${{ step.score.output.score <= 30 }}"
    - name: report
      function:
        image: oci-layout:///mnt/funcd-deps/registry:report
      dependsOn: [hi, lo]
      join: any
    # built-in wait: park the run on a durable timer for 2s (StepWaiting + wakeAt), then continue —
    # `describe` shows the step Waiting with a wakeAt before it resolves. No container is dispatched.
    - name: settle
      builtin:
        wait: "2s"
      dependsOn: [report]
    # built-in pass: an in-engine data transform (goja Select). `settle` passed report's output through
    # verbatim, so this reshapes it into the run's final output — no container is dispatched.
    - name: summary
      builtin:
        pass: "${{ {tier: step.settle.output.tier, settled: true} }}"
      dependsOn: [settle]
