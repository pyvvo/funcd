# Operator config for the egress-probe containerd lane (ADR-0117, F81) — the ONLY lane that enables the
# worker-egress enforcement path. Everything here mirrors a normal containerd lane; the `server.network`
# block is the per-lane knob that arms F80's default-deny substrate + F81's in-binary egress gateway and
# DNS forwarder. Other lanes leave `server.network.egress` unset (default off), so this is the smallest
# per-lane change that fits the existing "each lane stages its own funcdconfig.yaml" pattern.
#
# server.network:
#   * egress            — turns on F80's default-deny nftables substrate over the funcd0 CNI bridge AND,
#                         paired with dnsForwarderPort, wires F81's egress gateway + DNS forwarder.
#   * egressGatewayPort — F80's REDIRECT target: remaining external worker TCP is DNAT'd here, where the
#                         gateway recovers SO_ORIGINAL_DST, authenticates the worker by source IP, and
#                         authorizes egress::connect against the namespace's EgressPolicy (allow ⇒ splice).
#   * dnsForwarderPort  — worker :53 (UDP+TCP) is REDIRECTed into funcd's DNS forwarder so it is the ONLY
#                         reachable resolver (the domain trust anchor): it records (worker,domain)→IP and,
#                         for a namespace with a wildcard EgressPolicy rule, injects the matched `*.x.com`
#                         token — the mechanism the wildcard allow-case exercises end to end.
#   * dnsResolver       — the upstream the forwarder forwards to (a public resolver reachable from the VM
#                         host netns via NAT; the forwarder runs in the host netns, not the worker's).
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
  network:
    egress: true
    egressGatewayPort: 15080
    dnsForwarderPort: 15053
    dnsResolver: 1.1.1.1:53
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd
log:
  format: text
  level: info
