# egress-probe (ADR-0117, F81) — the JS function the egress lane deploys. It takes { url }, does a global
# fetch(url), and reports { ok } (true iff the outbound connection was allowed + completed). On real
# containerd with server.network.egress on, EVERY outbound worker TCP is REDIRECTed to the in-binary
# egress gateway, which authorizes egress::connect against this namespace's EgressPolicy over the
# forwarder-attested destination — so `ok` is a live read of the enforcement decision.
#
# No spec.blob / spec.kv / spec.egress binding: egress is governed by the namespaced EgressPolicy CRD
# (applied MID-SUITE by the Venom steps to make deny-then-allow observable), not a per-function grant.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: egress-probe
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:egress-probe   # funcdctl push probe.mjs
  replicas: 1
  scaling:
    minReplicas: 1
