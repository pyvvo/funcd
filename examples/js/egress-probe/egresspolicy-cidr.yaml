# A whole-namespace EgressPolicy allowing egress to the 1.1.1.1/32 CIDR on :443 (ADR-0117, F81). Applied
# MID-SUITE by the Venom CIDR allow-case (additive to the wildcard policy already applied — the compiled
# permit set is the union of both).
#
# It exercises the CIDR path (no DNS/domain needed): the compiled Cedar permit is
# `resource.ip.isInRange(ip("1.1.1.1/32"))` guarded by `resource.port`, matched directly against the
# gateway's recovered SO_ORIGINAL_DST. A probe of the literal IP https://1.1.1.1 opens no DNS query, so
# the gateway authorizes purely on the destination IP — proving isInRange compiles and matches. A probe
# of an unlisted IP (e.g. 1.0.0.1) has no domain and no CIDR match ⇒ denied (the allow-list stays closed).
apiVersion: funcd.io/v1alpha1
kind: EgressPolicy
metadata:
  name: allow-one-one-one-one
  namespace: default
  resourceGroup: rg1
spec:
  rules:
    - to:
        cidrs: ["1.1.1.1/32"]
      ports: [443]
