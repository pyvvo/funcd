# gold-ingest — the Sensor (ADR-0109, UNCHANGED by ADR-0119) that consumes the blob EventSource's `arrived`
# event and starts an `ingest` WorkflowRun, projecting the landed object's key into the run input via the
# F73 `${{ event.data.key }}` expression. This closes the reactive loop: external S3 PUT into gold/ → the
# blob watcher publishes `arrived` on the Fanout → this Sensor starts the ingest run carrying the object key.
#
# NB: the `on` keys are QUOTED (YAML 1.1 bare-`on:` = boolean true).
apiVersion: funcd.io/v1alpha1
kind: Sensor
metadata:
  name: gold-ingest
  namespace: default
  resourceGroup: rg1
spec:
  "on":
    - name: dropped
      source: gold-drops
      event: arrived
  do:
    - name: run
      "on": dropped
      workflow: ingest
      input: { file: "${{ event.data.key }}" }
