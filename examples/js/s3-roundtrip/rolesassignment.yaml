# RolesAssignment (ADR-0136, FEAT-0008/F101) — grants the s3-roundtrip Function `Blob Data Writer` on the
# lakehouse/shared prefix, which it NEITHER owns NOR binds. Without this grant, a PutObject into `shared`
# would be denied exactly like `other` (the single-writer forbid fires: the principal is not in the
# prefix's `writers` set). With it, the writer-role assignment adds s3-roundtrip to that prefix's `writers`
# set, so the write passes the REAL forbid — no ownership, no bypass. Blob Data Writer also grants s3::read,
# so the handler can GetObject the written key back to confirm it landed.
#
# This is the prod mirror of what `funcdctl dev` auto-provisions locally (ADR-0128 as amended): dev grants
# each dev function a write role instead of dropping the forbid. Here the SAME mechanism runs on real
# containerd, proving the role-assigned-writer path end to end (not just the owner path).
apiVersion: funcd.io/v1alpha1
kind: RolesAssignment
metadata:
  name: s3-roundtrip-shared-writer
  namespace: default
  resourceGroup: rg1
spec:
  principal:
    kind: Function
    name: s3-roundtrip
  assignments:
    - roleRef:
        kind: BuiltinRole
        name: Blob Data Writer
      scope:
        kind: BucketPrefix
        name: lakehouse/shared
