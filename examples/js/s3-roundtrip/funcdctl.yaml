# funcdctl.yaml (ADR-0122) — the colocated CLIENT push/dev config for the Node s3-roundtrip (the
# client-side analogue of wrangler.toml), NOT a deploy manifest. It declares only what the client
# tooling needs: the runtime, the handler, the blob binding the code uses, and the inline I/O contract.
# `funcdctl push . <ref>` bakes the schema-only contract + records the runtime; `funcdctl types` emits
# a .d.ts for FuncInput/FuncOutput + the typed blob binding context; `funcdctl dev` (later) runs it locally.
# Deploy concerns (name, namespace, scaling, placement) live on the hand-written Function CRD
# (function.yaml, which sits alongside this file) — this config never replaces it.
runtime: nodejs22
handler: handle
bindings:
  blob:
    - alias: gold        # the in-code handle / S3 scope: s3://lakehouse/gold/<key>
      bucket: lakehouse  # the Bucket (domain)
      prefix: gold       # the sub-domain it owns → reads AND writes (single writer)
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      inv:
        type: string
  output:
    type: object
    additionalProperties: false
    properties:
      put:
        type: boolean
      get:
        type: boolean
      list:
        type: number
      denied:
        type: boolean
    required:
      - put
      - get
      - list
      - denied
