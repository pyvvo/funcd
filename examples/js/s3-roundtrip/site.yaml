# bi Site (ADR-0139, F103) — the lakehouse's prebuilt BI app as ONE declared, versioned resource. It ADOPTS
# the existing `lakehouse` Bucket (bucket.yaml — its gold/other/shared entries stay byte-identical) and adds
# its own ownerless `bi` prefix, materializes the pushed bundle under bi/<digest-slug>/, and owns a Route
# serving the app at `/` for bi.example.com with the gold layer mounted at `/data` (a miss there is a 404,
# never the SPA shell). Ready only once the bundle is servable; a redeploy is a new spec.image tag.
apiVersion: funcd.io/v1alpha1
kind: Site
metadata:
  name: bi
  namespace: default
  resourceGroup: rg1
spec:
  image: oci-layout:///mnt/funcd-deps/registry:bi
  bucket:
    name: lakehouse
  prefix: bi
  spa: true
  ingress:
    host: bi.example.com
    public: true
    rules:
      - path: /data
        prefix: gold
