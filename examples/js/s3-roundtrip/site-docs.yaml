# docs Site (ADR-0140, F104) — the SAME listener as the bi Site, reached by PATH instead of a hostname.
# It sets neither ingress.host nor ingress.path, so the bundle mounts at the by-name default
# `/site/docs`: no /etc/hosts, no DNS, and no collision with bi (which is host-qualified at "/").
# It adopts the same lakehouse Bucket and adds its own ownerless `docs` prefix.
apiVersion: funcd.io/v1alpha1
kind: Site
metadata:
  name: docs
  namespace: default
  resourceGroup: rg1
spec:
  image: oci-layout:///mnt/funcd-deps/registry:docs
  bucket:
    name: lakehouse
  prefix: docs
  # SPA on, so the lane proves the fallback is scoped to THIS mount (an unknown path under
  # /site/docs serves the shell; anything outside it does not).
  spa: true
  ingress:
    public: true
    rules:
      # A data mount NESTED under the derived /site/docs mount (ADR-0140 allows it: the router is
      # longest-path-first, so this rule wins for /site/docs/data/*). It serves the gold layer the
      # s3-roundtrip invoke writes — and a miss here is 404, never the app shell, despite spa: true.
      - path: /site/docs/data
        prefix: gold
