# The Quack auth token the catalog engine serves with — consumed via spec.secrets (ADR-0087, the
# ADR-0057 convention). A Quack client ALWAYS needs a token (a token-less client is refused), so the
# engine serves with QUACK_TOKEN and every consumer presents the same. The ingress gateway is the
# authoritative OUTER auth; this token is the inner gate.
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: lake-quack-token
  namespace: default
  resourceGroup: rg1
spec:
  type: opaque
  data:
    QUACK_TOKEN: ZnVuY2QtY2F0YWxvZy10b2tlbg==   # base64("funcd-catalog-token"), >= 4 chars
