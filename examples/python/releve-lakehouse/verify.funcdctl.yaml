# verify — dev manifest (GATE 1). Runs functions/verify/handler.py IN PLACE via `main`. Bindings mirror
# the verify Function spec: config releve-project-config, blob landing (read PDF) + bronze (read extract's
# Parquet to reconcile) — both read-only. Contract from the handler's FuncInput/FuncOutput TypedDicts.
runtime: python314
handler: handle
main: functions/verify/handler.py
bindings:
  config:
    - releve-project-config
  blob:
    - alias: landing
      bucket: releves
      prefix: landing
    - alias: bronze
      bucket: releves
      prefix: bronze
contract:
  input:
    # verify DEPENDS ON extract, so it receives extract's OUTPUT (ADR-0094 flowing input) — the run summary,
    # which it IGNORES: it reconciles EVERY bronze against an independent re-parse of its landing PDF.
    # additionalProperties + no required ⇒ it accepts extract's summary (or anything) without needing a field.
    type: object
    additionalProperties: true
  output:
    type: object
    additionalProperties: false
    properties:
      ok:
        type: boolean
      statements:
        type: integer
      debit:
        type: string
      credit:
        type: string
    required:
      - ok
      - statements
      - debit
      - credit
dev:
  # the project virtualenv (carries pdfplumber/pyarrow/duckdb); funcdctl dev launches handlers with it
  python: .venv/bin/python
  backends:
    blob: "file://.funcd-dev/blob"
  config:
    releve-project-config:
      STOP_KEYWORDS: "TOTALDESOPERATIONS,TOTALDES,Soldecréditeur,Soldedébiteur,RELEVEDECOMPTE,Titulaire,PERIODE,NATUREDESOPERATIONS,Soldeau,Crédit,Débit,Bank,<ACCOUNT_NUMBER>"
      BANK: "bank"
      CLASSIFICATION: "confidential"
