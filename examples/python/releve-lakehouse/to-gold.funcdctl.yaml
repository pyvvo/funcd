# to-gold — dev manifest. Runs functions/to_gold/handler.py IN PLACE via `main` (underscore dir), so the
# sibling mart_depenses_mensuelles.sql resolves next to the handler. Bindings mirror the to-gold Function
# spec: blob silver (read the conformed table) + catalog lake (drive the mart SQL over Quack; the embedded
# devengine serves it). No gold write-binding (the catalog owns gold). Contract from FuncInput (total=False
# → file optional) / FuncOutput TypedDicts.
runtime: python314
handler: handle
main: functions/to_gold/handler.py
bindings:
  blob:
    - alias: silver
      bucket: releves
      prefix: silver
  catalogs:
    - alias: lake
      catalog: lake
contract:
  input:
    # to-gold depends on build-silver, receiving its output (ADR-0094 flowing input), which it IGNORES (it
    # rebuilds the mart from the whole silver layer via the `lake` catalog). Input-agnostic ⇒ accept any object.
    type: object
    additionalProperties: true
  output:
    type: object
    additionalProperties: false
    properties:
      gold:
        type: string
      rows:
        type: integer
    required:
      - gold
      - rows
dev:
  # the project virtualenv (carries pdfplumber/pyarrow/duckdb); funcdctl dev launches handlers with it
  python: .venv/bin/python
  backends:
    blob: "file://.funcd-dev/blob"
  # The provider side of the `lake` catalog binding — the storage layout funcdctl dev cannot infer from the
  # consumer binding above. funcdctl dev synthesizes a CatalogService/lake (DuckLake over these prefixes) +
  # a Quack-token Secret, and the embedded duckdb+quack engine serves it (ADR-0091 consumer binding in dev).
  catalog:
    lake:
      blob:
        - alias: silver
          bucket: releves
          prefix: silver
        - alias: gold
          bucket: releves
          prefix: gold
      catalog:
        bucket: releves
        prefix: gold
