# build-silver — dev manifest (GATE 2, PII). Runs functions/build_silver/handler.py IN PLACE via `main`
# (note the underscore dir). Bindings mirror the build-silver Function spec: blob bronze (read all) +
# silver (write, owner) + reports (write the BI bundle). No config binding. Contract from the handler's
# FuncInput (total=False → file optional) / FuncOutput TypedDicts.
runtime: python314
handler: handle
main: functions/build_silver/handler.py
bindings:
  blob:
    - alias: bronze
      bucket: releves
      prefix: bronze
    - alias: silver
      bucket: releves
      prefix: silver
    - alias: reports
      bucket: releves
      prefix: reports
contract:
  input:
    # build-silver fans in from extract + verify (ADR-0094 join: all), so it receives a composite of their
    # outputs — which it IGNORES (it reads the WHOLE bronze layer via context.blob). Input-agnostic ⇒ accept
    # any object.
    type: object
    additionalProperties: true
  output:
    type: object
    additionalProperties: false
    properties:
      silver:
        type: string
      rows:
        type: integer
    required:
      - silver
      - rows
dev:
  # the project virtualenv (carries pdfplumber/pyarrow/duckdb); funcdctl dev launches handlers with it
  python: .venv/bin/python
  backends:
    blob: "file://.funcd-dev/blob"
