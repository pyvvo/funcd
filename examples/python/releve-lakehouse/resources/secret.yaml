# The Quack auth token the `lake` catalog serves with — consumed via spec.secrets (ADR-0087/0057). Every
# consumer (to-gold, catalog-reader) presents the same token; the ingress gateway is the authoritative outer
# auth, this is the inner gate. Replace with a real random token before any non-demo use.
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: lake-quack-token
  namespace: default
  resourceGroup: rg1
spec:
  type: Opaque
  data:
    QUACK_TOKEN: cmVsZXZlLWNhdGFsb2ctdG9rZW4=   # base64("releve-catalog-token") — CHANGE ME
