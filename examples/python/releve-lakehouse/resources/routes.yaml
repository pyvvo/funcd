# The serving surface — two Routes fronted by the FEAT-0006 edge (TLS · authn PEP · limits · gzip).
#
# 1. bi (static, ADR-0120) — serves the built Observable Framework BI bundle straight from the `reports/`
#    prefix of the `releves` Bucket: index resolution, content-types, ETag/immutable caching, SPA
#    client-side routing. `public: true` forces the `open` stance — the dashboard is served openly. No
#    file-server Function.
# 2. query (function, ADR-0110/0113) — the interactive SQL surface: routes to the catalog-reader Function
#    with an `authenticated` stance (a bearer is required; a namespace-scoped token is authorized). Confidential
#    data, so the query door is closed by default.
apiVersion: funcd.io/v1alpha1
kind: Route
metadata:
  name: bi
  namespace: default
  resourceGroup: rg1
spec:
  rules:
    - path: /
      pathType: Prefix
      backend:
        static:
          bucket: releves
          prefix: reports/       # the built BI bundle root within the bucket
          index: index.html
          spa: true              # Observable / client-side routing
          public: true           # served openly (stance forced open)
---
apiVersion: funcd.io/v1alpha1
kind: Route
metadata:
  name: query
  namespace: default
  resourceGroup: rg1
spec:
  auth:
    mode: authenticated          # bearer required — confidential SQL surface
  rules:
    - path: /query
      backend:
        function: catalog-reader
