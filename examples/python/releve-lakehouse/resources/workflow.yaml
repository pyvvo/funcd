# releve-pipeline — the medallion DAG (ADR-0094). A landed PDF flows extract → (verify ∥ build-silver) →
# to-gold, with TWO blocking data-quality gates expressed as the graph shape:
#
#   extract ──┬── verify ────────────┐   (GATE 1: independent cross-check + printed totals; raise ⇒ run fails)
#             └────────────► build-silver   (GATE 2: PII residual scan; raise ⇒ run fails)   [join: all]
#                                   └──► to-gold   (mart SQL via the `lake` catalog)
#
# build-silver dependsOn [extract, verify] with join:all — so it runs ONLY after extract wrote bronze AND
# verify confirmed the extraction; either gate failing fails the run (fail-fast) BEFORE any confidential or
# wrong data is conformed. Each step is a dispatched Function (ref: an existing Function, not materialized
# from an image — the ELT functions are applied separately in functions.yaml). The run input {file: <key>}
# is projected by the Sensor from the landed object key and passed to every step as ${{ input.file }}.
apiVersion: funcd.io/v1alpha1
kind: Workflow
metadata:
  name: releve-pipeline
  namespace: default
  resourceGroup: rg1
spec:
  pooling:
    mode: isolated        # one solo container per step (statements are small; no shared-pool contention)
    minReplicas: 1        # keep steps warm — no cold-start on the reactive path
  steps:
    - name: extract
      function:
        ref: extract                     # landing/<key>.pdf → bronze/<key>.parquet (geometric extraction)
      input:
        file: "${{ input.file }}"
    - name: verify
      function:
        ref: verify                      # GATE 1: independent re-extraction + printed-total reconciliation
      dependsOn: [extract]
      input:
        file: "${{ input.file }}"
    - name: build-silver
      function:
        ref: build-silver                # GATE 2 (PII) + type + dedup → silver DuckLake `transactions`
      dependsOn: [extract, verify]
      join: all                          # both extract AND verify must succeed first
      input:
        file: "${{ input.file }}"
    - name: to-gold
      function:
        ref: to-gold                     # mart SQL over the `lake` catalog → gold DuckLake
      dependsOn: [build-silver]
