# Confidential posture: a bank-statement byte NEVER leaves the box (ADR-0117, F81).
#
# ADR-0117 is DEFAULT-DENY: with edge egress enforcement on (server.network.egress: true), a namespace with
# NO EgressPolicy permitting a destination has ALL worker outbound TCP refused at the in-binary egress
# gateway. So the confidential invariant needs no allow rules at all — extract/verify/build-silver run their
# OCR/parse/anonymize purely locally, and any attempt to reach an external API (OpenRouter, HF Jobs, …) is
# refused. The in-platform S3 endpoint and the `lake` catalog are reached over platform facades, NOT egress,
# so they keep working under full lockdown.
#
# This manifest documents the posture with an EMPTY allow-list. Uncomment a rule ONLY if a step ever needs a
# specific, audited external host (it does not, for this pipeline) — every added domain/CIDR is a hole in the
# invariant, so keep it empty for `confidential` work.
apiVersion: funcd.io/v1alpha1
kind: EgressPolicy
metadata:
  name: releve-confidential-deny
  namespace: default
  resourceGroup: rg1
spec:
  rules: []                       # deny-all (default-deny); no external destination is permitted
  # rules:                        # ← the shape you would add ONLY for an audited allow-list host:
  #   - to:
  #       domains: ["updates.example.com"]
  #     ports: [443]
