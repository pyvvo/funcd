# Non-secret configuration (ADR-0057/0093). Two ConfigMaps:
#   * releve-project-config — PROJECT tuning consumed by extract/verify (spec.config). STOP_KEYWORDS holds
#     the header/footer/balance markers to skip during extraction — INCLUDING the statement's account number,
#     which the prototype hard-coded. Keeping it here means no PII (the real account number) lives in code.
#   * lake-engine-config — DuckDB engine tuning for the CatalogService (DUCKDB_* → engine env).
apiVersion: funcd.io/v1alpha1
kind: ConfigMap
metadata:
  name: releve-project-config
  namespace: default
  resourceGroup: rg1
data:
  # Comma-separated markers that terminate/skip a line during extraction (header, footer, totals, balances,
  # and the account number). Replace <ACCOUNT_NUMBER> with your real statement account id at deploy time.
  STOP_KEYWORDS: "TOTALDESOPERATIONS,TOTALDES,Soldecréditeur,Soldedébiteur,RELEVEDECOMPTE,Titulaire,PERIODE,NATUREDESOPERATIONS,Soldeau,Crédit,Débit,Bank,<ACCOUNT_NUMBER>"
  BANK: "bank"                # the parser profile (Bank geometry)
  CLASSIFICATION: "confidential"   # medallion bronze path label + policy driver
---
apiVersion: funcd.io/v1alpha1
kind: ConfigMap
metadata:
  name: lake-engine-config
  namespace: default
  resourceGroup: rg1
data:
  DUCKDB_THREADS: "2"
  DUCKDB_MEMORY_LIMIT: "3GB"
