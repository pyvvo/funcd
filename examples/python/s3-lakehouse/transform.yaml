# transform — reads bronze, writes the silver + gold layers via DuckDB over the S3 endpoint (ADR-0080).
# It binds three prefixes of the lakehouse Bucket: bronze (READ — it is NOT bronze's owner, ingest is, so the
# binding grants read only) and silver + gold (it IS their `owner` in bucket.yaml → the single WRITER). One
# function, multiple spec.blob bindings, each scoped to a (bucket, prefix). Identity is connection-scoped (no
# key); DuckDB uses anonymous S3, e.g. CREATE TABLE silver AS SELECT … FROM 's3://lakehouse/bronze/*.parquet'.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: transform
  namespace: default
  resourceGroup: rg1
spec:
  runtime: python314
  handler: handle
  artifact:
    uri: oci-layout:///mnt/funcd-deps/registry:transform   # funcdctl push transform.py
  replicas: 1
  scaling:
    minReplicas: 1
  blob:
    - alias: bronze-in      # READ bronze (not its owner → read-only)
      bucket: lakehouse
      prefix: bronze
    - alias: silver-out     # WRITE silver (transform is silver's owner → single writer)
      bucket: lakehouse
      prefix: silver
    - alias: gold-out       # WRITE gold (transform is gold's owner → single writer)
      bucket: lakehouse
      prefix: gold
