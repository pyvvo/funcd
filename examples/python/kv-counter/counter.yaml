# kv-counter (Python) — increments a per-name counter in the KV binding "py-counters" via context.kv
# (ADR-0069). The Python sibling of examples/js/kv-counter; runs on the curated python314 runtime image.
# The spec.kv binding (ADR-0073) maps the alias "pycounters" to the py-counters store's "table-counters"
# table; the binding IS the capability (default-deny), and pycounter owns the table so it may write it.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: pycounter
  namespace: default
  resourceGroup: rg1
spec:
  runtime: python314
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:pycounter   # funcdctl push counter.py (built from src/counter.py)
  replicas: 1
  scaling:
    minReplicas: 1
  kv:
    - alias: pycounters       # the in-code handle: context.kv.*('pycounters', …)
      store: py-counters      # the KVStore (domain)
      table: table-counters   # the sub-domain pycounter owns (single writer)
