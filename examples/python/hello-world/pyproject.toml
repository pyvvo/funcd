[project]
name = "funcd-example-hello-world"
version = "0.1.0"
description = "A funcd function authored in Python against the funcd_shim typed contract, deployed with funcdctl (ADR-0049)."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# funcd-shim is the typed authoring contract (Handler/CloudEvent/FunctionContext/Json). At deploy
# time the artifact is just src/handler.py — the platform's curated Python image provides the shim
# (and the build bakes the contract validator); this dependency is for local typechecking + tests only.
dependencies = ["funcd-shim"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
funcd-shim = { path = "../../../shim/python" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
