[project]
name = "funcd-example-log-burst"
version = "0.1.0"
description = "A funcd Python function that emits a burst of >=100 structured logs via the stdlib logging module, to exercise the platform's Path B function-log capture (ADR-0081)."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# funcd-shim is the typed authoring contract (Handler/CloudEvent/FunctionContext). At deploy time the
# artifact is just src/handler.py — the platform's curated Python image provides the shim (which
# installs the Path B logging.Handler); this dependency is for local typechecking + tests only.
dependencies = ["funcd-shim"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]
# the push-time contract build (funcd_shim.build) reads FuncInput/FuncOutput via pydantic (ADR-0090).
build = ["pydantic>=2.13.4"]

[tool.uv.sources]
funcd-shim = { path = "../../../shim/python" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
