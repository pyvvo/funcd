# funcdctl.yaml (ADR-0122) — the colocated CLIENT push/dev config for the Python log-burst (the
# client-side analogue of wrangler.toml), NOT a deploy manifest. It declares only what the client
# tooling needs: the runtime, the handler, and the inline I/O contract. There are no bindings — the
# structured logs the function emits ARE the point of this example (Path B capture, ADR-0081).
# `funcdctl push . <ref>` bakes the schema-only contract + records the runtime; `funcdctl types` emits
# a .pyi for FuncInput/FuncOutput; `funcdctl dev` (later) runs it locally.
# Deploy concerns (name, namespace, scaling, placement) live on the hand-written Function CRD
# (handler.yaml, which sits alongside this file) — this config never replaces it.
runtime: python314
handler: handle
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      count:
        type: integer
  output:
    type: object
    additionalProperties: false
    properties:
      emitted:
        type: integer
    required:
      - emitted
