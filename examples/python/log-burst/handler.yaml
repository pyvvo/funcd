# log-burst (Python) — emits a burst of >=100 structured logs via the stdlib `logging` module so the
# platform's Path B function-log capture (ADR-0081) has something to capture and persist. Python has no
# `console`; the shim's Path B hook point is a `logging.Handler` on the root logger, so the function
# logs with `logging.info/.warning/.error` (a bare `print()` would fall to Path A / raw stdout instead).
# Runs on the curated python314 runtime image. The deliverable artifact is src/handler.py.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: log-burst
  namespace: default
  resourceGroup: rg1
spec:
  runtime: python314
  handler: handle
  artifact:
    uri: oci-layout:///mnt/funcd-deps/registry:log-burst   # funcdctl push src/handler.py
  replicas: 1
  scaling:
    minReplicas: 1
