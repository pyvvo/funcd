# catalog-quack CONSUMER — a funcd Function that queries the F48 Quack catalog (ADR-0086/0087/0088).
# Invoke it (POST /function/catalog-reader {"data":{"sql":"SELECT ..."}}) and it runs the SQL on the
# `lake` CatalogService over Quack and returns the rows. This is the funcd-native consumption shape (a
# deployed, governed, invokable function) — not a CLI.
#
# It runs on the STOCK curated `python314` runtime — no `python-duckdb` image. The DuckDB wheel + the
# quack/httpfs extensions travel IN the artifact as a deployment-package BUNDLE (ADR-0089): build it
# hermetically with `python build.py` → `bundle/`, then
#   funcdctl push examples/python/catalog-quack/bundle <ref> --entry handler.py
# funcd untars the bundle into the artifact dir and sets PYTHONPATH + FUNCD_BUNDLE_DIR so `import duckdb`
# and the offline `duckdb-ext/` extensions resolve with zero runtime changes.
#
# ⚠️ ONE remaining follow-up — Project #4 "Provider consumption binding":
#   spec.catalogs — the consumer binding that injects FUNCD_CATALOG_LAKE_URL/_TOKEN + opens the egress
#   grant (function → catalog). Until it lands, bind the token via spec.secrets + the URL via a ConfigMap.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: catalog-reader
  namespace: default
  resourceGroup: rg1
spec:
  runtime: python314            # the STOCK curated runtime — the duckdb dep travels in the bundle (ADR-0089)
  handler: handle
  artifact:
    uri: oci-layout:///mnt/funcd-deps/registry:catalog-reader   # funcdctl push ./bundle … --entry handler.py
  replicas: 1
  scaling:
    minReplicas: 1
  # NOTE: the consumer binding (`spec.catalogs`) that would inject FUNCD_CATALOG_LAKE_URL/_TOKEN and open
  # the function→catalog egress grant is a DEFERRED follow-up (Project #4 "Provider consumption binding") —
  # it is NOT an implemented Function field yet, so it is intentionally omitted here. Reaching Ready proves
  # the ADR-0089 bundle materialized and `import duckdb` (at module load) succeeded on the stock runtime;
  # the full SQL invoke against the `lake` catalog lands with that binding follow-up.
