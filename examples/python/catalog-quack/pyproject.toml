[project]
name = "funcd-example-catalog-quack"
version = "0.1.0"
description = "A real Quack consumer for the F48 DuckLake/DuckDB/Quack catalog (ADR-0086/0087/0088): a DuckDB-with-quack client that runs SQL on a deployed CatalogService over the Quack protocol."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# funcd-shim is the typed authoring contract (CloudEvent/FunctionContext). duckdb is the Quack client
# (a Quack client IS a local DuckDB) — provided at deploy by the duckdb-capable function runtime; here
# it is for local typecheck + tests.
dependencies = ["funcd-shim", "duckdb>=1.5.4"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]
# the push-time bundle build (build.py → funcd_shim.build) reads FuncInput/FuncOutput and bakes the
# ADR-0058 validators; it needs pydantic (build-time only, never in the deployed bundle).
build = ["pydantic>=2.13.4"]

[tool.uv.sources]
funcd-shim = { path = "../../../shim/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
