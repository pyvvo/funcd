# The lakehouse Bucket for the F48 catalog (ADR-0080). The `gold` prefix holds the Parquet data AND
# the DuckLake SQLite catalog (under _ducklake/catalog.db). Its `owner` is the single writer — the
# catalog engine's identity `lake`.
#
# ADR-0121: apply this in ANY order relative to the CatalogService — owner/binding EXISTENCE is
# reconcile-time. If `lake` doesn't exist yet the prefix is simply un-writable (fail-closed) until it
# does; a CatalogService binding a not-yet-applied Bucket waits (Ready=False/BucketNotFound) and
# converges when this lands. No two-phase bucket-base.
apiVersion: funcd.io/v1alpha1
kind: Bucket
metadata:
  name: lakehouse
  namespace: default
  resourceGroup: rg1
spec:
  prefixes:
    - name: gold
      owner: lake          # the CatalogService's provider identity (gated on the identity follow-up)
  maxObjectBytes: 1073741824
