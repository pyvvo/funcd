# Non-secret engine tuning consumed by the CatalogService via spec.config (ADR-0087, the ADR-0057
# convention). Each Data key becomes an env var the duckdb shim applies as a DuckDB `SET` before
# `lock_configuration=true`. (A reserved FUNCD_* key here would be dropped — it can't shadow the
# runtime contract.)
apiVersion: funcd.io/v1alpha1
kind: ConfigMap
metadata:
  name: lake-engine-config
  namespace: default
  resourceGroup: rg1
spec:
  data:
    DUCKDB_MEMORY_LIMIT: "3GB"
    DUCKDB_THREADS: "2"
