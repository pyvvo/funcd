buckets:
  - name: ${{ app.name + "-files" }}
    deletion: ${{ values.data.deletion }}
    prefixes:
      - name: attachments
        owner:
          kind: Function
          name: ${{ app.name + "-api" }}
      - name: events
        owner:
          kind: Function
          name: ${{ app.name + "-planner" }}
      - name: lake
        owner:
          kind: Lake
          name: ${{ app.name + "-lake" }}
