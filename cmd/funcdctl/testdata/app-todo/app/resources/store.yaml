kv:
  - name: ${{ app.name + "-store" }}
    deletion: ${{ values.data.deletion }}
    tables:
      - name: todos
        owner:
          kind: Function
          name: ${{ app.name + "-api" }}
      - name: runs
        owner:
          kind: Function
          name: ${{ app.name + "-planner" }}
functions:
  - name: ${{ app.name + "-migrate" }}
    runtime: nodejs22
    handler: handle
    image: ${{ images.migrate }}
    timeout: 10m
    bindings:
      kv:
        - alias: todos
          store: ${{ app.name + "-store" }}
          table: todos
