functions:
  - name: ${{ app.name + "-stats" }}
    runtime: nodejs22
    handler: handle
    image: ${{ images.stats }}
    bindings:
      lake:
        - alias: lake
          lake: ${{ app.name + "-lake" }}
routes:
  - name: ${{ app.name + "-stats" }}
    host: ${{ values.host }}
    rules:
      - path: /stats
        backend:
          function: ${{ app.name + "-stats" }}
