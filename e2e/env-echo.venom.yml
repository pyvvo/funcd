# Venom e2e suite for the env-echo containerd lane (ADR-0093 spec.config + ADR-0057 spec.secrets) — the
# declarative invoke phase of `just lima-example-env-echo`, run host-side AFTER the self-deploying Lima VM
# is Ready. It proves that a Function binding BOTH a ConfigMap (spec.config) and a Secret (spec.secrets)
# receives BOTH sets of Data as worker env at runtime, by invoking a void-input handler that echoes them:
#   1. env-echo is Ready — Ready requires BOTH bindings to resolve (fail-closed), so this already proves
#      resolution reconcile-side.
#   2. the injected values reach the RUNNING handler — config=prod (ConfigMap), secret=s3cr3t (Secret),
#      and shared=from-secret (the key present in both: the Secret wins, config-then-secrets order).
# It also proves ADR-0143's redeploy on containerd: a spec change switches revisions with no failed call, and a
# revision that cannot run leaves the serving one answering. Then it kills the daemon and starts it again: the
# serving revision answers again (issue 40). A Function on a runtime with no image is RuntimeUnavailable (ADR-0149).
# Last, the admin token from auth.credentials (ADR-0171) applies an explicit Namespace whose Function serves only
# through its host Route (ADR-0110), and a Namespace whose edgeDefaults make its Route authenticated (ADR-0113).
# The http step hits the VM's forwarded 127.0.0.1 data plane; the exec step reads phase in-VM via limactl.
name: env-echo config+secret env injection (ADR-0093/0057, containerd lane)

vars:
  filler: 
  dp: http://127.0.0.1:8081   # funcd data plane, forwarded from the Lima guest
  # the lane's `tokens` in scripts/lanes.yaml, listed in auth.credentials (e2e/fixtures/env-echo-funcdconfig.yaml)
  devtoken: env-echo-lane-developer
  admintoken: env-echo-lane-admin

testcases:
  - name: env-echo is Ready (both config + secret bindings resolved)
    steps:
      # Read the Function phase IN the VM (co-located with the daemon). Ready ⇒ both bindings resolved
      # (fail-closed: an unresolved ConfigMap/Secret would hold it out of Ready).
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} \
            funcdctl get function env-echo -n default -o json \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"]["phase"])'
        retry: 30
        delay: 2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual Ready

  - name: the config + secret values reach the running handler (secret wins the shared key)
    steps:
      # Void-input contract (ADR-0090): the input schema is {"type":"null"}, so the invocation sends
      # data: null. retry/delay absorbs first-invoke warm-up.
      - type: http
        method: POST
        url: "{{.dp}}/function/env-echo"
        headers:
          content-type: application/json
        body: '{"data":null}'
        retry: 15
        delay: 2
        info: "invoke → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.config ShouldEqual prod          # spec.config ConfigMap value → env
          - result.bodyjson.secret ShouldEqual s3cr3t        # spec.secrets Secret value → env
          - result.bodyjson.shared ShouldEqual from-secret   # in both: the secret wins (config-then-secrets)

  # ADR-0110 (F79): the declarative front door. A Route exposes env-echo at path /echo (host-less);
  # a request there is resolved by the edge router to the env-echo Function and served
  # through the activator (the matched /echo prefix is stripped → the solo shim sees "/"). Proves
  # Route-based serving works on real containerd — the same handler the config/secret case invokes
  # via /function/env-echo, now reached by path instead of by name.
  - name: F79 Route — path resolves to the function and serves (ADR-0110)
    steps:
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} \
            funcdctl get route env-echo -n default -o json \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);c={x["type"]:x["status"] for x in d.get("status",{}).get("conditions",[])};print("READY="+c.get("Ready",""))'
        retry: 30
        delay: 2
        info: "route status → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldContainSubstring READY=True
      - type: http
        method: POST
        url: "{{.dp}}/echo"
        headers:
          content-type: application/json
        body: '{"data":null}'
        retry: 15
        delay: 2
        info: "routed invoke → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.config ShouldEqual prod
          - result.bodyjson.secret ShouldEqual s3cr3t

  # ADR-0112 (F75): the ingress-protection body-size cap on real containerd. funcdconfig sets
  # server.limits.maxBodyBytes: 1024; a POST whose body exceeds it is rejected with 413 (RFC 9457)
  # BEFORE the handler — never reaching the function. The tiny invokes above (<1 KB) are unaffected.
  - name: F75 ingress protection — an oversized body is 413'd (ADR-0112)
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/env-echo"
        headers:
          content-type: application/json
        # a body well over the 1024-byte cap (a ~2 KB filler string).
        body: '{"data":"{{.filler}}"}'
        info: "oversized invoke → status {{.result.statuscode}}"
        assertions:
          - result.statuscode ShouldEqual 413

  # ADR-0113 (F77): the edge authn PEP. The `secure-echo` Route marks /secure `authenticated`
  # (server.auth.edge is on). An anonymous request is 401'd BEFORE the activator; a request bearing
  # the developer token (scoped to `default`) is authorized by the delegated PDP and served. The
  # default namespace stays `open`, so the earlier /echo + /function/env-echo cases are unaffected.
  - name: F77 edge authn PEP — /secure is 401 anonymous, served with a bearer (ADR-0113)
    steps:
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} \
            funcdctl get route secure-echo -n default -o json \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);c={x["type"]:x["status"] for x in d.get("status",{}).get("conditions",[])};print("READY="+c.get("Ready",""))'
        retry: 30
        delay: 2
        info: "secure route status → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldContainSubstring READY=True
      - type: http
        method: POST
        url: "{{.dp}}/secure"
        headers:
          content-type: application/json
        body: '{"data":null}'
        info: "anonymous /secure → {{.result.statuscode}}"
        assertions:
          - result.statuscode ShouldEqual 401
      - type: http
        method: POST
        url: "{{.dp}}/secure"
        headers:
          content-type: application/json
          Authorization: "Bearer {{.devtoken}}"
        body: '{"data":null}'
        retry: 15
        delay: 2
        info: "authenticated /secure → {{.result.statuscode}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.config ShouldEqual prod

  # ADR-0114 (F78): the edge shaping middleware on real containerd. funcdconfig enables
  # server.shaping.cors (allowOrigins: https://demo.example) + server.shaping.compression. A CORS
  # preflight from the allowed origin is answered at the edge with Access-Control-Allow-Origin (no
  # function wake); a gzip-accepting invoke gets a `Content-Encoding: gzip` response. curl (host-side,
  # against the forwarded data plane) dumps the headers so the shaping is directly observable.
  - name: F78 edge shaping — CORS preflight header + gzip response (ADR-0114)
    steps:
      # The match is done INSIDE the script (grep) and a space-less sentinel is printed, because venom's
      # assertion parser splits ShouldContainSubstring's operand on spaces — a quoted "a: b" substring
      # would be misread as two operands. So we grep here and assert a single-token CORS_OK / GZIP_OK.
      - type: exec
        script: |
          curl -s -o /dev/null -D - -X OPTIONS \
            -H 'Origin: https://demo.example' \
            -H 'Access-Control-Request-Method: POST' \
            {{.dp}}/function/env-echo \
            | tr -d '\r' | grep -qi '^access-control-allow-origin: https://demo.example$' \
            && echo CORS_OK || echo CORS_MISSING
        info: "CORS preflight → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldContainSubstring CORS_OK
      # A gzip-accepting invoke: the JSON response body is compressible + non-streaming, so the shaping
      # gzipWriter sets Content-Encoding: gzip. retry/delay absorbs first-invoke warm-up.
      - type: exec
        script: |
          curl -s -o /dev/null -D - -X POST \
            -H 'content-type: application/json' \
            -H 'Accept-Encoding: gzip' \
            --data '{"data":null}' \
            {{.dp}}/function/env-echo \
            | tr -d '\r' | grep -qi '^content-encoding: gzip$' \
            && echo GZIP_OK || echo GZIP_MISSING
        retry: 15
        delay: 2
        info: "gzip response → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldContainSubstring GZIP_OK

  # ADR-0114 (F76): the edge observability middleware on real containerd. funcdconfig enables
  # server.observability.accessLog — the observ middleware emits a structured `edge request` slog line
  # per hop, correlated by X-Request-Id and labelled with the dataplane-resolved function. The daemon
  # runs under `systemd-run --unit funcd-demo`, so the access log lands in the journal; by now the
  # earlier invokes have produced lines, so a matching line with `function=env-echo` must be present.
  # (RED metrics go to the no-op meter in the VM — no OTLP collector — so only the access log is
  # observable here; the metric emission is covered by the Go e2e's in-memory reader.)
  - name: F76 edge observability — the access log is emitted with the function label (ADR-0114)
    steps:
      # Ensure at least one edge hop with a resolved function label exists, then read the journal.
      - type: http
        method: POST
        url: "{{.dp}}/function/env-echo"
        headers:
          content-type: application/json
        body: '{"data":null}'
        retry: 15
        delay: 2
        assertions:
          - result.statuscode ShouldEqual 200
      # Match inside the script and print a space-less sentinel (see the F78 note on venom operand
      # splitting): assert one `edge request` access-log line carries function=env-echo.
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo journalctl -u funcd-demo --no-pager \
            | grep 'edge request' | grep -q 'function=env-echo' \
            && echo ACCESSLOG_OK || echo ACCESSLOG_MISSING
        info: "edge access log → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldContainSubstring ACCESSLOG_OK

  # ADR-0142: nothing writes the Function after the kill — its periodic pass replaces the dead worker.
  - name: crashed-function-worker-restarts — a killed worker is replaced with no write, and the function serves again
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sock=/var/lib/funcd/data/containerd/containerd.sock
            sudo ctr --address $sock -n funcd-default task ls | awk "\$1 ~ /^env-echo-[0-9]+[.]r0\$/ {print \$1, \$2}" > /tmp/env-echo-before
            read -r task pid < /tmp/env-echo-before
            sudo ctr --address $sock -n funcd-default task kill -s KILL "$task"
            echo "TASK_BEFORE=$task PID_BEFORE=$pid"'
        info: "killed the worker, no write → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "TASK_BEFORE=env-echo-[0-9]+[.]r0"
          - result.systemout ShouldMatchRegex "PID_BEFORE=[0-9]+"
      # The activator holds a call up to its 30 s activation timeout while the replacement boots, so a few
      # attempts bound this step to about two minutes.
      - type: http
        method: POST
        url: "{{.dp}}/function/env-echo"
        headers:
          content-type: application/json
        body: '{"data":null}'
        retry: 4
        delay: 2
        info: "invoke after the kill → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.config ShouldEqual prod
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            read -r task pid < /tmp/env-echo-before
            now=$(sudo ctr --address $sock -n funcd-default task ls | awk -v t="$task" "\$1==t && \$3==\"RUNNING\"{print \$2}")
            phase=$(funcdctl get function env-echo -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            [ -n "$now" ] && [ "$now" != "$pid" ] && replaced=yes || replaced=no
            echo "REPLACED=$replaced PHASE=$phase ($task: $pid -> $now)"'
        info: "after the restart → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REPLACED=yes"
          - result.systemout ShouldContainSubstring "PHASE=Ready"


  # ADR-0143: a redeploy reaches the running worker with no failed call. env-echo-v2 binds a second ConfigMap
  # (APP_MODE staging): the new revision boots beside the old one and takes the calls once ready, then the old worker
  # drains and leaves containerd.
  - name: redeploy-switches-to-new-revision — a spec change serves the new revision, and no call fails during the switch
    steps:
      # One apply, then a call loop co-located with the daemon until 25 calls got the new revision's answer. It counts
      # each status code with the revision that answered; "back" is an old answer after a new one.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl apply -f /opt/lane/env-echo-config-v2.yaml >/dev/null
            funcdctl apply -f /opt/lane/env-echo-v2.yaml >/dev/null
            seen=0
            for i in $(seq 1 150); do
              out=$(curl -s -w "\n%{http_code}" -X POST -H "content-type: application/json" -d "{\"data\":null}" \
                http://127.0.0.1:8081/function/env-echo)
              code=$(echo "$out" | tail -1)
              case "$out" in
                *staging*) seen=$((seen+1)); echo "$code-staging" ;;
                *prod*) [ $seen -gt 0 ] && echo "$code-back" || echo "$code-prod" ;;
                *) echo "$code-other" ;;
              esac
              [ $seen -ge 25 ] && break
              sleep 0.2
            done | sort | uniq -c | awk "{print \$2 \":\" \$1}" | paste -sd, -'
        info: "answers through the switch → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex ^200-prod:[0-9]+,200-staging:25$
      - type: http
        method: POST
        url: "{{.dp}}/function/env-echo"
        headers:
          content-type: application/json
        body: '{"data":null}'
        retry: 15
        delay: 2
        info: "after the redeploy → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.config ShouldEqual staging
      # The old worker drains (no call in flight, so 2 s after the switch) and leaves containerd; the status names
      # the serving revision and nothing drains.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            tasks=$(sudo ctr --address $sock -n funcd-default task ls | awk "\$1 ~ /^env-echo-/ {print \$1}" | sort | paste -sd, -)
            ctrs=$(sudo ctr --address $sock -n funcd-default containers ls -q | grep "^env-echo-" | sort | paste -sd, -)
            status=$(funcdctl get function env-echo -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];print(s.get(\"servingRevision\",\"\")+\"/\"+s.get(\"drainingRevision\",\"\"))")
            echo "TASKS=$tasks,CONTAINERS=$ctrs,STATUS=$status"'
        retry: 20
        delay: 2
        info: "workers and status after the drain → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual TASKS=env-echo-2.r0,CONTAINERS=env-echo-2.r0,STATUS=env-echo-2/

  # ADR-0143: a revision that cannot run leaves the serving one answering. env-echo-badtag names a tag never pushed.
  - name: failed-revision-keeps-old-serving — an unresolvable tag leaves the serving revision answering
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl apply -f /opt/lane/env-echo-badtag.yaml'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get function env-echo -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];r=([c for c in s.get(\"conditions\",[]) if c[\"type\"]==\"RevisionReady\"] or [{}])[0];print(\"PHASE=\"+s.get(\"phase\",\"\")+\",SERVING=\"+s.get(\"servingRevision\",\"\")+\",REVISION=\"+r.get(\"status\",\"\")+\"/\"+r.get(\"reason\",\"\"))"'
        retry: 15
        delay: 2
        info: "status after the failed redeploy → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual PHASE=Ready,SERVING=env-echo-2,REVISION=False/ArtifactUnresolved
      - type: http
        method: POST
        url: "{{.dp}}/function/env-echo"
        headers:
          content-type: application/json
        body: '{"data":null}'
        info: "the serving revision still answers → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.config ShouldEqual staging

  - name: failed-revision-keeps-old-serving — a handler that cannot load leaves the serving revision answering
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl apply -f /opt/lane/env-echo-badhandler.yaml'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get function env-echo -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];r=([c for c in s.get(\"conditions\",[]) if c[\"type\"]==\"RevisionReady\"] or [{}])[0];print(\"PHASE=\"+s.get(\"phase\",\"\")+\",SERVING=\"+s.get(\"servingRevision\",\"\")+\",REVISION=\"+r.get(\"status\",\"\")+\"/\"+r.get(\"reason\",\"\"))"'
        retry: 30
        delay: 2
        info: "status after the unloadable redeploy → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual PHASE=Ready,SERVING=env-echo-2,REVISION=False/ShapeInvalid
      - type: http
        method: POST
        url: "{{.dp}}/function/env-echo"
        headers:
          content-type: application/json
        body: '{"data":null}'
        info: "the serving revision still answers → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.config ShouldEqual staging

  # Issue 40: containerd keeps a worker's container and snapshot when the daemon dies, and the restarted daemon must
  # re-create the worker under the same name. Kill the daemon, start it again on the same data dir, and the serving
  # revision answers again.
  - name: daemon-restart-recovers — after a hard daemon restart the serving revision answers again
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sudo kill -KILL "$(systemctl show -p MainPID --value funcd-demo)"'
        assertions:
          - result.code ShouldEqual 0
      # retry/delay is the wait: systemd must finish stopping the killed unit before the same unit name runs again.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            systemctl is-active -q funcd-demo && exit 1
            sudo systemctl reset-failed funcd-demo 2>/dev/null
            sudo systemd-run --unit funcd-demo /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml'
        retry: 15
        delay: 2
        assertions:
          - result.code ShouldEqual 0
      - type: http
        method: POST
        url: "{{.dp}}/function/env-echo"
        headers:
          content-type: application/json
        body: '{"data":null}'
        retry: 10
        delay: 3
        info: "invoke after the daemon restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.config ShouldEqual staging

  # ADR-0149: ruby3 has no embedded image and the default prefix allows no pull, so the Function is Failed with
  # RuntimeUnavailable after its first Create, and no registry is called.
  - name: missing-image-containerd — a runtime with no image is Failed with RuntimeUnavailable
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl apply -f /opt/lane/ruby3-echo.yaml'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get function ruby3-echo -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];r=([c for c in s.get(\"conditions\",[]) if c[\"type\"]==\"Ready\"] or [{}])[0];print(\"PHASE=\"+s.get(\"phase\",\"\")+\",READY=\"+r.get(\"reason\",\"\")+\",MESSAGE=\"+r.get(\"message\",\"\"))"'
        retry: 15
        delay: 2
        info: "status of the ruby3 Function → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PHASE=Failed,READY=RuntimeUnavailable,"
          - result.systemout ShouldContainSubstring "funcd/runtime-ruby3:latest"
          - result.systemout ShouldContainSubstring "is not embedded"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl delete function ruby3-echo -n default'
        assertions:
          - result.code ShouldEqual 0

  # ADR-0110 + ADR-0171: only an admin creates a Namespace. In the explicit Namespace the host Route serves the
  # Function, and the by-name path is refused before any wake.
  - name: explicit-namespace — the admin token applies an explicit Namespace, and its Function serves through its host Route only
    steps:
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} \
            funcdctl apply -f /opt/lane/env-echo-explicit-namespace.yaml
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}}
            fn=$(funcdctl get function explicit-echo -n team-explicit -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            route=$(funcdctl get route explicit-echo -n team-explicit -o json | python3 -c "import sys,json;c={x[\"type\"]:x[\"status\"] for x in json.load(sys.stdin).get(\"status\",{}).get(\"conditions\",[])};print(c.get(\"Ready\",\"\"))")
            echo "FUNCTION=$fn,ROUTE=$route"'
        retry: 30
        delay: 2
        info: "explicit-echo status → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual FUNCTION=Ready,ROUTE=True
      - type: http
        method: POST
        url: "{{.dp}}/hello"
        headers:
          Host: explicit.example.com
          content-type: application/json
        body: '{"data":null}'
        retry: 15
        delay: 2
        info: "host-routed invoke → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/function/explicit-echo"
        headers:
          X-Funcd-Namespace: team-explicit
          content-type: application/json
        body: '{"data":null}'
        info: "by-name invoke in the explicit namespace → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 404
          - result.body ShouldContainSubstring "namespace is explicit"

  # ADR-0113 + ADR-0171: the Route sets no auth, so the namespace's edgeDefaults make it authenticated. The developer
  # token is scoped to `default`, so the PDP refuses it here; the admin token spans every namespace.
  - name: edge-defaults — a Route in a Namespace with authenticated edgeDefaults is 401 anonymous, 403 out of scope, served with the admin token
    steps:
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} \
            funcdctl apply -f /opt/lane/env-echo-edge-defaults.yaml
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}}
            fn=$(funcdctl get function guarded-echo -n team-guarded -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            route=$(funcdctl get route guarded-echo -n team-guarded -o json | python3 -c "import sys,json;c={x[\"type\"]:x[\"status\"] for x in json.load(sys.stdin).get(\"status\",{}).get(\"conditions\",[])};print(c.get(\"Ready\",\"\"))")
            echo "FUNCTION=$fn,ROUTE=$route"'
        retry: 30
        delay: 2
        info: "guarded-echo status → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual FUNCTION=Ready,ROUTE=True
      # retry/delay covers the router taking the Ready Route; until then /guarded is 404.
      - type: http
        method: POST
        url: "{{.dp}}/guarded"
        headers:
          content-type: application/json
        body: '{"data":null}'
        retry: 10
        delay: 1
        info: "anonymous /guarded → {{.result.statuscode}}"
        assertions:
          - result.statuscode ShouldEqual 401
      - type: http
        method: POST
        url: "{{.dp}}/guarded"
        headers:
          content-type: application/json
          Authorization: "Bearer {{.devtoken}}"
        body: '{"data":null}'
        info: "/guarded with the developer token → {{.result.statuscode}}"
        assertions:
          - result.statuscode ShouldEqual 403
      - type: http
        method: POST
        url: "{{.dp}}/guarded"
        headers:
          content-type: application/json
          Authorization: "Bearer {{.admintoken}}"
        body: '{"data":null}'
        retry: 15
        delay: 2
        info: "/guarded with the admin token → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
