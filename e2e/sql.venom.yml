# Venom e2e suite for the sql containerd lane (ADR-0232, ADR-0233), run host-side once the Lima VM is Ready. The
# functions come from funcd-functions (apps/todo): notes, a TypeScript owner of SQLDatabase notes-db whose Drizzle
# schema runs through context.sql, and notes-report, a Python reader whose SQLModel models compile with the SQLite
# dialect. One rqlite engine serves notes-db from a durable directory.
#   S1 the owner creates its table and writes; both runtimes read the rows (bound-function-reads, owner-writes).
#   S2 the reader's write is refused (non-writer-write-refused).
#   S3 a batch whose second statement fails applies none (batch-is-all-or-nothing).
#   S4 the rows survive a kill of the engine and a restart of the daemon (ADR-0231 durable storage).
#   S5 a 100 MB database is backed up to the S3 server in the VM, sealed, as one member file (ADR-0234).
#   S6 a Restore loads it into an empty database under the default 256Mi bound, and the copy reads the same rows.
#   S7 with its engine directory gone, as after a platform restore on a new host, notes-db is Ready and empty with
#      DataMissing True; an admin's in-place Restore brings its rows back and clears it.
#   S8 a note added to notes-db fires note-added through the engine's change feed, and a Sensor copies it into
#      notes-db-restored by invoking notes-restored (ADR-0235).
#   S9 the todo App with its value sql installs todo-db, and its pre-hook applies the 1.0.0 migration before the
#      API serves; the 1.1.0 upgrade applies only the new one (ADR-0236).
name: sql — SQL databases on real containerd (ADR-0232 to ADR-0236)

vars:
  dp: http://127.0.0.1:8081
  vmsh: "limactl shell --workdir / {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=sql-lane-developer bash -c"
  reg: oci-layout:///mnt/funcd-deps/registry
  values: "-f /opt/lane/values/e2e.yaml -f /opt/lane/values/sql.yaml"
  ctr: "/var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default"

testcases:
  - name: S1 the owner creates its table and writes, and both runtimes read the rows
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"init"}}'
        retry: 30
        delay: 2
        info: "init → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"milk"}}'
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.added.title ShouldEqual milk
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"eggs"}}'
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.added.title ShouldEqual eggs
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        info: "list → {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.notes ShouldHaveLength 2
          - result.bodyjson.notes.notes0.title ShouldEqual milk
      - type: http
        method: POST
        url: "{{.dp}}/function/notes-report"
        headers:
          content-type: application/json
        body: '{"data":{}}'
        retry: 15
        delay: 2
        info: "report → {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.count ShouldEqual 2
          - result.body ShouldContainSubstring '"titles":["milk","eggs"]'

  - name: S2 the reader binds the database but its write is refused
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/notes-report"
        headers:
          content-type: application/json
        body: '{"data":{"op":"write"}}'
        info: "write → {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.error ShouldContainSubstring 403
          - result.bodyjson.error ShouldContainSubstring "sql::write"

  - name: S3 a batch whose second statement fails applies none of its statements
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"batch","titles":["bread",null,"jam"]}}'
        info: "batch → {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.error ShouldContainSubstring "statement 1"
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        assertions:
          - result.bodyjson.notes ShouldHaveLength 2

  - name: S4 the rows survive a kill of the engine and a restart of the daemon
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            t=$({{.ctr}} task ls | awk "\$1 ~ /^notes-db-r[0-9]+$/ && \$3 == \"RUNNING\" {print \$1}" | head -1)
            echo "engine $t" >&2
            [ -n "$t" ] && {{.ctr}} task kill -s SIGKILL "$t" && echo KILLED'
        info: "the engine kill → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring KILLED
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "list after the engine kill → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.notes ShouldHaveLength 2
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo RESTARTED'
        info: "the daemon restart → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring RESTARTED
      - type: http
        method: POST
        url: "{{.dp}}/function/notes-report"
        headers:
          content-type: application/json
        body: '{"data":{}}'
        retry: 45
        delay: 2
        info: "report after the restart → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.count ShouldEqual 2

  - name: S5 a 100 MB database is backed up to the S3 server in the VM
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"fill","megabytes":100}}'
        info: "fill → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            install -d /var/lib/vgw/data/todo-workload /var/lib/vgw/versions
            systemd-run --unit sql-s3 -p EnvironmentFile=/opt/lane/dr/versitygw.env /opt/lane/dr/versitygw \
              --port 127.0.0.1:7070 posix --versioning-dir /var/lib/vgw/versions /var/lib/vgw/data
            for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:7070 && break; sleep 1; done
            funcdctl apply -f /opt/lane/dr/workload-secrets.yaml >/dev/null
            funcdctl apply -f /opt/lane/sql/backup.yaml >/dev/null
            funcdctl apply -f /opt/lane/sql/backup-b1.yaml >/dev/null
            for i in $(seq 90); do
              p=$(funcdctl get backup notes-b1 -n default -o json | python3 -c "import json,sys;print(json.load(sys.stdin)[\"status\"].get(\"phase\",\"\"))")
              [ "$p" = Succeeded ] && break; [ "$p" = Failed ] && { funcdctl get backup notes-b1 -n default -o json; exit 1; }; sleep 2
            done
            funcdctl get backup notes-b1 -n default -o json | python3 -c "import json,sys;s=json.load(sys.stdin)[\"status\"];m=s[\"members\"][0];print(s[\"phase\"],m[\"kind\"],m[\"name\"],m[\"bytes\"])"
            d=$(ls -d /var/lib/vgw/data/todo-workload/default/notes-b1-*)
            ls $d/sql/notes-db | head -3; ls $d | grep -q manifest.yaml && echo MANIFEST'
        info: "the backup → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Succeeded SQLDatabase notes-db"
          - result.systemout ShouldContainSubstring part-00000
          - result.systemout ShouldContainSubstring MANIFEST

  - name: S6 the backup restores into an empty database under the default memory bound
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            funcdctl apply -f /opt/lane/sql/notes-db-restored.yaml >/dev/null
            for i in $(seq 60); do
              funcdctl get sqldatabase notes-db-restored -n default -o json | grep -q "\"phase\": *\"Ready\"" && break; sleep 2
            done
            sed s/BACKUP/notes-b1/ /opt/lane/sql/restore-copy.yaml | funcdctl apply -f - >/dev/null
            for i in $(seq 120); do
              p=$(funcdctl get restore notes-copy -n default -o json | python3 -c "import json,sys;print(json.load(sys.stdin)[\"status\"].get(\"phase\",\"\"))")
              [ "$p" = Succeeded ] && break; [ "$p" = Failed ] && { funcdctl get restore notes-copy -n default -o json; exit 1; }; sleep 2
            done
            echo "restore $p"
            funcdctl apply -f /opt/lane/sql/notes-restored.yaml >/dev/null'
        info: "the restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "restore Succeeded"
      - type: http
        method: POST
        url: "{{.dp}}/function/notes-restored"
        headers:
          content-type: application/json
        body: '{"data":{"op":"size"}}'
        retry: 45
        delay: 2
        info: "the copy → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.blobs ShouldEqual 100
          - result.bodyjson.bytes ShouldEqual 104857600
      - type: http
        method: POST
        url: "{{.dp}}/function/notes-restored"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        assertions:
          - result.bodyjson.notes ShouldHaveLength 2

  - name: S7 lost engine data is reported, and an in-place Restore brings it back
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            rm -rf /var/lib/funcd/data/providers/sqldatabase/default/notes-db
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            for i in $(seq 60); do
              funcdctl get sqldatabase notes-db -n default -o json | python3 -c "
          import json,sys
          s=json.load(sys.stdin)[\"status\"]
          c={x[\"type\"]:x for x in s.get(\"conditions\",[])}
          ok=c.get(\"DataMissing\",{}).get(\"status\")==\"True\" and s.get(\"phase\")==\"Ready\"
          print(\"MISSING\" if ok else \"waiting\", c.get(\"DataMissing\",{}).get(\"message\",\"\"))" | tee /tmp/missing | grep -q MISSING && break
              sleep 2
            done
            cat /tmp/missing'
        info: "after the loss → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring MISSING
          - result.systemout ShouldContainSubstring "workload Restore"
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"init"}}'
        retry: 45
        delay: 2
        info: "the empty database → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=sql-lane-admin
            set -e
            sed s/BACKUP/notes-b1/ /opt/lane/sql/restore-in-place.yaml | funcdctl apply -f - >/dev/null
            for i in $(seq 120); do
              p=$(funcdctl get restore notes-back -n default -o json | python3 -c "import json,sys;print(json.load(sys.stdin)[\"status\"].get(\"phase\",\"\"))")
              [ "$p" = Succeeded ] && break; [ "$p" = Failed ] && { funcdctl get restore notes-back -n default -o json; exit 1; }; sleep 2
            done
            echo "in place $p"
            for i in $(seq 30); do
              funcdctl get sqldatabase notes-db -n default -o json | python3 -c "
          import json,sys
          c={x[\"type\"]:x for x in json.load(sys.stdin)[\"status\"].get(\"conditions\",[])}
          print(\"CLEARED\" if c.get(\"DataMissing\",{}).get(\"status\")==\"False\" else \"waiting\")" | grep -q CLEARED && { echo CLEARED; break; }
              sleep 2
            done'
        info: "the in-place restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "in place Succeeded"
          - result.systemout ShouldContainSubstring CLEARED
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "the rows after the restore → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.notes ShouldHaveLength 2

  - name: S8 a new row starts a Function through the change feed and a Sensor
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            funcdctl apply -f /opt/lane/sql/changes.yaml >/dev/null
            for i in $(seq 30); do
              funcdctl get eventsource notes-changes -n default -o json | grep -q "\"phase\": *\"Ready\"" && { echo WATCHING; break; }
              sleep 2
            done'
        info: "the EventSource → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring WATCHING
      - type: http
        method: POST
        url: "{{.dp}}/function/notes"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"bread"}}'
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/function/notes-restored"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "the copy → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring '"title":"bread"'
      # What a failed copy needs: the feed's listener, its answer to a forged token from the bridge, and its log.
      - type: exec
        script: |
          {{.vmsh}} '
            ss -ltn | grep 7075
            curl -s -o /dev/null -w "forged %{http_code}\n" -X POST http://10.63.0.1:7075/v1/changes/forged
            journalctl -u funcd-demo --no-pager | grep -o "bridge address.*" | tail -1
            journalctl -u funcd-demo --no-pager | grep -iE "change feed|sql change" | tail -5'
        info: "the feed → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "forged 404"
      - type: exec
        script: |
          {{.vmsh}} 'journalctl -u funcd-demo --no-pager | grep -c "sql change delivery failed" || true'
        info: "failed deliveries → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldEqual 0

  - name: S9 the todo App's pre-hook migrates its database at install and at upgrade
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            cd /opt/lane
            for f in api-1.0.0:todo-api:1.0.0 api-1.1.0:todo-api:1.1.0 migrate-1.0.0:todo-migrate:1.0.0 migrate-1.1.0:todo-migrate:1.1.0 collect:todo-collect:1.0.0; do
              funcdctl push functions/ts/${f%%:*}.mjs {{.reg}}/${f#*:} > /dev/null
            done
            for f in planner:todo-planner rank:todo-rank warm:todo-warm intake:todo-intake stats:todo-stats; do
              funcdctl push functions/py/dist/${f%%:*} {{.reg}}/${f#*:}:1.0.0 > /dev/null
            done
            funcdctl push --site web {{.reg}}/todo-web:1.0.0 > /dev/null
            funcdctl app lock app {{.values}} > /dev/null
            funcdctl push --template app {{.reg}}/todo:1.0.0 > /dev/null
            funcdctl app deploy {{.reg}}/todo:1.0.0 {{.values}}'
        info: "deploy 1.0.0 → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-1
      - type: http
        method: POST
        url: "{{.dp}}/function/todo-stats"
        headers:
          content-type: application/json
        body: '{"data":{}}'
        retry: 30
        delay: 2
        info: "stats on 1.0.0 → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.migrations ShouldEqual 1
          - result.bodyjson.todos ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            cd /opt/lane
            funcdctl app lock app-1.1.0 {{.values}} > /dev/null
            funcdctl push --template app-1.1.0 {{.reg}}/todo:1.1.0 > /dev/null
            funcdctl app deploy {{.reg}}/todo:1.1.0 {{.values}}'
        info: "deploy 1.1.0 → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-2
      - type: http
        method: POST
        url: "{{.dp}}/function/todo-stats"
        headers:
          content-type: application/json
        body: '{"data":{}}'
        retry: 30
        delay: 2
        info: "stats on 1.1.0 → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.migrations ShouldEqual 2
