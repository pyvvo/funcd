# Venom e2e suite for the app-todo lane: the todo App of github.com/pyvvo/funcd-functions (apps/todo) deployed as one
# unit on real containerd. The pkg/funcd e2e suite covers the App control logic in process; each testcase here proves
# what only the real runtime shows:
#   L1 the template pushed to the VM's OCI layout deploys, every Function runs the digest app.lock pinned, and a render
#      from the pushed ref equals the render from the directory (ADR-0217, ADR-0218);
#   L2 a Workflow run passes data from a TypeScript step to a Python step on containerd;
#   L3 a cron timer fires on the wall clock in Asia/Kathmandu (UTC+5:45) with the VM's zone files hidden, so only
#      funcd's embedded tzdata resolves the zone (ADR-0211);
#   L4 the 1.1.0 pre-hook migrates the durable KV data before the API switches, and a downgrade runs the hooks of
#      1.0.0 (ADR-0214);
#   L5 a delete keeps the retained stores' data on disk for a new install to use through ref, and the stores with
#      deletion delete leave the disk (ADR-0199);
#   L6 app deploy --dry-run of 1.1.0 prints the plan and stores nothing (ADR-0220);
#   L7 a hand edit of a part is written back and recorded; while the App is paused a hand edit stays, and the resume
#      writes it back (ADR-0212);
#   L8 a new value of the App's ConfigMap rolls the API to a new Revision that serves it (ADR-0213);
#   L9 app history lists the revisions, and app rollback applies an earlier spec as a new revision (ADR-0200);
#   L10 a Python call past its spec.timeout gets 504 and DeadlineExceeded, and its container keeps serving (ADR-0226);
#   L11 a replica whose handler blocks its event loop is restarted after the liveness timeout, and a binding the
#       planner may no longer read makes it DependencyNotReady, which the App names (ADR-0215);
#   L12 an App whose Workflow step binds a store neither the Workflow nor the App declares is refused at apply
#       (ADR-0248's binding-declared);
#   L13 a rollout waits for the App it requires until that App is Ready at a matching version (ADR-0219);
#   L14 an upload under uploads/ in Bucket todo-files fires the blob EventSource, whose Sensor runs the intake
#       Function, which records the upload (ADR-0119).
#   D1-D5 the disaster-recovery drill (FEAT-0009): backups on schedule to an S3 server in the VM (versitygw), sealed;
#       a total loss of the host (every process, file and link funcd made), then a rebuilt host restored from the
#       target and an escrow copy alone to the point before the damage, booting held; a lost write's version
#       conflicts; a release that advances the uploads source fires no restored upload twice; and funcdctl backup
#       plan (ADR-0202-0206, 0209, 0223).
#   D6-D8 the App's own data (F111): a backup schedule the App declares backs up its stores to its S3 target, sealed;
#       a Restore loads a Backup into new stores, and an admin's in-place Restore exports first (ADR-0222).
#   D9 funcd upgrade writes a pre-upgrade generation and keeps the old binary (ADR-0207).
#   D10 the blob store on S3: an unversioned bucket is refused, and on a versioned one uploads land there, keep their
#       old versions and still fire the blob event source (ADR-0208).
#   D11-D14 the dead letter and the run record of the backup come back as evidence; a target funcd cannot write stops
#       the backup and backup status says why; a config that breaks a backup rule is refused at start and by backup
#       plan alike; a plain restart keeps the event store, so nothing fires twice (ADR-0201, 0203, 0205, 0223).
#   D15 a crash-looping funcd starts held, then stops with status 70 naming the restore (ADR-0207 safe mode);
#   D16 funcd restore blob --at on the S3 store, to a key's earlier version and to before the key existed; D17 the App swaps a restored copy in through ref, and its Backups
#       outlive it until their ttl (ADR-0208, ADR-0222).
#   D18 the App's backup copies its DuckLake catalog, empty before its first checkpoint, and a Restore into an empty
#       prefix gives a catalog a new CatalogService serves (ADR-0222 Decisions 4, 5, 7).
#   Q1-Q6 version 1.2.0, whose todos and upload records live in SQLDatabase todo-db: its pre-hook migrates the database
#       and copies them from KV before the SQL API serves; done, a filter, counts and a join; an upload the 1.2.0 intake
#       records in SQL; a new row that fires the App's sql EventSource, whose Sensor records it in KV; the App's backup
#       copying todo-db, sealed; an admin's in-place Restore of it; and a restored copy swapped in through ref, while
#       todo-db stays (ADR-0233-0236).
#   C1-C5 one Site build of the site-config App of funcd-functions deployed into staging and prod: each serves its own
#       generated config.json and both the one bundle digest; config.json is revalidated (no-cache, an ETag, 304) and
#       never the SPA's index; a new value of the App's ConfigMap reaches it with a new ETag and the same digest
#       (ADR-0239). C6 runs the same digest as a Site at the path /preview on staging.localhost (ADR-0240), its index
#       carrying its mount as its base: a direct deep link loads the app's relative script and config.json under the
#       mount (ADR-0239 Decision 10). C7 serves that build at a host root through a Route of its own, the todo API
#       beside it, and follows a new build (ADR-0242). They run last, with the admin token the DR block installed,
#       since the developer token is scoped to default.
# The suite pushes, locks and deploys the App itself; the lane only creates the Secret and the grant beside it. Every
# file it applies comes from funcd-functions, staged by scripts/lanes.yaml.
name: app-todo — the todo App from its pushed template on real containerd (ADR-0199/0200/0211-0215/0217-0220/0226/0229), a disaster-recovery drill (ADR-0202-0209/0222/0223), version 1.2.0 on rqlite (ADR-0233-0236), and runtime configuration of a Site (ADR-0239)

vars:
  dp: http://127.0.0.1:8081
  reg: oci-layout:///mnt/funcd-deps/registry
  token: todo-lane-token
  fctl: "limactl shell --workdir / {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token funcdctl"
  vmsh: "limactl shell --workdir / {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token bash -c"
  values: "-f /opt/lane/values/e2e.yaml -f /opt/lane/values/reinstall.yaml"
  ctr: "/var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default"

testcases:
  - name: L1 the template pushed to the OCI layout deploys from its ref
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            cd /opt/lane
            for f in api-1.0.0:todo-api:1.0.0 api-1.1.0:todo-api:1.1.0 migrate-1.0.0:todo-migrate:1.0.0 migrate-1.1.0:todo-migrate:1.1.0 collect:todo-collect:1.0.0; do
              funcdctl push functions/ts/${f%%:*}.mjs {{.reg}}/${f#*:}
            done
            for f in planner:todo-planner:1.0.0 rank:todo-rank:1.0.0 warm:todo-warm:1.0.0 intake:todo-intake:1.0.0 stats:todo-stats:1.0.0; do
              funcdctl push functions/py/dist/${f%%:*} {{.reg}}/${f#*:}
            done
            funcdctl push --site web {{.reg}}/todo-web:1.0.0' | grep -c "@sha256:"
        info: "pushed → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual 11
      - type: exec
        script: |
          {{.fctl}} app lock /opt/lane/app -f /opt/lane/values/e2e.yaml | grep -E '^[a-z]+ 1[.]0[.]0 sha256:[0-9a-f]{64}$' | cut -d' ' -f1 | paste -sd, -
        info: "app.lock → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual api,collect,intake,migrate,planner,rank,stats,warm,web
      - type: exec
        script: "{{.fctl}} push --template /opt/lane/app {{.reg}}/todo:1.0.0"
        info: "template → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "^oci-layout:///mnt/funcd-deps/registry/todo:1[.]0[.]0@sha256:[0-9a-f]{64}$"
      - type: exec
        script: "{{.fctl}} app deploy {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml"
        info: "deploy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-1
          - result.systemerr ShouldContainSubstring "template oci-layout:///mnt/funcd-deps/registry/todo:1.0.0@sha256:"

  - name: L1 every Function of the App runs the image digest that app.lock pinned
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess, yaml
          def get(kind, name):
              out = subprocess.run(["funcdctl", "get", kind, name, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else {}
          lock = yaml.safe_load(open("/opt/lane/app/app.lock"))["images"]
          parts = {"todo-api": "api", "todo-migrate": "migrate", "todo-warm": "warm", "todo-planner": "planner",
                   "todo-plan-collect": "collect", "todo-plan-rank": "rank", "todo-intake": "intake"}
          runs = []
          for fn, image in sorted(parts.items()):
              rev = get("function", fn).get("status", {}).get("currentRevision", "")
              digest = get("revision", rev).get("spec", {}).get("imageDigest", "") if rev else ""
              runs.append(fn + "=" + ("locked" if digest == lock[image]["digest"] else "other:" + digest))
          site = get("site", "todo-web").get("status", {}).get("digest", "")
          runs.append("todo-web=" + ("locked" if site == lock["web"]["digest"] else "other:" + site))
          print(",".join(runs))
          PY
          '
        retry: 15
        delay: 2
        info: "digests → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual todo-api=locked,todo-intake=locked,todo-migrate=locked,todo-plan-collect=locked,todo-plan-rank=locked,todo-planner=locked,todo-warm=locked,todo-web=locked

  - name: L1 a render from the pushed ref equals the render from the template directory
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            funcdctl app render {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml >/tmp/render-ref.yaml 2>/dev/null
            funcdctl app render /opt/lane/app -f /opt/lane/values/e2e.yaml >/tmp/render-dir.yaml
            cmp -s /tmp/render-ref.yaml /tmp/render-dir.yaml && same=yes || same=no
            echo "SAME=$same,IMAGES=$(grep -c "@sha256:" /tmp/render-ref.yaml)"'
        info: "render → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual SAME=yes,IMAGES=8

  - name: L1 the App serves through its Route and its Site on the real edge, after both hooks ran
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"milk","token":"{{.token}}"}}'
        retry: 15
        delay: 2
        info: "add milk → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.id ShouldEqual milk
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"passport","token":"{{.token}}"}}'
        info: "add passport → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.id ShouldEqual passport
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.0.0
          - result.bodyjson.todos ShouldHaveLength 2
          - result.bodyjson.todos.todos0.title ShouldEqual milk
          - result.bodyjson.todos.todos1.title ShouldEqual passport
          - result.bodyjson.greeting ShouldEqual "hello from the todo App"
          - result.bodyjson.tokenSet ShouldBeTrue
          - result.bodyjson.migration.by ShouldEqual "todo-migrate 1.0.0"
          - result.bodyjson.migration.event ShouldEqual install
          - result.bodyjson.release.by ShouldEqual todo-warm
          - result.bodyjson.release.revision ShouldEqual todo-1
      - type: http
        method: GET
        url: "{{.dp}}/site/todo-web/"
        info: "site → status {{.result.statuscode}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring <title>todo</title>

  - name: L2 a Workflow run passes data from its TypeScript step to its Python step on containerd
    steps:
      - type: exec
        script: "{{.fctl}} workflow run todo-plan plan-l2 --input '{\"tick\":\"manual-l2\"}'"
        info: "run → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.fctl}} get workflowrun plan-l2 -n default -o json | python3 -c 'import sys,json;d=json.load(sys.stdin);print("PHASE="+d["status"].get("phase","")+",STEPS="+";".join(s["name"]+"="+s["phase"] for s in d["status"].get("steps",[])))'
        retry: 60
        delay: 2
        info: "plan-l2 → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldEqual PHASE=Succeeded,STEPS=collect=Succeeded;rank=Succeeded
      # The Python planner reads the plan that the Python rank step stored from the titles the TypeScript step read.
      - type: http
        method: POST
        url: "{{.dp}}/function/todo-planner"
        headers:
          content-type: application/json
        body: '{"data":{"tick":"manual-l2"}}'
        retry: 15
        delay: 2
        info: "planner → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.found ShouldBeTrue
          - result.bodyjson.collected_by ShouldEqual collect
          - result.bodyjson.ranked_by ShouldEqual rank
          - result.bodyjson.plan ShouldHaveLength 2
          - result.bodyjson.plan.plan0 ShouldEqual milk
          - result.bodyjson.plan.plan1 ShouldEqual passport

  - name: L3 a cron timer fires on the wall clock in Asia/Kathmandu (UTC+5:45) with only funcd's embedded tzdata
    steps:
      # Hide the VM's zone files: from here the system cannot resolve Asia/Kathmandu, and funcd only through the tzdata
      # it embeds.
      - type: exec
        script: |
          {{.vmsh}} '
            mkdir -p /run/no-zoneinfo && mount --bind /run/no-zoneinfo /usr/share/zoneinfo
            echo "FILES=$(ls -A /usr/share/zoneinfo | wc -l),OFFSET=$(TZ=Asia/Kathmandu date +%z)"'
        info: "zone files → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual FILES=0,OFFSET=+0000
      # The slot is the minute two minutes ahead; the cron names its minute and hour in Kathmandu, 5 h 45 min ahead of
      # UTC all year, so a zone resolved to a whole-hour offset or to UTC misses the slot.
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            slot=$(( ($(date +%s) / 60 + 2) * 60 ))
            date -u -d @$slot +%Y-%m-%dT%H:%M > /tmp/slot
            cron="$(date -u -d @$((slot + 20700)) "+%-M %-H") * * *"
            printf "schedule:\n  cron: \"%s\"\n  timeZone: Asia/Kathmandu\n" "$cron" > /tmp/schedule.yaml
            funcdctl app deploy {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml -f /tmp/schedule.yaml > /tmp/deploy-l3.log 2>&1 || { cat /tmp/deploy-l3.log; exit 1; }
            funcdctl get eventsource todo-plan-timer -n default -o json > /tmp/timer.json
            python3 - "$cron" <<"PY"
          import json, sys
          timer = json.load(open("/tmp/timer.json"))
          event = timer["spec"]["timer"]["events"][0]
          ready = [c["status"] for c in timer.get("status", {}).get("conditions", []) if c["type"] == "Ready"]
          print("CRON=" + str(event.get("cron") == sys.argv[1]) + ",ZONE=" + event.get("timeZone", "") + ",READY=" + "".join(ready))
          PY
          '
        info: "timer → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual CRON=True,ZONE=Asia/Kathmandu,READY=True
      # The Sensor starts a run per tick with the event's time as its input: the run of the slot fired within seconds of
      # it, and it Succeeds.
      - type: exec
        script: |
          {{.vmsh}} '
            funcdctl get workflowrun -n default -o json > /tmp/runs.json
            python3 - "$(cat /tmp/slot)" <<"PY"
          import json, sys
          slot = sys.argv[1] + ":"
          runs = json.load(open("/tmp/runs.json"))
          runs = runs if isinstance(runs, list) else runs.get("items", [])
          fired = [r for r in runs if r["metadata"]["name"].startswith("todo-plan-schedule-plan-")
                   and str((r["spec"].get("input") or {}).get("tick", "")).startswith(slot)]
          if fired:
              tick = fired[0]["spec"]["input"]["tick"]
              print("PHASE=" + fired[0].get("status", {}).get("phase", "") + ",SECOND=" + tick[len(slot):len(slot) + 2])
          else:
              print("WAITING=" + slot)
          PY
          '
        retry: 100
        delay: 2
        info: "the run of the slot → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex ^PHASE=Succeeded,SECOND=0[0-9]$

  - name: L4 the 1.1.0 pre-hook migrates the durable KV data before the API switches
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            funcdctl app lock /opt/lane/app-1.1.0 -f /opt/lane/values/e2e.yaml > /dev/null
            funcdctl push --template /opt/lane/app-1.1.0 {{.reg}}/todo:1.1.0 > /dev/null
            funcdctl app deploy {{.reg}}/todo:1.1.0 -f /opt/lane/values/e2e.yaml'
        info: "deploy 1.1.0 → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex ^todo-[0-9]+
      # The 1.1.0 API lists only schema-2 todos: it shows the todos of 1.0.0 because the pre-hook rewrote them.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list on 1.1.0 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.1.0
          - result.bodyjson.unmigrated ShouldEqual 0
          - result.bodyjson.todos ShouldHaveLength 2
          - result.bodyjson.todos.todos0.title ShouldEqual milk
          - result.bodyjson.todos.todos0.done ShouldBeFalse
          - result.bodyjson.todos.todos1.title ShouldEqual passport
          - result.bodyjson.migration.by ShouldEqual "todo-migrate 1.1.0"
          - result.bodyjson.migration.event ShouldEqual upgrade
          - result.bodyjson.migration.fromVersion ShouldEqual 1.0.0
          - result.bodyjson.migration.migrated ShouldEqual 2
          - result.bodyjson.release.version ShouldEqual 1.1.0
      # The pre-hook's call ended before the API's 1.1.0 Revision was stamped, so the API switched after the migration.
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(kind, name):
              out = subprocess.run(["funcdctl", "get", kind, name, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else {}
          rev = get("apprevision", get("app", "todo")["status"]["currentRevision"])
          pre = [h for h in rev["status"].get("hooks", []) if h["point"] == "preApply"][-1]
          api = get("revision", get("function", "todo-api")["status"]["currentRevision"])
          order = "hook-first" if pre["endTime"] < api["metadata"]["creationTimestamp"] else "api-first"
          print("HOOK=" + pre["function"] + "/" + pre["phase"] + ",API=" + api["spec"]["image"].split("/")[-1].split("@")[0] + ",ORDER=" + order)
          PY
          '
        info: "pre-hook and API revision → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual HOOK=todo-migrate/Ready,API=todo-api:1.1.0,ORDER=hook-first
      # The migrated records are in the KV engine's files under the daemon's data dir.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c 'for t in milk passport; do grep -rqF "{\"title\":\"$t\",\"done\":false}" /var/lib/funcd/data/kv && echo "$t=on-disk" || echo "$t=missing"; done | paste -sd, -'
        info: "migrated records on disk → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual milk=on-disk,passport=on-disk

  - name: L4 a downgrade to 1.0.0 runs the hooks of 1.0.0 and keeps the data
    steps:
      - type: exec
        script: "{{.fctl}} app deploy {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml"
        info: "deploy 1.0.0 → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex ^todo-[0-9]+
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list on 1.0.0 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.0.0
          - result.bodyjson.todos ShouldHaveLength 2
          - result.bodyjson.todos.todos0.title ShouldEqual milk
          - result.bodyjson.todos.todos1.title ShouldEqual passport
          - result.bodyjson.migration.by ShouldEqual "todo-migrate 1.0.0"
          - result.bodyjson.migration.event ShouldEqual rollback
          - result.bodyjson.migration.fromVersion ShouldEqual 1.1.0
          - result.bodyjson.migration.toVersion ShouldEqual 1.0.0
          - result.bodyjson.release.version ShouldEqual 1.0.0
      # The downgrade's revision records both hook calls, and its hook Function runs the image of 1.0.0's lock.
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess, yaml
          def get(kind, name):
              out = subprocess.run(["funcdctl", "get", kind, name, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else {}
          lock = yaml.safe_load(open("/opt/lane/app/app.lock"))["images"]
          rev = get("apprevision", get("app", "todo")["status"]["currentRevision"])
          calls = ";".join(h["point"] + "=" + h["function"] + "/" + h["phase"] for h in rev["status"].get("hooks", []))
          migrate = get("revision", get("function", "todo-migrate")["status"]["currentRevision"])["spec"]["imageDigest"]
          print("HOOKS=" + calls + ",MIGRATE=" + ("1.0.0" if migrate == lock["migrate"]["digest"] else migrate))
          PY
          '
        retry: 5
        delay: 1
        info: "the downgrade's hooks → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual HOOKS=preApply=todo-migrate/Ready;postApply=todo-warm/Ready,MIGRATE=1.0.0

  - name: L5 a delete keeps the retained stores on disk and removes the stores with deletion delete
    steps:
      # Each store holds data on disk before the delete: todo-store and todo-files are retained, todo-cache, todo-tmp
      # and todo-plans have deletion delete.
      - type: exec
        script: &disk |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            kv=/var/lib/funcd/data/kv; s3=/var/lib/funcd/data/blob/s3/default
            has() { grep -rqF "$1" $kv && echo yes || echo no; }
            files() { find "$1" -type f ! -name "*.attrs" 2>/dev/null | wc -l; }
            echo "STORE=$(has "{\"title\":\"milk\"")" "FILES=$(files $s3/todo-files)" "CACHE=$(has "\"by\": \"todo-warm\"")" "PLANS=$(has "\"ranked_by\": \"rank\"")" "TMP=$(files $s3/todo-tmp)" | tr " " ,'
        info: "on disk before the delete → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual STORE=yes,FILES=2,CACHE=yes,PLANS=yes,TMP=2
      - type: exec
        script: "{{.fctl}} app delete todo -n default"
        info: "delete → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "kept KVStore/todo-store"
          - result.systemout ShouldContainSubstring "kept Bucket/todo-files"
          - result.systemout ShouldContainSubstring "deleted KVStore/todo-cache"
          - result.systemout ShouldContainSubstring "deleted Bucket/todo-tmp"
          - result.systemout ShouldContainSubstring "deleted KVStore/todo-plans"
      - type: exec
        script: *disk
        retry: 15
        delay: 2
        info: "on disk after the delete → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual STORE=yes,FILES=2,CACHE=no,PLANS=no,TMP=0

  - name: L5 a new install uses the kept stores through ref
    steps:
      - type: exec
        script: "{{.fctl}} app deploy {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml -f /opt/lane/values/reinstall.yaml"
        info: "reinstall → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-1
      - type: exec
        script: |
          {{.fctl}} get app todo -n default -o json | python3 -c 'import sys,json;s=json.load(sys.stdin)["spec"];print("KV="+next((k["ref"] for k in s["kv"] if k.get("ref")),"")+",BUCKET="+next((b["ref"] for b in s["buckets"] if b.get("ref")),""))'
        info: "the App's stores → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldEqual KV=todo-store,BUCKET=todo-files
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list after the reinstall → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.todos ShouldHaveLength 2
          - result.bodyjson.todos.todos0.title ShouldEqual milk
          - result.bodyjson.todos.todos1.title ShouldEqual passport
          - result.bodyjson.migration.event ShouldEqual install
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"passport"}}'
        info: "the kept attachment → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.attachment ShouldEqual passport

  - name: L6 app deploy --dry-run of 1.1.0 prints its plan and stores nothing
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            rv() { funcdctl get "$@" -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"metadata\"][\"resourceVersion\"])"; }
            state() { echo "$(rv app todo)/$(rv function todo-api)/$(funcdctl app history todo -o json | python3 -c "import sys,json;print(len(json.load(sys.stdin)))")"; }
            before=$(state)
            funcdctl app deploy {{.reg}}/todo:1.1.0 {{.values}} --dry-run > /tmp/dry-run.txt
            after=$(state)
            [ "$before" = "$after" ] && stored=nothing || stored="$before to $after"
            echo "PLAN=$(sed "s/^ *//" /tmp/dry-run.txt | paste -sd ";" -),STORED=$stored"'
        info: "dry run → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "PLAN=would apply App/todo;revision todo-2;update Function/todo-api;update Function/todo-migrate;hook todo-migrate;hook todo-warm,STORED=nothing"

  - name: L7 a hand edit of the API is written back; while the App is paused a hand edit stays until the resume
    steps:
      # A hot fix by hand: the API's image becomes the image of 1.1.0.
      - type: exec
        script: &hotfix |
          {{.vmsh}} '
            funcdctl get function todo-api -n default -o json \
              | python3 -c "import sys,json;f=json.load(sys.stdin);f[\"spec\"][\"image\"]=\"{{.reg}}/todo-api:1.1.0\";f[\"spec\"].pop(\"imageDigest\",None);print(json.dumps(f))" \
              | funcdctl apply -f -'
        info: "hand edit → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      # The App writes the declared image back, logs self-healed and records it in status.lastSelfHeal.
      - type: exec
        script: &drift |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          app, api = get("app", "todo"), get("function", "todo-api")
          paused = next((c["status"] + "/" + c.get("reason", "") for c in app["status"].get("conditions", []) if c["type"] == "Paused"), "none")
          heal = app["status"].get("lastSelfHeal", {})
          journal = subprocess.run(["journalctl", "-u", "funcd-demo", "--no-pager", "-o", "cat"], capture_output=True, text=True).stdout
          lines = sum(1 for l in journal.splitlines() if "msg=self-healed" in l and "kind=Function" in l and "name=todo-api" in l and "app=todo" in l)
          print("PAUSED=" + paused + ",IMAGE=" + api["spec"]["image"].split("/")[-1].split("@")[0] + ",LAST_SELF_HEAL=" + heal.get("kind", "") + "/" + heal.get("name", "") + ",LINES=" + str(lines) + ",LATEST=" + app["status"].get("latestRevision", ""))
          PY
          '
        retry: 15
        delay: 1
        info: "after the hand edit → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual PAUSED=none,IMAGE=todo-api:1.0.0,LAST_SELF_HEAL=Function/todo-api,LINES=1,LATEST=todo-1
      - type: exec
        script: "{{.fctl}} app pause todo"
        info: "pause → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "paused todo"
      - type: exec
        script: *hotfix
        info: "hand edit while paused → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      # While paused the hot fix stays: the API answers from the image of 1.1.0, and the App wrote and stamped nothing.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "list while paused → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.1.0
      - type: exec
        script: *drift
        info: "while paused → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual PAUSED=True/SpecPaused,IMAGE=todo-api:1.1.0,LAST_SELF_HEAL=Function/todo-api,LINES=1,LATEST=todo-1
      - type: exec
        script: "{{.fctl}} app resume todo"
        info: "resume → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "resumed todo"
      - type: exec
        script: *drift
        retry: 15
        delay: 1
        info: "after the resume → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual PAUSED=False/Resumed,IMAGE=todo-api:1.0.0,LAST_SELF_HEAL=Function/todo-api,LINES=2,LATEST=todo-1
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "list after the resume → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.0.0

  - name: L8 a new value of the App's ConfigMap rolls the API to a new Revision that serves it
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            funcdctl get function todo-api -n default -o json | python3 -c "import sys,json;f=json.load(sys.stdin);print(f[\"spec\"][\"bindings\"][\"config\"][0], f[\"status\"][\"currentRevision\"])" > /tmp/settings-1
            funcdctl app deploy {{.reg}}/todo:1.0.0 {{.values}} -f /opt/lane/values/greeting.yaml'
        info: "deploy the new greeting → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-2
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list on todo-2 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.greeting ShouldEqual "good morning from the todo App"
      # The new data is a new hashed ConfigMap, created before the API's new Revision; todo-1's is pruned.
      - type: exec
        script: &settings |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          first, first_rev = open("/tmp/settings-1").read().split()
          api = get("function", "todo-api")
          name, rev = api["spec"]["bindings"]["config"][0], api["status"]["currentRevision"]
          maps = sorted(m["metadata"]["name"] for m in get("configmap") if m["metadata"]["name"].startswith("todo-settings-"))
          first_map = get("configmap", name)["metadata"]["creationTimestamp"] <= get("revision", rev)["metadata"]["creationTimestamp"]
          print("API_CONFIG=" + ("todo-1" if name == first else "hashed" if len(name) == len("todo-settings-") + 10 else name) + ",MAPS=" + str(len(maps)) + ",REVISION=" + ("todo-1" if rev == first_rev else "new") + ",MAP_BEFORE_REVISION=" + str(first_map))
          PY
          '
        retry: 15
        delay: 1
        info: "ConfigMaps and the API → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual API_CONFIG=hashed,MAPS=1,REVISION=new,MAP_BEFORE_REVISION=True

  - name: L9 app history lists the revisions, and app rollback applies the spec of an earlier one as a new revision
    steps:
      - type: exec
        script: &history |
          {{.vmsh}} '
            funcdctl app history todo -o json | python3 -c "import sys,json;print(\",\".join(str(r[\"spec\"][\"number\"])+\"=\"+r[\"spec\"][\"spec\"].get(\"version\",\"\")+\"/\"+r[\"status\"].get(\"phase\",\"\") for r in json.load(sys.stdin)))"'
        info: "history → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual 1=1.0.0/Ready,2=1.0.0/Ready
      - type: exec
        script: "{{.fctl}} app rollback todo 1"
        info: "rollback → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "applied App todo with the spec of todo-1"
      # todo-3 holds todo-1's spec and becomes current: todo-1's ConfigMap is created again and todo-2's is pruned.
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          first = open("/tmp/settings-1").read().split()[0]
          app = get("app", "todo")
          revs = {r["metadata"]["name"]: r["spec"]["spec"] for r in get("apprevision")}
          maps = sorted(m["metadata"]["name"] for m in get("configmap") if m["metadata"]["name"].startswith("todo-settings-"))
          print("CURRENT=" + app["status"].get("currentRevision", "") + ",SPEC=" + ("todo-1" if revs.get("todo-3") == revs["todo-1"] else "other") + ",MAPS=" + ";".join("todo-1" if m == first else m for m in maps) + ",API_CONFIG=" + ("todo-1" if get("function", "todo-api")["spec"]["bindings"]["config"][0] == first else "other"))
          PY
          '
        retry: 30
        delay: 1
        info: "after the rollback → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual CURRENT=todo-3,SPEC=todo-1,MAPS=todo-1,API_CONFIG=todo-1
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list on todo-3 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.greeting ShouldEqual "hello from the todo App"
      - type: exec
        script: *history
        info: "history → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual 1=1.0.0/Ready,2=1.0.0/Ready,3=1.0.0/Ready

  - name: L10 a Python call past its spec.timeout gets 504 and DeadlineExceeded, and its container keeps serving
    steps:
      # The first call wakes the planner; todo-plans holds no plan for the tick none.
      - type: http
        method: POST
        url: "{{.dp}}/function/todo-planner"
        headers:
          content-type: application/json
        body: '{"data":{"tick":"none"}}'
        retry: 15
        delay: 2
        info: "planner → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.found ShouldBeFalse
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            {{.ctr}} task ls | awk "\$1 ~ /^todo-planner-[0-9]+[.]r0\$/ && \$3 == \"RUNNING\" {print \$1, \$2}" | tee /tmp/planner-task'
        info: "the planner's task → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "^todo-planner-[0-9]+[.]r0 [0-9]+$"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            start=$(date +%s.%N)
            code=$(curl -s -m 10 -o /tmp/late.json -w "%{http_code}" -H "content-type: application/json" -d "{\"data\":{\"tick\":\"none\",\"wait\":30}}" http://127.0.0.1:8081/function/todo-planner)
            end=$(date +%s.%N)
            echo "$start" > /tmp/late-start
            python3 -c "import json,sys;print(\"CODE=%s,TYPE=%s,SECONDS=%.1f\" % (sys.argv[1], json.load(open(\"/tmp/late.json\")).get(\"type\", \"\"), float(sys.argv[3]) - float(sys.argv[2])))" "$code" "$start" "$end"'
        info: "the late call → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "^CODE=504,TYPE=urn:funcd:problem:deadline-exceeded,SECONDS=2[.][0-9]$"
      # The shim raises DeadlineExceeded in the handler 1 s after the deadline; the planner logs it.
      - type: exec
        script: |
          {{.vmsh}} '
          funcdctl logs todo-planner -n default -o json > /tmp/planner-logs.json
          python3 - <<"PY"
          import datetime, json
          deadline = float(open("/tmp/late-start").read()) + 2
          for line in open("/tmp/planner-logs.json"):
              record = json.loads(line)
              if "DeadlineExceeded" in record.get("body", ""):
                  at = datetime.datetime.fromisoformat(record["time"].replace("Z", "+00:00")).timestamp()
                  print("AFTER_DEADLINE=%.1f,BODY=%s" % (at - deadline, record["body"]))
                  break
          else:
              print("WAITING")
          PY
          '
        retry: 20
        delay: 1
        info: "the planner's log → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^AFTER_DEADLINE=[01][.][0-9],BODY=DeadlineExceeded while the planner waited for the plan of none$"
      - type: http
        method: POST
        url: "{{.dp}}/function/todo-planner"
        headers:
          content-type: application/json
        body: '{"data":{"tick":"none"}}'
        info: "the next call → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.found ShouldBeFalse
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            now=$({{.ctr}} task ls | awk "\$1 ~ /^todo-planner-[0-9]+[.]r0\$/ && \$3 == \"RUNNING\" {print \$1, \$2}")
            [ -n "$now" ] && [ "$now" = "$(cat /tmp/planner-task)" ] && echo SAME_TASK || echo "OTHER_TASK $(cat /tmp/planner-task) then $now"'
        info: "the planner's task → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual SAME_TASK

  - name: L11 a replica whose handler blocks its event loop is restarted after the liveness timeout, and a binding the planner may not read is named by the App
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            {{.ctr}} task ls | awk "\$1 ~ /^todo-api-[0-9]+[.]r0\$/ && \$3 == \"RUNNING\" {print \$1, \$2}" | tee /tmp/api-task'
        info: "the API's task → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^todo-api-[0-9]+[.]r0 [0-9]+$"
      # The call blocks the API's event loop for good; the client gives up after 2 s.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            date +%s.%N > /tmp/hang-start
            code=$(curl -s -m 2 -o /dev/null -w "%{http_code}" -H "content-type: application/json" -d "{\"data\":{\"op\":\"hang\",\"token\":\"{{.token}}\"}}" http://127.0.0.1:8081/api)
            echo "CODE=$code,EXIT=$?"'
        info: "the hanging call → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual CODE=000,EXIT=28
      # The replica stops answering /health/liveness: after runtime.livenessTimeout (6 s in the lane config), at a
      # supervision pass (every 2 s), funcd logs the restart.
      - type: exec
        script: |
          {{.vmsh}} '
          journalctl -u funcd-demo --no-pager -o cat | grep "silent on its liveness" | grep "function=todo-api" > /tmp/hang-log
          python3 - <<"PY"
          import datetime, re
          start = float(open("/tmp/hang-start").read())
          lines = open("/tmp/hang-log").read().splitlines()
          if lines:
              at = datetime.datetime.fromisoformat(re.search(r"time=(\S+)", lines[-1]).group(1).replace("Z", "+00:00")).timestamp()
              print("RESTARTED_AFTER=%d,REPLICA=%s" % (round(at - start), re.search(r"replica=(\d+)", lines[-1]).group(1)))
          else:
              print("WAITING")
          PY
          '
        retry: 30
        delay: 1
        info: "the restart → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^RESTARTED_AFTER=([3-9]|1[0-2]),REPLICA=0$"
      # A call sent while the hung replica is stopped waits for the replacement: no call is handed to a worker that is
      # being stopped, so this one is served at its first attempt.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        info: "list after the restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.0.0
      # The same replica index runs a new task; the API and the App are Ready again.
      - type: exec
        script: |
          {{.vmsh}} '
            now=$({{.ctr}} task ls | awk "\$1 ~ /^todo-api-[0-9]+[.]r0\$/ && \$3 == \"RUNNING\" {print \$1, \$2}")
            read -r task pid < /tmp/api-task
            [ "${now%% *}" = "$task" ] && [ -n "${now#* }" ] && [ "${now#* }" != "$pid" ] && replaced=yes || replaced="no ($task $pid then $now)"
            phase() { funcdctl get "$@" -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])"; }
            echo "REPLACED=$replaced,API=$(phase function todo-api),APP=$(phase app todo)"'
        retry: 15
        delay: 1
        info: "after the restart → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual REPLACED=yes,API=Ready,APP=Ready
      # A Policy forbids the planner to read its table plans: its readiness reports the binding, and the App names it.
      - type: exec
        script: "{{.fctl}} apply -f /opt/lane/fixtures/forbid-plan-read.yaml"
        info: "the Policy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: &dependency |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          def ready(obj):
              c = next((c for c in obj["status"].get("conditions", []) if c["type"] == "Ready"), {})
              return (obj["status"].get("phase", "") + "/" + c.get("reason", "") + " " + c.get("message", "")).replace(chr(34), "")
          print("PLANNER=" + ready(get("function", "todo-planner")))
          print("APP=" + ready(get("app", "todo")))
          PY
          '
        retry: 20
        delay: 1
        info: "the planner and the App → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "PLANNER=Degraded/DependencyNotReady kv binding plans"
          - "result.systemout ShouldContainSubstring 'APP=Degraded/ChildNotReady Function/todo-planner: DependencyNotReady: kv binding plans'"
      - type: exec
        script: "{{.fctl}} delete policy todo-planner-reads-no-plans -n default"
        info: "delete the Policy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: *dependency
        retry: 20
        delay: 1
        info: "the planner and the App → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring PLANNER=Ready/
          - result.systemout ShouldContainSubstring APP=Ready/

  - name: L12 an App whose Workflow step binds a store neither the Workflow nor the App declares is refused at apply
    steps:
      - type: exec
        script: |
          out=$({{.fctl}} apply -f /opt/lane/fixtures/undeclared-step-store.yaml 2>&1); code=$?
          printf "EXIT=%s %s\n" "$code" "$out" | tr -d '"'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldNotStartWith EXIT=0
          - "result.systemout ShouldContainSubstring 'spec.workflows[0] (Workflow/todo-replan): admission.binding-declared: spec.steps[0].function.bindings.kv[0]: KVStore todo-store is not declared in spec.kv'"
      # The API answers 400 to the create and to its dry run (ADR-0220), naming the field.
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, urllib.error, urllib.request, yaml
          app = json.dumps(yaml.safe_load(open("/opt/lane/fixtures/undeclared-step-store.yaml"))).encode()
          answers = []
          for query in ("?dryRun=true", ""):
              req = urllib.request.Request("http://127.0.0.1:8080/apis/funcd.io/v1alpha1/namespaces/default/apps" + query, data=app, method="POST",
                                           headers={"Authorization": "Bearer funcd-dev-token", "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req)
                  answers.append("stored")
              except urllib.error.HTTPError as e:
                  answers.append(str(e.code) + " " + json.load(e)["detail"].replace(chr(34), ""))
          print("DRY_RUN=" + answers[0])
          print("CREATE=" + answers[1])
          PY
          '
        info: "the API → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - "result.systemout ShouldContainSubstring 'DRY_RUN=400 admission.app-parts: spec.workflows[0] (Workflow/todo-replan): admission.binding-declared: spec.steps[0].function.bindings.kv[0]: KVStore todo-store is not declared in spec.kv'"
          - "result.systemout ShouldContainSubstring 'CREATE=400 admission.app-parts: spec.workflows[0] (Workflow/todo-replan): admission.binding-declared: spec.steps[0].function.bindings.kv[0]: KVStore todo-store is not declared in spec.kv'"
      - type: exec
        script: |
          {{.vmsh}} '
            for kind in app workflow; do funcdctl get $kind todo-replan -n default >/dev/null 2>&1 && echo "$kind=stored" || echo "$kind=absent"; done | paste -sd, -'
        info: "stored → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual app=absent,workflow=absent

  - name: L13 a new revision waits for the App it requires, then rolls out once that App is Ready at a matching version
    steps:
      - type: exec
        script: "{{.fctl}} app deploy {{.reg}}/todo:1.0.0 {{.values}} -f /opt/lane/values/shared.yaml --no-wait"
        info: "deploy with requires → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: &requires |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else None
          app, shared = get("app", "todo"), get("app", "todo-shared")
          status = app["status"]
          ready = next((c for c in status.get("conditions", []) if c["type"] == "Ready"), {})
          latest = get("apprevision", status["latestRevision"])["status"]
          print("APP=" + status.get("phase", "") + "/" + ready.get("reason", "") + " " + ready.get("message", ""))
          print("LATEST=" + status["latestRevision"] + "/" + latest.get("phase", "") + "/" + ("started" if latest.get("startedAt") else "waiting") + ",CURRENT=" + status.get("currentRevision", ""))
          print("REQUIRES=" + ";".join(r["app"] + "@" + r.get("version", "") + "/" + str(r["met"]) for r in status.get("requires", [])) + ",REQUIRED_BY=" + (",".join(shared["status"].get("requiredBy", [])) if shared else "absent"))
          PY
          '
        retry: 15
        delay: 1
        info: "waiting → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - "result.systemout ShouldContainSubstring 'APP=Deploying/RequirementNotMet App/todo-shared does not exist; todo needs ^1.0.0'"
          - result.systemout ShouldContainSubstring LATEST=todo-4/Deploying/waiting,CURRENT=todo-3
          - result.systemout ShouldContainSubstring REQUIRES=todo-shared@/False,REQUIRED_BY=absent
      - type: exec
        script: "{{.fctl}} app deploy /opt/lane/todo-shared"
        info: "deploy todo-shared → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-shared-1
      - type: exec
        script: *requires
        retry: 30
        delay: 1
        info: "met → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring APP=Ready/
          - result.systemout ShouldContainSubstring LATEST=todo-4/Ready/started,CURRENT=todo-4
          - result.systemout ShouldContainSubstring REQUIRES=todo-shared@1.0.0/True,REQUIRED_BY=todo
      # The App todo requires stays: its delete is refused, naming the dependent.
      - type: exec
        script: |
          out=$({{.fctl}} app delete todo-shared 2>&1); code=$?
          printf "EXIT=%s %s\n" "$code" "$out" | tr -d '"'
        info: "delete todo-shared → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldNotStartWith EXIT=0
          - "result.systemout ShouldContainSubstring 'app todo-shared is required by todo; remove the requirement first'"

  - name: L14 an upload under uploads/ in Bucket todo-files fires the blob EventSource, whose Sensor runs the intake Function that records it
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"receipt.txt","content":"2 litres","token":"{{.token}}"}}'
        retry: 15
        delay: 2
        info: "attach → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.id ShouldEqual milk
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 30
        delay: 1
        info: "the recorded upload → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 1
          - result.bodyjson.uploads.uploads0.name ShouldEqual receipt.txt
          - result.bodyjson.uploads.uploads0.size ShouldEqual 8
      # The intake Function ran on containerd for the object; a Sensor delivers at least once, so one line or more.
      - type: exec
        script: |
          {{.vmsh}} '
            funcdctl logs todo-intake -n default | grep -q "intake uploads/milk/receipt.txt 8" && echo LOGGED || echo WAITING'
        retry: 15
        delay: 1
        info: "the intake's log → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual LOGGED

  # The disaster-recovery block (FEAT-0009): the platform backup to an S3 server in the VM, a lost data directory
  # restored by the operator from the target and an escrow copy alone, a held boot, the release, and the backup plan.
  - name: D1 with a target set, the platform, KV and blob backups run on schedule to the S3 server, sealed
    steps:
      # versitygw (Apache-2.0), built at a pinned version and staged by the lane, serves s3://todo-backup. funcd
      # restarts with the DR config: the lane's config with the backups and static credentials (ADR-0203/0204/0209).
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            install -d /var/lib/vgw/data/todo-backup /var/lib/vgw/versions /etc/funcd/tokens
            systemd-run --unit todo-s3 -p EnvironmentFile=/opt/lane/dr/versitygw.env /opt/lane/dr/versitygw \
              --port 127.0.0.1:7070 posix --versioning-dir /var/lib/vgw/versions /var/lib/vgw/data
            install -m 600 /opt/lane/dr/admin.token /etc/funcd/tokens/admin
            install -m 600 /opt/lane/dr/developer.token /etc/funcd/tokens/developer
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo RESTARTED'
        info: "the DR config → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring RESTARTED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 60
        delay: 2
        info: "milk after the restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 1
      # A dead letter before the backup: a Sensor whose action always fails fires on an upload to a todo of its own,
      # so milk's uploads stay as they are. D11 finds it again after the restore.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl apply -f /opt/lane/dr/dead-letter-sensor.yaml'
        info: "the failing Sensor → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      # The Sensor gets only the events published once it is bound, which its Ready says; the upload waits for it.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            funcdctl get sensor todo-dr-dead-letter -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1'
        retry: 30
        delay: 1
        info: "the failing Sensor bound → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Ready"
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"letters","token":"{{.token}}"}}'
        retry: 30
        delay: 2
        info: "add letters → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"letters","name":"dead.txt","content":"x","token":"{{.token}}"}}'
        retry: 15
        delay: 2
        info: "attach → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            funcdctl eventing dlq list -n default | grep todo-dr-dead-letter | head -1 | cut -f1 | grep . | tee /root/dead-letter'
        retry: 30
        delay: 2
        info: "the dead letter → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^[0-9A-Z]{26}$"
      # The probe ConfigMap is read before the backup that holds it; D3 writes it back with this old version.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            funcdctl apply -f /opt/lane/dr/probe-configmap.yaml >/dev/null
            curl -sf -H "authorization: Bearer todo-lane-developer" \
              http://127.0.0.1:8080/apis/funcd.io/v1alpha1/namespaces/default/configmaps/todo-dr-probe >/root/probe-before.json
            funcdctl logs todo-intake -n default | grep -c "intake uploads/milk/receipt.txt 8" >/root/intake-before
            install -d /root/escrow/master
            cp -p /var/lib/funcd/data/s3gateway/master.key /root/escrow/master/
            echo SAVED'
        info: "the probe and the escrow copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring SAVED
      # A generation and a KV point written after the probe, and a blob mirror generation.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            cd /var/lib/vgw/data/todo-backup
            n() { d=$1; shift; find "$d" -name manifest.yaml "$@" 2>/dev/null | head -1 | grep -c .; }
            echo "gen=$(n gen -newer /root/probe-before.json) kv=$(n kv) blob=$(n blob)"
            find . -type f | head -30 >&2'
        retry: 45
        delay: 2
        info: "the backups → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual "gen=1 kv=1 blob=1"
      # Sealed: neither the probe value nor a todo is readable in the generation or the KV parts.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            cd /var/lib/vgw/data/todo-backup
            grep -rlaE "before-the-backup|milk" gen kv && echo PLAINTEXT || echo SEALED'
        info: "the parts → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual SEALED
      - type: exec
        script: |
          {{.vmsh}} 'FUNCD_TOKEN=todo-lane-admin funcdctl backup status'
        info: "backup status → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      # The restore point P, the newest generation now: D2 restores it, the point before the damage.
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            funcd restore list --config /opt/lane/dr/funcdconfig.yaml --credentials-file /opt/lane/dr/restore.credentials |
              grep -E "^[0-9a-f]{16}/[0-9]+ " | tail -1 | cut -d" " -f1 | tee /root/point'
        info: "the restore point → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^[0-9a-f]{16}/[0-9]+$"

  - name: D2 after a total loss of the host the operator rebuilds it and restores the point before the damage from the target and the escrow copy alone, and funcd boots held
    steps:
      # A write after the point, which the restore loses; then the host is lost whole: lane-reset.sh kills the unit,
      # the workers and their mounts, the network and the data directory, and everything funcd install laid down goes
      # too. The staged kit in /opt/lane, the escrow copy and the notes under /root are the operator's, kept apart;
      # the S3 server and the registry stand for remote services.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            u=http://127.0.0.1:8080/apis/funcd.io/v1alpha1/namespaces/default/configmaps/todo-dr-probe
            curl -sf -H "authorization: Bearer todo-lane-developer" $u | sed s/before-the-backup/after-the-backup/ |
              curl -sf -X PUT -H "authorization: Bearer todo-lane-developer" -H "content-type: application/json" \
                --data-binary @- $u >/root/probe-lost.json
            rm -rf /root/lane-kit && cp -a /opt/lane /root/lane-kit
            bash /opt/lane/dr/lane-reset.sh
            rm -rf /var/lib/funcd /etc/funcd /etc/cni/net.d /opt/cni/bin /run/funcd-boot /run/funcd-log \
              /usr/local/bin/funcd /etc/systemd/system/funcd.service
            systemctl daemon-reload
            cp -a /root/lane-kit /opt/lane
            echo LOST'
        info: "the loss → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring LOST
      # Nothing of the old host is left: no funcd process, no containerd or shim run from funcd's runtime (by name and
      # executable; Lima runs a containerd of its own), none of its directories, no bridge.
      - type: exec
        script: |
          {{.vmsh}} '
            ours() { for p in $(pgrep "$@"); do readlink /proc/$p/exe; done | grep -c "^/var/lib/funcd/"; }
            echo "funcd=$(pgrep -c -x funcd) containerd=$(ours -x containerd)" \
              "shims=$(ours containerd-shim)" \
              "paths=$(ls -d /var/lib/funcd /etc/funcd /opt/cni/bin /usr/local/bin/funcd 2>/dev/null | wc -l)" \
              "bridge=$(ip -o link show funcd0 2>/dev/null | wc -l)"'
        info: "what is left → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual "funcd=0 containerd=0 shims=0 paths=0 bridge=0"
      # The new host: funcd installed as on a fresh machine (its runtime downloaded and checked again), the tokens of
      # its config, then the restore from the target with the operator's restore credential, identity and escrow copy.
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            install -m 0755 /mnt/funcd-deps/funcd /usr/local/bin/funcd
            funcd install >/dev/null
            systemctl disable --now funcd.service
            install -d -m 700 /etc/funcd/tokens
            install -m 600 /opt/lane/dr/admin.token /etc/funcd/tokens/admin
            install -m 600 /opt/lane/dr/developer.token /etc/funcd/tokens/developer
            r="--config /opt/lane/dr/funcdconfig.yaml --credentials-file /opt/lane/dr/restore.credentials --identity /opt/lane/dr/identity.txt"
            unset FUNCD_TOKEN
            p=$(cat /root/point)
            echo "point $p"
            funcd restore run "$p" $r --escrow /root/escrow
            funcd restore kv $r
            funcd restore blob $r
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo RESTORED'
        info: "the new host → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "the platform is held"'
          - result.systemout ShouldContainSubstring RESTORED
      - type: exec
        script: |
          {{.vmsh}} 'FUNCD_TOKEN=todo-lane-admin funcdctl hold status'
        # The pending list appears once the uploads source is Ready again and has listed its bucket.
        retry: 45
        delay: 2
        info: "hold status → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "held: true"'
          - 'result.systemout ShouldContainSubstring "reason: restore"'
          # The restored blob store gave receipt.txt a new ModTime, so the seen list no longer matches it (ADR-0206).
          - result.systemout ShouldContainSubstring "default/todo-uploads"
      # Every resource of the backup is readable while held: the App at the revision it had.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get app todo -n default -o json'
        retry: 15
        delay: 2
        info: "the App while held → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring todo-4

  - name: D3 a write carrying a version that the restore lost conflicts; the restored object holds the value of the point, and a write at its version succeeds
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            u=http://127.0.0.1:8080/apis/funcd.io/v1alpha1/namespaces/default/configmaps/todo-dr-probe
            a="authorization: Bearer todo-lane-developer"
            put() { curl -s -o /dev/null -w "%{http_code}" -X PUT -H "$a" -H "content-type: application/json" --data-binary @- $u; }
            echo "lost $(sed s/after-the-backup/a-lost-write/ /root/probe-lost.json | put)"
            curl -sf -H "$a" $u >/root/probe-restored.json
            grep -o "before-the-backup" /root/probe-restored.json
            echo "current $(sed s/before-the-backup/after-the-restore/ /root/probe-restored.json | put)"'
        info: "the writes → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "lost 409"
          - result.systemout ShouldContainSubstring before-the-backup
          - result.systemout ShouldContainSubstring "current 200"

  - name: D4 a release that advances todo-uploads marks the restored upload seen, so it does not fire again, and a new upload fires once
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'FUNCD_TOKEN=todo-lane-admin funcdctl hold release --advance default/todo-uploads'
        # An advance needs the source Ready; a refused release leaves the platform held and may run again.
        retry: 15
        delay: 2
        info: "release → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"late.txt","content":"1 loaf","token":"{{.token}}"}}'
        retry: 60
        delay: 2
        info: "attach after the release → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 30
        delay: 1
        info: "the uploads → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 2
      # Without --advance the release replays receipt.txt (ADR-0206); advanced, the intake logged it as often as before
      # the loss.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            l=$(funcdctl logs todo-intake -n default)
            n=$(echo "$l" | grep -c "intake uploads/milk/receipt.txt 8")
            [ "$n" = "$(cat /root/intake-before)" ] && echo "RECEIPT ONCE" || echo "receipt $n times"
            echo "$l" | grep "intake uploads/milk" >&2
            echo "$l" | grep -q "intake uploads/milk/late.txt 6" && echo LATE'
        retry: 15
        delay: 1
        info: "the intake's log → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring LATE
          - result.systemout ShouldContainSubstring "RECEIPT ONCE"

  - name: D5 funcdctl backup plan turns objectives into the settings the daemon accepts, and names an impossible recovery time
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'unset FUNCD_TOKEN; funcdctl backup plan platform --config /opt/lane/dr/funcdconfig.yaml --rpo 1m --keep 72h'
        info: "plan → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "interval: 30s"'
      - type: exec
        script: |
          {{.vmsh}} 'unset FUNCD_TOKEN; funcdctl backup plan platform --config /opt/lane/dr/funcdconfig.yaml --rpo 1h --keep 720h \
            --rto 1m --size 10Gi --speed 10Mi'
        info: "plan with an RTO → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 3
          - result.systemerr ShouldContainSubstring "RTO 1m is impossible"

  # The App's own data (FEAT-0009 F111): a schedule the App declares backs up its stores to an S3 target of its
  # choice, sealed; a Restore loads a Backup under new names, and only an admin restores in place, after an export.
  - name: D6 a backup schedule the App declares backs up the App's stores every minute to its S3 target, sealed
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            install -d /var/lib/vgw/data/todo-workload
            funcdctl apply -f /opt/lane/dr/workload-secrets.yaml >/dev/null
            funcdctl app deploy {{.reg}}/todo:1.0.0 {{.values}} -f /opt/lane/values/shared.yaml \
              -f /opt/lane/values/backup.yaml >/tmp/deploy-d6.log 2>&1 || { cat /tmp/deploy-d6.log; exit 1; }
            funcdctl get backupschedule todo-backup -n default -o json'
        info: "the schedule → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex app.:\s*.todo.
      # The newest Succeeded Backup of the schedule: D7 and D8 restore it.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            for b in $(funcdctl get backups -n default | grep -E "^todo-backup-[0-9]+$" | sort); do
              funcdctl get backup $b -n default -o json | grep -qE "\"phase\": *\"Succeeded\"" && echo $b
            done | tail -1 | grep . | tee /root/workload-backup'
        retry: 60
        delay: 3
        info: "the Backups → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^todo-backup-[0-9]+$"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            b=$(cat /root/workload-backup)
            funcdctl get backup $b -n default -o json >&2
            d=$(ls -d /var/lib/vgw/data/todo-workload/default/$b-*)
            test -f $d/manifest.yaml && echo MANIFEST
            ls $d/kv $d/blob
            echo "sealed=$(for f in $d/kv/todo-store/part-00000 $d/blob/todo-files/part-00000; do head -c 21 $f; echo; done |
              grep -c "^age-encryption.org/v1$")."
            grep -rlaE "milk|receipt" $d/kv $d/blob && echo PLAINTEXT || echo SEALED'
        info: "the Backup on the target → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring MANIFEST
          - result.systemout ShouldContainSubstring todo-store
          - result.systemout ShouldContainSubstring todo-files
          - result.systemout ShouldContainSubstring "sealed=2."
          - result.systemout ShouldContainSubstring SEALED

  - name: D7 a Restore loads the Backup into new, empty stores and leaves the App's stores as they are; a store that is not empty is refused
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            sed "s/BACKUP/$(cat /root/workload-backup)/" /opt/lane/dr/restore-copy.yaml | funcdctl apply -f -'
        info: "apply todo-copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get restore todo-copy -n default -o json'
        retry: 30
        delay: 2
        info: "Restore todo-copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Succeeded"
      # The blob store is a local directory: the copy of the upload sits under the new bucket, byte for byte.
      - type: exec
        script: |
          {{.vmsh}} '
            f() { find /var/lib/funcd/data/blob -path "*/$1/uploads/milk/receipt.txt" -type f | head -1; }
            cmp "$(f todo-files)" "$(f todo-files-r)" && echo SAME'
        info: "the restored upload → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual SAME
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        info: "milk after the copy → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 2
      # todo-store-r holds the loaded keys now: a second load into it is refused, the KV half of the copy's proof.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            sed "s/BACKUP/$(cat /root/workload-backup)/" /opt/lane/dr/restore-not-empty.yaml | funcdctl apply -f -'
        info: "apply todo-copy-again → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get restore todo-copy-again -n default -o json'
        retry: 30
        delay: 2
        info: "Restore todo-copy-again → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Failed"
          - result.systemout ShouldContainSubstring NotEmpty

  - name: D8 a developer may not restore in place; an admin's in-place Restore exports the store first, then brings back the todos of the Backup
    steps:
      # A todo added after the Backup, which the in-place Restore removes.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"bread","token":"{{.token}}"}}'
        info: "add bread → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        info: "the todos before the in-place Restore → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring bread
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            sed "s/BACKUP/$(cat /root/workload-backup)/" /opt/lane/dr/restore-in-place.yaml | funcdctl apply -f -'
        info: "the developer's in-place Restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldNotEqual 0
          - result.systemerr ShouldContainSubstring "an in-place Restore needs update on Namespace"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; 
            sed "s/BACKUP/$(cat /root/workload-backup)/" /opt/lane/dr/restore-in-place.yaml | funcdctl apply -f - >/dev/null'
        info: "the admin's in-place Restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; 
            funcdctl get restore todo-back -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1
            funcdctl get backup todo-back-before -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1 | sed s/phase/export/'
        retry: 45
        delay: 2
        info: "Restore todo-back and its export → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Succeeded"
          - result.systemout ShouldMatchRegex "export.{1,4}Succeeded"
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "the todos after the in-place Restore → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring milk
          - result.body ShouldNotContainSubstring bread

  # F109's way back from a bad release: funcd upgrade writes a pre-upgrade generation before it swaps the binary.
  - name: D9 funcd upgrade writes a pre-upgrade generation to the target, keeps the old binary, and the upgraded funcd serves
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            cp /usr/local/bin/funcd /root/funcd-next
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            /usr/local/bin/funcd upgrade /root/funcd-next --config /opt/lane/dr/funcdconfig.yaml --unit ""
            test -x /usr/local/bin/funcd.previous && echo PREVIOUS
            echo "pins=$(find /var/lib/vgw/data/todo-backup/gen/pre-upgrade -name manifest.yaml | grep -c .)."
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo UPGRADED'
        info: "the upgrade → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "pre-upgrade generation [0-9a-f]{16}/[0-9]+"
          - result.systemout ShouldContainSubstring PREVIOUS
          - result.systemout ShouldContainSubstring "pins=1."
          - result.systemout ShouldContainSubstring UPGRADED
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            funcd restore list --config /opt/lane/dr/funcdconfig.yaml --credentials-file /opt/lane/dr/restore.credentials |
              grep -E "^ *[0-9a-f]{16}/[0-9]+ +pre-upgrade "'
        info: "restore list → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring pre-upgrade
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 60
        delay: 2
        info: "milk after the upgrade → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 2

  # The blob store itself on S3 (ADR-0208): funcd refuses an unversioned bucket, and on a versioned one the App's
  # uploads land on the S3 server, an overwrite keeps the old version, and the blob event source still fires.
  - name: D10 funcd refuses a blob store on an unversioned S3 bucket; on a versioned one an upload lands on the S3 server, keeps its old version and fires the intake
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            install -d /var/lib/vgw/data/todo-blob
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            timeout 60 /usr/local/bin/funcd --config /opt/lane/dr/funcdconfig-blob-s3.yaml 2>&1 | tail -5
            echo "exit=${PIPESTATUS[0]}."'
        info: "an unversioned bucket → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring blob.allowUnversioned
          # 124 would be the timeout: funcd served instead of refusing.
          - result.systemout ShouldNotContainSubstring "exit=0."
          - result.systemout ShouldNotContainSubstring "exit=124."
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            # curl 7.88 signs a bare ?versioning wrong and sends no payload hash, which versitygw requires.
            v="<VersioningConfiguration><Status>Enabled</Status></VersioningConfiguration>"
            curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user todo-lane-s3:todo-lane-s3-secret \
              -H "x-amz-content-sha256: $(printf %s "$v" | sha256sum | cut -d" " -f1)" \
              -H "content-type: application/xml" --data "$v" "http://127.0.0.1:7070/todo-blob?versioning="
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig-blob-s3.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo STARTED'
        info: "a versioned bucket → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STARTED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"remote.txt","content":"first","token":"{{.token}}"}}'
        retry: 60
        delay: 2
        info: "attach on the S3 store → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"remote.txt","content":"second","token":"{{.token}}"}}'
        info: "attach again → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} '
            f=$(find /var/lib/vgw/data/todo-blob -path "*uploads/milk/remote.txt" -type f | head -1)
            echo "current $(cat "$f")"
            k=$(echo "${f#/var/lib/vgw/data/todo-blob/}" | sed "s|/|%2F|g")
            curl -s --aws-sigv4 "aws:amz:us-east-1:s3" --user todo-lane-s3:todo-lane-s3-secret \
              -H "x-amz-content-sha256: $(printf "" | sha256sum | cut -d" " -f1)" \
              "http://127.0.0.1:7070/todo-blob?prefix=$k&versions=" | grep -o "<Version>" | grep -c . | sed "s/^/versions=/; s/$/./"'
        info: "the object on the S3 server → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "current second"
          - result.systemout ShouldContainSubstring "versions=2."
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl logs todo-intake -n default | grep "intake uploads/milk/remote.txt"'
        retry: 30
        delay: 2
        info: "the intake's log → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "intake uploads/milk/remote.txt"

  - name: D11 the dead letter and the workflow run record of the backup came back with the restore, as evidence that nothing resumed
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            funcdctl eventing dlq describe "$(cat /root/dead-letter)" -n default >/dev/null && echo "DEAD LETTER KEPT"
            funcdctl get workflowrun plan-l2 -n default -o json | python3 -c "import sys,json;d=json.load(sys.stdin)[\"status\"];print(\"PHASE=\"+d.get(\"phase\",\"\")+\",STEPS=\"+\";\".join(s[\"name\"]+\"=\"+s[\"phase\"] for s in d.get(\"steps\",[])))"'
        info: "the evidence → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "DEAD LETTER KEPT"
          - result.systemout ShouldContainSubstring PHASE=Succeeded
          - result.systemout ShouldContainSubstring STEPS=

  - name: D12 a backup target funcd cannot write stops the backup, and backup status says why; the platform keeps serving
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            c=/opt/lane/dr/funcdconfig-blob-s3.yaml
            sed "s|s3://todo-backup?|s3://todo-missing?|" $c >/root/missing-target.yaml
            grep -q todo-missing /root/missing-target.yaml
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /root/missing-target.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo STARTED'
        info: "a missing target → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring STARTED
      - type: exec
        script: |
          {{.vmsh}} 'FUNCD_TOKEN=todo-lane-admin funcdctl backup status'
        retry: 20
        delay: 2
        info: "backup status → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldNotEqual 0
          - result.systemerr ShouldContainSubstring "bucket does not exist"
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 30
        delay: 2
        info: "milk → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200

  - name: D13 a hand-edited config that breaks a backup rule is refused at start, and funcdctl backup plan refuses it by the same rule
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            sed "s/^  interval: 20s$/  interval: 0s/" /opt/lane/dr/funcdconfig-blob-s3.yaml >/root/zero-interval.yaml
            grep -q "^  interval: 0s$" /root/zero-interval.yaml || { echo "no backup.interval to edit"; exit 1; }
            timeout 30 /usr/local/bin/funcd --config /root/zero-interval.yaml >/root/start.log 2>&1
            echo "start exit $?"; grep -o "backup.interval[^;]*" /root/start.log | head -1
            funcdctl backup plan platform --config /root/zero-interval.yaml --rpo 1h --keep 72h >/root/plan.log 2>&1
            echo "plan exit $?"; grep -o "backup.interval[^;]*" /root/plan.log | head -1'
        info: "the refusals → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "start exit 1"
          - result.systemout ShouldContainSubstring "plan exit 1"
          - result.systemout ShouldContainSubstring backup.interval

  - name: D14 a plain restart keeps eventing state in the event store; no object fires again and the dead letter stays
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            funcdctl logs todo-intake -n default | grep -c "intake uploads/" >/root/intake-before-restart
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig-blob-s3.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo RESTARTED'
        info: "the restart → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring RESTARTED
      # The uploads source is Ready and listing again once a new upload fires; nothing listed before fired twice.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"after-restart.txt","content":"ok","token":"{{.token}}"}}'
        retry: 30
        delay: 2
        info: "attach → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            l=$(funcdctl logs todo-intake -n default)
            echo "$l" | grep -q "intake uploads/milk/after-restart.txt 2" || { echo WAITING; exit 0; }
            n=$(echo "$l" | grep -c "intake uploads/")
            [ "$n" = "$(( $(cat /root/intake-before-restart) + 1 ))" ] && echo "NO REFIRE" || echo "intake ran $n times"
            funcdctl eventing dlq describe "$(cat /root/dead-letter)" -n default >/dev/null && echo "DEAD LETTER KEPT"'
        retry: 30
        delay: 2
        info: "after the restart → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "NO REFIRE"
          - result.systemout ShouldContainSubstring "DEAD LETTER KEPT"

  # F109's crash loop (ADR-0207 Decisions 3-5): with recovery.safeMode.afterCrashes 1, one unclean start makes the next
  # start held, two make it stop with status 70 and name the way back; safe-mode reset and a release leave it.
  - name: D15 a funcd that keeps crashing starts held, then stops with status 70 naming the restore, and safe-mode reset and a release bring it back
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            run() {
              systemctl stop funcd-demo 2>/dev/null
              systemctl reset-failed funcd-demo 2>/dev/null || true
              systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 "$@" /usr/local/bin/funcd \
                --config /opt/lane/dr/funcdconfig.yaml
            }
            ready() { curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz; }
            loop="-p Environment=FUNCD_RECOVERY_SAFE_MODE_AFTER_CRASHES=1 -p Environment=FUNCD_RECOVERY_SAFE_MODE_STABLE_AFTER=1h"
            run $loop; ready; systemctl kill -s KILL funcd-demo; sleep 2
            run $loop; ready
            FUNCD_TOKEN=todo-lane-admin funcdctl hold status'
        info: "after one crash → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - 'result.systemout ShouldContainSubstring "held: true"'
          - 'result.systemout ShouldContainSubstring "reason: safe-mode"'
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            systemctl kill -s KILL funcd-demo; sleep 2
            systemctl stop funcd-demo 2>/dev/null
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 \
              -p Environment=FUNCD_RECOVERY_SAFE_MODE_AFTER_CRASHES=1 \
              -p Environment=FUNCD_RECOVERY_SAFE_MODE_STABLE_AFTER=1h /usr/local/bin/funcd --config /opt/lane/dr/funcdconfig.yaml
            for i in $(seq 30); do systemctl is-active --quiet funcd-demo || break; sleep 1; done
            echo "status=$(systemctl show -p ExecMainStatus --value funcd-demo)."
            journalctl -u funcd-demo --no-pager -n 20 | grep -oE "safe mode: [0-9]+ unclean starts in a row.*" | tail -1'
        info: "after two crashes → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "status=70."
          - 'result.systemout ShouldContainSubstring "safe mode: 2 unclean starts in a row"'
          # D9's upgrade recorded a pre-upgrade generation, so the way back is the old binary's restore of it.
          - result.systemout ShouldMatchRegex "funcd[.]previous restore run [0-9a-f]{16}/[0-9]+"
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            funcd safe-mode reset --config /opt/lane/dr/funcdconfig.yaml
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            FUNCD_TOKEN=todo-lane-admin funcdctl hold status | grep -E "held|reason"
            FUNCD_TOKEN=todo-lane-admin funcdctl hold release
            FUNCD_TOKEN=todo-lane-admin funcdctl hold status | grep -E "^held"
            echo RELEASED'
        info: "reset and release → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "the unclean-start count is 0"
          - 'result.systemout ShouldContainSubstring "reason: safe-mode"'
          - 'result.systemout ShouldContainSubstring "held: false"'
          - result.systemout ShouldContainSubstring RELEASED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 60
        delay: 2
        info: "milk after the release → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200

  # ADR-0208 Decision 6: on a versioned S3 blob store, funcd restore blob --at puts every key back to its state at a time,
  # removing no version, and leaves the platform held. A restore to a time between two writes of a key copies its first
  # version back: versitygw keeps a moved-aside version's write time from v1.9.0 on (versity/versitygw#2311). A restore
  # to a time before the key existed then deletes it, and every version stays listed (#994).
  - name: D16 funcd restore blob --at brings back a key's version at a time, deletes a key that did not exist then, and keeps every version
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig-blob-s3.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            sleep 2; date -u +%Y-%m-%dT%H:%M:%SZ >/root/blob-at; sleep 2
            echo STARTED'
        info: "the S3 store and the point before the key → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring STARTED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"at.txt","content":"before","token":"{{.token}}"}}'
        retry: 60
        delay: 2
        info: "attach → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} 'sleep 2; date -u +%Y-%m-%dT%H:%M:%SZ >/root/blob-at-first; sleep 2; echo MARKED'
        info: "the point between the two writes → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring MARKED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"at.txt","content":"after","token":"{{.token}}"}}'
        info: "attach again → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            k=s3/default/todo-files/uploads/milk/at.txt
            s3() { curl -s --aws-sigv4 "aws:amz:us-east-1:s3" --user todo-lane-s3:todo-lane-s3-secret \
              -H "x-amz-content-sha256: $(printf "" | sha256sum | cut -d" " -f1)" "$@"; }
            versions() { s3 "http://127.0.0.1:7070/todo-blob?prefix=$(echo $k | sed "s|/|%2F|g")&versions=" | grep -o "<Version>" | grep -c .; }
            echo "current=$(s3 "http://127.0.0.1:7070/todo-blob/$k")."
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            funcd restore blob --at "$(cat /root/blob-at-first)" --config /opt/lane/dr/funcdconfig-blob-s3.yaml
            echo "first=$(s3 "http://127.0.0.1:7070/todo-blob/$k")."
            echo "versions-first=$(versions)."
            funcd restore blob --at "$(cat /root/blob-at)" --config /opt/lane/dr/funcdconfig-blob-s3.yaml
            echo "after=$(s3 -o /dev/null -w %{http_code} "http://127.0.0.1:7070/todo-blob/$k")."
            echo "versions=$(versions)."
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig-blob-s3.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            FUNCD_TOKEN=todo-lane-admin funcdctl hold release >/dev/null
            echo RELEASED'
        info: "restore blob --at, twice → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "current=after."
          - result.systemout ShouldContainSubstring "restored the blob store to"
          - result.systemout ShouldContainSubstring "first=before."
          - result.systemout ShouldContainSubstring "versions-first=3."
          - result.systemout ShouldContainSubstring "no version was removed"
          - result.systemout ShouldContainSubstring "the platform is held"
          - 'result.systemout ShouldContainSubstring "deleted for want of a version at that time:"'
          - result.systemout ShouldContainSubstring uploads/milk/at.txt
          - result.systemout ShouldContainSubstring "after=404."
          - result.systemout ShouldContainSubstring "versions=3."
          - result.systemout ShouldContainSubstring RELEASED

  # ADR-0222: the owner swaps a restored copy in through ref, and an App's Backups outlive it until their ttl.
  - name: D17 the App swaps the restored copy in through ref; once the App is deleted its Backups stay until their ttl, then go
    steps:
      # A todo in todo-store that the copy restored in D7 does not hold.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"eggs","token":"{{.token}}"}}'
        retry: 60
        delay: 2
        info: "add eggs → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            funcdctl app deploy {{.reg}}/todo:1.0.0 {{.values}} -f /opt/lane/values/shared.yaml \
              -f /opt/lane/values/backup.yaml -f /opt/lane/values/restored-store.yaml \
              -f /opt/lane/values/short-backup-ttl.yaml >/tmp/deploy-d17.log 2>&1 || { cat /tmp/deploy-d17.log; exit 1; }
            # the slots after this minute are created once the schedule holds the 2m ttl
            echo $(( $(date +%s) / 60 )) >/root/swap-minute
            echo DEPLOYED'
        info: "deploy on todo-store-r → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring DEPLOYED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "the todos on the copy → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring milk
          - result.body ShouldNotContainSubstring eggs
      # A Backup of a slot after the swap, so it carries the 2m ttl.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            m=$(cat /root/swap-minute)
            for b in $(funcdctl get backups -n default | grep -E "^todo-backup-[0-9]+$" | sort); do
              [ "${b#todo-backup-}" -gt "$m" ] || continue
              funcdctl get backup $b -n default -o json | grep -qE "\"phase\": *\"Succeeded\"" && echo $b
            done | tail -1 | grep . | tee /root/short-backup'
        retry: 60
        delay: 3
        info: "a Backup after the swap → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^todo-backup-[0-9]+$"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            funcdctl app delete todo -n default >/dev/null
            for i in $(seq 60); do funcdctl get backupschedule todo-backup -n default >/dev/null 2>&1 || break; sleep 2; done
            funcdctl get backupschedule todo-backup -n default 2>&1 | grep -qi "not found" && echo "schedule gone"
            funcdctl get backup $(cat /root/short-backup) -n default >/dev/null && echo "short kept"
            funcdctl get backup $(cat /root/workload-backup) -n default >/dev/null && echo "long kept"'
        info: "after the App's delete → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "schedule gone"
          - result.systemout ShouldContainSubstring "short kept"
          - result.systemout ShouldContainSubstring "long kept"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            funcdctl get backup $(cat /root/short-backup) -n default 2>&1 | grep -qi "not found" && echo "short gone" || echo "short kept"
            funcdctl get backup $(cat /root/workload-backup) -n default >/dev/null && echo "long kept"'
        retry: 60
        delay: 5
        info: "after the ttl → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "short gone"
          - result.systemout ShouldContainSubstring "long kept"

  # ADR-0222 Decisions 4, 5 and 7: the App's backups copy a DuckLake catalog it owns (files first, catalog.db last),
  # and a Restore puts the catalog into an empty bucket prefix, which a new CatalogService then serves. The engine
  # checkpoints catalog.db only at shutdown (the per-commit checkpoint of ADR-0086 is #998), so a new catalog is an
  # empty member until then, and the stores beside it are still backed up (#996). The case writes no table: a write
  # needs a Quack client in the lane, so the catalog it copies holds no data file. It restarts funcd on the local
  # blob store with the S3 gateway and the catalog proxy, and deploys the App again, which D17 deleted.
  - name: D18 the App's backup copies its DuckLake catalog, empty before its first checkpoint, and a Restore into an empty prefix gives a catalog a new CatalogService serves
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig-catalog.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            export FUNCD_TOKEN=todo-lane-developer
            funcdctl apply -f /opt/lane/dr/catalog-fixtures.yaml >/dev/null
            funcdctl app deploy {{.reg}}/todo:1.0.0 {{.values}} -f /opt/lane/values/shared.yaml \
              -f /opt/lane/values/backup.yaml -f /opt/lane/values/catalog.yaml >/tmp/deploy-d18.log 2>&1 ||
              { cat /tmp/deploy-d18.log; exit 1; }
            echo $(( $(date +%s) / 60 )) >/root/catalog-minute
            echo DEPLOYED'
        info: "the App with its catalog → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring DEPLOYED
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            funcdctl get catalogservice todo-lake -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1'
        retry: 60
        delay: 3
        info: "catalog todo-lake → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex phase.{1,4}Ready
      # Before any checkpoint: a Backup succeeds, with the stores' parts and no part of the catalog.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            find /var/lib/funcd/data/blob -path "*/todo-lakehouse/lake/_ducklake/catalog.db" -type f | grep -q . && echo "CHECKPOINTED"
            m=$(cat /root/catalog-minute)
            b=$(for b in $(funcdctl get backups -n default | grep -E "^todo-backup-[0-9]+$" | sort); do
              [ "${b#todo-backup-}" -gt "$m" ] || continue
              funcdctl get backup $b -n default -o json | grep -qE "\"phase\": *\"Succeeded\"" && echo $b
            done | tail -1)
            [ -n "$b" ] || exit 0
            d=$(ls -d /var/lib/vgw/data/todo-workload/default/$b-*)
            ls -d $d/kv/todo-store $d/blob/todo-files >/dev/null && echo "STORES COPIED"
            grep -qE "^ *name: todo-lake$" $d/manifest.yaml && echo "CATALOG LISTED"
            ls $d/catalog 2>/dev/null | grep -q . && echo "CATALOG FILES" || echo "CATALOG EMPTY"'
        retry: 60
        delay: 3
        info: "a Backup before the first checkpoint → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldNotContainSubstring CHECKPOINTED
          - result.systemout ShouldContainSubstring "STORES COPIED"
          - result.systemout ShouldContainSubstring "CATALOG LISTED"
          - result.systemout ShouldContainSubstring "CATALOG EMPTY"
      # A SIGTERM to the engine alone, as a sandbox stop sends it, makes it checkpoint its catalog while funcd serves.
      - type: exec
        script: |
          {{.vmsh}} '
            t=$({{.ctr}} task ls | awk "\$1 ~ /^todo-lake-r[0-9]+$/ && \$3 == \"RUNNING\" {print \$1}" | head -1)
            echo "engine $t" >&2
            [ -n "$t" ] && {{.ctr}} task kill -s SIGTERM "$t"
            for i in $(seq 30); do
              find /var/lib/funcd/data/blob -path "*/todo-lakehouse/lake/_ducklake/catalog.db" -type f | grep -q . && break
              sleep 1
            done
            find /var/lib/funcd/data/blob -path "*/todo-lakehouse/lake/_ducklake/catalog.db" -type f | grep -q . && echo CHECKPOINTED
            echo $(( $(date +%s) / 60 )) >/root/catalog-minute'
        info: "the engine's checkpoint → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring CHECKPOINTED
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            m=$(cat /root/catalog-minute)
            for b in $(funcdctl get backups -n default | grep -E "^todo-backup-[0-9]+$" | sort); do
              [ "${b#todo-backup-}" -gt "$m" ] || continue
              funcdctl get backup $b -n default -o json | grep -qE "\"phase\": *\"Succeeded\"" && echo $b
            done | tail -1 | grep . | tee /root/catalog-backup'
        retry: 60
        delay: 3
        info: "a Backup after the checkpoint → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^todo-backup-[0-9]+$"
      - type: exec
        script: |
          {{.vmsh}} '
            d=$(ls -d /var/lib/vgw/data/todo-workload/default/$(cat /root/catalog-backup)-*)
            ls -d $d/catalog/todo-lake/*/catalog.db >/dev/null && echo "CATALOG COPIED"
            echo "sealed=$(find $d/catalog/todo-lake -path "*catalog.db*" -type f | head -1 | xargs head -c 21)."'
        info: "the catalog on the target → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "CATALOG COPIED"
          - result.systemout ShouldContainSubstring "sealed=age-encryption.org/v1."
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            sed "s/BACKUP/$(cat /root/catalog-backup)/" /opt/lane/dr/restore-catalog.yaml | funcdctl apply -f -'
        info: "apply todo-lake-back → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            funcdctl get restore todo-lake-back -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1
            find /var/lib/funcd/data/blob -path "*/todo-lakehouse-r/lake/_ducklake/catalog.db" -type f | grep -q . &&
              echo "CATALOG RESTORED"'
        retry: 30
        delay: 2
        info: "Restore todo-lake-back → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex phase.{1,4}Succeeded
          - result.systemout ShouldContainSubstring "CATALOG RESTORED"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl apply -f /opt/lane/dr/catalog-copy.yaml'
        info: "apply todo-lake-r → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            funcdctl get catalogservice todo-lake-r -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1'
        retry: 60
        delay: 3
        info: "catalog todo-lake-r → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex phase.{1,4}Ready

  # Version 1.2.0 keeps the todos and their upload records in SQLDatabase todo-db (ADR-0233 to ADR-0236). Its pre-hook
  # migrates the database and copies them from KV before the SQL API serves; the KV records stay for 1.1.0.
  - name: Q1 the 1.2.0 pre-hook moves the todos and upload records from KV into todo-db before the SQL API serves
    steps:
      - type: exec
        script: |
          curl -sf -X POST {{.dp}}/api -H 'content-type: application/json' -d '{"data":{"op":"list"}}' |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(sorted(t["id"] for t in d["todos"])))' |
            limactl shell --workdir / {{.vm}} -- sudo tee /root/todos-kv
          curl -sf -X POST {{.dp}}/api -H 'content-type: application/json' -d '{"data":{"op":"get","id":"milk"}}' |
            python3 -c 'import json,sys; print(",".join(u["name"] for u in json.load(sys.stdin)["uploads"]))' |
            limactl shell --workdir / {{.vm}} -- sudo tee /root/uploads-kv
        info: "the todos and milk's uploads on 1.0.0 → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring milk
          - result.systemout ShouldContainSubstring receipt.txt
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            cd /opt/lane
            for f in api-1.2.0:todo-api:1.2.0 migrate-1.2.0:todo-migrate:1.2.0; do
              funcdctl push functions/ts/${f%%:*}.mjs {{.reg}}/${f#*:} >/dev/null
            done
            for f in intake_sql:todo-intake:1.2.0 notify:todo-notify:1.2.0; do
              funcdctl push functions/py/dist/${f%%:*} {{.reg}}/${f#*:} >/dev/null
            done
            funcdctl app lock /opt/lane/app-1.2.0 -f /opt/lane/values/e2e.yaml >/dev/null
            funcdctl push --template /opt/lane/app-1.2.0 {{.reg}}/todo:1.2.0 >/dev/null
            funcdctl app deploy {{.reg}}/todo:1.2.0 {{.values}} -f /opt/lane/values/shared.yaml \
              -f /opt/lane/values/backup.yaml -f /opt/lane/values/catalog.yaml >/tmp/deploy-q1.log 2>&1 ||
              { cat /tmp/deploy-q1.log; exit 1; }
            echo DEPLOYED'
        info: "deploy 1.2.0 → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring DEPLOYED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "list on 1.2.0 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.2.0
          - result.bodyjson.migration.by ShouldEqual "todo-migrate 1.2.0"
          - result.bodyjson.migration.event ShouldEqual upgrade
          - result.bodyjson.migration.fromVersion ShouldEqual 1.0.0
          - result.bodyjson.release.version ShouldEqual 1.2.0
      # The SQL API lists the same todos and the same uploads of milk as the KV API did.
      - type: exec
        script: |
          kv=$(limactl shell --workdir / {{.vm}} -- sudo cat /root/todos-kv)
          up=$(limactl shell --workdir / {{.vm}} -- sudo cat /root/uploads-kv)
          sql=$(curl -sf -X POST {{.dp}}/api -H 'content-type: application/json' -d '{"data":{"op":"list"}}' |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(sorted(t["id"] for t in d["todos"])))')
          sqlup=$(curl -sf -X POST {{.dp}}/api -H 'content-type: application/json' -d '{"data":{"op":"get","id":"milk"}}' |
            python3 -c 'import json,sys; print(",".join(u["name"] for u in json.load(sys.stdin)["uploads"]))')
          [ "$kv" = "$sql" ] && echo "TODOS SAME" || echo "todos kv=$kv sql=$sql"
          [ "$up" = "$sqlup" ] && echo "UPLOADS SAME" || echo "uploads kv=$up sql=$sqlup"
        info: "KV against SQL → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "TODOS SAME"
          - result.systemout ShouldContainSubstring "UPLOADS SAME"
      # The pre-hook's call ended before the API's 1.2.0 Revision was stamped, so the API switched after the copy.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
          python3 - <<"PY"
          import json, subprocess
          def get(kind, name):
              out = subprocess.run(["funcdctl", "get", kind, name, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else {}
          rev = get("apprevision", get("app", "todo")["status"]["currentRevision"])
          pre = [h for h in rev["status"].get("hooks", []) if h["point"] == "preApply"][-1]
          api = get("revision", get("function", "todo-api")["status"]["currentRevision"])
          order = "hook-first" if pre["endTime"] < api["metadata"]["creationTimestamp"] else "api-first"
          print("HOOK=" + pre["function"] + "/" + pre["phase"] + ",API=" + api["spec"]["image"].split("/")[-1].split("@")[0] + ",ORDER=" + order)
          PY
          '
        info: "pre-hook and API revision → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual HOOK=todo-migrate/Ready,API=todo-api:1.2.0,ORDER=hook-first

  - name: Q2 the todos are SQL rows - done, a filter and counts, and an upload the 1.2.0 intake records in todo-db, read in one join
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"jam","token":"{{.token}}"}}'
        info: "add jam → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.id ShouldEqual jam
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"done","id":"jam","token":"{{.token}}"}}'
        info: "done jam → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list","done":true}}'
        info: "the done todos → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.todos ShouldHaveLength 1
          - result.bodyjson.todos.todos0.id ShouldEqual jam
          - result.bodyjson.todos.todos0.done ShouldBeTrue
          - result.bodyjson.counts.done ShouldEqual 1
      - type: exec
        script: |
          curl -sf -X POST {{.dp}}/api -H 'content-type: application/json' -d '{"data":{"op":"list","done":false}}' |
            python3 -c 'import json,sys; print("ids=," + ",".join(sorted(t["id"] for t in json.load(sys.stdin)["todos"])) + ",")'
        info: "the open todos → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldStartWith ids=
          - result.systemout ShouldContainSubstring ,milk,
          - result.systemout ShouldNotContainSubstring ,jam,
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"jam","name":"recipe.txt","content":"fruit, sugar","token":"{{.token}}"}}'
        info: "attach recipe.txt to jam → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      # The blob EventSource fires for the upload, and the 1.2.0 intake records it in table uploads of todo-db.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"jam"}}'
        retry: 30
        delay: 2
        info: "jam with its uploads → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.todos.todos0.done ShouldBeTrue
          - result.bodyjson.uploads ShouldHaveLength 1
          - result.bodyjson.uploads.uploads0.name ShouldEqual recipe.txt
          - result.bodyjson.uploads.uploads0.size ShouldEqual 12

  - name: Q3 a row inserted into todos fires the App's sql EventSource, and its Sensor's function records the todo in KV
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "the todos the change feed reported → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.notified ShouldContain jam

  - name: Q4 the App's backup schedule copies todo-db with its other stores, sealed
    steps:
      # The newest Succeeded Backup of a slot after jam was added: Q5 and Q6 restore it.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; echo $(( $(date +%s) / 60 )) >/root/jam-minute'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            m=$(cat /root/jam-minute)
            for b in $(funcdctl get backups -n default | grep -E "^todo-backup-[0-9]+$" | sort); do
              [ "${b#todo-backup-}" -gt "$m" ] || continue
              funcdctl get backup $b -n default -o json | grep -qE "\"phase\": *\"Succeeded\"" && echo $b
            done | tail -1 | grep . | tee /root/db-backup'
        retry: 60
        delay: 3
        info: "a Backup after jam → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^todo-backup-[0-9]+$"
      - type: exec
        script: |
          {{.vmsh}} '
            b=$(cat /root/db-backup)
            d=$(ls -d /var/lib/vgw/data/todo-workload/default/$b-*)
            grep -qE "kind: SQLDatabase$" $d/manifest.yaml && grep -qE "name: todo-db$" $d/manifest.yaml && echo "DATABASE LISTED"
            ls $d/sql/todo-db
            echo "sealed=$(head -c 21 $d/sql/todo-db/part-00000)."
            grep -rlaE "jam|recipe" $d/sql && echo PLAINTEXT || echo SEALED'
        info: "the Backup on the target → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "DATABASE LISTED"
          - result.systemout ShouldContainSubstring part-00000
          - result.systemout ShouldContainSubstring "sealed=age-encryption.org/v1."
          - result.systemout ShouldContainSubstring SEALED

  - name: Q5 an admin's in-place Restore of todo-db exports it first, then brings back the rows of the Backup
    steps:
      # A todo added after the Backup, which the in-place Restore removes.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"late","token":"{{.token}}"}}'
        info: "add late → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; 
            sed "s/BACKUP/$(cat /root/db-backup)/" /opt/lane/dr/restore-database-in-place.yaml | funcdctl apply -f - >/dev/null'
        info: "the admin's in-place Restore of todo-db → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; 
            funcdctl get restore todo-db-back -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1
            funcdctl get backup todo-db-back-before -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1 | sed s/phase/export/'
        retry: 45
        delay: 2
        info: "Restore todo-db-back and its export → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Succeeded"
          - result.systemout ShouldMatchRegex "export.{1,4}Succeeded"
      - type: exec
        script: |
          curl -sf -X POST {{.dp}}/api -H 'content-type: application/json' -d '{"data":{"op":"list"}}' |
            python3 -c 'import json,sys; print("ids=," + ",".join(sorted(t["id"] for t in json.load(sys.stdin)["todos"])) + ",")'
        retry: 30
        delay: 2
        info: "the todos after the in-place Restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldStartWith ids=
          - result.systemout ShouldContainSubstring ,jam,
          - result.systemout ShouldContainSubstring ,milk,
          - result.systemout ShouldNotContainSubstring ,late,

  - name: Q6 a Restore loads the Backup's todo-db into a new database, and the App swaps that copy in through ref
    steps:
      # A todo in todo-db that the copy, restored from the Backup, does not hold.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"tea","token":"{{.token}}"}}'
        retry: 30
        delay: 2
        info: "add tea → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      # A Restore needs its destination Ready (ADR-0234 Decision 3): the new database's engine starts first.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; funcdctl apply -f /opt/lane/dr/database-copy.yaml'
        info: "apply todo-db-r → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get sqldatabase todo-db-r -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1'
        retry: 30
        delay: 2
        info: "todo-db-r → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Ready"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            sed "s/BACKUP/$(cat /root/db-backup)/" /opt/lane/dr/restore-database.yaml | funcdctl apply -f -'
        info: "apply todo-db-copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get restore todo-db-copy -n default -o json'
        retry: 45
        delay: 2
        info: "Restore todo-db-copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Succeeded"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            funcdctl app deploy {{.reg}}/todo:1.2.0 {{.values}} -f /opt/lane/values/shared.yaml \
              -f /opt/lane/values/backup.yaml -f /opt/lane/values/catalog.yaml \
              -f /opt/lane/values/restored-database.yaml >/tmp/deploy-q6.log 2>&1 || { cat /tmp/deploy-q6.log; exit 1; }
            echo DEPLOYED'
        info: "deploy on todo-db-r → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring DEPLOYED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"jam"}}'
        retry: 30
        delay: 2
        info: "jam on the copy → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.todos.todos0.done ShouldBeTrue
          - result.bodyjson.uploads.uploads0.name ShouldEqual recipe.txt
      - type: exec
        script: |
          curl -sf -X POST {{.dp}}/api -H 'content-type: application/json' -d '{"data":{"op":"list"}}' |
            python3 -c 'import json,sys; print("ids=," + ",".join(sorted(t["id"] for t in json.load(sys.stdin)["todos"])) + ",")'
        retry: 30
        delay: 2
        info: "the todos on the copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldStartWith ids=
          - result.systemout ShouldContainSubstring ,jam,
          - result.systemout ShouldContainSubstring ,milk,
          - result.systemout ShouldNotContainSubstring ,tea,
      # todo-db, which the App no longer names, stays with its rows: deletion retain.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get sqldatabase todo-db -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1'
        info: "todo-db after the swap → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Ready"

  - name: C1 one Site bundle and the site-config template are pushed, its image digest locked, and the App deploys into staging and prod
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            export FUNCD_TOKEN=todo-lane-admin
            cd /opt/lane/site-config
            funcdctl push --site web {{.reg}}/site-config-web:1.0.0
            funcdctl app lock app -f values/e2e.yaml
            funcdctl push --template app {{.reg}}/site-config:1.0.0
            for env in staging prod; do
              funcdctl app deploy {{.reg}}/site-config:1.0.0 -n $env -f values/e2e.yaml -f values/$env.yaml >/dev/null
              echo deployed-$env
            done'
        info: "push, lock, deploy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "web 1[.]0[.]0 sha256:[0-9a-f]{64}"
          - result.systemout ShouldContainSubstring deployed-staging
          - result.systemout ShouldContainSubstring deployed-prod

  - name: C2 each environment serves its own config.json, and both Sites serve one bundle digest
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            export FUNCD_TOKEN=todo-lane-admin
            get() { curl -s -H "Host: site-config.$1.test" http://127.0.0.1:8081/config.json; }
            digest() { funcdctl get site site-config-web -n $1 -o json | grep -oE "\"digest\": *\"sha256:[0-9a-f]{64}\"" | grep -oE "sha256:[0-9a-f]{64}"; }
            echo "staging=$(get staging) prod=$(get prod)"
            [ "$(get staging)" = "{\"API_URL\":\"https://api.staging.example\",\"NEW_DASHBOARD\":\"false\"}" ] && echo STAGING-OK
            [ "$(get prod)" = "{\"API_URL\":\"https://api.example\",\"NEW_DASHBOARD\":\"false\"}" ] && echo PROD-OK
            s=$(digest staging); p=$(digest prod)
            echo "digests $s $p"
            [ -n "$s" ] && [ "$s" = "$p" ] && echo ONE-DIGEST'
        retry: 15
        delay: 2
        info: "config.json → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring STAGING-OK
          - result.systemout ShouldContainSubstring PROD-OK
          - result.systemout ShouldContainSubstring ONE-DIGEST

  - name: C3 config.json is always revalidated - no-cache, application/json, an ETag, and 304 on a match
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            h=$(curl -s -D - -o /dev/null -H "Host: site-config.staging.test" http://127.0.0.1:8081/config.json | tr -d "\r")
            echo "$h" | grep -i "^cache-control:"
            echo "$h" | grep -i "^content-type:"
            etag=$(echo "$h" | grep -i "^etag:" | cut -d" " -f2-)
            echo "etag=$etag"
            echo "conditional=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: site-config.staging.test" -H "If-None-Match: $etag" http://127.0.0.1:8081/config.json)."'
        info: "headers → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring no-cache
          - result.systemout ShouldContainSubstring application/json
          - result.systemout ShouldContainSubstring etag=W/
          - result.systemout ShouldContainSubstring conditional=304.

  - name: C4 with spa on, an app path answers the index, while config.json stays the generated file
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            curl -s -H "Host: site-config.staging.test" http://127.0.0.1:8081/fleet/vehicles/42 | grep -o "<title>Site config</title>"
            curl -s -H "Host: site-config.staging.test" http://127.0.0.1:8081/config.json | grep -o "https://api.staging.example"'
        info: "app path, config.json → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "<title>Site config</title>"
          - result.systemout ShouldContainSubstring https://api.staging.example

  - name: C5 a new value of the App's ConfigMap reaches staging's config.json with a new ETag and the same bundle digest, and prod keeps its own
    steps:
      # The ETag and the digest before the change, then the deploy that turns the flag on.
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            export FUNCD_TOKEN=todo-lane-admin
            cd /opt/lane/site-config
            curl -s -D - -o /dev/null -H "Host: site-config.staging.test" http://127.0.0.1:8081/config.json | tr -d "\r" | grep -i "^etag:" | cut -d" " -f2- >/root/site-config-etag
            funcdctl get site site-config-web -n staging -o json | grep -oE "\"digest\": *\"sha256:[0-9a-f]{64}\"" | grep -oE "sha256:[0-9a-f]{64}" >/root/site-config-digest
            funcdctl app deploy {{.reg}}/site-config:1.0.0 -n staging -f values/e2e.yaml -f values/staging.yaml -f values/new-dashboard.yaml >/dev/null
            echo "etag=$(cat /root/site-config-etag) digest=$(cat /root/site-config-digest)"'
        info: "flag on → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring etag=W/
          - result.systemout ShouldMatchRegex "digest=sha256:[0-9a-f]{64}"
      - type: exec
        script: |
          {{.vmsh}} '
            export FUNCD_TOKEN=todo-lane-admin
            get() { curl -s -H "Host: site-config.$1.test" http://127.0.0.1:8081/config.json; }
            etag=$(curl -s -D - -o /dev/null -H "Host: site-config.staging.test" http://127.0.0.1:8081/config.json | tr -d "\r" | grep -i "^etag:" | cut -d" " -f2-)
            digest=$(funcdctl get site site-config-web -n staging -o json | grep -oE "\"digest\": *\"sha256:[0-9a-f]{64}\"" | grep -oE "sha256:[0-9a-f]{64}")
            echo "staging=$(get staging)"
            [ "$(get staging)" = "{\"API_URL\":\"https://api.staging.example\",\"NEW_DASHBOARD\":\"true\"}" ] && echo FLAG-ON
            [ -n "$etag" ] && [ "$etag" != "$(cat /root/site-config-etag)" ] && echo ETAG-CHANGED
            [ -n "$digest" ] && [ "$digest" = "$(cat /root/site-config-digest)" ] && echo DIGEST-SAME
            [ "$(get prod)" = "{\"API_URL\":\"https://api.example\",\"NEW_DASHBOARD\":\"false\"}" ] && echo PROD-KEPT'
        retry: 10
        delay: 1
        info: "config.json after the change → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring FLAG-ON
          - result.systemout ShouldContainSubstring ETAG-CHANGED
          - result.systemout ShouldContainSubstring DIGEST-SAME
          - result.systemout ShouldContainSubstring PROD-KEPT

  - name: C6 the same digest at the path /preview - a direct deep link gets the index with the mount as its base, and the app's relative script and config.json load under the mount
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; funcdctl apply -f /opt/lane/site-config/sites/preview.yaml'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} '
            export FUNCD_TOKEN=todo-lane-admin
            digest() { funcdctl get site $1 -n staging -o json | grep -oE "\"digest\": *\"sha256:[0-9a-f]{64}\"" | grep -oE "sha256:[0-9a-f]{64}"; }
            page=$(curl -s -H "Host: staging.localhost" http://127.0.0.1:8081/preview/fleet/vehicles/42)
            [ "$(echo "$page" | grep -o "<base " | wc -l | tr -d " ")" = 1 ] && echo "$page" | grep -q "<base href=\"/preview/\">" && echo BASE-OK
            app=$(curl -s -H "Host: staging.localhost" -o /dev/null -w "%{http_code} %{content_type}" http://127.0.0.1:8081/preview/app.js)
            echo "app=$app"
            case "$app" in "200 "*javascript*) echo APP-OK ;; esac
            [ "$(curl -s -H "Host: staging.localhost" http://127.0.0.1:8081/preview/config.json)" = "{\"API_URL\":\"https://api.preview.example\"}" ] && echo CONFIG-OK
            p=$(digest site-config-preview); s=$(digest site-config-web)
            echo "digests $p $s"
            [ -n "$p" ] && [ "$p" = "$s" ] && echo ONE-DIGEST'
        retry: 15
        delay: 2
        info: "preview → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring BASE-OK
          - result.systemout ShouldContainSubstring APP-OK
          - result.systemout ShouldContainSubstring CONFIG-OK
          - result.systemout ShouldContainSubstring ONE-DIGEST

  - name: C7 one Route serves a Site at a host root and the todo API beside it, and follows a new build of the Site
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; funcdctl apply -f /opt/lane/site-config/sites/app-route.yaml'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} '
            get() { curl -s -H "Host: app.site-config.test" http://127.0.0.1:8081$1; }
            get /vehicles/42 | grep -q "<title>Site config</title>" && echo SITE-OK
            [ "$(get /config.json)" = "{\"API_URL\":\"https://api.app.example\"}" ] && echo CONFIG-OK
            curl -s -X POST -H "Host: app.site-config.test" -H "content-type: application/json" -d "{\"data\":{\"op\":\"list\"}}" \
              http://127.0.0.1:8081/api | grep -q "\"todos\"" && echo API-OK'
        retry: 15
        delay: 2
        info: "route → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring SITE-OK
          - result.systemout ShouldContainSubstring CONFIG-OK
          - result.systemout ShouldContainSubstring API-OK
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            export FUNCD_TOKEN=todo-lane-admin
            rm -rf /tmp/site-config-web-2 && cp -r /opt/lane/site-config/web /tmp/site-config-web-2
            echo "<!-- build 2 -->" >> /tmp/site-config-web-2/index.html
            funcdctl push --site /tmp/site-config-web-2 {{.reg}}/site-config-web:1.0.1 >/dev/null
            funcdctl get site site-config-app -n default -o json \
              | python3 -c "import sys,json;s=json.load(sys.stdin);s[\"spec\"][\"image\"]=\"oci-layout:///mnt/funcd-deps/registry/site-config-web:1.0.1\";print(json.dumps(s))" \
              | funcdctl apply -f -'
        info: "new build → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} '
            curl -s -H "Host: app.site-config.test" http://127.0.0.1:8081/ | grep -q "build 2" && echo NEW-BUILD
            curl -s -X POST -H "Host: app.site-config.test" -H "content-type: application/json" -d "{\"data\":{\"op\":\"list\"}}" \
              http://127.0.0.1:8081/api | grep -q "\"todos\"" && echo API-OK'
        retry: 15
        delay: 2
        info: "after the new build → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring NEW-BUILD
          - result.systemout ShouldContainSubstring API-OK
