# Venom e2e suite for the app-todo lane: the todo App of github.com/pyvvo/funcd-functions (apps/todo) deployed as one
# unit on real containerd. The pkg/funcd e2e suite covers the App control logic in process; each testcase here proves
# what only the real runtime shows:
#   L1 the template pushed to the VM's OCI layout deploys, every Function runs the digest app.lock pinned, and a render
#      from the pushed ref equals the render from the directory (ADR-0217, ADR-0218);
#   L2 a Workflow run passes data from a TypeScript step to a Python step on containerd;
#   L3 a cron timer fires on the wall clock in Asia/Kathmandu (UTC+5:45) with the VM's zone files hidden, so only
#      funcd's embedded tzdata resolves the zone (ADR-0211);
#   L4 the 1.1.0 pre-hook migrates the durable KV data before the API switches, and a downgrade runs the hooks of
#      1.0.0 (ADR-0214);
#   L5 a delete keeps the retained stores' data on disk for a new install to use through ref, and the stores with
#      deletion delete leave the disk (ADR-0199);
#   L6 app deploy --dry-run of 1.1.0 prints the plan and stores nothing (ADR-0220);
#   L7 a hand edit of a part is written back and recorded; while the App is paused a hand edit stays, and the resume
#      writes it back (ADR-0212);
#   L8 a new value of the App's ConfigMap rolls the API to a new Revision that serves it (ADR-0213);
#   L9 app history lists the revisions, and app rollback applies an earlier spec as a new revision (ADR-0200);
#   L10 a Python call past its spec.timeout gets 504 and DeadlineExceeded, and its container keeps serving (ADR-0226);
#   L11 a replica whose handler blocks its event loop is restarted after the liveness timeout, and a binding the
#       planner may no longer read makes it DependencyNotReady, which the App names (ADR-0215);
#   L12 an App whose Workflow step binds a store the Workflow does not declare is refused at apply (ADR-0229);
#   L13 a rollout waits for the App it requires until that App is Ready at a matching version (ADR-0219);
#   L14 an upload under uploads/ in Bucket todo-files fires the blob EventSource, whose Sensor runs the intake
#       Function, which records the upload (ADR-0119).
#   D1-D5 the disaster-recovery drill (FEAT-0009): backups on schedule to an S3 server in the VM (versitygw), sealed;
#       a lost data directory restored from the target and an escrow copy to the point before the damage, booting
#       held; a lost write's version conflicts; a release that advances the uploads source fires no restored upload
#       twice; and funcdctl backup plan (ADR-0202-0206, 0209, 0223).
#   D6-D8 the App's own data (F111): a backup schedule the App declares backs up its stores to its S3 target, sealed;
#       a Restore loads a Backup into new stores, and an admin's in-place Restore exports first (ADR-0222).
#   D9 funcd upgrade writes a pre-upgrade generation and keeps the old binary (ADR-0207).
#   D10 the blob store on S3: an unversioned bucket is refused, and on a versioned one uploads land there, keep their
#       old versions and still fire the blob event source (ADR-0208).
# The suite pushes, locks and deploys the App itself; the lane only creates the Secret and the grant beside it. Every
# file it applies comes from funcd-functions, staged by scripts/lanes.yaml.
name: app-todo — the todo App from its pushed template on real containerd (ADR-0199/0200/0211-0215/0217-0220/0226/0229), and a disaster-recovery drill (ADR-0202-0209/0222/0223)

vars:
  dp: http://127.0.0.1:8081
  reg: oci-layout:///mnt/funcd-deps/registry
  token: todo-lane-token
  fctl: "limactl shell --workdir / {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token funcdctl"
  vmsh: "limactl shell --workdir / {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token bash -c"
  values: "-f /opt/lane/values/e2e.yaml -f /opt/lane/values/reinstall.yaml"
  ctr: "/var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default"

testcases:
  - name: L1 the template pushed to the OCI layout deploys from its ref
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            cd /opt/lane
            for f in api-1.0.0:todo-api:1.0.0 api-1.1.0:todo-api:1.1.0 migrate-1.0.0:todo-migrate:1.0.0 migrate-1.1.0:todo-migrate:1.1.0 collect:todo-collect:1.0.0; do
              funcdctl push functions/ts/${f%%:*}.mjs {{.reg}}/${f#*:}
            done
            for f in planner:todo-planner:1.0.0 rank:todo-rank:1.0.0 warm:todo-warm:1.0.0 intake:todo-intake:1.0.0; do
              funcdctl push functions/py/${f%%:*}.py {{.reg}}/${f#*:}
            done
            funcdctl push --site web {{.reg}}/todo-web:1.0.0' | grep -c "@sha256:"
        info: "pushed → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual 10
      - type: exec
        script: |
          {{.fctl}} app lock /opt/lane/app -f /opt/lane/values/e2e.yaml | grep -E '^[a-z]+ 1[.]0[.]0 sha256:[0-9a-f]{64}$' | cut -d' ' -f1 | paste -sd, -
        info: "app.lock → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual api,collect,intake,migrate,planner,rank,warm,web
      - type: exec
        script: "{{.fctl}} push --template /opt/lane/app {{.reg}}/todo:1.0.0"
        info: "template → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "^oci-layout:///mnt/funcd-deps/registry/todo:1[.]0[.]0@sha256:[0-9a-f]{64}$"
      - type: exec
        script: "{{.fctl}} app deploy {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml"
        info: "deploy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-1
          - result.systemerr ShouldContainSubstring "template oci-layout:///mnt/funcd-deps/registry/todo:1.0.0@sha256:"

  - name: L1 every Function of the App runs the image digest that app.lock pinned
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess, yaml
          def get(kind, name):
              out = subprocess.run(["funcdctl", "get", kind, name, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else {}
          lock = yaml.safe_load(open("/opt/lane/app/app.lock"))["images"]
          parts = {"todo-api": "api", "todo-migrate": "migrate", "todo-warm": "warm", "todo-planner": "planner",
                   "todo-plan-collect": "collect", "todo-plan-rank": "rank", "todo-intake": "intake"}
          runs = []
          for fn, image in sorted(parts.items()):
              rev = get("function", fn).get("status", {}).get("currentRevision", "")
              digest = get("revision", rev).get("spec", {}).get("imageDigest", "") if rev else ""
              runs.append(fn + "=" + ("locked" if digest == lock[image]["digest"] else "other:" + digest))
          site = get("site", "todo-web").get("status", {}).get("digest", "")
          runs.append("todo-web=" + ("locked" if site == lock["web"]["digest"] else "other:" + site))
          print(",".join(runs))
          PY
          '
        retry: 15
        delay: 2
        info: "digests → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual todo-api=locked,todo-intake=locked,todo-migrate=locked,todo-plan-collect=locked,todo-plan-rank=locked,todo-planner=locked,todo-warm=locked,todo-web=locked

  - name: L1 a render from the pushed ref equals the render from the template directory
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            funcdctl app render {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml >/tmp/render-ref.yaml 2>/dev/null
            funcdctl app render /opt/lane/app -f /opt/lane/values/e2e.yaml >/tmp/render-dir.yaml
            cmp -s /tmp/render-ref.yaml /tmp/render-dir.yaml && same=yes || same=no
            echo "SAME=$same,IMAGES=$(grep -c "@sha256:" /tmp/render-ref.yaml)"'
        info: "render → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual SAME=yes,IMAGES=8

  - name: L1 the App serves through its Route and its Site on the real edge, after both hooks ran
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"milk","token":"{{.token}}"}}'
        retry: 15
        delay: 2
        info: "add milk → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.id ShouldEqual milk
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"passport","token":"{{.token}}"}}'
        info: "add passport → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.id ShouldEqual passport
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.0.0
          - result.bodyjson.todos ShouldHaveLength 2
          - result.bodyjson.todos.todos0.title ShouldEqual milk
          - result.bodyjson.todos.todos1.title ShouldEqual passport
          - result.bodyjson.greeting ShouldEqual "hello from the todo App"
          - result.bodyjson.tokenSet ShouldBeTrue
          - result.bodyjson.migration.by ShouldEqual "todo-migrate 1.0.0"
          - result.bodyjson.migration.event ShouldEqual install
          - result.bodyjson.release.by ShouldEqual todo-warm
          - result.bodyjson.release.revision ShouldEqual todo-1
      - type: http
        method: GET
        url: "{{.dp}}/site/todo-web/"
        info: "site → status {{.result.statuscode}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring <title>todo</title>

  - name: L2 a Workflow run passes data from its TypeScript step to its Python step on containerd
    steps:
      - type: exec
        script: "{{.fctl}} workflow run todo-plan plan-l2 --input '{\"tick\":\"manual-l2\"}'"
        info: "run → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.fctl}} get workflowrun plan-l2 -n default -o json | python3 -c 'import sys,json;d=json.load(sys.stdin);print("PHASE="+d["status"].get("phase","")+",STEPS="+";".join(s["name"]+"="+s["phase"] for s in d["status"].get("steps",[])))'
        retry: 60
        delay: 2
        info: "plan-l2 → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldEqual PHASE=Succeeded,STEPS=collect=Succeeded;rank=Succeeded
      # The Python planner reads the plan that the Python rank step stored from the titles the TypeScript step read.
      - type: http
        method: POST
        url: "{{.dp}}/function/todo-planner"
        headers:
          content-type: application/json
        body: '{"data":{"tick":"manual-l2"}}'
        retry: 15
        delay: 2
        info: "planner → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.found ShouldBeTrue
          - result.bodyjson.collected_by ShouldEqual collect
          - result.bodyjson.ranked_by ShouldEqual rank
          - result.bodyjson.plan ShouldHaveLength 2
          - result.bodyjson.plan.plan0 ShouldEqual milk
          - result.bodyjson.plan.plan1 ShouldEqual passport

  - name: L3 a cron timer fires on the wall clock in Asia/Kathmandu (UTC+5:45) with only funcd's embedded tzdata
    steps:
      # Hide the VM's zone files: from here the system cannot resolve Asia/Kathmandu, and funcd only through the tzdata
      # it embeds.
      - type: exec
        script: |
          {{.vmsh}} '
            mkdir -p /run/no-zoneinfo && mount --bind /run/no-zoneinfo /usr/share/zoneinfo
            echo "FILES=$(ls -A /usr/share/zoneinfo | wc -l),OFFSET=$(TZ=Asia/Kathmandu date +%z)"'
        info: "zone files → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual FILES=0,OFFSET=+0000
      # The slot is the minute two minutes ahead; the cron names its minute and hour in Kathmandu, 5 h 45 min ahead of
      # UTC all year, so a zone resolved to a whole-hour offset or to UTC misses the slot.
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            slot=$(( ($(date +%s) / 60 + 2) * 60 ))
            date -u -d @$slot +%Y-%m-%dT%H:%M > /tmp/slot
            cron="$(date -u -d @$((slot + 20700)) "+%-M %-H") * * *"
            printf "schedule:\n  cron: \"%s\"\n  timeZone: Asia/Kathmandu\n" "$cron" > /tmp/schedule.yaml
            funcdctl app deploy {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml -f /tmp/schedule.yaml > /tmp/deploy-l3.log 2>&1 || { cat /tmp/deploy-l3.log; exit 1; }
            funcdctl get eventsource todo-plan-timer -n default -o json > /tmp/timer.json
            python3 - "$cron" <<"PY"
          import json, sys
          timer = json.load(open("/tmp/timer.json"))
          event = timer["spec"]["timer"]["events"][0]
          ready = [c["status"] for c in timer.get("status", {}).get("conditions", []) if c["type"] == "Ready"]
          print("CRON=" + str(event.get("cron") == sys.argv[1]) + ",ZONE=" + event.get("timeZone", "") + ",READY=" + "".join(ready))
          PY
          '
        info: "timer → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual CRON=True,ZONE=Asia/Kathmandu,READY=True
      # The Sensor starts a run per tick with the event's time as its input: the run of the slot fired within seconds of
      # it, and it Succeeds.
      - type: exec
        script: |
          {{.vmsh}} '
            funcdctl get workflowrun -n default -o json > /tmp/runs.json
            python3 - "$(cat /tmp/slot)" <<"PY"
          import json, sys
          slot = sys.argv[1] + ":"
          runs = json.load(open("/tmp/runs.json"))
          runs = runs if isinstance(runs, list) else runs.get("items", [])
          fired = [r for r in runs if r["metadata"]["name"].startswith("todo-plan-schedule-plan-")
                   and str((r["spec"].get("input") or {}).get("tick", "")).startswith(slot)]
          if fired:
              tick = fired[0]["spec"]["input"]["tick"]
              print("PHASE=" + fired[0].get("status", {}).get("phase", "") + ",SECOND=" + tick[len(slot):len(slot) + 2])
          else:
              print("WAITING=" + slot)
          PY
          '
        retry: 100
        delay: 2
        info: "the run of the slot → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex ^PHASE=Succeeded,SECOND=0[0-9]$

  - name: L4 the 1.1.0 pre-hook migrates the durable KV data before the API switches
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            funcdctl app lock /opt/lane/app-1.1.0 -f /opt/lane/values/e2e.yaml > /dev/null
            funcdctl push --template /opt/lane/app-1.1.0 {{.reg}}/todo:1.1.0 > /dev/null
            funcdctl app deploy {{.reg}}/todo:1.1.0 -f /opt/lane/values/e2e.yaml'
        info: "deploy 1.1.0 → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex ^todo-[0-9]+
      # The 1.1.0 API lists only schema-2 todos: it shows the todos of 1.0.0 because the pre-hook rewrote them.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list on 1.1.0 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.1.0
          - result.bodyjson.unmigrated ShouldEqual 0
          - result.bodyjson.todos ShouldHaveLength 2
          - result.bodyjson.todos.todos0.title ShouldEqual milk
          - result.bodyjson.todos.todos0.done ShouldBeFalse
          - result.bodyjson.todos.todos1.title ShouldEqual passport
          - result.bodyjson.migration.by ShouldEqual "todo-migrate 1.1.0"
          - result.bodyjson.migration.event ShouldEqual upgrade
          - result.bodyjson.migration.fromVersion ShouldEqual 1.0.0
          - result.bodyjson.migration.migrated ShouldEqual 2
          - result.bodyjson.release.version ShouldEqual 1.1.0
      # The pre-hook's call ended before the API's 1.1.0 Revision was stamped, so the API switched after the migration.
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(kind, name):
              out = subprocess.run(["funcdctl", "get", kind, name, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else {}
          rev = get("apprevision", get("app", "todo")["status"]["currentRevision"])
          pre = [h for h in rev["status"].get("hooks", []) if h["point"] == "preApply"][-1]
          api = get("revision", get("function", "todo-api")["status"]["currentRevision"])
          order = "hook-first" if pre["endTime"] < api["metadata"]["creationTimestamp"] else "api-first"
          print("HOOK=" + pre["function"] + "/" + pre["phase"] + ",API=" + api["spec"]["image"].split("/")[-1].split("@")[0] + ",ORDER=" + order)
          PY
          '
        info: "pre-hook and API revision → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual HOOK=todo-migrate/Ready,API=todo-api:1.1.0,ORDER=hook-first
      # The migrated records are in the KV engine's files under the daemon's data dir.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c 'for t in milk passport; do grep -rqF "{\"title\":\"$t\",\"done\":false}" /var/lib/funcd/data/kv && echo "$t=on-disk" || echo "$t=missing"; done | paste -sd, -'
        info: "migrated records on disk → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual milk=on-disk,passport=on-disk

  - name: L4 a downgrade to 1.0.0 runs the hooks of 1.0.0 and keeps the data
    steps:
      - type: exec
        script: "{{.fctl}} app deploy {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml"
        info: "deploy 1.0.0 → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex ^todo-[0-9]+
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list on 1.0.0 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.0.0
          - result.bodyjson.todos ShouldHaveLength 2
          - result.bodyjson.todos.todos0.title ShouldEqual milk
          - result.bodyjson.todos.todos1.title ShouldEqual passport
          - result.bodyjson.migration.by ShouldEqual "todo-migrate 1.0.0"
          - result.bodyjson.migration.event ShouldEqual rollback
          - result.bodyjson.migration.fromVersion ShouldEqual 1.1.0
          - result.bodyjson.migration.toVersion ShouldEqual 1.0.0
          - result.bodyjson.release.version ShouldEqual 1.0.0
      # The downgrade's revision records both hook calls, and its hook Function runs the image of 1.0.0's lock.
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess, yaml
          def get(kind, name):
              out = subprocess.run(["funcdctl", "get", kind, name, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else {}
          lock = yaml.safe_load(open("/opt/lane/app/app.lock"))["images"]
          rev = get("apprevision", get("app", "todo")["status"]["currentRevision"])
          calls = ";".join(h["point"] + "=" + h["function"] + "/" + h["phase"] for h in rev["status"].get("hooks", []))
          migrate = get("revision", get("function", "todo-migrate")["status"]["currentRevision"])["spec"]["imageDigest"]
          print("HOOKS=" + calls + ",MIGRATE=" + ("1.0.0" if migrate == lock["migrate"]["digest"] else migrate))
          PY
          '
        retry: 5
        delay: 1
        info: "the downgrade's hooks → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual HOOKS=preApply=todo-migrate/Ready;postApply=todo-warm/Ready,MIGRATE=1.0.0

  - name: L5 a delete keeps the retained stores on disk and removes the stores with deletion delete
    steps:
      # Each store holds data on disk before the delete: todo-store and todo-files are retained, todo-cache, todo-tmp
      # and the Workflow's todo-plans have deletion delete.
      - type: exec
        script: &disk |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            kv=/var/lib/funcd/data/kv; s3=/var/lib/funcd/data/blob/s3/default
            has() { grep -rqF "$1" $kv && echo yes || echo no; }
            files() { find "$1" -type f ! -name "*.attrs" 2>/dev/null | wc -l; }
            echo "STORE=$(has "{\"title\":\"milk\"")" "FILES=$(files $s3/todo-files)" "CACHE=$(has "\"by\": \"todo-warm\"")" "PLANS=$(has "\"ranked_by\": \"rank\"")" "TMP=$(files $s3/todo-tmp)" | tr " " ,'
        info: "on disk before the delete → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual STORE=yes,FILES=2,CACHE=yes,PLANS=yes,TMP=2
      - type: exec
        script: "{{.fctl}} app delete todo -n default"
        info: "delete → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "kept KVStore/todo-store"
          - result.systemout ShouldContainSubstring "kept Bucket/todo-files"
          - result.systemout ShouldContainSubstring "deleted KVStore/todo-cache"
          - result.systemout ShouldContainSubstring "deleted Bucket/todo-tmp"
          - result.systemout ShouldContainSubstring "deleted KVStore/todo-plans"
      - type: exec
        script: *disk
        retry: 15
        delay: 2
        info: "on disk after the delete → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual STORE=yes,FILES=2,CACHE=no,PLANS=no,TMP=0

  - name: L5 a new install uses the kept stores through ref
    steps:
      - type: exec
        script: "{{.fctl}} app deploy {{.reg}}/todo:1.0.0 -f /opt/lane/values/e2e.yaml -f /opt/lane/values/reinstall.yaml"
        info: "reinstall → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-1
      - type: exec
        script: |
          {{.fctl}} get app todo -n default -o json | python3 -c 'import sys,json;s=json.load(sys.stdin)["spec"];print("KV="+next((k["ref"] for k in s["kv"] if k.get("ref")),"")+",BUCKET="+next((b["ref"] for b in s["buckets"] if b.get("ref")),""))'
        info: "the App's stores → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldEqual KV=todo-store,BUCKET=todo-files
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list after the reinstall → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.todos ShouldHaveLength 2
          - result.bodyjson.todos.todos0.title ShouldEqual milk
          - result.bodyjson.todos.todos1.title ShouldEqual passport
          - result.bodyjson.migration.event ShouldEqual install
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"passport"}}'
        info: "the kept attachment → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.attachment ShouldEqual passport

  - name: L6 app deploy --dry-run of 1.1.0 prints its plan and stores nothing
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            rv() { funcdctl get "$@" -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"metadata\"][\"resourceVersion\"])"; }
            state() { echo "$(rv app todo)/$(rv function todo-api)/$(funcdctl app history todo -o json | python3 -c "import sys,json;print(len(json.load(sys.stdin)))")"; }
            before=$(state)
            funcdctl app deploy {{.reg}}/todo:1.1.0 {{.values}} --dry-run > /tmp/dry-run.txt
            after=$(state)
            [ "$before" = "$after" ] && stored=nothing || stored="$before to $after"
            echo "PLAN=$(sed "s/^ *//" /tmp/dry-run.txt | paste -sd ";" -),STORED=$stored"'
        info: "dry run → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "PLAN=would apply App/todo;revision todo-2;update Function/todo-api;update Function/todo-migrate;hook todo-migrate;hook todo-warm,STORED=nothing"

  - name: L7 a hand edit of the API is written back; while the App is paused a hand edit stays until the resume
    steps:
      # A hot fix by hand: the API's image becomes the image of 1.1.0.
      - type: exec
        script: &hotfix |
          {{.vmsh}} '
            funcdctl get function todo-api -n default -o json \
              | python3 -c "import sys,json;f=json.load(sys.stdin);f[\"spec\"][\"image\"]=\"{{.reg}}/todo-api:1.1.0\";f[\"spec\"].pop(\"imageDigest\",None);print(json.dumps(f))" \
              | funcdctl apply -f -'
        info: "hand edit → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      # The App writes the declared image back, logs self-healed and records it in status.lastSelfHeal.
      - type: exec
        script: &drift |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          app, api = get("app", "todo"), get("function", "todo-api")
          paused = next((c["status"] + "/" + c.get("reason", "") for c in app["status"].get("conditions", []) if c["type"] == "Paused"), "none")
          heal = app["status"].get("lastSelfHeal", {})
          journal = subprocess.run(["journalctl", "-u", "funcd-demo", "--no-pager", "-o", "cat"], capture_output=True, text=True).stdout
          lines = sum(1 for l in journal.splitlines() if "msg=self-healed" in l and "kind=Function" in l and "name=todo-api" in l and "app=todo" in l)
          print("PAUSED=" + paused + ",IMAGE=" + api["spec"]["image"].split("/")[-1].split("@")[0] + ",LAST_SELF_HEAL=" + heal.get("kind", "") + "/" + heal.get("name", "") + ",LINES=" + str(lines) + ",LATEST=" + app["status"].get("latestRevision", ""))
          PY
          '
        retry: 15
        delay: 1
        info: "after the hand edit → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual PAUSED=none,IMAGE=todo-api:1.0.0,LAST_SELF_HEAL=Function/todo-api,LINES=1,LATEST=todo-1
      - type: exec
        script: "{{.fctl}} app pause todo"
        info: "pause → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "paused todo"
      - type: exec
        script: *hotfix
        info: "hand edit while paused → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      # While paused the hot fix stays: the API answers from the image of 1.1.0, and the App wrote and stamped nothing.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "list while paused → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.1.0
      - type: exec
        script: *drift
        info: "while paused → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual PAUSED=True/SpecPaused,IMAGE=todo-api:1.1.0,LAST_SELF_HEAL=Function/todo-api,LINES=1,LATEST=todo-1
      - type: exec
        script: "{{.fctl}} app resume todo"
        info: "resume → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "resumed todo"
      - type: exec
        script: *drift
        retry: 15
        delay: 1
        info: "after the resume → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual PAUSED=False/Resumed,IMAGE=todo-api:1.0.0,LAST_SELF_HEAL=Function/todo-api,LINES=2,LATEST=todo-1
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "list after the resume → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.0.0

  - name: L8 a new value of the App's ConfigMap rolls the API to a new Revision that serves it
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            funcdctl get function todo-api -n default -o json | python3 -c "import sys,json;f=json.load(sys.stdin);print(f[\"spec\"][\"config\"][0], f[\"status\"][\"currentRevision\"])" > /tmp/settings-1
            funcdctl app deploy {{.reg}}/todo:1.0.0 {{.values}} -f /opt/lane/values/greeting.yaml'
        info: "deploy the new greeting → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-2
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list on todo-2 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.greeting ShouldEqual "good morning from the todo App"
      # The new data is a new hashed ConfigMap, created before the API's new Revision; todo-1's is pruned.
      - type: exec
        script: &settings |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          first, first_rev = open("/tmp/settings-1").read().split()
          api = get("function", "todo-api")
          name, rev = api["spec"]["config"][0], api["status"]["currentRevision"]
          maps = sorted(m["metadata"]["name"] for m in get("configmap") if m["metadata"]["name"].startswith("todo-settings-"))
          first_map = get("configmap", name)["metadata"]["creationTimestamp"] <= get("revision", rev)["metadata"]["creationTimestamp"]
          print("API_CONFIG=" + ("todo-1" if name == first else "hashed" if len(name) == len("todo-settings-") + 10 else name) + ",MAPS=" + str(len(maps)) + ",REVISION=" + ("todo-1" if rev == first_rev else "new") + ",MAP_BEFORE_REVISION=" + str(first_map))
          PY
          '
        retry: 15
        delay: 1
        info: "ConfigMaps and the API → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual API_CONFIG=hashed,MAPS=1,REVISION=new,MAP_BEFORE_REVISION=True

  - name: L9 app history lists the revisions, and app rollback applies the spec of an earlier one as a new revision
    steps:
      - type: exec
        script: &history |
          {{.vmsh}} '
            funcdctl app history todo -o json | python3 -c "import sys,json;print(\",\".join(str(r[\"spec\"][\"number\"])+\"=\"+r[\"spec\"][\"spec\"].get(\"version\",\"\")+\"/\"+r[\"status\"].get(\"phase\",\"\") for r in json.load(sys.stdin)))"'
        info: "history → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual 1=1.0.0/Ready,2=1.0.0/Ready
      - type: exec
        script: "{{.fctl}} app rollback todo 1"
        info: "rollback → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "applied App todo with the spec of todo-1"
      # todo-3 holds todo-1's spec and becomes current: todo-1's ConfigMap is created again and todo-2's is pruned.
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          first = open("/tmp/settings-1").read().split()[0]
          app = get("app", "todo")
          revs = {r["metadata"]["name"]: r["spec"]["spec"] for r in get("apprevision")}
          maps = sorted(m["metadata"]["name"] for m in get("configmap") if m["metadata"]["name"].startswith("todo-settings-"))
          print("CURRENT=" + app["status"].get("currentRevision", "") + ",SPEC=" + ("todo-1" if revs.get("todo-3") == revs["todo-1"] else "other") + ",MAPS=" + ";".join("todo-1" if m == first else m for m in maps) + ",API_CONFIG=" + ("todo-1" if get("function", "todo-api")["spec"]["config"][0] == first else "other"))
          PY
          '
        retry: 30
        delay: 1
        info: "after the rollback → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual CURRENT=todo-3,SPEC=todo-1,MAPS=todo-1,API_CONFIG=todo-1
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 15
        delay: 2
        info: "list on todo-3 → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.greeting ShouldEqual "hello from the todo App"
      - type: exec
        script: *history
        info: "history → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual 1=1.0.0/Ready,2=1.0.0/Ready,3=1.0.0/Ready

  - name: L10 a Python call past its spec.timeout gets 504 and DeadlineExceeded, and its container keeps serving
    steps:
      # The first call wakes the planner; todo-plans holds no plan for the tick none.
      - type: http
        method: POST
        url: "{{.dp}}/function/todo-planner"
        headers:
          content-type: application/json
        body: '{"data":{"tick":"none"}}'
        retry: 15
        delay: 2
        info: "planner → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.found ShouldBeFalse
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            {{.ctr}} task ls | awk "\$1 ~ /^todo-planner-[0-9]+[.]r0\$/ && \$3 == \"RUNNING\" {print \$1, \$2}" | tee /tmp/planner-task'
        info: "the planner's task → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "^todo-planner-[0-9]+[.]r0 [0-9]+$"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            start=$(date +%s.%N)
            code=$(curl -s -m 10 -o /tmp/late.json -w "%{http_code}" -H "content-type: application/json" -d "{\"data\":{\"tick\":\"none\",\"wait\":30}}" http://127.0.0.1:8081/function/todo-planner)
            end=$(date +%s.%N)
            echo "$start" > /tmp/late-start
            python3 -c "import json,sys;print(\"CODE=%s,TYPE=%s,SECONDS=%.1f\" % (sys.argv[1], json.load(open(\"/tmp/late.json\")).get(\"type\", \"\"), float(sys.argv[3]) - float(sys.argv[2])))" "$code" "$start" "$end"'
        info: "the late call → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "^CODE=504,TYPE=urn:funcd:problem:deadline-exceeded,SECONDS=2[.][0-9]$"
      # The shim raises DeadlineExceeded in the handler 1 s after the deadline; the planner logs it.
      - type: exec
        script: |
          {{.vmsh}} '
          funcdctl logs todo-planner -n default -o json > /tmp/planner-logs.json
          python3 - <<"PY"
          import datetime, json
          deadline = float(open("/tmp/late-start").read()) + 2
          for line in open("/tmp/planner-logs.json"):
              record = json.loads(line)
              if "DeadlineExceeded" in record.get("body", ""):
                  at = datetime.datetime.fromisoformat(record["time"].replace("Z", "+00:00")).timestamp()
                  print("AFTER_DEADLINE=%.1f,BODY=%s" % (at - deadline, record["body"]))
                  break
          else:
              print("WAITING")
          PY
          '
        retry: 20
        delay: 1
        info: "the planner's log → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^AFTER_DEADLINE=[01][.][0-9],BODY=DeadlineExceeded while the planner waited for the plan of none$"
      - type: http
        method: POST
        url: "{{.dp}}/function/todo-planner"
        headers:
          content-type: application/json
        body: '{"data":{"tick":"none"}}'
        info: "the next call → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.found ShouldBeFalse
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            now=$({{.ctr}} task ls | awk "\$1 ~ /^todo-planner-[0-9]+[.]r0\$/ && \$3 == \"RUNNING\" {print \$1, \$2}")
            [ -n "$now" ] && [ "$now" = "$(cat /tmp/planner-task)" ] && echo SAME_TASK || echo "OTHER_TASK $(cat /tmp/planner-task) then $now"'
        info: "the planner's task → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual SAME_TASK

  - name: L11 a replica whose handler blocks its event loop is restarted after the liveness timeout, and a binding the planner may not read is named by the App
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            {{.ctr}} task ls | awk "\$1 ~ /^todo-api-[0-9]+[.]r0\$/ && \$3 == \"RUNNING\" {print \$1, \$2}" | tee /tmp/api-task'
        info: "the API's task → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^todo-api-[0-9]+[.]r0 [0-9]+$"
      # The call blocks the API's event loop for good; the client gives up after 2 s.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} -- sudo bash -c '
            date +%s.%N > /tmp/hang-start
            code=$(curl -s -m 2 -o /dev/null -w "%{http_code}" -H "content-type: application/json" -d "{\"data\":{\"op\":\"hang\",\"token\":\"{{.token}}\"}}" http://127.0.0.1:8081/api)
            echo "CODE=$code,EXIT=$?"'
        info: "the hanging call → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual CODE=000,EXIT=28
      # The replica stops answering /health/liveness: after runtime.livenessTimeout (6 s in the lane config), at a
      # supervision pass (every 2 s), funcd logs the restart.
      - type: exec
        script: |
          {{.vmsh}} '
          journalctl -u funcd-demo --no-pager -o cat | grep "silent on its liveness" | grep "function=todo-api" > /tmp/hang-log
          python3 - <<"PY"
          import datetime, re
          start = float(open("/tmp/hang-start").read())
          lines = open("/tmp/hang-log").read().splitlines()
          if lines:
              at = datetime.datetime.fromisoformat(re.search(r"time=(\S+)", lines[-1]).group(1).replace("Z", "+00:00")).timestamp()
              print("RESTARTED_AFTER=%d,REPLICA=%s" % (round(at - start), re.search(r"replica=(\d+)", lines[-1]).group(1)))
          else:
              print("WAITING")
          PY
          '
        retry: 30
        delay: 1
        info: "the restart → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^RESTARTED_AFTER=([3-9]|1[0-2]),REPLICA=0$"
      # A call sent while the hung replica is stopped waits for the replacement: no call is handed to a worker that is
      # being stopped, so this one is served at its first attempt.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        info: "list after the restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.version ShouldEqual 1.0.0
      # The same replica index runs a new task; the API and the App are Ready again.
      - type: exec
        script: |
          {{.vmsh}} '
            now=$({{.ctr}} task ls | awk "\$1 ~ /^todo-api-[0-9]+[.]r0\$/ && \$3 == \"RUNNING\" {print \$1, \$2}")
            read -r task pid < /tmp/api-task
            [ "${now%% *}" = "$task" ] && [ -n "${now#* }" ] && [ "${now#* }" != "$pid" ] && replaced=yes || replaced="no ($task $pid then $now)"
            phase() { funcdctl get "$@" -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])"; }
            echo "REPLACED=$replaced,API=$(phase function todo-api),APP=$(phase app todo)"'
        retry: 15
        delay: 1
        info: "after the restart → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual REPLACED=yes,API=Ready,APP=Ready
      # A Policy forbids the planner to read its table plans: its readiness reports the binding, and the App names it.
      - type: exec
        script: "{{.fctl}} apply -f /opt/lane/fixtures/forbid-plan-read.yaml"
        info: "the Policy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: &dependency |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          def ready(obj):
              c = next((c for c in obj["status"].get("conditions", []) if c["type"] == "Ready"), {})
              return (obj["status"].get("phase", "") + "/" + c.get("reason", "") + " " + c.get("message", "")).replace(chr(34), "")
          print("PLANNER=" + ready(get("function", "todo-planner")))
          print("APP=" + ready(get("app", "todo")))
          PY
          '
        retry: 20
        delay: 1
        info: "the planner and the App → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "PLANNER=Degraded/DependencyNotReady kv binding plans"
          - "result.systemout ShouldContainSubstring 'APP=Degraded/ChildNotReady Function/todo-planner: DependencyNotReady: kv binding plans'"
      - type: exec
        script: "{{.fctl}} delete policy todo-planner-reads-no-plans -n default"
        info: "delete the Policy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: *dependency
        retry: 20
        delay: 1
        info: "the planner and the App → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring PLANNER=Ready/
          - result.systemout ShouldContainSubstring APP=Ready/

  - name: L12 an App whose Workflow step binds a store the Workflow does not declare is refused at apply
    steps:
      - type: exec
        script: |
          out=$({{.fctl}} apply -f /opt/lane/fixtures/undeclared-step-store.yaml 2>&1); code=$?
          printf "EXIT=%s %s\n" "$code" "$out" | tr -d '"'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldNotStartWith EXIT=0
          - "result.systemout ShouldContainSubstring 'spec.workflows[0] (Workflow/todo-replan): admission.workflow-step-stores: spec.steps[0].function.kv[0].store todo-store is not declared in spec.kv'"
      # The API answers 400 to the create and to its dry run (ADR-0220), naming the field.
      - type: exec
        script: |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, urllib.error, urllib.request, yaml
          app = json.dumps(yaml.safe_load(open("/opt/lane/fixtures/undeclared-step-store.yaml"))).encode()
          answers = []
          for query in ("?dryRun=true", ""):
              req = urllib.request.Request("http://127.0.0.1:8080/apis/funcd.io/v1alpha1/namespaces/default/apps" + query, data=app, method="POST",
                                           headers={"Authorization": "Bearer funcd-dev-token", "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req)
                  answers.append("stored")
              except urllib.error.HTTPError as e:
                  answers.append(str(e.code) + " " + json.load(e)["detail"].replace(chr(34), ""))
          print("DRY_RUN=" + answers[0])
          print("CREATE=" + answers[1])
          PY
          '
        info: "the API → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - "result.systemout ShouldContainSubstring 'DRY_RUN=400 admission.app-parts: spec.workflows[0] (Workflow/todo-replan): admission.workflow-step-stores: spec.steps[0].function.kv[0].store todo-store is not declared in spec.kv'"
          - "result.systemout ShouldContainSubstring 'CREATE=400 admission.app-parts: spec.workflows[0] (Workflow/todo-replan): admission.workflow-step-stores: spec.steps[0].function.kv[0].store todo-store is not declared in spec.kv'"
      - type: exec
        script: |
          {{.vmsh}} '
            for kind in app workflow; do funcdctl get $kind todo-replan -n default >/dev/null 2>&1 && echo "$kind=stored" || echo "$kind=absent"; done | paste -sd, -'
        info: "stored → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual app=absent,workflow=absent

  - name: L13 a new revision waits for the App it requires, then rolls out once that App is Ready at a matching version
    steps:
      - type: exec
        script: "{{.fctl}} app deploy {{.reg}}/todo:1.0.0 {{.values}} -f /opt/lane/values/shared.yaml --no-wait"
        info: "deploy with requires → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: &requires |
          {{.vmsh}} '
          python3 - <<"PY"
          import json, subprocess
          def get(*args):
              out = subprocess.run(["funcdctl", "get", *args, "-n", "default", "-o", "json"], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else None
          app, shared = get("app", "todo"), get("app", "todo-shared")
          status = app["status"]
          ready = next((c for c in status.get("conditions", []) if c["type"] == "Ready"), {})
          latest = get("apprevision", status["latestRevision"])["status"]
          print("APP=" + status.get("phase", "") + "/" + ready.get("reason", "") + " " + ready.get("message", ""))
          print("LATEST=" + status["latestRevision"] + "/" + latest.get("phase", "") + "/" + ("started" if latest.get("startedAt") else "waiting") + ",CURRENT=" + status.get("currentRevision", ""))
          print("REQUIRES=" + ";".join(r["app"] + "@" + r.get("version", "") + "/" + str(r["met"]) for r in status.get("requires", [])) + ",REQUIRED_BY=" + (",".join(shared["status"].get("requiredBy", [])) if shared else "absent"))
          PY
          '
        retry: 15
        delay: 1
        info: "waiting → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - "result.systemout ShouldContainSubstring 'APP=Deploying/RequirementNotMet App/todo-shared does not exist; todo needs ^1.0.0'"
          - result.systemout ShouldContainSubstring LATEST=todo-4/Deploying/waiting,CURRENT=todo-3
          - result.systemout ShouldContainSubstring REQUIRES=todo-shared@/False,REQUIRED_BY=absent
      - type: exec
        script: "{{.fctl}} app deploy /opt/lane/todo-shared"
        info: "deploy todo-shared → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith todo-shared-1
      - type: exec
        script: *requires
        retry: 30
        delay: 1
        info: "met → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring APP=Ready/
          - result.systemout ShouldContainSubstring LATEST=todo-4/Ready/started,CURRENT=todo-4
          - result.systemout ShouldContainSubstring REQUIRES=todo-shared@1.0.0/True,REQUIRED_BY=todo
      # The App todo requires stays: its delete is refused, naming the dependent.
      - type: exec
        script: |
          out=$({{.fctl}} app delete todo-shared 2>&1); code=$?
          printf "EXIT=%s %s\n" "$code" "$out" | tr -d '"'
        info: "delete todo-shared → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldNotStartWith EXIT=0
          - "result.systemout ShouldContainSubstring 'app todo-shared is required by todo; remove the requirement first'"

  - name: L14 an upload under uploads/ in Bucket todo-files fires the blob EventSource, whose Sensor runs the intake Function that records it
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"receipt.txt","content":"2 litres","token":"{{.token}}"}}'
        retry: 15
        delay: 2
        info: "attach → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.id ShouldEqual milk
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 30
        delay: 1
        info: "the recorded upload → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 1
          - result.bodyjson.uploads.uploads0.name ShouldEqual receipt.txt
          - result.bodyjson.uploads.uploads0.size ShouldEqual 8
      # The intake Function ran on containerd for the object; a Sensor delivers at least once, so one line or more.
      - type: exec
        script: |
          {{.vmsh}} '
            funcdctl logs todo-intake -n default | grep -q "intake uploads/milk/receipt.txt 8" && echo LOGGED || echo WAITING'
        retry: 15
        delay: 1
        info: "the intake's log → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual LOGGED

  # The disaster-recovery block (FEAT-0009): the platform backup to an S3 server in the VM, a lost data directory
  # restored by the operator from the target and an escrow copy alone, a held boot, the release, and the backup plan.
  - name: D1 with a target set, the platform, KV and blob backups run on schedule to the S3 server, sealed
    steps:
      # versitygw (Apache-2.0), built at a pinned version and staged by the lane, serves s3://todo-backup. funcd
      # restarts with the DR config: the lane's config with the backups and static credentials (ADR-0203/0204/0209).
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            install -d /var/lib/vgw/data/todo-backup /var/lib/vgw/versions /etc/funcd/tokens
            systemd-run --unit todo-s3 -p EnvironmentFile=/opt/lane/dr/versitygw.env /opt/lane/dr/versitygw \
              --port 127.0.0.1:7070 posix --versioning-dir /var/lib/vgw/versions /var/lib/vgw/data
            install -m 600 /opt/lane/dr/admin.token /etc/funcd/tokens/admin
            install -m 600 /opt/lane/dr/developer.token /etc/funcd/tokens/developer
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo RESTARTED'
        info: "the DR config → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring RESTARTED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 60
        delay: 2
        info: "milk after the restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 1
      # The probe ConfigMap is read before the backup that holds it; D3 writes it back with this old version.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            funcdctl apply -f /opt/lane/dr/probe-configmap.yaml >/dev/null
            curl -sf -H "authorization: Bearer todo-lane-developer" \
              http://127.0.0.1:8080/apis/funcd.io/v1alpha1/namespaces/default/configmaps/todo-dr-probe >/root/probe-before.json
            funcdctl logs todo-intake -n default | grep -c "intake uploads/milk/receipt.txt 8" >/root/intake-before
            install -d /root/escrow/master
            cp -p /var/lib/funcd/data/s3gateway/master.key /root/escrow/master/
            echo SAVED'
        info: "the probe and the escrow copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring SAVED
      # A generation and a KV point written after the probe, and a blob mirror generation.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            cd /var/lib/vgw/data/todo-backup
            n() { d=$1; shift; find "$d" -name manifest.yaml "$@" 2>/dev/null | head -1 | grep -c .; }
            echo "gen=$(n gen -newer /root/probe-before.json) kv=$(n kv) blob=$(n blob)"
            find . -type f | head -30 >&2'
        retry: 45
        delay: 2
        info: "the backups → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual "gen=1 kv=1 blob=1"
      # Sealed: neither the probe value nor a todo is readable in the generation or the KV parts.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            cd /var/lib/vgw/data/todo-backup
            grep -rlaE "before-the-backup|milk" gen kv && echo PLAINTEXT || echo SEALED'
        info: "the parts → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual SEALED
      - type: exec
        script: |
          {{.vmsh}} 'FUNCD_TOKEN=todo-lane-admin funcdctl backup status'
        info: "backup status → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      # The restore point P, the newest generation now: D2 restores it, the point before the damage.
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            funcd restore list --config /opt/lane/dr/funcdconfig.yaml --credentials-file /opt/lane/dr/restore.credentials |
              grep -E "^[0-9a-f]{16}/[0-9]+ " | tail -1 | cut -d" " -f1 | tee /root/point'
        info: "the restore point → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^[0-9a-f]{16}/[0-9]+$"

  - name: D2 after a lost data directory the operator restores the point before the damage from the target and the escrow copy, and funcd boots held
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            u=http://127.0.0.1:8080/apis/funcd.io/v1alpha1/namespaces/default/configmaps/todo-dr-probe
            curl -sf -H "authorization: Bearer todo-lane-developer" $u | sed s/before-the-backup/after-the-backup/ |
              curl -sf -X PUT -H "authorization: Bearer todo-lane-developer" -H "content-type: application/json" \
                --data-binary @- $u >/root/probe-lost.json
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            mv /var/lib/funcd/data /var/lib/funcd/data.lost
            r="--config /opt/lane/dr/funcdconfig.yaml --credentials-file /opt/lane/dr/restore.credentials --identity /opt/lane/dr/identity.txt"
            unset FUNCD_TOKEN
            p=$(cat /root/point)
            echo "point $p"
            funcd restore run "$p" $r --escrow /root/escrow
            funcd restore kv $r
            funcd restore blob $r
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo RESTORED'
        info: "the restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "the platform is held"
          - result.systemout ShouldContainSubstring RESTORED
      - type: exec
        script: |
          {{.vmsh}} 'FUNCD_TOKEN=todo-lane-admin funcdctl hold status'
        # The pending list appears once the uploads source is Ready again and has listed its bucket.
        retry: 45
        delay: 2
        info: "hold status → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "held: true"'
          - 'result.systemout ShouldContainSubstring "reason: restore"'
          # The restored blob store gave receipt.txt a new ModTime, so the seen list no longer matches it (ADR-0206).
          - result.systemout ShouldContainSubstring "default/todo-uploads"
      # Every resource of the backup is readable while held: the App at the revision it had.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get app todo -n default -o json'
        retry: 15
        delay: 2
        info: "the App while held → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring todo-4

  - name: D3 a write carrying a version that the restore lost conflicts; the restored object holds the value of the point, and a write at its version succeeds
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            u=http://127.0.0.1:8080/apis/funcd.io/v1alpha1/namespaces/default/configmaps/todo-dr-probe
            a="authorization: Bearer todo-lane-developer"
            put() { curl -s -o /dev/null -w "%{http_code}" -X PUT -H "$a" -H "content-type: application/json" --data-binary @- $u; }
            echo "lost $(sed s/after-the-backup/a-lost-write/ /root/probe-lost.json | put)"
            curl -sf -H "$a" $u >/root/probe-restored.json
            grep -o "before-the-backup" /root/probe-restored.json
            echo "current $(sed s/before-the-backup/after-the-restore/ /root/probe-restored.json | put)"'
        info: "the writes → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "lost 409"
          - result.systemout ShouldContainSubstring before-the-backup
          - result.systemout ShouldContainSubstring "current 200"

  - name: D4 a release that advances todo-uploads marks the restored upload seen, so it does not fire again, and a new upload fires once
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'FUNCD_TOKEN=todo-lane-admin funcdctl hold release --advance default/todo-uploads'
        # An advance needs the source Ready; a refused release leaves the platform held and may run again.
        retry: 15
        delay: 2
        info: "release → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"late.txt","content":"1 loaf","token":"{{.token}}"}}'
        retry: 60
        delay: 2
        info: "attach after the release → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 30
        delay: 1
        info: "the uploads → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 2
      # Without --advance the release replays receipt.txt (ADR-0206); advanced, the intake logged it as often as before
      # the loss.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            l=$(funcdctl logs todo-intake -n default)
            n=$(echo "$l" | grep -c "intake uploads/milk/receipt.txt 8")
            [ "$n" = "$(cat /root/intake-before)" ] && echo "RECEIPT ONCE" || echo "receipt $n times"
            echo "$l" | grep "intake uploads/milk" >&2
            echo "$l" | grep -q "intake uploads/milk/late.txt 6" && echo LATE'
        retry: 15
        delay: 1
        info: "the intake's log → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring LATE
          - result.systemout ShouldContainSubstring "RECEIPT ONCE"

  - name: D5 funcdctl backup plan turns objectives into the settings the daemon accepts, and names an impossible recovery time
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'unset FUNCD_TOKEN; funcdctl backup plan platform --config /opt/lane/dr/funcdconfig.yaml --rpo 1m --keep 72h'
        info: "plan → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "interval: 30s"'
      - type: exec
        script: |
          {{.vmsh}} 'unset FUNCD_TOKEN; funcdctl backup plan platform --config /opt/lane/dr/funcdconfig.yaml --rpo 1h --keep 720h \
            --rto 1m --size 10Gi --speed 10Mi'
        info: "plan with an RTO → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 3
          - result.systemerr ShouldContainSubstring "RTO 1m is impossible"

  # The App's own data (FEAT-0009 F111): a schedule the App declares backs up its stores to an S3 target of its
  # choice, sealed; a Restore loads a Backup under new names, and only an admin restores in place, after an export.
  - name: D6 a backup schedule the App declares backs up the App's stores every minute to its S3 target, sealed
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            set -e
            install -d /var/lib/vgw/data/todo-workload
            funcdctl apply -f /opt/lane/dr/workload-secrets.yaml >/dev/null
            funcdctl app deploy {{.reg}}/todo:1.0.0 {{.values}} -f /opt/lane/values/shared.yaml \
              -f /opt/lane/values/backup.yaml >/tmp/deploy-d6.log 2>&1 || { cat /tmp/deploy-d6.log; exit 1; }
            funcdctl get backupschedule todo-backup -n default -o json'
        info: "the schedule → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex app.:\s*.todo.
      # The newest Succeeded Backup of the schedule: D7 and D8 restore it.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            for b in $(funcdctl get backups -n default | grep -E "^todo-backup-[0-9]+$" | sort); do
              funcdctl get backup $b -n default -o json | grep -qE "\"phase\": *\"Succeeded\"" && echo $b
            done | tail -1 | grep . | tee /root/workload-backup'
        retry: 60
        delay: 3
        info: "the Backups → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "^todo-backup-[0-9]+$"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            b=$(cat /root/workload-backup)
            funcdctl get backup $b -n default -o json >&2
            d=$(ls -d /var/lib/vgw/data/todo-workload/default/$b-*)
            test -f $d/manifest.yaml && echo MANIFEST
            ls $d/kv $d/blob
            echo "sealed=$(for f in $d/kv/todo-store/part-00000 $d/blob/todo-files/part-00000; do head -c 21 $f; echo; done |
              grep -c "^age-encryption.org/v1$")."
            grep -rlaE "milk|receipt" $d/kv $d/blob && echo PLAINTEXT || echo SEALED'
        info: "the Backup on the target → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring MANIFEST
          - result.systemout ShouldContainSubstring todo-store
          - result.systemout ShouldContainSubstring todo-files
          - result.systemout ShouldContainSubstring "sealed=2."
          - result.systemout ShouldContainSubstring SEALED

  - name: D7 a Restore loads the Backup into new, empty stores and leaves the App's stores as they are; a store that is not empty is refused
    steps:
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            sed "s/BACKUP/$(cat /root/workload-backup)/" /opt/lane/dr/restore-copy.yaml | funcdctl apply -f -'
        info: "apply todo-copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get restore todo-copy -n default -o json'
        retry: 30
        delay: 2
        info: "Restore todo-copy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Succeeded"
      # The blob store is a local directory: the copy of the upload sits under the new bucket, byte for byte.
      - type: exec
        script: |
          {{.vmsh}} '
            f() { find /var/lib/funcd/data/blob -path "*/$1/uploads/milk/receipt.txt" -type f | head -1; }
            cmp "$(f todo-files)" "$(f todo-files-r)" && echo SAME'
        info: "the restored upload → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual SAME
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        info: "milk after the copy → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 2
      # todo-store-r holds the loaded keys now: a second load into it is refused, the KV half of the copy's proof.
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            sed "s/BACKUP/$(cat /root/workload-backup)/" /opt/lane/dr/restore-not-empty.yaml | funcdctl apply -f -'
        info: "apply todo-copy-again → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl get restore todo-copy-again -n default -o json'
        retry: 30
        delay: 2
        info: "Restore todo-copy-again → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Failed"
          - result.systemout ShouldContainSubstring NotEmpty

  - name: D8 a developer may not restore in place; an admin's in-place Restore exports the store first, then brings back the todos of the Backup
    steps:
      # A todo added after the Backup, which the in-place Restore removes.
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"add","title":"bread","token":"{{.token}}"}}'
        info: "add bread → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        info: "the todos before the in-place Restore → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring bread
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; 
            sed "s/BACKUP/$(cat /root/workload-backup)/" /opt/lane/dr/restore-in-place.yaml | funcdctl apply -f -'
        info: "the developer's in-place Restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldNotEqual 0
          - result.systemerr ShouldContainSubstring "an in-place Restore needs update on Namespace"
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; 
            sed "s/BACKUP/$(cat /root/workload-backup)/" /opt/lane/dr/restore-in-place.yaml | funcdctl apply -f - >/dev/null'
        info: "the admin's in-place Restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-admin; 
            funcdctl get restore todo-back -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1
            funcdctl get backup todo-back-before -n default -o json | grep -oE "\"phase\": *\"[A-Za-z]+\"" | head -1 | sed s/phase/export/'
        retry: 45
        delay: 2
        info: "Restore todo-back and its export → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Succeeded"
          - result.systemout ShouldMatchRegex "export.{1,4}Succeeded"
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"list"}}'
        retry: 30
        delay: 2
        info: "the todos after the in-place Restore → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring milk
          - result.body ShouldNotContainSubstring bread

  # F109's way back from a bad release: funcd upgrade writes a pre-upgrade generation before it swaps the binary.
  - name: D9 funcd upgrade writes a pre-upgrade generation to the target, keeps the old binary, and the upgraded funcd serves
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            cp /usr/local/bin/funcd /root/funcd-next
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            /usr/local/bin/funcd upgrade /root/funcd-next --config /opt/lane/dr/funcdconfig.yaml --unit ""
            test -x /usr/local/bin/funcd.previous && echo PREVIOUS
            echo "pins=$(find /var/lib/vgw/data/todo-backup/gen/pre-upgrade -name manifest.yaml | grep -c .)."
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo UPGRADED'
        info: "the upgrade → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "pre-upgrade generation [0-9a-f]{16}/[0-9]+"
          - result.systemout ShouldContainSubstring PREVIOUS
          - result.systemout ShouldContainSubstring "pins=1."
          - result.systemout ShouldContainSubstring UPGRADED
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            funcd restore list --config /opt/lane/dr/funcdconfig.yaml --credentials-file /opt/lane/dr/restore.credentials |
              grep -E "^ *[0-9a-f]{16}/[0-9]+ +pre-upgrade "'
        info: "restore list → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring pre-upgrade
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"get","id":"milk"}}'
        retry: 60
        delay: 2
        info: "milk after the upgrade → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.uploads ShouldHaveLength 2

  # The blob store itself on S3 (ADR-0208): funcd refuses an unversioned bucket, and on a versioned one the App's
  # uploads land on the S3 server, an overwrite keeps the old version, and the blob event source still fires.
  - name: D10 funcd refuses a blob store on an unversioned S3 bucket; on a versioned one an upload lands on the S3 server, keeps its old version and fires the intake
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            unset FUNCD_TOKEN
            install -d /var/lib/vgw/data/todo-blob
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            timeout 60 /usr/local/bin/funcd --config /opt/lane/dr/funcdconfig-blob-s3.yaml 2>&1 | tail -5
            echo "exit=${PIPESTATUS[0]}."'
        info: "an unversioned bucket → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring blob.allowUnversioned
          # 124 would be the timeout: funcd served instead of refusing.
          - result.systemout ShouldNotContainSubstring "exit=0."
          - result.systemout ShouldNotContainSubstring "exit=124."
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            # curl 7.88 signs a bare ?versioning wrong and sends no payload hash, which versitygw requires.
            v="<VersioningConfiguration><Status>Enabled</Status></VersioningConfiguration>"
            curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user todo-lane-s3:todo-lane-s3-secret \
              -H "x-amz-content-sha256: $(printf %s "$v" | sha256sum | cut -d" " -f1)" \
              -H "content-type: application/xml" --data "$v" "http://127.0.0.1:7070/todo-blob?versioning="
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=30 /usr/local/bin/funcd \
              --config /opt/lane/dr/funcdconfig-blob-s3.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo STARTED'
        info: "a versioned bucket → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STARTED
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"remote.txt","content":"first","token":"{{.token}}"}}'
        retry: 60
        delay: 2
        info: "attach on the S3 store → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "{{.dp}}/api"
        headers:
          content-type: application/json
        body: '{"data":{"op":"attach","id":"milk","name":"remote.txt","content":"second","token":"{{.token}}"}}'
        info: "attach again → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          {{.vmsh}} '
            f=$(find /var/lib/vgw/data/todo-blob -path "*uploads/milk/remote.txt" -type f | head -1)
            echo "current $(cat "$f")"
            k=$(echo "${f#/var/lib/vgw/data/todo-blob/}" | sed "s|/|%2F|g")
            curl -s --aws-sigv4 "aws:amz:us-east-1:s3" --user todo-lane-s3:todo-lane-s3-secret \
              -H "x-amz-content-sha256: $(printf "" | sha256sum | cut -d" " -f1)" \
              "http://127.0.0.1:7070/todo-blob?prefix=$k&versions=" | grep -o "<Version>" | grep -c . | sed "s/^/versions=/; s/$/./"'
        info: "the object on the S3 server → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "current second"
          - result.systemout ShouldContainSubstring "versions=2."
      - type: exec
        script: |
          {{.vmsh}} 'export FUNCD_TOKEN=todo-lane-developer; funcdctl logs todo-intake -n default | grep "intake uploads/milk/remote.txt"'
        retry: 30
        delay: 2
        info: "the intake's log → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "intake uploads/milk/remote.txt"
