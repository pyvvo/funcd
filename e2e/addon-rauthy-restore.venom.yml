# Venom e2e suite for the addon-rauthy-restore containerd lane: rauthy, registered from its published image (rauthy/
# addon.yaml of pyvvo/funcd-addons) with a snapshot every 15 s, backed up from hiqlite's own snapshots to an S3 server in
# the VM, restored in place, and then cut by funcd's kill while its engine starts with restore.env. Run host-side once
# the self-deploying Lima VM is up; each apply and each call at the engine's own address runs in the VM, beside the
# daemon, from its host netns, whose source address funcd's bridge is.
#
# It proves on a real funcd and a real hiqlite (ADR-0333 scenarios addon-backup-member, addon-restore-in-place and
# addon-restore-interrupted, and the Design model's Left to tests):
#   1. a Backup of login copies rauthy's newest snapshot as member IdentityProvider/login;
#   2. an in-place Restore succeeds once rauthy answers again without restore.env: a client registered before the
#      Backup is kept, one registered after it is gone, and restore.path is empty;
#   3. funcd killed while rauthy starts with restore.env: at the next start the Restore is Failed (Interrupted), the
#      namespace stays held, the copy and status.restore are gone, and rauthy runs without restore.env over the crash
#      marker the boot sweep's kill left.
name: addon-rauthy-restore — an add-on object backed up from its engine's own snapshots and restored in place (ADR-0333, containerd lane)

vars:
  # the lane's `tokens` in scripts/lanes.yaml, listed in auth.credentials (e2e/fixtures/addon-rauthy-funcdconfig.yaml)
  vmsh: "limactl shell --workdir / {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=addon-rauthy-restore-lane-developer bash -c"
  avmsh: "limactl shell --workdir / {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=addon-rauthy-restore-lane-admin bash -c"
  ctr: "/var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default"
  # login's storage on the VM's host (ADR-0231): its snapshots under state_machine/backups, its copy under restore
  store: /var/lib/funcd/data/providers/addonobject/default/login
  addr: 'funcdctl get identityproviders login -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"].get(\"address\",\"\"))"'

testcases:
  - name: rauthy, registered with a snapshot every 15 s, serves login on containerd
    steps:
      # hiqlite writes a snapshot at each HQL_BACKUP_CRON tick; the module's Addon writes one every 15 min.
      - type: exec
        script: |
          {{.avmsh}} 'sed "s|HQL_BACKUP_CRON: .*|HQL_BACKUP_CRON: \"*/15 * * * * * *\"|" /opt/lane/app/addon.yaml | funcdctl apply -f -'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied Addon/rauthy"
      - type: exec
        script: |
          {{.vmsh}} 'funcdctl apply -f /opt/lane/rauthy-keys.yaml && funcdctl apply -f /opt/lane/login.yaml'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied IdentityProvider/login"
      - type: exec
        script: |
          {{.vmsh}} 'funcdctl get identityproviders login -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"].get(\"phase\",\"\"))"'
        retry: 60
        delay: 2
        info: "login → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldEqual Ready

  - name: a Backup copies rauthy's newest snapshot, taken after the first client
    steps:
      # versitygw serves s3://todo-workload with the todo App's test key, as in the volumes lane.
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            install -d /var/lib/vgw/data/todo-workload /var/lib/vgw/versions
            systemd-run --unit login-s3 -p EnvironmentFile=/opt/lane/dr/versitygw.env /opt/lane/versitygw \
              --port 127.0.0.1:7070 posix --versioning-dir /var/lib/vgw/versions /var/lib/vgw/data
            for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:7070 && break; sleep 1; done
            funcdctl apply -f /opt/lane/dr/workload-secrets.yaml >/dev/null
            funcdctl apply -f /opt/lane/backup.yaml'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied BackupSchedule/login-nightly"
      # The client is registered at the engine's own address, which funcd reaches; then the step waits for a snapshot
      # newer than it, past the Backup's 2 s quiet.
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            a=$({{.addr}})
            t0=$(date +%s)
            curl -sf -X POST "http://$a/auth/v1/clients_dyn" -H "content-type: application/json" -d @/opt/lane/client.json >/root/client-a.json
            for i in $(seq 120); do
              f=$(ls -t {{.store}}/state_machine/backups 2>/dev/null | grep -v "~$" | head -1)
              [ -n "$f" ] && [ "$(stat -c %Y "{{.store}}/state_machine/backups/$f")" -gt "$t0" ] && break
              sleep 2
            done
            sleep 3
            echo "SNAPSHOT=$f"'
        info: "client a and the snapshot → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SNAPSHOT=backup_"
      - type: exec
        script: |
          {{.vmsh}} '
            funcdctl apply -f /opt/lane/b1.yaml >/dev/null
            for i in $(seq 60); do
              p=$(funcdctl get backup login-b1 -n default -o json | python3 -c "import json,sys;print(json.load(sys.stdin)[\"status\"].get(\"phase\",\"\"))")
              [ "$p" = Succeeded ] && break; [ "$p" = Failed ] && { funcdctl get backup login-b1 -n default -o json; exit 1; }; sleep 2
            done
            funcdctl get backup login-b1 -n default -o json | python3 -c "import json,sys;s=json.load(sys.stdin)[\"status\"];m=s[\"members\"][0];print(s[\"phase\"],m[\"kind\"],m[\"name\"],m[\"bytes\"]>0)"'
        info: "the backup → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Succeeded IdentityProvider login True"

  - name: the in-place Restore brings rauthy back to its Backup, through two starts
    steps:
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            sleep 2
            curl -sf -X POST "http://$({{.addr}})/auth/v1/clients_dyn" -H "content-type: application/json" -d @/opt/lane/client.json >/root/client-b.json
            echo REGISTERED'
        assertions:
          - result.systemout ShouldContainSubstring REGISTERED
      - type: exec
        script: |
          {{.avmsh}} '
            sed "s/NAME/login-rewind/" /opt/lane/restore-in-place.yaml | funcdctl apply -f - >/dev/null
            for i in $(seq 150); do
              p=$(funcdctl get restore login-rewind -n default -o json | python3 -c "import json,sys;print(json.load(sys.stdin)[\"status\"].get(\"phase\",\"\"))")
              [ "$p" = Succeeded ] && break; [ "$p" = Failed ] && { funcdctl get restore login-rewind -n default -o json; exit 1; }; sleep 2
            done
            echo "$p"'
        info: "the restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual Succeeded
      # The Restore ends once rauthy answers without restore.env: the client from before the Backup is there, the one
      # from after it is gone, and funcd removed the copy and status.restore.
      - type: exec
        script: |
          {{.vmsh}} '
            a=$({{.addr}})
            code() { curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $(python3 -c "import json;print(json.load(open(\"$1\"))[\"registration_access_token\"])")" \
              "http://$a/auth/v1/clients_dyn/$(python3 -c "import json;print(json.load(open(\"$1\"))[\"client_id\"])")"; }
            echo "A=$(code /root/client-a.json) B=$(code /root/client-b.json) COPIES=$(ls -A {{.store}}/restore | wc -l)"
            funcdctl get identityproviders login -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];print(\"MARK=\"+str(\"restore\" in s), \"PHASE=\"+s.get(\"phase\",\"\"))"'
        retry: 15
        delay: 2
        info: "after the restore → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "A=200 B=404 COPIES=0"
          - result.systemout ShouldContainSubstring "MARK=False PHASE=Ready"
      - type: exec
        script: |
          {{.avmsh}} 'funcdctl hold status'
        info: "hold status → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - 'result.systemout ShouldNotContainSubstring "restore: login-rewind"'

  # As app-todo B12 does for a load, but funcd's process gets SIGKILL, as a crash: the engine then ends with no grace,
  # leaving hiqlite's crash marker, which a start without restore.env passes.
  - name: funcd killed while rauthy starts with restore.env ends the Restore Interrupted, held, and rauthy runs without it
    steps:
      # hiqlite moved the copy it restored out of its snapshot folder, which may then hold no snapshot until its next
      # tick, and the Restore's export Backup copies one unchanged for 2 s (ADR-0333 Decision 2).
      - type: exec
        script: |
          {{.vmsh}} '
            b={{.store}}/state_machine/backups
            for i in $(seq 60); do
              f=$(ls -tr $b 2>/dev/null | grep -v "~$" | head -1)
              if [ -n "$f" ] && [ $(( $(date +%s) - $(stat -c %Y "$b/$f") )) -ge 3 ]; then echo "QUIET=$f"; break; fi
              sleep 1
            done'
        info: "a quiet snapshot → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "QUIET=backup_"
      - type: exec
        script: |
          {{.avmsh}} '
            sed "s/NAME/login-killed/" /opt/lane/restore-in-place.yaml | funcdctl apply -f - >/dev/null
            for i in $(seq 900); do
              s=$(funcdctl get identityproviders login -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"].get(\"restore\",{}).get(\"state\",\"\"))")
              if [ "$s" = Loading ] && {{.ctr}} containers info login-r0 2>/dev/null | grep -q HQL_BACKUP_RESTORE; then break; fi
              sleep 0.2
            done
            kill -s KILL "$(systemctl show -p MainPID --value funcd-demo)"
            echo "KILLED while $s"'
        info: "the kill → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "KILLED while Loading"
      - type: exec
        script: |
          {{.vmsh}} '
            set -e
            unset FUNCD_TOKEN
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml
            curl -s --retry-connrefused --retry 60 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            systemctl is-active --quiet funcd-demo || { journalctl -u funcd-demo --no-pager -n 60; exit 1; }
            echo RESTARTED'
        info: "funcd's next start → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring RESTARTED
      - type: exec
        script: |
          {{.avmsh}} 'funcdctl get restore login-killed -n default -o json'
        retry: 30
        delay: 1
        info: "Restore login-killed → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldMatchRegex "phase.{1,4}Failed"
          - result.systemout ShouldContainSubstring Interrupted
      - type: exec
        script: |
          {{.vmsh}} '
            echo "COPIES=$(ls -A {{.store}}/restore | wc -l) RESTORE_ENV=$({{.ctr}} containers info login-r0 | grep -c HQL_BACKUP_RESTORE)"
            funcdctl get identityproviders login -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];print(\"MARK=\"+str(\"restore\" in s), \"PHASE=\"+s.get(\"phase\",\"\"))"'
        retry: 60
        delay: 2
        info: "login after the clear → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring "COPIES=0 RESTORE_ENV=0"
          - result.systemout ShouldContainSubstring "MARK=False PHASE=Ready"
      - type: exec
        script: |
          {{.avmsh}} 'funcdctl hold status'
        info: "hold status → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - 'result.systemout ShouldContainSubstring "restore: login-killed"'
      - type: exec
        script: |
          {{.avmsh}} 'funcdctl hold release --namespace default && funcdctl hold status'
        info: "the release → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldNotContainSubstring "restore: login-killed"'
