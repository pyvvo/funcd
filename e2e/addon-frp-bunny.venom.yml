# Venom e2e suite for the addon-frp-bunny containerd lane: funcd-functions' frp-bunny App with no spend, egress on. An
# admin registers pyvvo/funcd-addons' InfraStack and Tunnel Addons; the App's template, locked against the guest's OCI
# layout, holds the stack (the fake module in place of Bunny's, with the same variables and outputs), its Job and the
# reconciler, the hello Function on its host, and the Tunnel. The stack's approved run writes FRP_TOKEN into the outputs
# Secret, which the Tunnel binds; frps runs on the bridge with that token, the Tunnel's engine dials it through the
# egress gateway under the EgressPolicy that names it (ADR-0352), and a call to frps with the public host reaches the
# hello Function through frpc and the edge on the bridge address (ADR-0353). Deleting the App holds the stack until
# its approved destroy succeeded (ADR-0345 Decision 8).
#
# The Addons pull their images from GHCR by the digests they pin. A lane that stages opentofu.tar and tunnel.tar,
# images built from the add-ons' folders, serves them from two e2e/laneregistry instances in the VM instead.
name: addon-frp-bunny — an App's stack, its Tunnel and its hello Function, reached through frps (containerd lane)

vars:
  devtoken: addon-frp-bunny-lane-developer
  admintoken: addon-frp-bunny-lane-admin
  registry: oci-layout:///mnt/funcd-deps/registry

testcases:
  - name: the add-ons' images come from GHCR, or from the lane's registries when the lane stages them
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo bash -c '
            set -e
            if [ ! -f /opt/lane/opentofu.tar ]; then echo FROM_GHCR; exit 0; fi
            serve() {
              systemctl stop "$1" 2>/dev/null || true
              systemctl reset-failed "$1" 2>/dev/null || true
              rm -f "/opt/lane/$2.digest"
              systemd-run --unit "$1" /mnt/funcd-deps/laneregistry "/opt/lane/$2.tar" "funcd/$2" "127.0.0.1:$3" \
                "/opt/lane/$1.crt" "/opt/lane/$2.digest"
              for i in $(seq 120); do [ -s "/opt/lane/$2.digest" ] && break; sleep 1; done
              install -m 0644 "/opt/lane/$1.crt" "/usr/local/share/ca-certificates/funcd-$1.crt"
              sed -i -E "s#ghcr.io/pyvvo/funcd-$2@sha256:[A-Za-z0-9-]+#127.0.0.1:$3/funcd/$2@$(cat /opt/lane/$2.digest)#" "/opt/lane/$2-addon.yaml"
            }
            serve lane-registry opentofu 5443
            serve lane-registry-tunnel tunnel 5444
            update-ca-certificates >/dev/null
            curl -sf -o /dev/null https://127.0.0.1:5443/v2/ && curl -sf -o /dev/null https://127.0.0.1:5444/v2/
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml
            curl -s --retry-connrefused --retry 30 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            echo FROM_LANE_REGISTRIES'
        info: "images → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0

  - name: an admin registers both Addons, and the App's images and template are pushed and locked
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} bash -c '
            funcdctl apply -f /opt/lane/opentofu-addon.yaml && funcdctl apply -f /opt/lane/tunnel-addon.yaml'
        info: "admin apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied Addon/infrastack"
          - result.systemout ShouldContainSubstring "applied Addon/tunnel"
      - type: exec
        script: |
          limactl shell --workdir /opt/lane {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} bash -c '
            set -e
            funcdctl push infra/fake {{.registry}}/frp-bunny-module:0.1.0 --entry main.tf
            funcdctl push hello/hello.mjs {{.registry}}/frp-bunny-hello:0.1.0
            funcdctl push infrastack-reconciler.mjs {{.registry}}/infrastack-reconciler:0.1.0
            funcdctl app lock app -f values/lane.yaml
            funcdctl push --template app {{.registry}}/frp-bunny:0.1.0
            echo PUSHED'
        info: "pushes → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring PUSHED

  - name: the App deploys, its stack's run is approved and applies, and the outputs Secret gets FRP_TOKEN
    steps:
      - type: exec
        script: |
          limactl shell --workdir /opt/lane {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} bash -c '
            funcdctl apply -f secrets.yaml &&
            funcdctl apply -f egress.yaml &&
            funcdctl app deploy {{.registry}}/frp-bunny:0.1.0 -n default -f values/lane.yaml --name frp --no-wait'
        retry: 15
        delay: 2
        info: "deploy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
      # The InfraStack add-on's resync is a minute, and a run awaiting approval is no run's end (ADR-0345 Decision 4).
      - type: exec
        script: &stack |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            st=$(funcdctl get InfraStack frp-stack -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin).get(\"status\",{});r=([c for c in s.get(\"conditions\",[]) if c[\"type\"]==\"Ready\"] or [{}])[0];print(\"PHASE=\"+s.get(\"phase\",\"\")+\",REASON=\"+str(r.get(\"reason\",\"\"))+\",MESSAGE=\"+r.get(\"message\",\"\"))")
            echo "$st"
            case "$st" in *Failed*) run=$(echo "$st" | grep -o "frp-stack-[a-z0-9-]*" | head -1); funcdctl job logs "$run" -n default 2>&1 | tail -25;; esac'
        retry: 120
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring REASON=AwaitingApproval
      - type: exec
        script: &approve |
          limactl shell --workdir / {{.vm}} bash -lc '
            set -e
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            run=$(funcdctl job runs frp-stack -n default -o json | python3 -c "import sys,json;print([r[\"metadata\"][\"name\"] for r in json.load(sys.stdin) if r.get(\"status\",{}).get(\"phase\")==\"AwaitingApproval\"][0])")
            funcdctl get jobrun "$run" -n default -o json > /tmp/run.json
            python3 -c "import json;d=json.load(open(\"/tmp/run.json\"))[\"status\"][\"preview\"][\"document\"];print(\"RUN=$run,ACTION=%s,ADD=%d,DESTROY=%d\" % (d[\"action\"],d[\"add\"],d[\"destroy\"]))"
            funcdctl job approve "$run" -n default --digest "$(python3 -c "import json;print(json.load(open(\"/tmp/run.json\"))[\"status\"][\"preview\"][\"digest\"])")" >/dev/null
            echo APPROVED'
        info: "approval → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring ACTION=apply,ADD=1,DESTROY=0
          - result.systemout ShouldContainSubstring APPROVED
      - type: exec
        script: *stack
        retry: 120
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith PHASE=Ready,
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} bash -c '
            funcdctl get secret frp-outputs -n default -o json | python3 -c "import sys,json,base64;v=base64.b64decode(json.load(sys.stdin)[\"spec\"][\"data\"][\"FRP_TOKEN\"]).decode();open(\"/opt/lane/frp.token\",\"w\").write(v);print(\"TOKEN_LEN=%d\" % len(v))"
            chmod 0600 /opt/lane/frp.token'
        info: "token → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring TOKEN_LEN=32

  - name: frps runs on the bridge with the stack's token, and a call to it with the public host reaches hello
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo bash -c '
            systemctl stop lane-frps 2>/dev/null || true
            systemctl reset-failed lane-frps 2>/dev/null || true
            install -m 0755 /opt/lane/frps /usr/local/bin/lane-frps
            printf "bindPort = 7000\nvhostHTTPPort = 7000\nauth.token = \"%s\"\n" "$(cat /opt/lane/frp.token)" > /opt/lane/frps.toml
            chmod 0600 /opt/lane/frps.toml
            systemd-run --unit lane-frps /usr/local/bin/lane-frps -c /opt/lane/frps.toml
            sleep 1
            systemctl is-active --quiet lane-frps && echo FRPS'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring FRPS
      # The Tunnel's engine restarts with the token the apply wrote, then frpc logs in to frps and registers the public
      # host, which may take a few retries of frpc's.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} bash -c '
            out=$(curl -s -m 5 -H "Host: frp-lane.b-cdn.net" http://10.63.0.1:7000/)
            case "$out" in *"hello from frp-bunny"*) echo "$out"; exit 0;; esac
            echo NOT_YET
            funcdctl get Tunnel frp-tunnel -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin).get(\"status\",{});print(\"TUNNEL\",s.get(\"phase\"),[(c.get(\"type\"),c.get(\"reason\"),c.get(\"message\",\"\")[:200]) for c in s.get(\"conditions\",[])])"
            funcdctl logs Tunnel/frp-tunnel -n default --limit 12 2>&1 | tail -12'
        retry: 60
        delay: 3
        info: "frps → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hello from frp-bunny"

  - name: the App's deletion holds the stack until its approved destroy succeeded, then the App goes
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} \
            funcdctl app delete frp -n default --no-wait
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: *stack
        retry: 120
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "which destroys frp-stack, awaits approval"
      - type: exec
        script: *approve
        info: "approval → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring ACTION=destroy,ADD=0,DESTROY=1
          - result.systemout ShouldContainSubstring APPROVED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get app frp -n default >/dev/null 2>&1 || echo APP_GONE
            funcdctl get InfraStack frp-stack -n default >/dev/null 2>&1 || echo STACK_GONE'
        retry: 90
        delay: 2
        info: "after the destroy → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring APP_GONE
          - result.systemout ShouldContainSubstring STACK_GONE

  - name: frps, the registries, the Secrets, the EgressPolicy and the Addons go
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo bash -c '
            export FUNCD_SERVER=http://127.0.0.1:8080
            systemctl stop lane-frps lane-registry lane-registry-tunnel 2>/dev/null || true
            rm -f /opt/lane/frp.token /opt/lane/frps.toml
            for s in frp-outputs bunny-api; do FUNCD_TOKEN={{.devtoken}} funcdctl delete secret $s -n default || true; done
            FUNCD_TOKEN={{.devtoken}} funcdctl delete egresspolicy frp-tunnel -n default || true
            FUNCD_TOKEN={{.admintoken}} funcdctl delete addon tunnel || true
            FUNCD_TOKEN={{.admintoken}} funcdctl delete addon infrastack || true
            if ls /usr/local/share/ca-certificates/funcd-lane-registry*.crt >/dev/null 2>&1; then
              rm -f /usr/local/share/ca-certificates/funcd-lane-registry*.crt
              update-ca-certificates --fresh >/dev/null
            fi
            echo CLEANED'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring CLEANED
