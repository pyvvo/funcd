# Venom e2e suite for the secret-writer containerd lane: in TypeScript and in Python, a Secret's owner writes and
# deletes one of its keys through context.secret, and a function that binds the Secret without owning it writes only
# once a role allows it. Run host-side once the self-deploying Lima VM is Ready; the http steps hit the VM's forwarded
# 127.0.0.1 ports, and each grant is applied in the VM, beside the daemon, by one exec step.
#
# It proves on a real funcd (ADR-0327 and ADR-0328 scenarios secret-owner-writes, secret-write-refused and
# secret-writer-role), for each language:
#   1. the user's put is refused with 403 by builtin/secret-single-writer, and the Secret keeps its value;
#   2. the owner's put lands, and the next read of each function that binds the Secret returns it;
#   3. once fixtures/grant.yaml gives the user Secret Data Writer on the Secret, its put lands;
#   4. the owner's delete, repeated on the key it just removed, is no error, and the key reads as null.
name: secret-writer owner writes, a refused write and a writer grant (ADR-0327, containerd lane)

vars:
  dp: http://127.0.0.1:8081   # funcd data plane, forwarded from the Lima guest

testcases:
  - name: token-user reads demo-token, and its put is refused with 403 by the single-writer rule
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/token-user"
        headers:
          content-type: application/json
        body: '{"data":{"value":"from-user"}}'
        retry: 10
        delay: 1
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.token ShouldEqual token-v1
          - 'result.bodyjson.error ShouldContainSubstring "context.secret.put failed: 403"'
          - result.bodyjson.error ShouldContainSubstring builtin/secret-single-writer

  - name: token-owner writes TOKEN and reads it back, and token-user's next read returns it
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/token-owner"
        headers:
          content-type: application/json
        body: '{"data":{"op":"put","value":"token-v2"}}'
        retry: 10
        delay: 1
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.token ShouldEqual token-v2
      - type: http
        method: POST
        url: "{{.dp}}/function/token-user"
        headers:
          content-type: application/json
        body: '{"data":{"value":"from-user"}}'
        assertions:
          - result.bodyjson.token ShouldEqual token-v2
          - 'result.bodyjson.error ShouldContainSubstring "context.secret.put failed: 403"'
      # the refused put wrote nothing: the next read still returns the owner's value
      - type: http
        method: POST
        url: "{{.dp}}/function/token-user"
        headers:
          content-type: application/json
        body: '{"data":{"value":"from-user"}}'
        assertions:
          - result.bodyjson.token ShouldEqual token-v2
          - 'result.bodyjson.error ShouldContainSubstring "context.secret.put failed: 403"'

  - name: a Secret Data Writer grant on demo-token lets token-user write it
    steps:
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token \
            funcdctl apply -f /opt/lane/fixtures/grant.yaml
        assertions:
          - result.code ShouldEqual 0
      # funcd reads the namespace's RolesAssignments at each write, so the first put after the apply lands; the
      # retry only absorbs a slow apply.
      - type: http
        method: POST
        url: "{{.dp}}/function/token-user"
        headers:
          content-type: application/json
        body: '{"data":{"value":"from-user"}}'
        retry: 10
        delay: 1
        info: "token-user after the grant → {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.token ShouldEqual from-user
          - result.body ShouldNotContainSubstring error

  - name: token-owner deletes TOKEN twice, the second time a key that demo-token no longer holds
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/token-owner"
        headers:
          content-type: application/json
        body: '{"data":{"op":"delete"}}'
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring '"token":null'

  - name: py-token-user reads py-demo-token, and its put is refused with 403 by the single-writer rule
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/py-token-user"
        headers:
          content-type: application/json
        body: '{"data":{"value":"from-user"}}'
        retry: 10
        delay: 1
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.token ShouldEqual token-v1
          - 'result.bodyjson.error ShouldContainSubstring "context.secret.put failed: 403"'
          - result.bodyjson.error ShouldContainSubstring builtin/secret-single-writer

  - name: py-token-owner writes TOKEN and reads it back, and py-token-user's next read returns it
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/py-token-owner"
        headers:
          content-type: application/json
        body: '{"data":{"op":"put","value":"token-v2"}}'
        retry: 10
        delay: 1
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.token ShouldEqual token-v2
      - type: http
        method: POST
        url: "{{.dp}}/function/py-token-user"
        headers:
          content-type: application/json
        body: '{"data":{"value":"from-user"}}'
        assertions:
          - result.bodyjson.token ShouldEqual token-v2
          - 'result.bodyjson.error ShouldContainSubstring "context.secret.put failed: 403"'
      # the refused put wrote nothing: the next read still returns the owner's value
      - type: http
        method: POST
        url: "{{.dp}}/function/py-token-user"
        headers:
          content-type: application/json
        body: '{"data":{"value":"from-user"}}'
        assertions:
          - result.bodyjson.token ShouldEqual token-v2
          - 'result.bodyjson.error ShouldContainSubstring "context.secret.put failed: 403"'

  - name: a Secret Data Writer grant on py-demo-token lets py-token-user write it
    steps:
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token \
            funcdctl apply -f /opt/lane/py/fixtures/grant.yaml
        assertions:
          - result.code ShouldEqual 0
      - type: http
        method: POST
        url: "{{.dp}}/function/py-token-user"
        headers:
          content-type: application/json
        body: '{"data":{"value":"from-user"}}'
        retry: 10
        delay: 1
        info: "py-token-user after the grant → {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.token ShouldEqual from-user
          - result.body ShouldNotContainSubstring error

  - name: py-token-owner deletes TOKEN twice, the second time a key that py-demo-token no longer holds
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/py-token-owner"
        headers:
          content-type: application/json
        body: '{"data":{"op":"delete"}}'
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring '"token":null'
