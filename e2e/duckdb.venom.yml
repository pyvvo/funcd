# Venom e2e for the lake-quack lane (ADR-0086 + ADR-0087 + ADR-0088, F48/F57/F58) — the assert phase
# of `just lima-example-duckdb`, run host-side after the self-deploying Lima VM is Ready.
#
# It proves the whole add-on-provider loop on REAL containerd: a Lake is deployed as an
# add-on PROVIDER (no backing Function), the provider-runtime (ADR-0087) brings up the curated `duckdb`
# engine, the engine gets its F47/Cedar identity (ADR-0088 — its spec.bindings.blob are its blobBindings, it owns
# its lake prefix) so its keypair reads/writes S3 through the F47 PEP, and it reaches Ready on its own
# HTTP readiness probe.
#
# The CONSUMER is a funcd FUNCTION (pyvvo/funcd-python examples/lake-quack/src/handler.py + consumer.yaml) — the
# funcd-native shape. It runs on the STOCK `python314` runtime: its duckdb dep travels IN the artifact as
# an ADR-0089 dependency BUNDLE (vendored duckdb wheel + duckdb-ext/). Testcase 3 deploys it, asserts it
# reaches Ready (bundle materialized + `import duckdb` at module load), and then does a LIVE SQL round-trip:
# it POSTs to the function's data-plane route, the handler reads the `spec.bindings.lake` consumer binding
# (ADR-0091 — FUNCD_LAKE_LAKE_URL/_TOKEN injected from the `lake` lake's status.endpoint + QUACK_TOKEN),
# runs the SQL on `lake` over Quack, and returns the rows. Ready alone proves the binding injected the
# endpoint/token and `lake` is reachable; the invoke proves the whole consumer loop end-to-end on containerd.
#
# Then the ADR-0179 cases: the boot sweep releases a CNI attachment planted under the ID form used before ADR-0179
# (<ns>-<name>-r<replica>), and engines c in namespace a-b and b-c in namespace a, whose IDs collided under that
# form, each hold their own attachment.
#
# The ADR-0263 cases (DuckDB 2.0): the checkpointed catalog is DuckLake 1.1; a query reaches no path but s3:// and the
# engine's temp directory; a non-gating probe records whether lake-reader can ATTACH its Lake through the PEP proxy;
# and, last (ADR-0264), Lake lake re-created at 1Gi records its idle engine's RSS: the engine sees its own cgroup, so
# DuckDB sizes itself to its limit and spills a query larger than its memory, and lake-reader, with no limit, reads max.
# The ADR-0269 case: a query that points an S3 secret at the VM's own address opens no connection there.
# The #1227 case: tables committed just before a spec change replaces the engine are read back from the new engine.
# The #1232 case: tables committed just before a graceful daemon stop are read back after the daemon starts again.
# The #1233 case: a Lake whose catalog saves are refused reports it in CatalogSaved and the daemon's journal.
# ADR-0275: Lake lake keeps its prefix's write beside Function lake and through its own delete (#1231).
name: lake-quack add-on provider — deploy + Ready + live SQL round-trip on real containerd (ADR-0086/0087/0088/0091)

vars:
  # the lane's `tokens` in scripts/lanes.yaml, listed in auth.credentials (e2e/fixtures/duckdb-funcdconfig.yaml)
  devtoken: duckdb-lane-developer
  admintoken: duckdb-lane-admin

testcases:
  - name: the Lake deploys as a provider (no backing Function) and reaches Ready
    steps:
      - type: exec
        # The provider-runtime brings up the duckdb engine; with its F47/Cedar identity (ADR-0088) the
        # engine reads/writes S3 (HEAD 404 fresh, not 403), serves Quack, and the readiness probe passes
        # — the Lake auto-progresses to Ready (the reconciler requeues while it boots). Assert
        # Ready + the published status.endpoint, and that NO backing Function exists (it's a provider).
        # Under ADR-0137 status.endpoint is the per-Lake lake::query PEP PROXY (published on
        # the CNI bridge host so a consumer's netns can reach it — its ephemeral port), NOT the engine's
        # internal :8080 (which the proxy now fronts as its upstream).
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            cs=$(funcdctl get lake lake -n default -o json)
            phase=$(echo "$cs" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            ep=$(echo "$cs" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"].get(\"endpoint\",\"\"))")
            fns=$(funcdctl get function -n default -o json 2>/dev/null | python3 -c "import sys,json;print(len(json.load(sys.stdin).get(\"items\",[])))" 2>/dev/null || echo 0)
            echo "PHASE=$phase ENDPOINT=$ep FUNCTIONS=$fns"'
        retry: 30
        delay: 2
        info: "lake lake → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PHASE=Ready"
          - result.systemout ShouldContainSubstring "ENDPOINT=10.63.0.1:"  # the netns-reachable lake::query PEP proxy (ADR-0137), not the engine's :8080
          - result.systemout ShouldContainSubstring "FUNCTIONS=0"     # a provider, NOT a Function

  - name: the engine serves Quack and its S3 access is authorized (ADR-0088, not 403)
    steps:
      - type: exec
        # Directly hit the engine: GET / is the Quack RPC endpoint (200), and the daemon's S3 vgw log
        # shows the lake HEAD authorized as 404 (fresh) — proving the provider's F47/Cedar identity.
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            addr=$(funcdctl get lake lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"endpoint\"])")
            code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "http://$addr/")
            denied=$(sudo journalctl -u funcd-demo --no-pager 2>/dev/null | grep -c " 403 .* /lakehouse/gold/" || echo 0)
            echo "QUACK_HTTP=$code S3_403_COUNT=$denied"'
        retry: 10
        delay: 2
        info: "engine → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "QUACK_HTTP=200"  # the engine serves Quack
          - result.systemout ShouldContainSubstring "S3_403_COUNT=0"  # no S3 denial — ADR-0088 authorized it

  - name: the lake-reader CONSUMER Function reaches Ready and round-trips SQL over the spec.bindings.lake binding
    steps:
      # (a) Ready. The consumer is a funcd Function whose artifact is an ADR-0089 dependency BUNDLE carrying
      # the vendored duckdb wheel + duckdb-ext/. It runs on the STOCK `python314` runtime (no python-duckdb
      # image). handler.py does `import duckdb` at module load, so Ready ⇒ the bundle materialized and the
      # vendored native dep loaded on the stock runtime. Ready ALSO proves the ADR-0091 spec.bindings.lake binding
      # resolved: the reconcile requeues lake-reader until `lake` is Ready and injects FUNCD_LAKE_LAKE_URL
      # (= lake's status.endpoint) + FUNCD_LAKE_LAKE_TOKEN (= its QUACK_TOKEN).
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            fn=$(funcdctl get function lake-reader -n default -o json)
            phase=$(echo "$fn" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            echo "PHASE=$phase"'
        retry: 60
        delay: 2
        info: "function lake-reader → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PHASE=Ready"     # bundle materialized + import duckdb OK + binding resolved
      # (b) LIVE SQL round-trip. POST to the function's data-plane route (127.0.0.1:8081, forwarded from the
      # guest like the kv/fn-to-fn lanes). The handler reads the injected FUNCD_LAKE_LAKE_URL/_TOKEN, loads
      # the offline quack extension from FUNCD_BUNDLE_DIR/duckdb-ext, and runs the SQL on `lake` over Quack —
      # returning {"rows": [...]}. `SELECT 42 AS answer` ⇒ [[42]]. retry/delay absorbs first-invoke warm-up.
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT 42 AS answer"}}'
        retry: 20
        delay: 2
        info: "sql round-trip → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "rows"                 # the handler's FuncOutput shape
          - result.body ShouldContainSubstring "[[42]]"               # rows == [[42]] — real Quack round-trip on lake

  - name: tuning-keys-apply — Lake lake's engine runs with its ConfigMap's DUCKDB_MEMORY_LIMIT (ADR-0265)
    steps:
      # The example's ConfigMap sets DUCKDB_MEMORY_LIMIT "3GB", which DuckDB reads back as 2.7 GiB; without it the
      # engine's default on this Lake is 3.2 GiB. The SQL runs on the engine over Quack, so it reads the engine's setting.
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: "{\"data\":{\"sql\":\"SELECT current_setting('memory_limit') AS m\"}}"
        retry: 10
        delay: 2
        info: "memory_limit → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "2.7 GiB"

  - name: the lake is exposed at the edge and external lake::query is PEP'd (ADR-0138)
    steps:
      # ADR-0138/0241: lake.yaml enables spec.ingress at path /lake/lake, so once `lake` is Ready
      # the Lake reconciler programs — THROUGH THE EDGE-ROUTE AGGREGATOR — a Route-v2 edge entry whose
      # node-private Upstream backend is the lake::query PEP PROXY (never the engine). This proves, on real
      # containerd: (a) the aggregator programmed the lake entry ALONGSIDE the function route (testcase 3b's
      # /function/lake-reader still 200'd — no replace-all clobber); (b) the data-plane reverse-proxies the
      # edge path to the PROXY, which forwards a non-handshake request to the ready engine (⇒ 200 REACHABILITY).
      - type: http
        method: GET
        url: "http://127.0.0.1:8081/lake/lake"
        retry: 20
        delay: 2
        info: "edge /lake/lake → status {{.result.statuscode}} (200 = edge reaches the PEP proxy → engine)"
        assertions:
          - result.statuscode ShouldEqual 200          # the edge routes external traffic through the aggregator's Upstream entry to the proxy
      # control: an unexposed edge path has NO programmed entry ⇒ 404. This distinguishes "the lake entry is
      # programmed and reachable" (200 above) from "no route at all", proving the 200 is ADR-0138's edge entry.
      - type: http
        method: GET
        url: "http://127.0.0.1:8081/lake/not-a-lake"
        info: "control edge /lake/not-a-lake → status {{.result.statuscode}} (404 = no route)"
        assertions:
          - result.statuscode ShouldEqual 404          # no edge entry for an unexposed path
      # PEP ENFORCEMENT at the edge: POST a real Quack handshake frame carrying a GARBAGE token (8-byte preamble
      # + token TLV field 0x01,0x00 + LEB128 length 0x1a + 26-byte token + trailing field — the makeHandshake
      # shape). The proxy resolves the caller token to a principal, fails (unresolvable), and FAIL-CLOSES 403 —
      # the engine never sees it. This proves the external lake::query path is default-deny at the edge.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            code=$(printf "\x00\x00\x00\x00\x00\x00\x00\x00\x01\x00\x1agarbage-unresolvable-token\x02\x00\x03end" \
              | curl -s -m 5 -o /dev/null -w "%{http_code}" -X POST --data-binary @- http://127.0.0.1:8081/lake/lake)
            echo "PEP=$code"'
        info: "edge PEP (garbage token) → {{.result.systemout}} (PEP=403 = default-deny enforced at the edge)"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PEP=403"   # unresolvable caller token ⇒ fail-closed, engine never reached

  # ADR-0142: nothing writes the Lake after the kill — the lake's periodic pass recreates the engine.
  - name: crashed-lake-engine-restarts — a killed engine comes back on a new IP behind the same proxy URL with no write, and the consumer keeps working
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            funcdctl get lake lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"endpoint\"])" > /tmp/lake-endpoint-before
            pid=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "\$1==\"lake-r0\"{print \$2}")
            sudo nsenter -t "$pid" -n ip -4 -o addr show scope global | awk "{print \$4}" > /tmp/lake-ip-before
            sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task kill -s KILL lake-r0
            echo "BEFORE=$(cat /tmp/lake-endpoint-before) IP=$(cat /tmp/lake-ip-before)"'
        info: "killed the engine, no write → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "BEFORE=10.63.0.1:"
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT 42 AS answer"}}'
        retry: 30
        delay: 2
        info: "sql after the engine restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[42]]"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            now=$(funcdctl get lake lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"endpoint\"])")
            pid=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "\$1==\"lake-r0\"{print \$2}")
            ip=$(sudo nsenter -t "$pid" -n ip -4 -o addr show scope global | awk "{print \$4}")
            [ "$now" = "$(cat /tmp/lake-endpoint-before)" ] && same=yes || same=no
            [ -n "$ip" ] && [ "$ip" != "$(cat /tmp/lake-ip-before)" ] && moved=yes || moved=no
            echo "ENDPOINT_SAME=$same ENGINE_MOVED=$moved ($(cat /tmp/lake-ip-before) -> $ip, endpoint $now)"'
        info: "after the restart → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENGINE_MOVED=yes"              # the engine really came back on a new IP
          - result.systemout ShouldContainSubstring "ENDPOINT_SAME=yes"             # yet the published proxy URL did not change

  # #998: the engine checkpoints its DuckLake catalog after each commit (ADR-0086), so a table committed over Quack
  # survives a SIGKILL of the engine; before, only a SIGTERM checkpointed and the restarted engine lost the table.
  - name: issue998-committed-table-survives-a-killed-engine — a table created over Quack is checkpointed within a second and read back after a SIGKILL of the engine
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc 'touch /tmp/issue998-before && echo MARKED'
        assertions:
          - result.systemout ShouldContainSubstring MARKED
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"CREATE TABLE lakehouse.issue998 AS SELECT 998 AS n"}}'
        retry: 30
        delay: 2
        info: "create → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sudo find /var/lib/funcd/data/blob -path "*/_ducklake/catalog.db" -newer /tmp/issue998-before -type f |
              grep -q . && echo CHECKPOINTED || echo WAITING'
        retry: 15
        delay: 1
        info: "the lake after the commit → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldEqual CHECKPOINTED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sudo /var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default \
              task kill -s KILL lake-r0 && echo KILLED'
        retry: 15
        delay: 2
        info: "kill → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring KILLED
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT n FROM lakehouse.issue998"}}'
        retry: 30
        delay: 2
        info: "read after the restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[998]]"

  # ADR-0279: without lake.saveInterval, as this lane runs, the Lake saves before it answers, so a SIGKILL right after a
  # commit's answer keeps it, with no wait for a save as above.
  - name: acknowledged-commit-survives-crash — rows committed over Quack are read back after a SIGKILL right after their answer (ADR-0279)
    steps:
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"CREATE TABLE lakehouse.adr0279 AS SELECT 279 AS n"}}'
        retry: 30
        delay: 2
        info: "create → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"INSERT INTO lakehouse.adr0279 VALUES (2790)"}}'
        info: "insert → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sudo /var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default \
              task kill -s KILL lake-r0 && echo KILLED'
        info: "kill → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.systemout ShouldContainSubstring KILLED
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT sum(n) FROM lakehouse.adr0279"}}'
        retry: 30
        delay: 2
        info: "read after the restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[3069]]"

  - name: new-lake-is-1-1 — the Lake's catalog, checkpointed to blob as a DuckDB file (ADR-0271), is DuckLake 1.1 (ADR-0263 Decision 3)
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            cat=$(sudo find /var/lib/funcd/data/blob -path "*/lakehouse/gold/_ducklake/catalog.db" -type f | head -1)
            [ -n "$cat" ] || exit 1
            echo "MAGIC=$(sudo head -c 12 "$cat" | tail -c 4)"'
        retry: 15
        delay: 2
        info: "the checkpointed catalog → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual MAGIC=DUCK
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT value FROM __ducklake_metadata_lakehouse.ducklake_metadata WHERE key = ''version''"}}'
        retry: 10
        delay: 2
        info: "the catalog's DuckLake version → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring '[["1.1"]]'

  - name: only-allowed-paths — a query reaches no path but s3:// and the engine's temp directory (ADR-0263 Decision 8)
    steps:
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT content FROM read_text(''http://example.invalid/x'')"}}'
        retry: 10
        delay: 2
        info: "an http read → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 500
          - result.body ShouldContainSubstring "disabled"
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT content FROM read_text(''/etc/passwd'')"}}'
        retry: 10
        delay: 2
        info: "a read of a local file outside the temp directory → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 500
          - result.body ShouldContainSubstring "disabled"
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT (SELECT secret_string FROM duckdb_secrets() WHERE name = ''funcd_lake_s3''), (SELECT count(*) FROM duckdb_settings() WHERE name LIKE ''s3_%'' AND value LIKE ''FUNCD%'')"}}'
        retry: 10
        delay: 2
        info: "the engine's S3 secret and key settings → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "secret=redacted"
          - result.body ShouldContainSubstring ",0]]"

  # Non-gating (ADR-0263 Open questions): only quack_query's handshake is verified through the PEP proxy.
  - name: quack-attach-probe — records, never failing, whether lake-reader's DuckDB 2.0 can ATTACH its Lake through the PEP proxy
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sock=/var/lib/funcd/data/containerd/containerd.sock
            task=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "index(\$1,\"lake-reader\")==1{print \$1; exit}")
            sudo timeout 60 /var/lib/funcd/bin/ctr --address $sock -n funcd-default task exec --exec-id quack-attach-probe "$task" \
              /usr/local/bin/python3.14 -c "$(cat /opt/lane/quack-attach-probe.py)" 2>&1 | tail -2
            true'
        info: "ATTACH through the PEP proxy → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0

  # Issue #1227: a graceful stop keeps every commit acknowledged before it. A spec change replaces the engine (#1195);
  # the containerd driver removed the engine's network before SIGTERM, so the stop could not save its catalog and the
  # tables committed since the last save were lost. It runs before Function lake exists: a Function named like the
  # prefix owner takes the prefix's write from the Lake (ADR-0175, an accepted risk).
  - name: issue1227-redeploy-keeps-commits — tables committed just before a spec change are read back from the new engine
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sudo /var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default \
              task ls | awk "\$1==\"lake-r0\" && \$3==\"RUNNING\" {print \$2}"'
        info: "the running engine → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotBeEmpty
        vars:
          oldpid:
            from: result.systemout
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            set -e
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            for t in a b c; do
              curl -sf -m 30 -X POST -H "content-type: application/json" \
                --data "{\"data\":{\"sql\":\"CREATE TABLE lakehouse.issue1227_$t AS SELECT 1227 AS n\"}}" \
                http://127.0.0.1:8081/function/lake-reader >/dev/null
            done
            funcdctl apply -f /opt/lane/lake-redeploy.yaml >/dev/null && echo COMMITTED_AND_APPLIED'
        info: "three commits, then the redeploy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual COMMITTED_AND_APPLIED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            pid=$(sudo /var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default \
              task ls | awk "\$1==\"lake-r0\" && \$3==\"RUNNING\" {print \$2}")
            phase=$(funcdctl get lake lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            old=$(printf %s "{{.oldpid}}" | tr -d "[:space:]")
            [ -n "$old" ] && [ -n "$pid" ] && [ "$pid" != "$old" ] && [ "$phase" = Ready ] && echo "REPLACED $old -> $pid"'
        retry: 60
        delay: 1
        info: "the engine after the redeploy → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldContainSubstring REPLACED
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT count(*) FROM (SELECT n FROM lakehouse.issue1227_a UNION ALL SELECT n FROM lakehouse.issue1227_b UNION ALL SELECT n FROM lakehouse.issue1227_c)"}}'
        retry: 20
        delay: 2
        info: "the three tables from the new engine → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[3]]"

  # Issue #1232: a graceful daemon stop keeps every commit acknowledged before it. The daemon stopped the S3 gateway at
  # SIGTERM, before it stopped the engine, so the engine's stop could not save its catalog. A daemon started with
  # lake.saveInterval: 1h leaves the stop's own saves as the only ones; the file gets its own interval back once that
  # daemon has read it. It runs before Function lake exists, as issue1227-redeploy-keeps-commits does.
  - name: issue1232-daemon-stop-keeps-commits — tables committed just before a graceful daemon stop are read back after the start
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            set -e
            sudo cp /opt/lane/funcdconfig.yaml /opt/lane/funcdconfig.yaml.issue1232
            printf "\nlake:\n  saveInterval: 1h\n" | sudo tee -a /opt/lane/funcdconfig.yaml >/dev/null
            sudo systemctl stop funcd-demo
            echo STOPPED'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual STOPPED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            systemctl is-active -q funcd-demo && exit 1
            sudo systemctl reset-failed funcd-demo 2>/dev/null
            sudo systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml'
        retry: 15
        delay: 2
        assertions:
          - result.code ShouldEqual 0
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT 42 AS answer"}}'
        retry: 60
        delay: 2
        info: "the daemon with a 1h save interval → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[42]]"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            set -e
            sudo mv /opt/lane/funcdconfig.yaml.issue1232 /opt/lane/funcdconfig.yaml
            for t in a b c; do
              curl -sf -m 30 -X POST -H "content-type: application/json" \
                --data "{\"data\":{\"sql\":\"CREATE TABLE lakehouse.issue1232_$t AS SELECT 1232 AS n\"}}" \
                http://127.0.0.1:8081/function/lake-reader >/dev/null
            done
            sudo systemctl stop funcd-demo
            echo COMMITTED_AND_STOPPED'
        info: "three commits, then a graceful daemon stop → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual COMMITTED_AND_STOPPED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            systemctl is-active -q funcd-demo && exit 1
            sudo systemctl reset-failed funcd-demo 2>/dev/null
            sudo systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml'
        retry: 15
        delay: 2
        assertions:
          - result.code ShouldEqual 0
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT count(*) FROM (SELECT n FROM lakehouse.issue1232_a UNION ALL SELECT n FROM lakehouse.issue1232_b UNION ALL SELECT n FROM lakehouse.issue1232_c)"}}'
        retry: 30
        delay: 2
        info: "the three tables after the start → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[3]]"

  # ADR-0276 (#1233): a Lake whose catalog saves fail shows it. Its gold prefix given to Function other, which does not
  # exist, makes the S3 gateway refuse the engine's saves; a one-row table is inlined in the catalog, so the commit
  # itself lands in the engine, but its answer, and every answer after it, is an error (ADR-0279). CatalogSaved turns
  # False with the engine's error while the Lake stays Ready, and the engine's line reaches the daemon's journal. Given
  # back, the next save turns it True. It runs before Function lake exists, as the cases before it do.
  - name: issue1233-failing-saves-show — a Lake whose catalog saves are refused reports it, and reports the next good save
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl apply -f /opt/lane/lake-saves-refused.yaml >/dev/null && echo APPLIED'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual APPLIED
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"CREATE TABLE IF NOT EXISTS lakehouse.issue1233_refused AS SELECT 1233 AS n"}}'
        retry: 30
        delay: 2
        info: "a commit while the saves are refused is an error (ADR-0279) → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldNotEqual 200
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get lake lake -n default -o json | python3 -c "import sys,json
          s=json.load(sys.stdin)[\"status\"]
          c=next((c for c in s.get(\"conditions\",[]) if c[\"type\"]==\"CatalogSaved\"),{})
          print(c.get(\"status\",\"\"),c.get(\"reason\",\"\"),s.get(\"phase\",\"\"),c.get(\"message\",\"\"))"'
        retry: 30
        delay: 2
        info: "CatalogSaved while the saves are refused → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldMatchRegex "^False SavesFailing Ready failing since [0-9]"
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT n FROM lakehouse.issue1233_refused"}}'
        info: "a query after the unsaved commit is an error too (ADR-0279) → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldNotEqual 200
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sudo journalctl -u funcd-demo --no-pager | grep "msg=\"engine output\"" | grep -q "catalog checkpoint failed" && echo LOGGED'
        info: "the engine's failed save in the daemon's journal → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldEqual LOGGED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl apply -f /opt/lane/lake-redeploy.yaml >/dev/null && echo APPLIED'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual APPLIED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get lake lake -n default -o json | python3 -c "import sys,json
          s=json.load(sys.stdin)[\"status\"]
          c=next((c for c in s.get(\"conditions\",[]) if c[\"type\"]==\"CatalogSaved\"),{})
          print(c.get(\"status\",\"\"),c.get(\"reason\",\"\"),s.get(\"phase\",\"\"),c.get(\"message\",\"\"))"'
        retry: 60
        delay: 2
        info: "CatalogSaved once the prefix is the Lake's again → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldMatchRegex "^True Saved Ready saved [0-9]"

  # ADR-0152: a Function and a Lake share the name `lake`; each reconciler manages only its own kind's workers.
  - name: same-name-function-and-lake-stay-ready — Function lake deploys and scales beside Lake lake, which keeps its engine
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            pid=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "\$1==\"lake-r0\"{print \$2}")
            [ -n "$pid" ] || exit 1
            echo "$pid" > /tmp/lake-engine-pid
            sed -e "s/^  name: lake-reader/  name: lake/" /opt/lane/consumer.yaml > /tmp/lake-function.yaml
            printf "    blob:\n      - alias: gold\n        bucket: lakehouse\n        prefix: gold\n  buckets:\n    - ref: lakehouse\n" >> /tmp/lake-function.yaml
            funcdctl apply -f /tmp/lake-function.yaml >/dev/null
            echo "ENGINE_PID=$(cat /tmp/lake-engine-pid)"'
        info: "applied Function lake → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            fn=$(funcdctl get function lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            [ "$fn" = Ready ] || exit 1
            sed -e "s/^  replicas: 1/  replicas: 2/" /tmp/lake-function.yaml > /tmp/lake-function-2.yaml
            funcdctl apply -f /tmp/lake-function-2.yaml >/dev/null
            echo "FUNCTION=$fn"'
        retry: 60
        delay: 2
        info: "Function lake → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FUNCTION=Ready"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            label() { sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default containers info "$1" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"Labels\"].get(\"funcd/owner-kind\",\"\"))"; }
            phase() { funcdctl get "$1" "$2" -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])"; }
            fn=$(funcdctl get function lake -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];print(s[\"phase\"],s.get(\"replicas\",0))")
            pid=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "\$1==\"lake-r0\"{print \$2}")
            [ "$pid" = "$(cat /tmp/lake-engine-pid)" ] && same=yes || same=no
            echo "FUNCTION=$fn LAKE=$(phase lake lake) ENGINE_SAME=$same ENGINE_LABEL=$(label lake-r0) FUNCTION_LABEL=$(label lake-2.r0)"'
        retry: 60
        delay: 2
        info: "after scaling Function lake → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FUNCTION=Ready 2"
          - result.systemout ShouldContainSubstring "LAKE=Ready"
          - result.systemout ShouldContainSubstring "ENGINE_SAME=yes"
          - result.systemout ShouldContainSubstring "ENGINE_LABEL=Lake"
          - result.systemout ShouldContainSubstring "FUNCTION_LABEL=Function"
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT 42 AS answer"}}'
        retry: 20
        delay: 2
        info: "lake-reader beside Function lake → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[42]]"
      # ADR-0275: the prefix's owner is Lake lake by kind, so Function lake does not take its write: a commit made beside
      # it survives the engine's replacement (a spec change back to lake.yaml's 4Gi).
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sudo /var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default \
              task ls | awk "\$1==\"lake-r0\" && \$3==\"RUNNING\" {print \$2}"'
        info: "the engine beside Function lake → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotBeEmpty
        vars:
          samenamepid:
            from: result.systemout
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            set -e
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            curl -sf -m 30 -X POST -H "content-type: application/json" \
              --data "{\"data\":{\"sql\":\"CREATE TABLE lakehouse.issue1231_samename AS SELECT 1231 AS n\"}}" \
              http://127.0.0.1:8081/function/lake-reader >/dev/null
            funcdctl apply -f /opt/lane/lake.yaml >/dev/null && echo COMMITTED_AND_APPLIED'
        info: "a commit beside Function lake, then the redeploy → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual COMMITTED_AND_APPLIED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            pid=$(sudo /var/lib/funcd/bin/ctr --address /var/lib/funcd/data/containerd/containerd.sock -n funcd-default \
              task ls | awk "\$1==\"lake-r0\" && \$3==\"RUNNING\" {print \$2}")
            phase=$(funcdctl get lake lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            old=$(printf %s "{{.samenamepid}}" | tr -d "[:space:]")
            [ -n "$old" ] && [ -n "$pid" ] && [ "$pid" != "$old" ] && [ "$phase" = Ready ] && echo "REPLACED $old -> $pid"'
        retry: 60
        delay: 1
        info: "the engine after the redeploy → {{.result.systemout}}"
        assertions:
          - result.systemout ShouldContainSubstring REPLACED
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT n FROM lakehouse.issue1231_samename"}}'
        retry: 20
        delay: 2
        info: "the commit made beside Function lake, from the new engine → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[1231]]"

  # ADR-0162: a deleted lake's proxy listener stays bound while lake-reader binds it, so the re-applied lake
  # serves on the same URL and the consumer's worker is not re-created.
  - name: lake-recreate-keeps-url — a deleted and re-applied Lake keeps its endpoint, and lake-reader keeps its worker
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            funcdctl get lake lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"endpoint\"])" > /tmp/lake-endpoint-recreate
            sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "index(\$1,\"lake-reader\")==1{print \$1, \$2}" | sort > /tmp/reader-tasks-before
            [ -s /tmp/reader-tasks-before ] || exit 1
            curl -sf -m 30 -X POST -H "content-type: application/json" \
              --data "{\"data\":{\"sql\":\"CREATE TABLE lakehouse.issue1231_deleted AS SELECT 1231 AS n\"}}" \
              http://127.0.0.1:8081/function/lake-reader >/dev/null || exit 1
            funcdctl delete lake lake -n default >/dev/null
            echo "ENDPOINT=$(cat /tmp/lake-endpoint-recreate)"'
        info: "deleted Lake lake → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENDPOINT=10.63.0.1:"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get lake lake -n default >/dev/null 2>&1 && exit 1
            reason=$(funcdctl get function lake-reader -n default -o json | python3 -c "import sys,json;print(next((c.get(\"reason\",\"\") for c in json.load(sys.stdin)[\"status\"][\"conditions\"] if c[\"type\"]==\"RevisionReady\"),\"\"))")
            [ "$reason" = LakeNotReady ] || exit 1
            funcdctl apply -f /opt/lane/lake-quack-recreate.yaml >/dev/null
            echo "READER_REASON=$reason"'
        retry: 30
        delay: 2
        info: "lake gone, re-applied → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "READER_REASON=LakeNotReady"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            cs=$(funcdctl get lake lake -n default -o json)
            phase=$(echo "$cs" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            [ "$phase" = Ready ] || exit 1
            ep=$(echo "$cs" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"endpoint\"])")
            sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "index(\$1,\"lake-reader\")==1{print \$1, \$2}" | sort > /tmp/reader-tasks-after
            [ "$ep" = "$(cat /tmp/lake-endpoint-recreate)" ] && same=yes || same=no
            cmp -s /tmp/reader-tasks-before /tmp/reader-tasks-after && kept=yes || kept=no
            echo "LAKE=$phase ENDPOINT_SAME=$same READER_WORKER_KEPT=$kept ($(cat /tmp/lake-endpoint-recreate) -> $ep)"'
        retry: 60
        delay: 2
        info: "after the re-apply → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LAKE=Ready"
          - result.systemout ShouldContainSubstring "ENDPOINT_SAME=yes"
          - result.systemout ShouldContainSubstring "READER_WORKER_KEPT=yes"
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT 42 AS answer"}}'
        retry: 20
        delay: 2
        info: "lake-reader after the re-apply → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[42]]"
      # ADR-0275: the deleted Lake's engine still writes its retained prefix, so a commit made just before the delete
      # is in the catalog the Lake applied again by ref reads.
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT n FROM lakehouse.issue1231_deleted"}}'
        retry: 20
        delay: 2
        info: "the commit made just before the delete, after the re-apply → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[1231]]"

  # ADR-0162 restart-keeps-lake-port: the hard restart below also checks that lake keeps its proxy port and endpoint.
  - name: owner-kind-across-daemon-restart — after a hard daemon restart both lakes return, each on workers labelled with its own kind
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get lake lake -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];print(s[\"endpoint\"], s[\"proxyPort\"])" > /tmp/lake-port-before
            sudo kill -KILL "$(systemctl show -p MainPID --value funcd-demo)"
            echo "BEFORE=$(cat /tmp/lake-port-before)"'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "BEFORE=10.63.0.1:"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            systemctl is-active -q funcd-demo && exit 1
            sudo systemctl reset-failed funcd-demo 2>/dev/null
            sudo systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml'
        retry: 15
        delay: 2
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            label() { sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default containers info "$1" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"Labels\"].get(\"funcd/owner-kind\",\"\"))"; }
            phase() { funcdctl get "$1" "$2" -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])"; }
            port=$(funcdctl get lake lake -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];print(s[\"endpoint\"], s[\"proxyPort\"])")
            [ "$port" = "$(cat /tmp/lake-port-before)" ] && same=yes || same=no
            echo "FUNCTION=$(phase function lake) LAKE=$(phase lake lake) ENGINE_LABEL=$(label lake-r0) FUNCTION_LABEL=$(label lake-2.r0) PORT_SAME=$same ($(cat /tmp/lake-port-before) -> $port)"'
        retry: 60
        delay: 2
        info: "after the daemon restart → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FUNCTION=Ready"
          - result.systemout ShouldContainSubstring "LAKE=Ready"
          - result.systemout ShouldContainSubstring "PORT_SAME=yes"
          - result.systemout ShouldContainSubstring "ENGINE_LABEL=Lake"
          - result.systemout ShouldContainSubstring "FUNCTION_LABEL=Function"
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT 42 AS answer"}}'
        retry: 30
        delay: 2
        info: "lake-reader after the daemon restart → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[42]]"

  # ADR-0179: a container from before the change is attached under <ns>-<name>-r<replica>; the old ID of engine c in
  # namespace a-b is a-b-c-r0. The step plants one (labels as Create sets them, no revision) with the netns already
  # gone, as discard sees it, then a hard restart's boot sweep (ADR-0167) discards the container.
  - name: leftover-old-form-attachment-released — the boot sweep releases an attachment left under the old CNI ID form
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            set -e
            sock=/var/lib/funcd/data/containerd/containerd.sock
            sudo mkdir -p /tmp/leftover-rootfs
            sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-a-b containers create --rootfs \
              --label funcd/namespace=a-b --label funcd/name=c --label funcd/replica=0 /tmp/leftover-rootfs c-r0
            sudo ip netns add cni-leftover
            sudo /mnt/funcd-deps/cniadd /opt/cni/bin /var/lib/funcd/data/cni a-b-c-r0 /var/run/netns/cni-leftover
            sudo ip netns delete cni-leftover
            echo "LEASES=$(sudo grep -rlF a-b-c-r0 /var/lib/cni/networks/funcd | wc -l) RESULTS=$(sudo ls /var/lib/cni/results | grep -cF -- -a-b-c-r0-)"'
        info: "planted → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LEASES=1 RESULTS=2"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sudo kill -KILL "$(systemctl show -p MainPID --value funcd-demo)"'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            systemctl is-active -q funcd-demo && exit 1
            sudo systemctl reset-failed funcd-demo 2>/dev/null
            sudo systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml'
        retry: 15
        delay: 2
        assertions:
          - result.code ShouldEqual 0
      # the control plane serves once funcd.New runs, after the boot sweep
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} funcdctl get lake lake -n default >/dev/null || exit 1
            sock=/var/lib/funcd/data/containerd/containerd.sock
            ctr=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-a-b containers ls -q | grep -cx c-r0)
            echo "CONTAINER=$ctr LEASES=$(sudo grep -rlF a-b-c-r0 /var/lib/cni/networks/funcd | wc -l) RESULTS=$(sudo ls /var/lib/cni/results | grep -cF -- -a-b-c-r0-)"'
        retry: 30
        delay: 2
        info: "after the boot sweep → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CONTAINER=0 LEASES=0 RESULTS=0"

  # ADR-0179: engines c in a-b and b-c in a both had the CNI ID a-b-c-r0 before the change. Each engine prints
  # phase/quack status/the CNI ID holding its address's host-local lease/its address.
  - name: unrevisioned-cni-ids-distinct-across-namespaces — engines c in a-b and b-c in a each hold their own attachment, and stopping one leaves the other serving
    steps:
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} \
            funcdctl apply -f /opt/lane/cni-engines.yaml
        retry: 10
        delay: 2
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            engine() {
              read -r phase ep < <(funcdctl get lake $2 -n $1 -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];print(s[\"phase\"],s.get(\"endpoint\",\"-\"))")
              code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "http://$ep/")
              pid=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-$1 task ls | awk "\$1==\"$2-r0\"{print \$2}")
              ip=$(sudo nsenter -t "$pid" -n ip -4 -o addr show scope global | awk "{print \$4}" | cut -d/ -f1)
              echo "$phase/$code/$(sudo head -n1 /var/lib/cni/networks/funcd/$ip 2>/dev/null | tr -d "\r")/$ip"
            }
            c=$(engine a-b c); bc=$(engine a b-c)
            [ -n "${c##*/}" ] && [ "${c##*/}" != "${bc##*/}" ] && ips=distinct || ips=shared
            echo "ENGINE_C=$c ENGINE_BC=$bc IPS=$ips"'
        retry: 90
        delay: 2
        info: "engines → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENGINE_C=Ready/200/a-b_c-r0/"
          - result.systemout ShouldContainSubstring "ENGINE_BC=Ready/200/a_b-c-r0/"
          - result.systemout ShouldContainSubstring "IPS=distinct"
      - type: exec
        script: |
          limactl shell {{.vm}} -- sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} \
            funcdctl delete lake c -n a-b
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            engine() {
              read -r phase ep < <(funcdctl get lake $2 -n $1 -o json | python3 -c "import sys,json;s=json.load(sys.stdin)[\"status\"];print(s[\"phase\"],s.get(\"endpoint\",\"-\"))")
              code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "http://$ep/")
              pid=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-$1 task ls | awk "\$1==\"$2-r0\"{print \$2}")
              ip=$(sudo nsenter -t "$pid" -n ip -4 -o addr show scope global | awk "{print \$4}" | cut -d/ -f1)
              echo "$phase/$code/$(sudo head -n1 /var/lib/cni/networks/funcd/$ip 2>/dev/null | tr -d "\r")/$ip"
            }
            [ "$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-a-b containers ls -q | grep -cx c-r0)" = 0 ] || exit 1
            echo "C_LEASES=$(sudo grep -rlF a-b_c-r0 /var/lib/cni/networks/funcd | wc -l) ENGINE_BC=$(engine a b-c)"'
        retry: 30
        delay: 2
        info: "after stopping c → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "C_LEASES=0 ENGINE_BC=Ready/200/a_b-c-r0/"

  # ADR-0264: the engine sees its own cgroup, so DuckDB sizes itself to its spec.resources (80% of 1 GiB, 2 threads);
  # lake-1gi.yaml binds no ConfigMap, so no tuning key sets it.
  - name: engine-sizes-to-its-limit — Lake lake re-created at 1Gi sizes DuckDB to its limit
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl delete lake lake -n default >/dev/null && echo DELETED'
        info: "delete Lake lake → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual DELETED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get lake lake -n default >/dev/null 2>&1 && exit 1
            funcdctl apply -f /opt/lane/lake-1gi.yaml >/dev/null && echo APPLIED'
        retry: 30
        delay: 2
        info: "re-apply at 1Gi → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual APPLIED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            phase=$(funcdctl get lake lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            [ "$phase" = Ready ] || exit 1
            pid=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "\$1==\"lake-r0\"{print \$2}")
            [ -n "$pid" ] || exit 1
            cg=/sys/fs/cgroup$(sudo awk -F: "\$1==\"0\"{print \$3}" /proc/$pid/cgroup)
            echo "LAKE=$phase IDLE_RSS_KB=$(ps -o rss= -p $pid | tr -d " ") MEMORY_CURRENT=$(sudo cat $cg/memory.current) MEMORY_MAX=$(sudo cat $cg/memory.max)"'
        retry: 60
        delay: 2
        info: "the idle 1Gi engine → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LAKE=Ready"
          - result.systemout ShouldContainSubstring "MEMORY_MAX=1073741824"
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT current_setting(''memory_limit''), current_setting(''threads'')"}}'
        retry: 20
        delay: 2
        info: "the engine's memory_limit and threads → {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "819.1 MiB"
          - result.body ShouldContainSubstring "2]]"

  # ADR-0264: a query larger than the engine's memory (experiment 0006's window query, scaled past 819 MiB) spills to
  # its temp directory and returns its rows; the Lake stays Ready and its cgroup records no OOM kill.
  - name: engine-spills-under-its-limit — the 1Gi engine spills a query larger than its memory and keeps serving
    steps:
      - type: http
        method: POST
        url: "http://127.0.0.1:8081/function/lake-reader"
        headers:
          content-type: application/json
        body: '{"data":{"sql":"SELECT max(x) FROM (SELECT i, lead(i) OVER (ORDER BY hash(i)) AS x FROM range(40000000) t(i))"}}'
        info: "a query larger than its memory, on the 1Gi engine → {{.result.statuscode}} {{.result.body}}"
        assertions:
          - result.statuscode ShouldEqual 200
          - result.body ShouldContainSubstring "[[39999999]]"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sock=/var/lib/funcd/data/containerd/containerd.sock
            phase=$(funcdctl get lake lake -n default -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[\"status\"][\"phase\"])")
            pid=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "\$1==\"lake-r0\"{print \$2}")
            cg=/sys/fs/cgroup$(sudo awk -F: "\$1==\"0\"{print \$3}" /proc/$pid/cgroup)
            echo "LAKE=$phase OOM_KILL=$(sudo awk "\$1==\"oom_kill\"{print \$2}" $cg/memory.events) MEMORY_PEAK=$(sudo cat $cg/memory.peak 2>/dev/null) KERNEL_OOM=$(sudo dmesg | grep -c oom-kill:)"
            sudo dmesg | grep oom-kill: | tail -1 | cut -c1-240'
        info: "the engine after the query → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LAKE=Ready OOM_KILL=0"

  # ADR-0264: inside a worker, /proc/self/cgroup is its cgroup namespace's root, /sys/fs/cgroup holds its own limits
  # (max without one) and refuses a write.
  - name: worker-sees-only-its-cgroup — the engine reads its limits and lake-reader reads max, read-only
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sock=/var/lib/funcd/data/containerd/containerd.sock
            sudo timeout 60 /var/lib/funcd/bin/ctr --address $sock -n funcd-default task exec --exec-id cgroup-view lake-r0 \
              /usr/local/bin/python3.14 -c "$(cat /opt/lane/cgroup-view.py)" 2>&1 | tail -1'
        info: "the 1Gi engine's cgroup view → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CGROUP=0::/ MEMORY_MAX=1073741824 CPU_MAX=200000/100000 WRITE=refused"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            sock=/var/lib/funcd/data/containerd/containerd.sock
            task=$(sudo /var/lib/funcd/bin/ctr --address $sock -n funcd-default task ls | awk "index(\$1,\"lake-reader\")==1{print \$1; exit}")
            sudo timeout 60 /var/lib/funcd/bin/ctr --address $sock -n funcd-default task exec --exec-id cgroup-view "$task" \
              /usr/local/bin/python3.14 -c "$(cat /opt/lane/cgroup-view.py)" 2>&1 | tail -1'
        info: "lake-reader's cgroup view, with no limit → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CGROUP=0::/ MEMORY_MAX=max CPU_MAX=max/100000 WRITE=refused"

  # Last: the probe leaves a query hanging on the dropped connection, so no later step shares the engine with it.
  - name: engine-fenced — a query that points an S3 secret at the VM's own address opens no connection there (ADR-0269)
    steps:
      - type: exec
        script: limactl shell --workdir / {{.vm}} sudo sh /opt/lane/fence-probe.sh
        info: "the fence probe → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "HITS=0"
          - result.systemout ShouldNotContainSubstring "Parser Error"
