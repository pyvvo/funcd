# Venom e2e suite for the addon-infrastack containerd lane: pyvvo/funcd-addons' InfraStack add-on on a real funcd. An
# admin registers the add-on's Addon, which ships opentofu1, the OpenTofu runtime, and the Engineless kind InfraStack
# (ADR-0344, ADR-0345). The add-on's plugin, funcdctl infra, pushes the example modules random-stack and token-stack
# from the VM, running OpenTofu on Docker in the runtime's image, with a contract made from each module's variables
# (ADR-0355). A developer applies the example random-stack, whose Job's image is the random-stack module, and whose
# reconciler Function binds that Job (ADR-0349): a run whose variables break the contract is refused; the stack's run
# previews its plan (ADR-0348), waits for an approval, applies it with the state in a Bucket prefix through the S3
# gateway, writes both outputs into the Secret the Job owns, which a Function reads at each call, and the stack turns
# Ready (ADR-0356); deleted, it is held until its destroy run, approved too, succeeded (ADR-0345 Decision 6). Then the
# example token-stack, whose module's variable token is sensitive, takes it from a Secret its Job binds.
#
# The ADRs' outputs are frp-bunny's: random-stack's plain output name stands in for pullzone_host, and its sensitive
# output token for FRP_TOKEN.
#
# The lane builds the runtime's image from the add-on's runtime/ and stages it as opentofu.tar: e2e/laneregistry
# serves it in the VM, and the Addon and the plugin take it from there.
name: addon-infrastack — InfraStacks applied and destroyed through approved OpenTofu runs of pushed modules (containerd lane)

vars:
  devtoken: addon-infrastack-lane-developer
  admintoken: addon-infrastack-lane-admin
  registry: oci-layout:///mnt/funcd-deps/registry

testcases:
  - name: the OpenTofu runtime's image that the lane built comes from the lane's registry, for the Addon and the plugin
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo bash -c '
            set -e
            systemctl stop lane-registry 2>/dev/null || true
            systemctl reset-failed lane-registry 2>/dev/null || true
            rm -f /opt/lane/opentofu.digest
            systemd-run --unit lane-registry /mnt/funcd-deps/laneregistry /opt/lane/opentofu.tar funcd/opentofu \
              127.0.0.1:5443 /opt/lane/registry.crt /opt/lane/opentofu.digest
            for i in $(seq 120); do [ -s /opt/lane/opentofu.digest ] && break; sleep 1; done
            install -m 0644 /opt/lane/registry.crt /usr/local/share/ca-certificates/funcd-lane-registry.crt
            update-ca-certificates >/dev/null
            curl -sf -o /dev/null https://127.0.0.1:5443/v2/
            echo "127.0.0.1:5443/funcd/opentofu@$(cat /opt/lane/opentofu.digest)" > /opt/lane/opentofu.image
            sed -i -E "s#ghcr.io/pyvvo/funcd-opentofu@sha256:[A-Za-z0-9-]+#$(cat /opt/lane/opentofu.image)#" /opt/lane/addon.yaml
            systemctl stop funcd-demo
            systemctl reset-failed funcd-demo 2>/dev/null || true
            systemd-run --unit funcd-demo -p KillMode=mixed -p TimeoutStopSec=45 /usr/local/bin/funcd --config /opt/lane/funcdconfig.yaml
            curl -s --retry-connrefused --retry 30 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz
            echo "IMAGE=$(cat /opt/lane/opentofu.image)"'
        info: "image → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring IMAGE=127.0.0.1:5443/funcd/opentofu@sha256

  - name: the add-on's plugin runs in the VM on Docker and pushes random-stack and token-stack, each an index of a linux/amd64 and a linux/arm64 bundle
    steps:
      # Debian's docker.io, from the snapshot that scripts/lima-apt-snapshot.sh points apt at; funcdctl hands the plugin
      # FUNCDCTL, its own path (ADR-0319 Decision 4).
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo bash -c '
            set -e
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends docker.io=20.10.24+dfsg1-1+deb12u1+b6 >/dev/null
            install -m 0755 /opt/lane/funcdctl-infra /usr/local/bin/funcdctl-infra
            docker info >/dev/null
            echo "ENGINE=$(docker --version) PYTHON=$(python3 --version)"'
        info: "engine → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENGINE=Docker version"
      - type: exec
        script: |
          limactl shell --workdir /opt/lane {{.vm}} sudo bash -c '
            set -e
            export INFRASTACK_OPENTOFU_IMAGE=$(cat /opt/lane/opentofu.image)
            for m in random-stack token-stack; do
              ref=$(funcdctl infra push "$m" "{{.registry}}:$m")
              echo "$ref"
              python3 -c "import sys,json;i=json.load(open(\"/mnt/funcd-deps/registry/blobs/sha256/\"+sys.argv[1].split(\":\")[1]));print(sys.argv[2]+\" PLATFORMS=\"+\",\".join(sorted(m[\"platform\"][\"os\"]+\"/\"+m[\"platform\"][\"architecture\"] for m in i[\"manifests\"])))" "${ref##*@}" "$m"
            done'
        retry: 2
        delay: 5
        info: "pushes → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring oci-layout:///mnt/funcd-deps/registry:random-stack@sha256
          - result.systemout ShouldContainSubstring oci-layout:///mnt/funcd-deps/registry:token-stack@sha256
          - result.systemout ShouldContainSubstring "random-stack PLATFORMS=linux/amd64,linux/arm64"
          - result.systemout ShouldContainSubstring "token-stack PLATFORMS=linux/amd64,linux/arm64"

  # The stack's own document is applied once its Job holds the module's contract: a run started before that is checked
  # at its start, not at its creation (ADR-0347 Decision 3), so infra-variables-refused would see no 422.
  - name: an admin registers the InfraStack Addon, a developer applies random-stack's Job, the reconciler and the reader, and the Job takes the plugin's contract
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} \
            funcdctl apply -f /opt/lane/addon.yaml
        info: "admin apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied Addon/infrastack"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} bash -c '
            set -e
            sed -e "s#registry.example.com/random-stack:0.1.0#{{.registry}}:random-stack#" \
              -e "s#registry.example.com/infrastack-reconciler:0.1.0#{{.registry}}:infrastack-reconciler#" \
              /opt/lane/random-stack.yaml > /opt/lane/random-stack.lane.yaml
            python3 -c "import sys,yaml;d=[x for x in yaml.safe_load_all(open(sys.argv[1])) if x];[yaml.safe_dump_all([x for x in d if (x[\"kind\"]==\"InfraStack\")==s],open(p,\"w\"),sort_keys=False) for s,p in ((False,sys.argv[2]),(True,sys.argv[3]))]" \
              /opt/lane/random-stack.lane.yaml /opt/lane/random-stack.objects.yaml /opt/lane/random-stack.stack.yaml
            funcdctl apply -f /opt/lane/random-stack.objects.yaml
            sed -e "s#registry.example.com/random-stack-reader:0.1.0#{{.registry}}:random-stack-reader#" \
              /opt/lane/random-stack-reader.yaml | funcdctl apply -f -'
        retry: 15
        delay: 2
        info: "developer apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied Job/random-stack"
          - result.systemout ShouldContainSubstring "applied Function/random-stack-reader"
          - result.systemout ShouldNotContainSubstring InfraStack
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get job random-stack -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin).get(\"status\",{});v=(((s.get(\"contract\") or {}).get(\"input\") or {}).get(\"properties\") or {}).get(\"variables\") or {};print(\"PHASE=%s,VARIABLES=%s,REQUIRED=%s\" % (s.get(\"phase\"),\",\".join(sorted(v.get(\"properties\") or {})),\",\".join(v.get(\"required\") or [])))"'
        retry: 60
        delay: 2
        info: "the Job → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring PHASE=Ready,VARIABLES=prefix,REQUIRED=prefix

  - name: "scenario infra-variables-refused: random-stack's runs with prefx a, then prefix 3, answer 422 naming the path, no run exists, and the stack shows InvalidVariables"
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sed "s#^\( *\)prefix: example\$#\1prefx: a#" /opt/lane/random-stack.stack.yaml | funcdctl apply -f -'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied InfraStack/random-stack"
      # The reconciler's message holds the start's answer: its status and funcd's ContractViolation, whose details name
      # each path (ADR-0349 Decision 4).
      - type: exec
        script: &refused |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get InfraStack random-stack -n default -o json | python3 -c "import sys,json;c=([c for c in json.load(sys.stdin).get(\"status\",{}).get(\"conditions\",[]) if c[\"type\"]==\"Ready\"] or [{}])[0];m=c.get(\"message\",\"\");i=m.find(\" failed: \");code=m[i+9:i+12] if i>=0 else \"\";d=json.loads(m[i+13:]) if code==\"422\" else {};print(\"REASON=%s RUN=%s STATUS=%s PATHS=[%s]\" % (c.get(\"reason\"),(m.split() or [\"\",\"\"])[1] if m.startswith(\"run \") else \"\",code,\",\".join(x[\"path\"] for x in d.get(\"details\",[]))))"
            funcdctl job runs random-stack -n default -o json | python3 -c "import sys,json;print(\"RUNS=%d\" % len(json.load(sys.stdin)))"'
        retry: 30
        delay: 2
        info: "stack → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring REASON=InvalidVariables
          - result.systemout ShouldContainSubstring RUN=random-stack-g1-
          - result.systemout ShouldContainSubstring STATUS=422
          - result.systemout ShouldContainSubstring PATHS=[/variables/prefix,/variables/prefx]
          - result.systemout ShouldContainSubstring RUNS=0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sed "s#^\( *\)prefix: example\$#\1prefix: 3#" /opt/lane/random-stack.stack.yaml | funcdctl apply -f -'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied InfraStack/random-stack"
      - type: exec
        script: *refused
        retry: 30
        delay: 2
        info: "stack → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring REASON=InvalidVariables
          - result.systemout ShouldContainSubstring RUN=random-stack-g2-
          - result.systemout ShouldContainSubstring STATUS=422
          - result.systemout ShouldContainSubstring PATHS=[/variables/prefix]
          - result.systemout ShouldContainSubstring RUNS=0

  - name: "scenario stack-outputs-reach-function: random-stack's approved apply answers its plain output, and the reader reads both outputs from the Secret the Job owns"
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl apply -f /opt/lane/random-stack.stack.yaml'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied InfraStack/random-stack"
      # The add-on's resync is a minute, and a run awaiting approval is no run's end (ADR-0345 Decision 4).
      - type: exec
        script: &stack |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            st=$(funcdctl get InfraStack random-stack -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin).get(\"status\",{});r=([c for c in s.get(\"conditions\",[]) if c[\"type\"]==\"Ready\"] or [{}])[0];print(\"PHASE=\"+s.get(\"phase\",\"\")+\",REASON=\"+str(r.get(\"reason\",\"\"))+\",MESSAGE=\"+r.get(\"message\",\"\"))")
            echo "$st"
            case "$st" in *Failed*) run=$(echo "$st" | grep -o "random-stack-[a-z0-9-]*" | head -1); funcdctl job logs "$run" -n default 2>&1 | tail -25;; esac'
        retry: 120
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring REASON=AwaitingApproval
      - type: exec
        script: &approve |
          limactl shell --workdir / {{.vm}} bash -lc '
            set -e
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            run=$(funcdctl job runs random-stack -n default -o json | python3 -c "import sys,json;print([r[\"metadata\"][\"name\"] for r in json.load(sys.stdin) if r.get(\"status\",{}).get(\"phase\")==\"AwaitingApproval\"][0])")
            funcdctl get jobrun "$run" -n default -o json > /tmp/run.json
            python3 -c "import json;d=json.load(open(\"/tmp/run.json\"))[\"status\"][\"preview\"][\"document\"];print(\"RUN=$run,ACTION=%s,ADD=%d,DESTROY=%d\" % (d[\"action\"],d[\"add\"],d[\"destroy\"]))"
            funcdctl job approve "$run" -n default --digest "$(python3 -c "import json;print(json.load(open(\"/tmp/run.json\"))[\"status\"][\"preview\"][\"digest\"])")" >/dev/null
            echo APPROVED'
        info: "approval → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring ACTION=apply,ADD=3,DESTROY=0
          - result.systemout ShouldContainSubstring APPROVED
      - type: exec
        script: *stack
        retry: 120
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith PHASE=Ready,
      - type: exec
        script: &result |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl job runs random-stack -n default -o json | python3 -c "import sys,json;r=([r for r in json.load(sys.stdin) if r.get(\"status\",{}).get(\"phase\")==\"Succeeded\"] or [{}])[0];res=r.get(\"status\",{}).get(\"result\") or {};o=res.get(\"outputs\") or {};print(\"KEYS=%s OUTPUTS=%s NAME=%s\" % (\",\".join(sorted(res)),\",\".join(sorted(o)),o.get(\"name\")))"'
        info: "the run's result → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "KEYS=outputs OUTPUTS=name NAME=example-"
      # The reader answers only the sha256 of the sensitive output, which the admin's read of the Secret checks.
      - type: exec
        script: &reader |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} bash -c '
            secret=$(funcdctl get secret random-stack-outputs -n default -o json)
            answer=$(curl -s -X POST -H "content-type: application/json" -d "{\"data\":null}" http://127.0.0.1:8081/function/random-stack-reader)
            python3 -c "import sys,json,base64,hashlib;d=json.loads(sys.argv[1])[\"spec\"][\"data\"];a=json.loads(sys.argv[2]);v=lambda k:base64.b64decode(d.get(k,\"\")).decode();print(\"READ_NAME=%s NAME_MATCH=%s TOKEN_MATCH=%s TOKEN_LEN=%d\" % (a.get(\"name\"),a.get(\"name\")==v(\"name\"),a.get(\"tokenSha256\")==hashlib.sha256(v(\"token\").encode()).hexdigest(),len(v(\"token\"))))" "$secret" "$answer"'
        retry: 15
        delay: 2
        info: "the reader → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "READ_NAME=example-"
          - result.systemout ShouldContainSubstring "NAME_MATCH=True TOKEN_MATCH=True TOKEN_LEN=24"

  - name: "scenario stack-outputs-never-shown: random-stack's sensitive token is in no run status, preview document, log line or funcdctl infra outputs line"
    steps:
      # Each count is the lines that hold the token; the run's status and the plugin's table show the plain output.
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.admintoken}} bash -c '
            tok=$(funcdctl get secret random-stack-outputs -n default -o json | python3 -c "import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)[\"spec\"][\"data\"][\"token\"]).decode())")
            [ ${#tok} -eq 24 ] || { echo "TOKEN_LEN=${#tok}"; exit 1; }
            run=$(funcdctl job runs random-stack -n default -o json | python3 -c "import sys,json;print([r[\"metadata\"][\"name\"] for r in json.load(sys.stdin) if r.get(\"status\",{}).get(\"phase\")==\"Succeeded\"][0])")
            d=/tmp/never-shown; rm -rf $d; mkdir -p $d
            funcdctl get jobrun "$run" -n default -o json > $d/status.json
            python3 -c "import sys,json;print(json.dumps(json.load(open(sys.argv[1]))[\"status\"][\"preview\"]))" $d/status.json > $d/preview.json
            funcdctl job logs "$run" -n default > $d/logs.txt 2>&1
            funcdctl infra outputs random-stack -n default > $d/outputs.txt 2>&1
            funcdctl infra outputs random-stack -n default -o json > $d/outputs.json 2>&1
            journalctl -u funcd-demo --no-pager > $d/journal.txt 2>&1
            echo "RUN=$run"
            for f in status.json preview.json logs.txt outputs.txt outputs.json journal.txt; do printf "%s=%s " "$f" "$(grep -cF -- "$tok" $d/$f)"; done
            echo
            grep -q "Apply complete" $d/logs.txt && echo LOGS_HOLD_THE_APPLY
            grep -q "\"name\": \"example-" $d/status.json && echo STATUS_HOLDS_THE_PLAIN_OUTPUT
            grep -E "^(name|token) " $d/outputs.txt | tr -s " " | paste -sd ";" - | sed -E "s/^/TABLE=/; s/example-[a-z0-9-]+/example-…/"
            python3 -c "import sys,json;o=json.load(open(sys.argv[1]));print(\"JSON_OUTPUTS=%s JSON_SENSITIVE=%s\" % (\",\".join(sorted(o[\"outputs\"])),\",\".join(o[\"sensitive\"])))" $d/outputs.json'
        retry: 10
        delay: 3
        info: "never shown → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "status.json=0 preview.json=0 logs.txt=0 outputs.txt=0 outputs.json=0 journal.txt=0"
          - result.systemout ShouldContainSubstring LOGS_HOLD_THE_APPLY
          - result.systemout ShouldContainSubstring STATUS_HOLDS_THE_PLAIN_OUTPUT
          - result.systemout ShouldContainSubstring "TABLE=name example-…;token (sensitive)"
          - result.systemout ShouldContainSubstring "JSON_OUTPUTS=name JSON_SENSITIVE=token"

  - name: "scenario stack-output-changed: random-stack's next apply changes the plain output name, and the reader's next call returns it with the same revision"
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get function random-stack-reader -n default -o json | python3 -c "import sys,json;f=json.load(sys.stdin);print(\"GENERATION=%s REVISION=%s\" % (f[\"metadata\"][\"generation\"],f[\"status\"][\"currentRevision\"]))" | tee /tmp/reader.revision
            sed "s#^\( *\)prefix: example\$#\1prefix: changed#" /opt/lane/random-stack.stack.yaml | funcdctl apply -f -'
        info: "the reader, then the apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring REVISION=random-stack-reader
          - result.systemout ShouldContainSubstring "applied InfraStack/random-stack"
      - type: exec
        script: *stack
        retry: 120
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring REASON=AwaitingApproval
      # A new prefix replaces random_pet.name, and null_resource.marker with it.
      - type: exec
        script: *approve
        info: "approval → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring ACTION=apply,ADD=0,DESTROY=0
          - result.systemout ShouldContainSubstring APPROVED
      - type: exec
        script: *stack
        retry: 120
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith PHASE=Ready,
      - type: exec
        script: *result
        info: "the run's result → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "KEYS=outputs OUTPUTS=name NAME=changed-"
      - type: exec
        script: *reader
        retry: 15
        delay: 2
        info: "the reader → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "READ_NAME=changed-"
          - result.systemout ShouldContainSubstring "NAME_MATCH=True TOKEN_MATCH=True TOKEN_LEN=24"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            now=$(funcdctl get function random-stack-reader -n default -o json | python3 -c "import sys,json;f=json.load(sys.stdin);print(\"GENERATION=%s REVISION=%s\" % (f[\"metadata\"][\"generation\"],f[\"status\"][\"currentRevision\"]))")
            [ "$now" = "$(cat /tmp/reader.revision)" ] && echo "SAME_REVISION $now" || echo "NEW_REVISION $(cat /tmp/reader.revision) then $now"'
        info: "the reader's revision → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring SAME_REVISION

  - name: the deleted stack is held, its destroy run waits for an approval, and the stack goes once it succeeded
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} \
            funcdctl delete InfraStack random-stack -n default
        info: "delete → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "deleting InfraStack/random-stack"
      - type: exec
        script: *stack
        retry: 120
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "which destroys random-stack, awaits approval"
      - type: exec
        script: *approve
        info: "approval → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring ACTION=destroy,ADD=0,DESTROY=3
          - result.systemout ShouldContainSubstring APPROVED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get InfraStack random-stack -n default >/dev/null 2>&1 || echo GONE'
        retry: 90
        delay: 2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring GONE

  # token-stack's runs are read from the Job: a run that ends calls the reconciler at once, but the stack shows a run
  # awaiting approval only at its next resync (ADR-0345 Decision 4).
  - name: "scenario infra-sensitive-variable-refused: a token-stack run that sets its sensitive variable token answers 422, and with TF_VAR_token in a Secret its Job binds, it plans"
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} bash -c '
            set -e
            sed -e "s#registry.example.com/token-stack:0.1.0#{{.registry}}:token-stack#" \
              -e "s#registry.example.com/infrastack-reconciler:0.1.0#{{.registry}}:infrastack-reconciler#" \
              /opt/lane/token-stack.yaml > /opt/lane/token-stack.lane.yaml
            python3 -c "import sys,yaml;d=[x for x in yaml.safe_load_all(open(sys.argv[1])) if x];[yaml.safe_dump_all([x for x in d if (x[\"kind\"]==\"InfraStack\")==s],open(p,\"w\"),sort_keys=False) for s,p in ((False,sys.argv[2]),(True,sys.argv[3]))]" \
              /opt/lane/token-stack.lane.yaml /opt/lane/token-stack.objects.yaml /opt/lane/token-stack.stack.yaml
            funcdctl apply -f /opt/lane/token-stack.objects.yaml'
        retry: 15
        delay: 2
        info: "developer apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied Secret/token-stack-token"
          - result.systemout ShouldContainSubstring "applied Job/token-stack"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get job token-stack -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin).get(\"status\",{});v=(((s.get(\"contract\") or {}).get(\"input\") or {}).get(\"properties\") or {}).get(\"variables\") or {};print(\"PHASE=%s,VARIABLES=%s,REQUIRED=%s\" % (s.get(\"phase\"),\",\".join(sorted(v.get(\"properties\") or {})),\",\".join(v.get(\"required\") or [])))"'
        retry: 60
        delay: 2
        info: "the Job → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring PHASE=Ready,VARIABLES=prefix,REQUIRED=prefix
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            sed "s#^\( *\)prefix: example\$#&\n\1token: lane#" /opt/lane/token-stack.stack.yaml | funcdctl apply -f -'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied InfraStack/token-stack"
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get InfraStack token-stack -n default -o json | python3 -c "import sys,json;c=([c for c in json.load(sys.stdin).get(\"status\",{}).get(\"conditions\",[]) if c[\"type\"]==\"Ready\"] or [{}])[0];m=c.get(\"message\",\"\");i=m.find(\" failed: \");code=m[i+9:i+12] if i>=0 else \"\";d=json.loads(m[i+13:]) if code==\"422\" else {};print(\"REASON=%s RUN=%s STATUS=%s PATHS=[%s]\" % (c.get(\"reason\"),(m.split() or [\"\",\"\"])[1] if m.startswith(\"run \") else \"\",code,\",\".join(x[\"path\"] for x in d.get(\"details\",[]))))"
            funcdctl job runs token-stack -n default -o json | python3 -c "import sys,json;print(\"RUNS=%d\" % len(json.load(sys.stdin)))"'
        retry: 30
        delay: 2
        info: "stack → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring REASON=InvalidVariables
          - result.systemout ShouldContainSubstring RUN=token-stack-g1-
          - result.systemout ShouldContainSubstring STATUS=422
          - result.systemout ShouldContainSubstring PATHS=[/variables/token]
          - result.systemout ShouldContainSubstring RUNS=0
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl apply -f /opt/lane/token-stack.stack.yaml'
        info: "apply → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied InfraStack/token-stack"
      # The preview's plan needs token, which only TF_VAR_token of token-stack-token gives OpenTofu.
      - type: exec
        script: &tokenapprove |
          limactl shell --workdir / {{.vm}} bash -lc '
            set -e
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl job runs token-stack -n default -o json > /tmp/token-runs.json
            python3 -c "import json;print(\"RUNS \"+\" \".join(r[\"metadata\"][\"name\"]+\"=\"+r.get(\"status\",{}).get(\"phase\",\"\") for r in json.load(open(\"/tmp/token-runs.json\"))))"
            run=$(python3 -c "import json;print([r[\"metadata\"][\"name\"] for r in json.load(open(\"/tmp/token-runs.json\")) if r.get(\"status\",{}).get(\"phase\")==\"AwaitingApproval\"][0])")
            funcdctl get jobrun "$run" -n default -o json > /tmp/run.json
            python3 -c "import json;d=json.load(open(\"/tmp/run.json\"))[\"status\"][\"preview\"][\"document\"];print(\"RUN=$run,ACTION=%s,ADD=%d,DESTROY=%d\" % (d[\"action\"],d[\"add\"],d[\"destroy\"]))"
            funcdctl job approve "$run" -n default --digest "$(python3 -c "import json;print(json.load(open(\"/tmp/run.json\"))[\"status\"][\"preview\"][\"digest\"])")" >/dev/null
            echo APPROVED'
        retry: 60
        delay: 2
        info: "approval → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring RUN=token-stack-g2-
          - result.systemout ShouldContainSubstring ACTION=apply,ADD=1,DESTROY=0
          - result.systemout ShouldContainSubstring APPROVED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get InfraStack token-stack -n default -o json | python3 -c "import sys,json;s=json.load(sys.stdin).get(\"status\",{});r=([c for c in s.get(\"conditions\",[]) if c[\"type\"]==\"Ready\"] or [{}])[0];print(\"PHASE=\"+s.get(\"phase\",\"\")+\",REASON=\"+str(r.get(\"reason\",\"\"))+\",MESSAGE=\"+r.get(\"message\",\"\"))"'
        retry: 90
        delay: 2
        info: "stack → {{.result.systemout}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldStartWith PHASE=Ready,

  - name: the deleted token-stack is held until its approved destroy succeeded
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo env FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}} \
            funcdctl delete InfraStack token-stack -n default
        info: "delete → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "deleting InfraStack/token-stack"
      - type: exec
        script: *tokenapprove
        retry: 60
        delay: 2
        info: "approval → {{.result.systemout}} {{.result.systemerr}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring RUN=token-stack-d2-
          - result.systemout ShouldContainSubstring ACTION=destroy,ADD=0,DESTROY=1
          - result.systemout ShouldContainSubstring APPROVED
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} bash -lc '
            export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN={{.devtoken}}
            funcdctl get InfraStack token-stack -n default >/dev/null 2>&1 || echo GONE'
        retry: 90
        delay: 2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring GONE

  - name: the stacks' other objects, the reader and the Addon go
    steps:
      - type: exec
        script: |
          limactl shell --workdir / {{.vm}} sudo bash -c '
            export FUNCD_SERVER=http://127.0.0.1:8080
            for o in function/infrastack-reconciler function/random-stack-reader job/random-stack job/token-stack \
              secret/random-stack-outputs secret/token-stack-token configmap/random-stack-infrastack configmap/token-stack-infrastack; do
              FUNCD_TOKEN={{.devtoken}} funcdctl delete ${o%%/*} ${o#*/} -n default || true
            done
            FUNCD_TOKEN={{.admintoken}} funcdctl delete addon infrastack
            systemctl stop lane-registry 2>/dev/null || true
            if [ -f /usr/local/share/ca-certificates/funcd-lane-registry.crt ]; then
              rm -f /usr/local/share/ca-certificates/funcd-lane-registry.crt
              update-ca-certificates --fresh >/dev/null
            fi
            echo CLEANED'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring CLEANED
