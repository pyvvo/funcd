# Venom e2e suite for the KV containerd lane (ADR-0069/0076) — SPIKE evaluating OVH Venom as a
# declarative replacement for scripts/lima-kv-invoke.sh. Run host-side by `FUNCD_VENOM=1 just
# lima-example-kv` AFTER the self-deploying Lima VM is Ready; the http steps hit the VM's forwarded
# 127.0.0.1 ports, the exec step drives the (host) funcdcli against the forwarded control plane.
#
# It proves the same two properties as the bash script, but declaratively:
#   1. binding-as-read-grant — each counter reads 1→2 with NO read Policy (the spec.kv binding grants it).
#   2. fail-closed — removing the binding makes context.kv.get Forbidden (bound-only, not default-allow).
name: kv-counter binding-as-read-grant (ADR-0076, containerd lane)

vars:
  dp: http://127.0.0.1:8081   # funcd data plane, forwarded from the Lima guest

testcases:
  - name: js-counter reads 1 then 2 with no read Policy (binding grants read)
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/counter"
        headers: { content-type: application/json }
        body: '{"data":{"name":"venom"}}'
        retry: 10
        delay: 1
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.count ShouldEqual 1
      - type: http
        method: POST
        url: "{{.dp}}/function/counter"
        headers: { content-type: application/json }
        body: '{"data":{"name":"venom"}}'
        assertions:
          - result.bodyjson.count ShouldEqual 2

  - name: py-counter reads 1 then 2 with no read Policy (binding grants read)
    steps:
      - type: http
        method: POST
        url: "{{.dp}}/function/pycounter"
        headers: { content-type: application/json }
        body: '{"data":{"name":"venom"}}'
        retry: 10
        delay: 1
        assertions:
          - result.statuscode ShouldEqual 200
          - result.bodyjson.count ShouldEqual 1
      - type: http
        method: POST
        url: "{{.dp}}/function/pycounter"
        headers: { content-type: application/json }
        body: '{"data":{"name":"venom"}}'
        assertions:
          - result.bodyjson.count ShouldEqual 2

  # The fail-closed NEGATIVE, HYBRID style: the mutation runs IN the VM (co-located with the daemon, so it
  # does not race the redeploy the way a host-side funcdcli does), the assertion runs host-side. {{.vm}} and
  # {{.strip}} are injected by the recipe (--var) so no machine-specific path lives in this tracked file.
  - name: removing the spec.kv binding denies the read (fail-closed)
    steps:
      # strip spec.kv IN the VM (sudo bash -s < the strip script) and wait for the function to reconcile.
      - type: exec
        script: |
          set -eu
          limactl shell {{.vm}} -- sudo bash -s < {{.strip}}
        assertions:
          - result.code ShouldEqual 0
      # with the binding gone, the PDP's kvBindings Set no longer contains the table ⇒ default-deny.
      # the denied response is funcd's forbidden problem+json wrapped by the handler; retry across any
      # residual settling — once settled every read is denied (fail-closed), not 200-with-a-count.
      - type: http
        method: POST
        url: "{{.dp}}/function/counter"
        headers: { content-type: application/json }
        body: '{"data":{"name":"venom"}}'
        retry: 6
        delay: 2
        info: "denied response → status {{.result.statuscode}} body {{.result.body}}"
        assertions:
          - result.body ShouldContainSubstring forbidden
