# The duckdb lane (ADR-0264) re-applies Lake lake at 1Gi from this copy of lake-quack-recreate.yaml, with no ConfigMap,
# so no tuning key sets DuckDB's memory: its engine reads its limit from its own cgroup and spills a query larger than
# that to its temp directory.
apiVersion: funcd.io/v1alpha1
kind: Lake
metadata:
  name: lake
  namespace: default
  resourceGroup: rg1
spec:
  buckets:
    - ref: lakehouse
  secrets:
    - name: lake-quack-token
      keys:
        - QUACK_TOKEN
  bindings:
    blob:
      - alias: gold
        bucket: lakehouse
        prefix: gold
    secret:
      - lake-quack-token
  location:
    bucket: lakehouse
    prefix: gold
  resources:
    cpu: "2"
    memory: "1Gi"
  ingress:
    enabled: true
    path: /lake/lake
