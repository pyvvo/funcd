# The funcdctl-plugin lane's daemon config: one developer credential, which funcdctl hands its plugins. The provisioning
# writes the token file (root, 0600) from the lane's `tokens` in scripts/lanes.yaml.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
runtime:
  mode: containerd
log:
  format: text
  level: info
