# The addon-runtime lane's daemon config: the containerd runtime with file storage, the lane's registry 127.0.0.1:5443
# listed in addons.registries so that an Addon's runtime may come from it (ADR-0344 Decision 5), and an ADR-0171
# credential list, since only an admin registers an Addon. The provisioning writes both token files (root, 0600).
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/admin
      role: admin
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
      namespaces:
        - default
runtime:
  mode: containerd
addons:
  registries:
    - 127.0.0.1:5443
log:
  format: text
  level: info
