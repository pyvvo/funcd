# The secret-writer lane's daemon config: file storage, so the Secrets that the functions write live in the metastore
# on disk, and the containerd runtime. The functions' writes need no other service.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd
log:
  format: text
  level: info
