# The addon-rauthy-restore lane's Backup of login (ADR-0333 Decision 2), which the lane takes once rauthy has written a
# snapshot newer than the client it registered first.
apiVersion: funcd.io/v1alpha1
kind: Backup
metadata:
  name: login-b1
  namespace: default
  resourceGroup: rg1
spec:
  schedule: login-nightly
