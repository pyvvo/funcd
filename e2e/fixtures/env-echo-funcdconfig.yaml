# The env-echo lane's daemon config: the env-echo example's funcdconfig.yaml (pyvvo/funcd-typescript) with
# auth.token replaced by an ADR-0171 credential list, so the suite applies Namespaces with an admin token.
# The provisioning writes both token files (root, 0600) from the lane's `tokens` in scripts/lanes.yaml.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
  limits:
    maxBodyBytes: 1024
  auth:
    edge: true
  observability:
    metrics: true
    accessLog: true
  shaping:
    cors:
      allowOrigins:
        - https://demo.example
      allowMethods:
        - GET
        - POST
    compression: true
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/admin
      role: admin
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
runtime:
  mode: containerd
log:
  format: text
  level: info
