# funcd-python's examples/catalog-quack/catalogservice.yaml plus one tag: applying it forces a reconcile,
# which an identical re-apply would not (no-op writes are coalesced, ADR-0047).
apiVersion: funcd.io/v1alpha1
kind: CatalogService
metadata:
  name: lake
  namespace: default
  resourceGroup: rg1
  tags:
    e2e-nudge: "1"
spec:
  blob:
    - alias: gold
      bucket: lakehouse
      prefix: gold
  catalog:
    bucket: lakehouse
    prefix: gold
  resources:
    cpu: "2"
    memory: "4Gi"
  secrets:
    - lake-quack-token
  config:
    - lake-engine-config
  ingress:
    pathPrefix: /catalog/lake
