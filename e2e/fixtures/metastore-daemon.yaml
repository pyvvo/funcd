# funcd daemon config for the metastore containerd lane (ADR-0065/0077) — the REAL production config:
# runtime.mode containerd + storage.mode file (the pure-Go Badger metastore at <dataDir>/store). Bundled
# into the VM at /mnt/funcd-deps and passed as `funcd --config`. Paths/addrs are in-VM (guest) values.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data   # durable: Badger metastore at /var/lib/funcd/data/store
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd               # the real production runtime
log:
  format: text
  level: info
