# The egress lane's daemon config: the egress-probe example's (pyvvo/funcd-typescript examples/egress-probe), with an
# ADR-0171 credential list, since only an admin registers the lane's test Addon, and docker.io in addons.registries for
# its engine image (ADR-0332 Decision 6). server.network turns on the egress rules, the gateway and the DNS forwarder.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
  network:
    egress: true
    egressGatewayPort: 15080
    dnsForwarderPort: 15053
    dnsResolver: 1.1.1.1:53
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/admin
      role: admin
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
      namespaces:
        - default
addons:
  registries:
    - docker.io
runtime:
  mode: containerd
log:
  format: text
  level: info
