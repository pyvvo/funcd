# The addon-rauthy lane's daemon config: the containerd runtime with file storage, ghcr.io listed in addons.registries
# so that rauthy's published image may be registered (ADR-0332 Decision 6), and an ADR-0171 credential list, since only
# an admin registers an Addon. The provisioning writes both token files (root, 0600) from the lane's tokens.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/admin
      role: admin
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
      namespaces:
        - default
runtime:
  mode: containerd
addons:
  registries:
    - ghcr.io
log:
  format: text
  level: info
