# The addon-rauthy-signin lane's daemon config (ADR-0335, ADR-0336): containerd, add-on images from ghcr.io and docker.io
# (ADR-0332 Decision 6), and an ADR-0171 credential list, so the suite registers the Addons with the admin token. The callbacks
# stay http on the data plane's port, which rauthy takes on loopback hosts only (ADR-0336 Consequences).
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/admin
      role: admin
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
addons:
  registries:
    - ghcr.io
    - docker.io
runtime:
  mode: containerd
log:
  format: text
  level: info
