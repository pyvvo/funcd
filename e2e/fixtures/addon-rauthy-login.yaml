# The addon-rauthy lane's IdentityProvider (ADR-0332): an object of rauthy's kind, which no funcd code names. Its config
# fits the schema of rauthy's Addon, it binds the lane's keys, and the edge serves it at login.example.com under
# /auth/v1.
apiVersion: funcd.io/v1alpha1
kind: IdentityProvider
metadata:
  name: login
  namespace: default
  resourceGroup: rg1
spec:
  config:
    publicHost: login.example.com
    rpId: login.example.com
    https: false
  bindings:
    secret:
      - rauthy-keys
  ingress:
    host: login.example.com
