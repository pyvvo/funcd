# The addon-rauthy-restore lane's backups of login (ADR-0333): a schedule whose scope names the IdentityProvider, to the
# S3 server the lane runs in its VM, with the todo App's test Secrets of apps/todo/dr/workload-secrets.yaml and sealed to
# its recipients (apps/todo/dr/recipients.txt). The lane creates its Backups by hand, so the slot is far off.
apiVersion: funcd.io/v1alpha1
kind: BackupSchedule
metadata:
  name: login-nightly
  namespace: default
  resourceGroup: rg1
spec:
  schedule: "0 3 * * *"
  timeZone: UTC
  scope:
    addons:
      - login
  target:
    url: s3://todo-workload?endpoint=http://127.0.0.1:7070&region=us-east-1&use_path_style=true
    credentialsSecret: todo-backup-writer
  encryption:
    recipients:
      - age1gvngj00ucwlleuk898r0s3umcacr5mxhkv4fy67evygxsmlgpanq43ttm3
      - age1263g0rath75xcgy9wh9cd6p9tpdn6wq35t5fa5pajnna4u7tgyhsxd384c
