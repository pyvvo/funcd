# The job lane's daemon config (ADR-0347): containerd, the shared VM's data dir and the built-in dev token.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
runtime:
  mode: containerd
log:
  format: text
  level: info
