# The Secrets the frp-bunny App declares, which exist before its deploy: the outputs Secret, which the stack's Job owns
# and writes FRP_TOKEN into, empty until the first apply, and the Bunny API key, which the fake module does not use.
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: frp-outputs
  namespace: default
  resourceGroup: default
spec:
  owner:
    kind: Job
    name: frp-stack
  data:
    FRP_TOKEN: ""
---
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: bunny-api
  namespace: default
  resourceGroup: default
spec:
  data:
    BUNNYNET_API_KEY: ZmFrZQ==
