# The OIDCProvider sso with its client's secret rotated once (ADR-0336 Decision 3).
apiVersion: funcd.io/v1alpha1
kind: OIDCProvider
metadata:
  name: sso
  namespace: default
  resourceGroup: rg1
spec:
  issuer: http://login.localhost:8081/auth/v1
  addon: login
  client:
    registration:
      rotate: 1
  sessionSecret: sso-session
