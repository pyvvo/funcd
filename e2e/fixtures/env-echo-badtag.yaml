# ADR-0143: env-echo pointed at a tag that was never pushed — the revision cannot resolve, so the serving one stays.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: env-echo
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:env-echo-missing
  replicas: 1
  scaling:
    minReplicas: 1
  config:
    - app-config-v2
  secrets:
    - app-secret
