# The duckdb lane's lake-recreate-keeps-url (ADR-0162) re-applies Lake lake from this copy of funcd-python's
# examples/lake-quack/lake.yaml: a re-created owner takes its retained Bucket back only by ref (ADR-0248
# recreated-owner, applied to a standalone Lake by ADR-0251), which keeps the lake's data for reader's query.
apiVersion: funcd.io/v1alpha1
kind: Lake
metadata:
  name: lake
  namespace: default
  resourceGroup: rg1
spec:
  buckets:
    - ref: lakehouse
  configMaps:
    - ref: lake-engine-config
  secrets:
    - name: lake-quack-token
      keys:
        - QUACK_TOKEN
  bindings:
    blob:
      - alias: gold
        bucket: lakehouse
        prefix: gold
    secret:
      - lake-quack-token
    config:
      - lake-engine-config
  location:
    bucket: lakehouse
    prefix: gold
  resources:
    cpu: "2"
    memory: "4Gi"
  ingress:
    enabled: true
    path: /lake/lake
