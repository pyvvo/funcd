name: Build funcdctl (local)

# LOCAL-ONLY for now: run under nektos/act to build the funcdctl CLI and collect the binaries as
# artifacts. No remote GitHub Release publishing yet — that gets added when we ship remotely. Pure-Go
# (CGO_ENABLED=0), so it runs fully under act on any host.
#
# A build MATRIX fans the 4 targets (linux/darwin × amd64/arm64) across parallel jobs. Each job builds
# BOTH:
#   - the THIN client            → dist/funcdctl-<version>-<os>-<arch>            (~10 MB)
#   - the FAT `-tags dev` client → dist/funcdctl-dev-<version>-<os>-<arch>        (`funcdctl dev`,
#     ADR-0125): embeds the process-runtime platform (~60 MB) + the per-arch DuckDB+Quack catalog
#     engine (~130 MB) fetched by scripts/fetch-catalog-engine.sh, and the per-arch rqlited SQL engine
#     (~12 MB, ADR-0237) built by the build-sql-engine job. Both engines are subprocesses, never linked,
#     so the client stays CGO_ENABLED=0.
#
# rqlited needs cgo and has no macOS release, so build-sql-engine builds it with scripts/build-sql-engine.sh on a
# native runner per target: linux in the rqlite image's Docker builder stage on a Linux runner of that arch, darwin
# with clang on macOS (darwin/amd64 through clang -arch). A Go build under emulation crashes, so no target is built on
# a host of the other arch. Under act, .actrc runs the macOS and linux/arm64 jobs on an arm64 Mac host (self-hosted,
# Docker from colima); linux/amd64 needs an amd64 host: GitHub's runner, or an amd64 Lima VM running the script.
#
# Run locally — the flags live in ./.actrc (image, colima socket fix, --pull=false, artifact dir):
#   docker pull catthehacker/ubuntu:act-latest      # once (act won't pull with --pull=false)
#   act workflow_dispatch -W .github/workflows/release.yml
# Each matrix job uploads its own artifact (gitignored) under .act-artifacts/.

on:
  workflow_dispatch:
    inputs:
      version:
        description: version string to stamp into the binary
        required: false
        default: dev

jobs:
  build-sql-engine:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build rqlited for ${{ matrix.os }}/${{ matrix.arch }}
        run: scripts/build-sql-engine.sh "${{ matrix.os }}" "${{ matrix.arch }}"

      - name: Upload the engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sql-engine-${{ matrix.os }}-${{ matrix.arch }}
          path: internal/sql/embedengine/rqlited.gz

  build-funcdctl:
    needs: build-sql-engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    env:
      VERSION: ${{ github.event.inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download the SQL engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sql-engine-${{ matrix.os }}-${{ matrix.arch }}
          path: internal/sql/embedengine

      - name: Build funcdctl (thin + fat -tags dev) for ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          set -euo pipefail
          os="${{ matrix.os }}"
          arch="${{ matrix.arch }}"
          LDFLAGS="-s -w -X github.com/pyvvo/funcd/internal/platform/version.Version=${VERSION}"
          mkdir -p dist

          # Thin client (pkg/sdk + api only).
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
            go build -trimpath -ldflags "$LDFLAGS" -o "dist/funcdctl-${VERSION}-${os}-${arch}" ./cmd/funcdctl

          # Fat `-tags dev` client: fetch the per-arch DuckDB+Quack engine into the embed slot beside the
          # downloaded rqlited, then bake both in. Engines are subprocesses (no cgo), so CGO_ENABLED=0 still
          # cross-builds cleanly.
          scripts/fetch-catalog-engine.sh "$os" "$arch"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
            go build -tags dev -trimpath -ldflags "$LDFLAGS" -o "dist/funcdctl-dev-${VERSION}-${os}-${arch}" ./cmd/funcdctl

          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: funcdctl-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
