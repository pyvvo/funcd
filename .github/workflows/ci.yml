name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Run CI (fmt check + lint + test + build)
        run: nix develop --command just ci

  # The slatedb (cgo) engine lane: builds the slatedb_uniffi native lib from the pinned
  # source and runs the tag-gated tests (RunContract + crash-recovery on the real engine),
  # so funcd's production store engine is exercised on every change — not just the
  # pure-Go memory fake that `just ci` covers (ADR-0006 §5).
  slatedb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - name: Build slatedb_uniffi + run the cgo engine lane
        run: |
          just slatedb-lib
          just test-slatedb
