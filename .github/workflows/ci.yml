name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Run CI (fmt check + lint + test + build)
        run: nix develop --command just ci
        # The metastore engine is pure-Go Badger (ADR-0065), exercised by `just ci` itself
        # (internal/store/badger passes the same storecontract as the memory engine). The old
        # slatedb cgo lane (a separate rust-toolchain job running just slatedb-lib/test-slatedb)
        # was removed together with slatedb.
