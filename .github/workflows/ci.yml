name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

# pull-requests:read — dorny/paths-filter reads the PR's changed files via the API.
# actions:write — cache-nix-action lists/saves/purges its store caches via the cache API.
permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  # `code`: whether this change touches anything the pkg/funcd e2e scenarios depend on.
  # pkg/funcd imports ~63% of the module, execs the language shims (pinned in go.mod,
  # ADR-0141), and rides the runtime images — so any of these paths changing means the heavy
  # suite must run. `nondocs`: anything but Markdown, LICENSE or a file under docs/ (the review ledger's JSON
  # included; a push to main still runs the fast lane). `design`: the design specs and their diagrams under
  # docs/design (ADR-0272). A change with no `nondocs` file that touches a spec takes the `ci` job's light path in
  # its pull_request and merge_group runs: `just check-hygiene check-specs`, not the whole fast lane.
  # `nonrelease`: anything but release-please's own files. The `ci` job needs `nonrelease` and either `nondocs` or
  # `design`, so a docs-only PR and a release PR skip it, while a release PR that also touches code still runs
  # it. A skipped required job still reports success, so neither is blocked.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      design: ${{ steps.filter.outputs.design }}
      nondocs: ${{ steps.filter.outputs.nondocs }}
      nonrelease: ${{ steps.filter.outputs.nonrelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'api/**'
              - 'internal/**'
              - 'pkg/**'
              - 'images/**'
              - 'go.mod'
              - 'go.sum'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yml'
            design:
              - 'docs/design/**'
            nondocs:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!docs/**'
            nonrelease:
              - '**'
              - '!CHANGELOG.md'
              - '!version.txt'
              - '!.release-please-manifest.json'

  # Fast lane — runs on every change but a docs-only one (and always on push to main). The heavy
  # pkg/funcd e2e suite is build-tagged out of `just ci`, so this is fmt + lint + fast tests +
  # build (seconds of test, not ~70s). A docs change that touches a design spec runs only the two
  # checks it can break, in this same job, so the required `ci` check still reports.
  ci:
    needs: changes
    if: ((needs.changes.outputs.nondocs == 'true' || needs.changes.outputs.design == 'true') && needs.changes.outputs.nonrelease == 'true') || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Persist the realised Nix store across runs. Upstream Nix keeps /nix on the normal
      # filesystem (unlike the Determinate installer's KVM image, which a file cache can't
      # archive), so this is what removes the ~169s devShell download on warm runs. Keyed
      # on the flake, so it only invalidates when the pinned toolchain moves.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Cache Go modules & build
        if: needs.changes.outputs.nondocs == 'true' || github.event_name == 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Run CI (fmt check + lint + fast tests + build)
        if: needs.changes.outputs.nondocs == 'true' || github.event_name == 'push'
        run: nix develop --command just ci

      - name: Check the design specs and the repository hygiene (docs and specs only)
        if: needs.changes.outputs.nondocs != 'true' && github.event_name != 'push'
        run: nix develop --command just check-hygiene check-specs

  # Heavy lane — the pkg/funcd e2e scenarios (`-tags e2e`). Runs only when the change
  # touches code the suite depends on (the `changes` filter), and always on push to main
  # as the safety net.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Cache Go modules & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Run e2e scenarios (pkg/funcd, -tags e2e)
        run: nix develop --command just test-e2e -v
