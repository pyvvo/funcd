version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /images/runtime/nodejs22
      - /images/runtime/python314
      - /images/runtime/duckdb
    schedule:
      interval: weekly
    # A runtime image's Python version is part of its name (python314), so only digest and patch updates come here: a
    # new Python minor is a new runtime image.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      runtime-images:
        patterns:
          - "*"
  - package-ecosystem: pip
    directories:
      - /images/runtime/python314
      - /images/runtime/duckdb
    schedule:
      interval: weekly
    # botocore requires python-dateutil <3.0.0, and the images install with --no-deps, so no step would catch a 3.x pin.
    ignore:
      - dependency-name: python-dateutil
        update-types:
          - version-update:semver-major
    groups:
      pip:
        patterns:
          - "*"
  # Go: otel modules move in lockstep, so they share a PR; other minor and patch bumps share one. A major bump, and
  # containerd (it needs the Lima lanes), always get a PR of their own.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      go-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "github.com/containerd/*"
