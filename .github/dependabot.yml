version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /images/runtime/nodejs22
      - /images/runtime/python314
      - /images/runtime/duckdb
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /images/runtime/python314
      - /images/runtime/duckdb
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
