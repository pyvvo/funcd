# Thin OVERRIDE of the bench VM (scripts/lima.yaml) for the s3-roundtrip demo (ADR-0080/0085, F47) on
# REAL containerd. `base:` inherits the image/arch, resources, the `funcd install` provision, and the
# runtime probe; this file carries only the demo's deltas. Driven by `just lima-example-s3`.
#
# The s3-roundtrip JS function uses its funcd-INJECTED keypair (AWS_* env, set by the daemon for a
# spec.blob function — ADR-0085) + a bundled @aws-sdk/client-s3 to round-trip S3 against the gateway:
# PutObject/GetObject/ListObjectsV2 on the OWNED gold prefix (allowed) and a PutObject on an unbound
# prefix (403 AccessDenied from the Cedar PEP) — proving keypair-injection → SigV4 over TCP → the PEP
# → blob.Bucket on the live daemon, on real containerd.
base: lima.yaml

mounts:
  - location: "~/.cache/funcd-lima"
    mountPoint: "/mnt/funcd-deps"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      d=/opt/s3-roundtrip; reg=/mnt/funcd-deps/registry
      install -m 0755 /mnt/funcd-deps/funcdctl /usr/local/bin/funcdctl
      mkdir -p "$d" /var/lib/funcd/data
      tar xzf /mnt/funcd-deps/s3-roundtrip.tgz -C "$d"
      rm -rf "$reg"
      funcdctl push "$d/roundtrip.mjs" "oci-layout://$reg:s3-roundtrip"
      export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token
      systemd-run --unit funcd-demo /usr/local/bin/funcd --config "$d/funcdconfig.yaml"
      curl -s --retry-connrefused --retry 30 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz || true
      # Apply order resolves the admission cycle (ADR-0080 / ADR-0073 pattern):
      #   1. the Function WITHOUT spec.blob (so the Bucket's gold.owner=s3-roundtrip exists);
      #   2. the Bucket (its prefix owner now exists);
      #   3. re-apply the Function WITH spec.blob (an Update; the bucket+prefix now exist).
      funcdctl apply -f "$d/function-base.yaml"
      funcdctl apply -f "$d/bucket.yaml"
      funcdctl apply -f "$d/function.yaml"

probes:
  - description: "s3-roundtrip reconciles to Ready on a real containerd sandbox"
    script: |
      #!/bin/bash
      set -eu -o pipefail
      export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token
      phase() { funcdctl get function "$1" -n default -o json 2>/dev/null \
        | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("phase","?"))' 2>/dev/null; }
      for i in $(seq 1 60); do
        [ "$(phase s3-roundtrip)" = Ready ] && exit 0; sleep 2
      done
      exit 1
    hint: "s3-roundtrip did not reach Ready; see `sudo journalctl -u funcd-demo` in `limactl shell funcd-bench-s3`"
