version: "2"

linters:
  default: none
  enable:
    - dupl
    - funlen
    - gocognit
    - gocyclo
    - godox
    - nolintlint
  settings:
    dupl:
      threshold: 75
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX
    nolintlint:
      allow-unused: true
      require-explanation: true
      require-specific: true

run:
  relative-path-mode: wd
  timeout: 5m

issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
