# Thin OVERRIDE of the bench VM (scripts/lima.yaml) for the KV demo (ADR-0069) on REAL containerd. `base:`
# inherits the image/arch, resources, the `funcd install` provision, and the runtime probe; this file
# carries only the demo's deltas. Driven by `just lima-example-kv`. Lima merge (2.1.2): provision + probes
# APPEND after base's; mounts dedup by mountPoint with the child winning.
base: lima.yaml

# Writable so the guest pushes the OCI layout into /mnt/funcd-deps/registry (the manifest's artifact.uri).
mounts:
  - location: "~/.cache/funcd-lima"
    mountPoint: "/mnt/funcd-deps"
    writable: true

# Appended after `funcd install`: extract the bundle, push BOTH contract-validated artifacts (JS counter.mjs
# + Python py/counter.py), run funcd (containerd + durable KV) as a unit, then apply both manifests.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      d=/opt/kv-counter; reg=/mnt/funcd-deps/registry
      install -m 0755 /mnt/funcd-deps/funcdctl /usr/local/bin/funcdctl
      mkdir -p "$d" /var/lib/funcd/data
      tar xzf /mnt/funcd-deps/kv-counter.tgz -C "$d"
      rm -rf "$reg"
      funcdctl push "$d/counter.mjs" "oci-layout://$reg:counter" \
        --schema "$d/counter.schema.json"
      funcdctl push "$d/py/counter.py" "oci-layout://$reg:pycounter" \
        --schema "$d/py/counter.schema.json"
      export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token
      systemd-run --unit funcd-demo /usr/local/bin/funcd --config "$d/funcdconfig.yaml"
      curl -s --retry-connrefused --retry 30 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz || true
      # ADR-0073 ordering: owner-exists (KVStore.tables[].owner is a real Function) needs the function
      # first; binding-validity (Function.spec.kv names an existing store/table) needs the store first.
      # Break the cycle: apply each function WITHOUT spec.kv, then the owned store (owner now exists),
      # then re-apply the function WITH spec.kv. The binding IS the capability (default-deny).
      strip_kv() { python3 -c 'import sys,yaml;d=yaml.safe_load(open(sys.argv[1]));d["spec"].pop("kv",None);print(yaml.safe_dump(d))' "$1"; }
      strip_kv "$d/counter.yaml"    | funcdctl apply -f -
      strip_kv "$d/py/counter.yaml" | funcdctl apply -f -
      funcdctl apply -f "$d/store.yaml"
      funcdctl apply -f "$d/py/store.yaml"
      funcdctl apply -f "$d/counter.yaml"
      funcdctl apply -f "$d/py/counter.yaml"
      # ADR-0076: a declared spec.kv binding GRANTS kv::read on its table (built-in permit) — so NO read
      # Policy is applied here; context.kv.get is permitted by the binding alone (owner-write stays a
      # built-in forbid, no write Policy). This lane is the e2e proof that own-table reads need no Policy.

# Appended after the runtime probe: gate `limactl start` on BOTH counters reaching Ready on a real sandbox.
probes:
  - description: "counter + pycounter reconcile to Ready (real containerd sandbox)"
    script: |
      #!/bin/bash
      set -eu -o pipefail
      export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token
      phase() { funcdctl get function "$1" -n default -o json 2>/dev/null \
        | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("phase","?"))' 2>/dev/null; }
      for i in $(seq 1 60); do
        [ "$(phase counter)" = Ready ] && [ "$(phase pycounter)" = Ready ] && exit 0; sleep 2
      done
      exit 1
    hint: "counter/pycounter did not reach Ready; see `sudo journalctl -u funcd-demo` in `limactl shell funcd-bench-kv`"
