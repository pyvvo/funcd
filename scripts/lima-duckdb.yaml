# Self-deploying Lima VM for the F48 catalog-quack lane (ADR-0086 + ADR-0087) on REAL containerd.
# `base:` inherits the image/arch, resources, the `funcd install` provision, and the runtime probe;
# this file carries only the lane's deltas. Driven by `just lima-example-duckdb`.
#
# It deploys a CatalogService and lets the add-on PROVIDER RUNTIME (ADR-0087) bring up the curated
# `duckdb` engine (DuckDB + DuckLake + Quack) — NO backing Function — reading/writing Parquet through
# the F47 S3 surface and serving Quack on its netns port.
#
# The CatalogService reaches Ready: the engine gets its F47/Cedar identity (ADR-0088 — its spec.blob
# are its blobBindings, it owns its catalog prefix), so its keypair reads/writes S3 (HEAD 404 fresh,
# not 403), recovers/attaches the catalog, serves Quack, and the provider-runtime's readiness probe
# passes. See examples/python/catalog-quack/README.md.
base: lima.yaml

mounts:
  - location: "~/.cache/funcd-lima"
    mountPoint: "/mnt/funcd-deps"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      d=/opt/catalog-quack
      install -m 0755 /mnt/funcd-deps/funcdctl /usr/local/bin/funcdctl
      mkdir -p "$d" /var/lib/funcd/data
      tar xzf /mnt/funcd-deps/catalog-quack.tgz -C "$d"
      # The EXTERNAL consumer is plain host python3 + the duckdb wheel (it autoinstalls the quack
      # extension on first LOAD); install it so client.py runs on the host (best-effort — the lane is
      # gated, so a failure here doesn't mask the real blocker).
      python3 -m pip install --quiet duckdb 2>/dev/null || pip3 install --quiet duckdb 2>/dev/null || true
      export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token
      systemd-run --unit funcd-demo /usr/local/bin/funcd --config "$d/funcdconfig.yaml"
      curl -s --retry-connrefused --retry 30 --retry-delay 1 -o /dev/null http://127.0.0.1:8080/healthz || true
      # Apply order resolves the admission cycle (bucket-owner ↔ CatalogService), the s3-roundtrip
      # pattern: ConfigMap + Secret → the Bucket WITHOUT owner (bucket-base) → the CatalogService (its
      # catalog-blob-validity now passes — the bucket/prefix exist) → the Bucket WITH owner=lake (an
      # Update; the owner-exists admission now admits the CatalogService `lake`, ADR-0088). Then the
      # provider-runtime brings up the duckdb engine.
      funcdctl apply -f "$d/configmap.yaml"
      funcdctl apply -f "$d/secret.yaml"
      funcdctl apply -f "$d/bucket-base.yaml"
      funcdctl apply -f "$d/catalogservice.yaml"
      funcdctl apply -f "$d/bucket.yaml"

probes:
  - description: "the CatalogService reaches Ready (the duckdb engine deployed by the provider-runtime)"
    script: |
      #!/bin/bash
      set -eu -o pipefail
      export FUNCD_SERVER=http://127.0.0.1:8080 FUNCD_TOKEN=funcd-dev-token
      phase() { funcdctl get catalogservice "$1" -n default -o json 2>/dev/null \
        | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("phase","?"))' 2>/dev/null; }
      for i in $(seq 1 90); do
        [ "$(phase lake)" = Ready ] && exit 0; sleep 2
      done
      exit 1
    hint: "lake did not reach Ready — check the engine: `curl http://<status.address>/` should be 200 (Quack), and the S3 HEAD on the catalog should be 404 (authorized, fresh) not 403; see `sudo journalctl -u funcd-demo` in `limactl shell funcd-bench-duckdb`"
