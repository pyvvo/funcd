# The funcd example-lane REGISTRY (ADR-0077 declarative e2e). One section per lane; the single generic
# recipe `just lima-example <name>` (host side) and the single generic VM `scripts/lima-lane.yaml`
# (guest side, through scripts/lane-provision.sh and scripts/lane-ready.sh) read the section for the lane
# being launched and drive it entirely from this data — so a new lane is just a section here + its
# manifests + a Venom suite, with NO per-lane recipe or VM YAML. `just lima-example-all` runs the lanes one
# after the other on one shared VM (ADR-0230), so every lane funcdconfig sets dataDir: /var/lib/funcd/data.
#
# Per lane:
#   module  — the pinned Go module the example lives in (ADR-0141): github.com/pyvvo/funcd-typescript,
#             github.com/pyvvo/funcd-python or github.com/pyvvo/funcd-functions (the example Apps), resolved
#             by scripts/moddir.sh (module cache or go.work). Absent = the funcd repo root. The language
#             repos commit their example builds.
#   dir     — the example directory, relative to the module root; source of the staged files.
#   copy    — true = build in a writable copy (the module cache is read-only): the whole module goes to
#             .modcopy/lane/<module>, so the example's relative references still resolve.
#   build   — host shell commands (run in the lane's dir, in order, with FUNCD_ROOT set to the funcd checkout) that
#             produce the artifacts to push. A download in one is pinned: an image by digest, a lockfile with --locked,
#             a file by its checksum (scripts/lanes_test.go holds it).
#   stage   — files/dirs (relative to dir) copied into the VM's /opt/lane (the manifests + built artifacts);
#             or {from, module, to}: a file or a directory from funcd's root (or from `module`'s root) to a tgz path.
#   push    — OCI pushes done in the guest: artifact + ref (→ oci-layout:///mnt/funcd-deps/registry:<ref>);
#             optional entry (bundle --entry, default main.py or main.mjs), or site: true (a prebuilt static web app
#             dir pushed with --site, ADR-0139). funcdctl push reads the artifact's contract file, staged beside a
#             file or at a bundle's root (ADR-0247), for its contract and runtime.
#   apply   — `funcdctl apply -f` order in the guest (after the pushes).
#   ready   — the readiness gate for `limactl start`: kind + names polled until Ready (tries × 2s). Absent = no
#             gate, for a lane whose suite deploys its resources itself.
#   tokens  — ADR-0171 static credentials, name → token. Before funcd starts, the guest writes each to
#             /etc/funcd/tokens/<name> (root, 0600) for the lane funcdconfig's auth.credentials; its funcdctl then
#             applies and probes with the `developer` token. Absent = the built-in dev token.
#   venom   — the host-side Venom suite the recipe runs once the VM is up.
#   optional — true = `just lima-example-all` skips the lane (scripts/lane.py --venom-lanes leaves it out);
#             `just lima-example <name>` still runs it.

env-echo:
  description: A JS function receiving spec.bindings.config (ConfigMap) + spec.bindings.secret (Secret) env (ADR-0093/0057).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/env-echo
  stage:
    - env-echo.mjs
    - env-echo.contract.yaml
    - configmap.yaml
    - secret.yaml
    - function.yaml
    - route.yaml
    - secure-route.yaml
    # ADR-0171: the example's daemon config with auth.credentials in place of auth.token
    - from: e2e/fixtures/env-echo-funcdconfig.yaml
      to: funcdconfig.yaml
    # ADR-0143: the redeploy fixtures the Venom suite applies mid-suite
    - from: e2e/fixtures/env-echo-config-v2.yaml
      to: env-echo-config-v2.yaml
    - from: e2e/fixtures/env-echo-v2.yaml
      to: env-echo-v2.yaml
    - from: e2e/fixtures/env-echo-badtag.yaml
      to: env-echo-badtag.yaml
    - from: e2e/fixtures/env-echo-badhandler.yaml
      to: env-echo-badhandler.yaml
    # ADR-0160: a handler that takes 30 s to load, killed while it boots
    - from: e2e/fixtures/boot-hang.mjs
      to: boot-hang.mjs
    - from: e2e/fixtures/boot-hang.contract.json
      to: boot-hang.contract.json
    - from: e2e/fixtures/boot-hang.yaml
      to: boot-hang.yaml
    # ADR-0149: a runtime with no image, applied last by the Venom suite
    - from: e2e/fixtures/ruby3-echo.yaml
      to: ruby3-echo.yaml
    # ADR-0110 and ADR-0113: the Namespaces the Venom suite applies last, with the admin token
    - from: e2e/fixtures/env-echo-explicit-namespace.yaml
      to: env-echo-explicit-namespace.yaml
    - from: e2e/fixtures/env-echo-edge-defaults.yaml
      to: env-echo-edge-defaults.yaml
  tokens:
    admin: env-echo-lane-admin
    developer: env-echo-lane-developer
  push:
    - artifact: env-echo.mjs
      ref: env-echo
    - artifact: boot-hang.mjs
      ref: boot-hang
  apply:
    - configmap.yaml
    - secret.yaml
    - function.yaml
    # ADR-0110 (F79): a Route exposing env-echo at host env.example.com /echo (namespace stays
    # implicit, so /function/env-echo also keeps working) — proves the declarative front door.
    - route.yaml
    # ADR-0113 (F77): a Route at /secure with an `authenticated` stance — 401 without a bearer.
    - secure-route.yaml
  ready:
    kind: function
    names:
      - env-echo
    tries: 60
  venom: e2e/env-echo.venom.yml

fn-to-fn:
  description: Two JS functions with a declared synchronous fn-to-fn link (ADR-0064/0058).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/fn-to-fn
  stage:
    - greeter.mjs
    - front.mjs
    - greeter.contract.yaml
    - front.contract.yaml
    - greeter.yaml
    - front.yaml
    - funcdconfig.yaml
  push:
    - artifact: greeter.mjs
      ref: greeter
    - artifact: front.mjs
      ref: front
  apply:
    - greeter.yaml
    - front.yaml
  ready:
    kind: function
    names:
      - greeter
      - front
    tries: 40
  venom: e2e/fn-to-fn.venom.yml

http-api:
  description: A JS Function that serves HTTP, a Hono REST API behind a Route, with a streamed export (ADR-0243).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/http-api
  stage:
    - devices-api.mjs
    - devices-api.contract.yaml
    - devices.yaml
    - route.yaml
    - funcdconfig.yaml
  push:
    - artifact: devices-api.mjs
      ref: devices
  apply:
    - devices.yaml
    - route.yaml
  ready:
    kind: function
    names:
      - devices-api
    tries: 40
  venom: e2e/http-api.venom.yml

duckdb:
  description: The lake-quack provider + bundle consumer, live SQL round-trip (ADR-0086..0093).
  module: github.com/pyvvo/funcd-python
  dir: examples/lake-quack
  copy: true
  # funcd-bundle (funcd-python) installs the bundle in the local python:3.14-slim-bookworm image: point that tag at the
  # digest the runtime images pin first. It downloads the DuckDB extensions: check them against their pins after.
  build:
    - uv run --locked funcd-bundle
    - cd dist/lake-reader/duckdb-ext && grep -E "/linux_$(go env GOARCH)/(httpfs|quack)\." "$FUNCD_ROOT/images/runtime/duckdb/duckdb.sha256" | sha256sum -c - && test "$(find . -name '*.duckdb_extension' | wc -l)" -eq 2
  stage:
    - configmap.yaml
    - secret.yaml
    - lake.yaml
    - consumer.yaml
    - dist/lake-reader
    # ADR-0171: the example's daemon config with auth.credentials in place of auth.token
    - from: e2e/fixtures/duckdb-funcdconfig.yaml
      to: funcdconfig.yaml
    # ADR-0179: the engines in namespaces a-b and a the Venom suite applies with the admin token
    - from: e2e/fixtures/cni-engines.yaml
      to: cni-engines.yaml
    # ADR-0248/0251: lake re-created with a ref to the Bucket it retained
    - from: e2e/fixtures/lake-quack-recreate.yaml
      to: lake-quack-recreate.yaml
    # ADR-0263: the non-gating ATTACH probe run in lake-reader; ADR-0264: lake re-created at 1Gi and the probe of a
    # worker's cgroup view
    - from: e2e/fixtures/lake-1gi.yaml
      to: lake-1gi.yaml
    # Issue #1227: lake re-applied at 3Gi, so a spec change replaces its engine through a graceful stop
    - from: e2e/fixtures/lake-redeploy.yaml
      to: lake-redeploy.yaml
    - from: e2e/fixtures/lake-saves-refused.yaml
      to: lake-saves-refused.yaml
    # ADR-0292/0293: lake re-applied with its gold prefix capped at 1Mi
    - from: e2e/fixtures/lake-quota.yaml
      to: lake-quota.yaml
    - from: e2e/fixtures/quack-attach-probe.py
      to: quack-attach-probe.py
    - from: e2e/fixtures/cgroup-view.py
      to: cgroup-view.py
    # ADR-0269: a query that points an S3 secret at the VM's own address reaches nothing
    - from: e2e/fixtures/fence-probe.sh
      to: fence-probe.sh
  tokens:
    admin: duckdb-lane-admin
    developer: duckdb-lane-developer
  push:
    - artifact: dist/lake-reader
      ref: lake-reader
  # ADR-0251: the Lake declares the lakehouse Bucket it owns at its root, so its reconciler writes it; the
  # consumer applies after it in any order (ADR-0121).
  apply:
    - configmap.yaml
    - secret.yaml
    - lake.yaml
    - consumer.yaml
  ready:
    kind: lake
    names:
      - lake
    tries: 90
  venom: e2e/duckdb.venom.yml

s3:
  description: The s3-roundtrip JS function round-trips S3 with its funcd-injected keypair + a PEP deny (ADR-0080/0085, F47).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/s3-roundtrip
  stage:
    - s3-roundtrip.mjs
    - s3-roundtrip.contract.yaml
    - bucket.yaml
    - function.yaml
    - funcdconfig.yaml
    # ADR-0136 (F101): grants s3-roundtrip Blob Data Writer on the unowned `shared` prefix — the role-assigned
    # writer path (a write to a prefix it neither owns nor binds), proven live alongside the owner path.
    - rolesassignment.yaml
    # ADR-0119 (F83): the reactive-ingestion trio — a builtin-pass Workflow started when an object lands
    # under gold/, the blob EventSource that watches it, and the Sensor that binds the drop to the run.
    - ingest-workflow.yaml
    - drop-source.yaml
    - drop-sensor.yaml
    # ADR-0139 (F103): the prebuilt BI app (two builds, for the redeploy case) + the Site that binds the
    # lakehouse Bucket by ref (ADR-0248), materializes the bundle under bi/<digest>/, and mounts gold/ at /data.
    - bi
    - bi-v2
    - site.yaml
    # ADR-0140 (F104): a SECOND site on the same listener, host-less ⇒ mounted at /site/docs.
    - docs
    - site-docs.yaml
  push:
    - artifact: s3-roundtrip.mjs
      ref: s3-roundtrip
    - artifact: bi
      ref: bi
      site: true
    - artifact: bi-v2
      ref: bi-v2
      site: true
    - artifact: docs
      ref: docs
      site: true
  # ADR-0121: no two-phase — apply in any order. The Function WITH spec.bindings.blob is applied BEFORE its Bucket
  # (admitted, held Ready=False/BucketNotFound), then the Bucket (owner: s3-roundtrip) resolves it and the
  # function converges Ready — a live apply-any-order proof of the Bucket↔Function-owner cycle on real
  # containerd. Then the ADR-0119 reactive trio (the ingest Workflow, the blob EventSource, the Sensor).
  apply:
    - function.yaml
    - bucket.yaml
    # The RolesAssignment references the Function + the lakehouse/shared prefix; its admission is structural
    # (no existence gate), and the WriterLister resolves it per-request, so it applies after function+bucket.
    - rolesassignment.yaml
    - ingest-workflow.yaml
    - drop-source.yaml
    - drop-sensor.yaml
    # ADR-0248: the Sites bind lakehouse by ref over its ownerless bi and docs prefixes and never edit it — the
    # live shared-substrate case.
    - site.yaml
    - site-docs.yaml
  ready:
    kind: function
    names:
      - s3-roundtrip
    tries: 60
  venom: e2e/s3.venom.yml

kv:
  description: The kv-counter JS + Python functions increment a per-name counter via context.kv on a durable Badger store (ADR-0069/0073/0076).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/kv-counter
  # Both sides collide on the resource file's name, so the Python side is staged under a py/ subdir via the
  # {from,to} form (pulling from a DIFFERENT dir than `dir`); the JS side stages at the layout root. Each artifact's
  # contract file sits where `funcdctl push` reads it (ADR-0247): beside the file, named after its stem.
  stage:
    - counter.mjs
    - counter.contract.yaml
    - counter.yaml
    - fixtures/counter-unbound.yaml   # the fail-closed negative applied in-VM by the Venom suite
    - from: e2e/fixtures/counter-quota.yaml   # ADR-0292: the store capped at 100 bytes
      to: fixtures/counter-quota.yaml
    - funcdconfig.yaml
    - from: examples/kv-counter/src/main.py
      module: github.com/pyvvo/funcd-python
      to: py/pycounter.py
    - from: examples/kv-counter/pycounter.contract.yaml
      module: github.com/pyvvo/funcd-python
      to: py/pycounter.contract.yaml
    - from: examples/kv-counter/counter.yaml
      module: github.com/pyvvo/funcd-python
      to: py/counter.yaml
  push:
    - artifact: counter.mjs
      ref: counter
    - artifact: py/pycounter.py
      ref: pycounter
  # ADR-0248: each function declares the store it owns at its root and the reconciler writes it, the function as
  # the table owner (the binding IS the capability — default-deny; ADR-0076: no read Policy needed).
  apply:
    - counter.yaml
    - py/counter.yaml
  ready:
    kind: function
    names:
      - counter
      - pycounter
    tries: 60
  venom: e2e/kv-counter.venom.yml

workflow:
  description: A Workflow (ingest→score→{hi|lo}→report→wait→pass) mixing materialized function steps with engine-native built-ins (a blocking wait + a pass transform), driven on real containerd (ADR-0094 + ADR-0096).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/workflow
  stage:
    - ingest.mjs
    - score.mjs
    - hi.mjs
    - lo.mjs
    - report.mjs
    - ingest.contract.yaml
    - score.contract.yaml
    - hi.contract.yaml
    - lo.contract.yaml
    - report.contract.yaml
    - workflow.yaml
    - child.yaml
    - parent.yaml
    - fixtures/run-pause.yaml
    - fixtures/run-cancel.yaml
    - fixtures/schedule-source.yaml
    - fixtures/schedule-sensor.yaml
    - funcdconfig.yaml
  # Each step image carries its contract file's runtime (the dev.funcd.runtime.v1 annotation, ADR-0247) so the
  # workflow materializer resolves its runtime from the manifest alone (ADR-0094).
  push:
    - artifact: ingest.mjs
      ref: ingest
    - artifact: score.mjs
      ref: score
    - artifact: hi.mjs
      ref: hi
    - artifact: lo.mjs
      ref: lo
    - artifact: report.mjs
      ref: report
  # Apply the Workflows — orders (the main lane), plus the F70 sub-workflow pair: `scorer` (child) and
  # `pipeline` (parent, whose `sub` step runs scorer inline). The engine materializes each's owned step
  # Functions. The run manifests (run-pause/run-cancel) are applied IN-VM by the Venom suite.
  apply:
    - workflow.yaml
    - child.yaml
    - parent.yaml
  # NB: schedule-source.yaml + schedule-sensor.yaml (F68/F69) are STAGED but NOT applied at deploy — the
  # Venom suite applies them IN its final scheduled-workflow case so the timer's per-tick `orders` runs
  # don't perturb the earlier status.runs count assertions (same ordering rule as the run-replay case).
  # Readiness gate: the materialized step Functions pull + serve on containerd (they appear only after
  # each Workflow reconciles, so `funcdctl get function` tolerates a transient not-found).
  ready:
    kind: function
    names:
      - orders-ingest
      - orders-score
      - orders-hi
      - orders-lo
      - orders-report
      - scorer-s
      - pipeline-feed
    tries: 90
  venom: e2e/workflow.venom.yml

funclog:
  description: The log-burst JS + Python functions each emit >=100 logs; funcd captures them as OTLP-JSONL (ADR-0081/0084).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/log-burst
  stage:
    - log-burst.mjs
    - log-burst.contract.yaml
    - burst.yaml
    - funcdconfig.yaml
    - from: examples/log-burst/src/main.py
      module: github.com/pyvvo/funcd-python
      to: py/pylog-burst.py
    - from: examples/log-burst/log-burst.contract.yaml
      module: github.com/pyvvo/funcd-python
      to: py/pylog-burst.contract.yaml
    - from: examples/log-burst/handler.yaml
      module: github.com/pyvvo/funcd-python
      to: py/handler.yaml
  # Both examples are named "log-burst"; the Python one deploys as "pylog-burst" (transform rewrites both
  # the metadata.name and the artifact ref) so they coexist on one daemon.
  push:
    - artifact: log-burst.mjs
      ref: log-burst
    - artifact: py/pylog-burst.py
      ref: pylog-burst
  apply:
    - burst.yaml
    - file: py/handler.yaml
      transform: "sed -e 's/name: log-burst/name: pylog-burst/' -e 's#:log-burst#:pylog-burst#'"
  ready:
    kind: function
    names:
      - log-burst
      - pylog-burst
    tries: 60
  venom: e2e/funclog.venom.yml

egress:
  description: The egress-probe JS function proves ADR-0117 (F81) egress enforcement on real containerd — default-deny with no EgressPolicy, allow via a wildcard-domain / CIDR EgressPolicy, and the audit trail.
  module: github.com/pyvvo/funcd-typescript
  dir: examples/egress-probe
  stage:
    - egress-probe.mjs
    - egress-probe.contract.yaml
    - function.yaml
    - fixtures/egresspolicy-wildcard.yaml   # applied MID-SUITE by the Venom allow-cases (deny-then-allow ordering)
    - fixtures/egresspolicy-cidr.yaml       # applied MID-SUITE by the Venom CIDR allow-case
    - funcdconfig.yaml             # the ONLY lane funcdconfig with server.network.egress on (F80+F81 armed)
  push:
    - artifact: egress-probe.mjs
      ref: egress-probe
  # Only the Function is applied at deploy. The EgressPolicies are applied IN-VM by the Venom suite so the
  # default-deny (no policy) case is observable BEFORE any allow-list exists — the deny-then-allow ordering.
  apply:
    - function.yaml
  ready:
    kind: function
    names:
      - egress-probe
    tries: 60
  venom: e2e/egress.venom.yml

sql:
  description: SQL databases on real containerd (ADR-0232 to ADR-0236) — a Drizzle TypeScript owner and a SQLModel Python reader of one rqlite engine, a refused write, an all-or-nothing batch, rows that survive an engine kill and a daemon restart, a 100 MB database backed up to an S3 server in the VM and restored under a new name, lost engine data reported and restored in place, a new row that starts a Function through a Sensor, and the todo App's database migrated by its pre-hook at install and upgrade.
  module: github.com/pyvvo/funcd-functions
  dir: apps/todo
  # funcd-bundle writes dist/ beside the Python project, so the lane builds in a writable copy of the module.
  copy: true
  # funcd-bundle installs the bundle in the local python:3.14-slim-bookworm image: that tag first points at the digest
  # the python314 runtime image pins.
  # versitygw (Apache-2.0), the S3 server of the backup steps, is built for the VM at the app-todo lane's pinned version.
  build:
    - docker pull python:3.14-slim-bookworm@sha256:9974e24551f9e7ca172cf284d85b8ab3e031d22d945f7026ede7a8279118c9f1 && docker tag python:3.14-slim-bookworm@sha256:9974e24551f9e7ca172cf284d85b8ab3e031d22d945f7026ede7a8279118c9f1 python:3.14-slim-bookworm
    - cd functions/py && uv run --locked funcd-bundle
    - CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) GOBIN= go install github.com/versity/versitygw/cmd/versitygw@v1.9.0 && cp "$(go env GOPATH)/bin/linux_$(go env GOARCH)/versitygw" dr/versitygw
  stage:
    - sql/notes-db.yaml
    - sql/notes.yaml
    - sql/notes-report.yaml
    - sql/backup.yaml
    - sql/backup-b1.yaml
    - sql/notes-db-restored.yaml
    - sql/restore-copy.yaml
    - sql/notes-restored.yaml
    - sql/restore-in-place.yaml
    - sql/changes.yaml
    - from: e2e/fixtures/notes-db-quota.yaml   # ADR-0292: notes-db capped at 1Mi
      to: sql/notes-db-quota.yaml
    # The todo App's S3 server key, workload Secrets and test identity.
    - dr
    - from: apps/todo/sql/funcdconfig.yaml
      module: github.com/pyvvo/funcd-functions
      to: funcdconfig.yaml
    - functions/ts/notes.mjs
    - functions/ts/notes.contract.yaml
    - functions/py/dist/notes_report
    # The todo App with its value sql (ADR-0236): its 1.0.0 and 1.1.0 templates, values and site, and every image its
    # lock pins; the suite pushes, locks and deploys it.
    - app
    - values
    - web
    - from: apps/todo/app/resources
      module: github.com/pyvvo/funcd-functions
      to: app-1.1.0/resources
    - from: apps/todo/app-1.1.0.yaml
      module: github.com/pyvvo/funcd-functions
      to: app-1.1.0/app.yaml
    - functions/ts/api-1.0.0.mjs
    - functions/ts/api-1.0.0.contract.yaml
    - functions/ts/api-1.1.0.mjs
    - functions/ts/api-1.1.0.contract.yaml
    - functions/ts/migrate-1.0.0.mjs
    - functions/ts/migrate-1.0.0.contract.yaml
    - functions/ts/migrate-1.1.0.mjs
    - functions/ts/migrate-1.1.0.contract.yaml
    - functions/ts/collect.mjs
    - functions/ts/collect.contract.yaml
    - functions/py/dist/planner
    - functions/py/dist/rank
    - functions/py/dist/warm
    - functions/py/dist/intake
    - functions/py/dist/stats
    - grants.yaml
    - secret.yaml
  tokens:
    admin: sql-lane-admin
    developer: sql-lane-developer
  push:
    - artifact: functions/ts/notes.mjs
      ref: notes
    - artifact: functions/py/dist/notes_report
      ref: notes-report
  apply:
    - sql/notes-db.yaml
    - sql/notes.yaml
    - sql/notes-report.yaml
    - grants.yaml
    - secret.yaml
  ready:
    kind: function
    names:
      - notes
      - notes-report
    tries: 90
  venom: e2e/sql.venom.yml

sql-examples:
  description: The SQL examples of funcd-typescript and funcd-python on real containerd, one round trip each (FEAT-0011) — Drizzle migrations and queries, full-text search with FTS5 and JSON, SQLModel with Alembic migrations and an audit trail filled by the change feed, and a Workflow whose steps share a database.
  module: github.com/pyvvo/funcd-python
  dir: examples
  # funcd-bundle writes dist/ beside each Python example, so the lane builds in a writable copy of the module.
  copy: true
  # funcd-bundle installs the bundles in the local python:3.14-slim-bookworm image: that tag first points at the
  # digest the python314 runtime image pins.
  build:
    - docker pull python:3.14-slim-bookworm@sha256:9974e24551f9e7ca172cf284d85b8ab3e031d22d945f7026ede7a8279118c9f1 && docker tag python:3.14-slim-bookworm@sha256:9974e24551f9e7ca172cf284d85b8ab3e031d22d945f7026ede7a8279118c9f1 python:3.14-slim-bookworm
    - cd sql-orders && uv run --locked funcd-bundle
    - cd sql-readings && uv run --locked funcd-bundle
  stage:
    - sql-orders/orders-db.yaml
    - sql-orders/orders.yaml
    - sql-orders/orders-migrate.yaml
    - sql-orders/audit.yaml
    - sql-orders/grant.yaml
    - sql-orders/changes.yaml
    - sql-orders/dist/orders
    - sql-orders/dist/orders-migrate
    - sql-orders/dist/audit
    - sql-readings/workflow.yaml
    - sql-readings/run.yaml
    - sql-readings/dist/ingest
    - sql-readings/dist/summarize
    # The engines post their changes to the bridge address this config sets (ADR-0235).
    - from: examples/sql-orders/funcdconfig.yaml
