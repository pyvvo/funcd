app-todo:
  description: The todo App of funcd-functions, deployed from its pushed template on real containerd (ADR-0217/0218), and the App features on it — pinned digests, a TypeScript→Python Workflow, a zoned cron timer, hooks, kept stores, a dry run, drift and pause, a config roll, rollback, liveness and dependency health, a late call, a refused binding, a requirement and a blob upload; then the disaster-recovery drill of FEAT-0009 — a backup to an S3 server in the VM, a lost data directory restored, held boot and release, the App's own backups and restores, a pre-upgrade generation, and the blob store on S3; then version 1.2.0 on rqlite — its pre-hook moving the todos and uploads from KV into a SQL database, SQL queries and a join, the change feed, and the database's backup, in-place restore and restored copy; then one Site build of the site-config App deployed into staging and prod, each serving its own generated config.json, and at the path /preview with its mount as its base.
  module: github.com/pyvvo/funcd-functions
  dir: apps/todo
  # The build writes the Python bundles into functions/py/dist/ and the S3 server into dr/, so the lane builds in a
  # writable copy of the module.
  copy: true
  optional: true
  stage:
    - app
    - values
    - web
    - fixtures
    - grants.yaml
    - secret.yaml
    - funcdconfig.yaml
    - functions/ts/api-1.0.0.mjs
    - functions/ts/api-1.0.0.contract.yaml
    - functions/ts/api-1.1.0.mjs
    - functions/ts/api-1.1.0.contract.yaml
    - functions/ts/migrate-1.0.0.mjs
    - functions/ts/migrate-1.0.0.contract.yaml
    - functions/ts/migrate-1.1.0.mjs
    - functions/ts/migrate-1.1.0.contract.yaml
    - functions/ts/api-1.2.0.mjs
    - functions/ts/api-1.2.0.contract.yaml
    - functions/ts/migrate-1.2.0.mjs
    - functions/ts/migrate-1.2.0.contract.yaml
    - functions/ts/collect.mjs
    - functions/ts/collect.contract.yaml
    - functions/py/dist/planner
    - functions/py/dist/rank
    - functions/py/dist/warm
    - functions/py/dist/intake
    - functions/py/dist/stats
    - functions/py/dist/intake_sql
    - functions/py/dist/notify
    # Version 1.1.0 is the same resources with the app.yaml of 1.1.0.
    - from: apps/todo/app/resources
      module: github.com/pyvvo/funcd-functions
      to: app-1.1.0/resources
    - from: apps/todo/app-1.1.0.yaml
      module: github.com/pyvvo/funcd-functions
      to: app-1.1.0/app.yaml
    # Version 1.2.0, which keeps its todos and uploads in todo-db: the same resources with the app.yaml of 1.2.0.
    - from: apps/todo/app/resources
      module: github.com/pyvvo/funcd-functions
      to: app-1.2.0/resources
    - from: apps/todo/app-1.2.0.yaml
      module: github.com/pyvvo/funcd-functions
      to: app-1.2.0/app.yaml
    # The App that todo requires when it is deployed with values/shared.yaml (ADR-0219).
    - from: apps/todo-shared/app
      module: github.com/pyvvo/funcd-functions
      to: todo-shared
    # The disaster-recovery block: its config, test keys and tokens, and the S3 server that serves its backup target.
    - dr
    # The reset of the shared lane VM, which the DR block's total loss runs.
    - from: scripts/lane-reset.sh
      to: dr/lane-reset.sh
    # The site-config App (ADR-0239): one Site build the suite deploys into staging and prod, and at /preview (C6).
    - from: apps/site-config
      module: github.com/pyvvo/funcd-functions
      to: site-config
  # funcd-bundle builds each Python part into functions/py/dist/ in the local python:3.14-slim-bookworm image: that tag
  # first points at the digest the python314 runtime image pins (ADR-0247). versitygw (Apache-2.0), the S3 server of
  # the DR block, is built for the VM at a pinned version.
  build:
    - docker pull python:3.14-slim-bookworm@sha256:9974e24551f9e7ca172cf284d85b8ab3e031d22d945f7026ede7a8279118c9f1 && docker tag python:3.14-slim-bookworm@sha256:9974e24551f9e7ca172cf284d85b8ab3e031d22d945f7026ede7a8279118c9f1 python:3.14-slim-bookworm
    - cd functions/py && uv run --locked funcd-bundle
    - CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) GOBIN= go install github.com/versity/versitygw/cmd/versitygw@v1.9.0 && cp "$(go env GOPATH)/bin/linux_$(go env GOARCH)/versitygw" dr/versitygw
  # The objects the App needs beside it; the Venom suite pushes, locks and deploys the App itself.
  apply:
    - grants.yaml
    - secret.yaml
  venom: e2e/app-todo.venom.yml

volumes:
  description: The volumes App of funcd-functions on real containerd with a 64 MiB volume image (ADR-0262, ADR-0266, ADR-0268) — a local volume kept across a crash and a redeploy, an emptyDir empty in every new worker, a write past a volume's size refused by its quota, each worker seeing only its own volumes and unable to change a project id or its leaf's flags, the capacity and replica refusals, a local volume lost while funcd was down reported by DataMissing and restored in place from a Backup on an S3 server in the VM, and a retained volume deleted with funcdctl volume delete.
  module: github.com/pyvvo/funcd-functions
  dir: apps/volumes
  # The probe that runs inside a worker is built from funcd's root into the lane's dir, so the lane builds in a writable
  # copy of the module. versitygw (Apache-2.0), the S3 server of the backup step, is built for the VM at the app-todo
  # lane's pinned version.
  copy: true
  build:
    - CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) go -C "$FUNCD_ROOT" build -o "$PWD/projid-probe" ./e2e/fixtures/projid-probe
    - CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) go -C "$FUNCD_ROOT" build -o "$PWD/sandbox-probe" ./e2e/fixtures/sandbox-probe
    - CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) GOBIN= go install github.com/versity/versitygw/cmd/versitygw@v1.9.0 && cp "$(go env GOPATH)/bin/linux_$(go env GOARCH)/versitygw" versitygw
  stage:
    - app
    - values
    - fixtures
    - backup
    - funcdconfig.yaml
    - functions/ts/files.mjs
    - functions/ts/files.contract.yaml
    - projid-probe
    - sandbox-probe
    - versitygw
    # The S3 server's key, the workload Secrets and the admin token of the todo App's test fixtures, which the backup
    # step uses.
    - from: apps/todo/dr/versitygw.env
      module: github.com/pyvvo/funcd-functions
      to: dr/versitygw.env
    - from: apps/todo/dr/admin.token
      module: github.com/pyvvo/funcd-functions
      to: dr/admin.token
    - from: apps/todo/dr/workload-secrets.yaml
      module: github.com/pyvvo/funcd-functions
      to: dr/workload-secrets.yaml
  # The suite pushes and deploys the App itself.
  venom: e2e/volumes.venom.yml
