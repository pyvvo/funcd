      to: sql-notes/notes-migrate.contract.yaml
    - from: examples/sql-notes/notes-db.yaml
      module: github.com/pyvvo/funcd-typescript
      to: sql-notes/notes-db.yaml
    - from: examples/sql-notes/notes.yaml
      module: github.com/pyvvo/funcd-typescript
