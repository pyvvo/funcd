# The funcd example-lane REGISTRY (ADR-0077 declarative e2e). One section per lane; the single generic
# recipe `just lima-example <name>` (host side) and the single generic VM `scripts/lima-lane.yaml`
# (guest side, through scripts/lane-provision.sh and scripts/lane-ready.sh) read the section for the lane
# being launched and drive it entirely from this data — so a new lane is just a section here + its
# manifests + a Venom suite, with NO per-lane recipe or VM YAML. `just lima-example-all` runs the lanes one
# after the other on one shared VM (ADR-0230), so every lane funcdconfig sets dataDir: /var/lib/funcd/data.
#
# Per lane:
#   module  — the pinned Go module the example lives in (ADR-0141): github.com/pyvvo/funcd-typescript,
#             github.com/pyvvo/funcd-python or github.com/pyvvo/funcd-functions (the example Apps), resolved
#             by scripts/moddir.sh (module cache or go.work). Absent = the funcd repo root. The language
#             repos commit their example builds.
#   dir     — the example directory, relative to the module root; source of the staged files.
#   copy    — true = build in a writable copy (the module cache is read-only): the whole module goes to
#             .modcopy/lane/<module>, so the example's relative references still resolve.
#   build   — host shell commands (run in the lane's dir, in order, with FUNCD_ROOT set to the funcd checkout) that
#             produce the artifacts to push. A download in one is pinned: an image by digest, a lockfile with --locked,
#             a file by its checksum (scripts/lanes_test.go holds it).
#   stage   — files/dirs (relative to dir) copied into the VM's /opt/lane (the manifests + built artifacts);
#             or {from, module, to}: a file or a directory from funcd's root (or from `module`'s root) to a tgz path.
#   push    — OCI pushes done in the guest: artifact + ref (→ oci-layout:///mnt/funcd-deps/registry:<ref>);
#             optional schema (single-file --schema), entry (bundle --entry), or site: true (a prebuilt
#             static web app dir pushed with --site, ADR-0139).
#   apply   — `funcdctl apply -f` order in the guest (after the pushes).
#   ready   — the readiness gate for `limactl start`: kind + names polled until Ready (tries × 2s). Absent = no
#             gate, for a lane whose suite deploys its resources itself.
#   tokens  — ADR-0171 static credentials, name → token. Before funcd starts, the guest writes each to
#             /etc/funcd/tokens/<name> (root, 0600) for the lane funcdconfig's auth.credentials; its funcdctl then
#             applies and probes with the `developer` token. Absent = the built-in dev token.
#   venom   — the host-side Venom suite the recipe runs once the VM is up.
#   optional — true = `just lima-example-all` skips the lane (scripts/lane.py --venom-lanes leaves it out);
#             `just lima-example <name>` still runs it.

env-echo:
  description: A JS function receiving spec.config (ConfigMap) + spec.secrets (Secret) env (ADR-0093/0057).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/env-echo
  stage:
    - env-echo.mjs
    - funcdctl.yaml
    - configmap.yaml
    - secret.yaml
    - function.yaml
    - route.yaml
    - secure-route.yaml
    # ADR-0171: the example's daemon config with auth.credentials in place of auth.token
    - from: e2e/fixtures/env-echo-funcdconfig.yaml
      to: funcdconfig.yaml
    # ADR-0143: the redeploy fixtures the Venom suite applies mid-suite
    - from: e2e/fixtures/env-echo-config-v2.yaml
      to: env-echo-config-v2.yaml
    - from: e2e/fixtures/env-echo-v2.yaml
      to: env-echo-v2.yaml
    - from: e2e/fixtures/env-echo-badtag.yaml
      to: env-echo-badtag.yaml
    - from: e2e/fixtures/env-echo-badhandler.yaml
      to: env-echo-badhandler.yaml
    # ADR-0160: a handler that takes 30 s to load, killed while it boots
    - from: e2e/fixtures/boot-hang.mjs
      to: boot-hang.mjs
    - from: e2e/fixtures/boot-hang.yaml
      to: boot-hang.yaml
    # ADR-0149: a runtime with no image, applied last by the Venom suite
    - from: e2e/fixtures/ruby3-echo.yaml
      to: ruby3-echo.yaml
    # ADR-0110 and ADR-0113: the Namespaces the Venom suite applies last, with the admin token
    - from: e2e/fixtures/env-echo-explicit-namespace.yaml
      to: env-echo-explicit-namespace.yaml
    - from: e2e/fixtures/env-echo-edge-defaults.yaml
      to: env-echo-edge-defaults.yaml
  tokens:
    admin: env-echo-lane-admin
    developer: env-echo-lane-developer
  push:
    - artifact: env-echo.mjs
      ref: env-echo
    - artifact: boot-hang.mjs
      ref: boot-hang
  apply:
    - configmap.yaml
    - secret.yaml
    - function.yaml
    # ADR-0110 (F79): a Route exposing env-echo at host env.example.com /echo (namespace stays
    # implicit, so /function/env-echo also keeps working) — proves the declarative front door.
    - route.yaml
    # ADR-0113 (F77): a Route at /secure with an `authenticated` stance — 401 without a bearer.
    - secure-route.yaml
  ready:
    kind: function
    names:
      - env-echo
    tries: 60
  venom: e2e/env-echo.venom.yml

fn-to-fn:
  description: Two JS functions with a declared synchronous fn-to-fn link (ADR-0064/0058).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/fn-to-fn
  stage:
    - greeter.mjs
    - front.mjs
    - greeter.funcdctl.yaml
    - front.funcdctl.yaml
    - greeter.yaml
    - front.yaml
    - funcdconfig.yaml
  push:
    - artifact: greeter.mjs
      ref: greeter
    - artifact: front.mjs
      ref: front
  apply:
    - greeter.yaml
    - front.yaml
  ready:
    kind: function
    names:
      - greeter
      - front
    tries: 40
  venom: e2e/fn-to-fn.venom.yml

duckdb:
  description: The catalog-quack provider + bundle consumer, live SQL round-trip (ADR-0086..0093).
  module: github.com/pyvvo/funcd-python
  dir: examples/catalog-quack
  copy: true
  # funcd-bundle (funcd-python) installs the bundle in the local python:3.14-slim-bookworm image: point that tag at the
  # digest the runtime images pin first. It downloads the DuckDB extensions: check them against their pins after.
  build:
    - uv run --locked funcd-bundle
    - cd dist/catalog-quack/duckdb-ext && grep -E "/linux_$(go env GOARCH)/(httpfs|quack)\." "$FUNCD_ROOT/images/runtime/duckdb/duckdb.sha256" | sha256sum -c - && test "$(find . -name '*.duckdb_extension' | wc -l)" -eq 2
  stage:
    - configmap.yaml
    - secret.yaml
    - bucket.yaml
    - catalogservice.yaml
    - consumer.yaml
    - dist/catalog-quack
    # ADR-0171: the example's daemon config with auth.credentials in place of auth.token
    - from: e2e/fixtures/duckdb-funcdconfig.yaml
      to: funcdconfig.yaml
    # ADR-0179: the engines in namespaces a-b and a the Venom suite applies with the admin token
    - from: e2e/fixtures/cni-engines.yaml
      to: cni-engines.yaml
  tokens:
    admin: duckdb-lane-admin
    developer: duckdb-lane-developer
  push:
    - artifact: dist/catalog-quack
      ref: catalog-reader
      entry: handler.py
  # ADR-0121: no two-phase — apply in any order. The CatalogService binds the Bucket BEFORE it exists
  # (admitted, held Ready=False/BucketNotFound), then the Bucket (owner: lake) resolves it and the engine
  # converges — a live apply-any-order proof of the Bucket↔CatalogService cycle on real containerd.
  apply:
    - configmap.yaml
    - secret.yaml
    - catalogservice.yaml
    - bucket.yaml
    - consumer.yaml
  ready:
    kind: catalogservice
    names:
      - lake
    tries: 90
  venom: e2e/duckdb.venom.yml

s3:
  description: The s3-roundtrip JS function round-trips S3 with its funcd-injected keypair + a PEP deny (ADR-0080/0085, F47).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/s3-roundtrip
  stage:
    - roundtrip.mjs
    - funcdctl.yaml
    - bucket.yaml
    - function.yaml
    - funcdconfig.yaml
    # ADR-0136 (F101): grants s3-roundtrip Blob Data Writer on the unowned `shared` prefix — the role-assigned
    # writer path (a write to a prefix it neither owns nor binds), proven live alongside the owner path.
    - rolesassignment.yaml
    # ADR-0119 (F83): the reactive-ingestion trio — a builtin-pass Workflow started when an object lands
    # under gold/, the blob EventSource that watches it, and the Sensor that binds the drop to the run.
    - ingest-workflow.yaml
    - drop-source.yaml
    - drop-sensor.yaml
    # ADR-0139 (F103): the prebuilt BI app (two builds, for the redeploy case) + the Site that adopts the
    # lakehouse Bucket, materializes the bundle under bi/<digest>/, and mounts gold/ at /data.
    - bi
    - bi-v2
    - site.yaml
    # ADR-0140 (F104): a SECOND site on the same listener, host-less ⇒ mounted at /site/docs.
    - docs
    - site-docs.yaml
  push:
    - artifact: roundtrip.mjs
      ref: s3-roundtrip
    - artifact: bi
      ref: bi
      site: true
    - artifact: bi-v2
      ref: bi-v2
      site: true
    - artifact: docs
      ref: docs
      site: true
  # ADR-0121: no two-phase — apply in any order. The Function WITH spec.blob is applied BEFORE its Bucket
  # (admitted, held Ready=False/BucketNotFound), then the Bucket (owner: s3-roundtrip) resolves it and the
  # function converges Ready — a live apply-any-order proof of the Bucket↔Function-owner cycle on real
  # containerd. Then the ADR-0119 reactive trio (the ingest Workflow, the blob EventSource, the Sensor).
  apply:
    - function.yaml
    - bucket.yaml
    # The RolesAssignment references the Function + the lakehouse/shared prefix; its admission is structural
    # (no existence gate), and the WriterLister resolves it per-request, so it applies after function+bucket.
    - rolesassignment.yaml
    - ingest-workflow.yaml
    - drop-source.yaml
    - drop-sensor.yaml
    # ADR-0139: applied AFTER bucket.yaml so the Site ADOPTS lakehouse (adds its ownerless `bi` prefix,
    # leaves gold/other/shared untouched) — the live shared-substrate case.
    - site.yaml
    - site-docs.yaml
  ready:
    kind: function
    names:
      - s3-roundtrip
    tries: 60
  venom: e2e/s3.venom.yml

kv:
  description: The kv-counter JS + Python functions increment a per-name counter via context.kv on a durable Badger store (ADR-0069/0073/0076).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/kv-counter
  # Both sides collide on the manifest and file basenames, so the Python side is staged under a py/ subdir
  # via the {from,to} form (pulling from a DIFFERENT dir than `dir`); the JS side stages at the layout root.
  # Each artifact's funcdctl.yaml sits where `funcdctl push` resolves it (ADR-0144): beside the file.
  stage:
    - counter.mjs
    - funcdctl.yaml
    - counter.yaml
    - counter-unbound.yaml   # the fail-closed negative applied in-VM by the Venom suite
    - store.yaml
    - funcdconfig.yaml
    - from: examples/kv-counter/src/counter.py
      module: github.com/pyvvo/funcd-python
      to: py/counter.py
    - from: examples/kv-counter/funcdctl.yaml
      module: github.com/pyvvo/funcd-python
      to: py/counter.funcdctl.yaml
    - from: examples/kv-counter/counter.yaml
      module: github.com/pyvvo/funcd-python
      to: py/counter.yaml
    - from: examples/kv-counter/store.yaml
      module: github.com/pyvvo/funcd-python
      to: py/store.yaml
  push:
    - artifact: counter.mjs
      ref: counter
    - artifact: py/counter.py
      ref: pycounter
  # ADR-0073 cycle break: apply each function WITHOUT spec.kv (owner exists), then the owned store, then
  # re-apply WITH spec.kv (the binding IS the capability — default-deny; ADR-0076: no read Policy needed).
  apply:
    - file: counter.yaml
      transform: python3 -c 'import sys,yaml;d=yaml.safe_load(sys.stdin);d["spec"].pop("kv",None);print(yaml.safe_dump(d))'
    - file: py/counter.yaml
      transform: python3 -c 'import sys,yaml;d=yaml.safe_load(sys.stdin);d["spec"].pop("kv",None);print(yaml.safe_dump(d))'
    - store.yaml
    - py/store.yaml
    - counter.yaml
    - py/counter.yaml
  ready:
    kind: function
    names:
      - counter
      - pycounter
    tries: 60
  venom: e2e/kv-counter.venom.yml

workflow:
  description: A Workflow (ingest→score→{hi|lo}→report→wait→pass) mixing materialized function steps with engine-native built-ins (a blocking wait + a pass transform), driven on real containerd (ADR-0094 + ADR-0096).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/workflow
  stage:
    - ingest.mjs
    - score.mjs
    - hi.mjs
    - lo.mjs
    - report.mjs
    - ingest.funcdctl.yaml
    - score.funcdctl.yaml
    - hi.funcdctl.yaml
    - lo.funcdctl.yaml
    - report.funcdctl.yaml
    - workflow.yaml
    - child.yaml
    - parent.yaml
    - run-pause.yaml
    - run-cancel.yaml
    - schedule-source.yaml
    - schedule-sensor.yaml
    - funcdconfig.yaml
  # Each step image carries --runtime nodejs22 (the dev.funcd.runtime.v1 annotation) so the workflow
  # materializer resolves its runtime from the manifest alone (ADR-0094).
  push:
    - artifact: ingest.mjs
      ref: ingest
      runtime: nodejs22
    - artifact: score.mjs
      ref: score
      runtime: nodejs22
    - artifact: hi.mjs
      ref: hi
      runtime: nodejs22
    - artifact: lo.mjs
      ref: lo
      runtime: nodejs22
    - artifact: report.mjs
      ref: report
      runtime: nodejs22
  # Apply the Workflows — orders (the main lane), plus the F70 sub-workflow pair: `scorer` (child) and
  # `pipeline` (parent, whose `sub` step runs scorer inline). The engine materializes each's owned step
  # Functions. The run manifests (run-pause/run-cancel) are applied IN-VM by the Venom suite.
  apply:
    - workflow.yaml
    - child.yaml
    - parent.yaml
  # NB: schedule-source.yaml + schedule-sensor.yaml (F68/F69) are STAGED but NOT applied at deploy — the
  # Venom suite applies them IN its final scheduled-workflow case so the timer's per-tick `orders` runs
  # don't perturb the earlier status.runs count assertions (same ordering rule as the run-replay case).
  # Readiness gate: the materialized step Functions pull + serve on containerd (they appear only after
  # each Workflow reconciles, so `funcdctl get function` tolerates a transient not-found).
  ready:
    kind: function
    names:
      - orders-ingest
      - orders-score
      - orders-hi
      - orders-lo
      - orders-report
      - scorer-s
      - pipeline-feed
    tries: 90
  venom: e2e/workflow.venom.yml

funclog:
  description: The log-burst JS + Python functions each emit >=100 logs; funcd captures them as OTLP-JSONL (ADR-0081/0084).
  module: github.com/pyvvo/funcd-typescript
  dir: examples/log-burst
  stage:
    - burst.mjs
    - funcdctl.yaml
    - burst.yaml
    - funcdconfig.yaml
    - from: examples/log-burst/src/handler.py
      module: github.com/pyvvo/funcd-python
      to: py/handler.py
    - from: examples/log-burst/funcdctl.yaml
      module: github.com/pyvvo/funcd-python
      to: py/handler.funcdctl.yaml
    - from: examples/log-burst/handler.yaml
      module: github.com/pyvvo/funcd-python
      to: py/handler.yaml
  # Both examples are named "log-burst"; the Python one deploys as "pylog-burst" (transform rewrites both
  # the metadata.name and the artifact ref) so they coexist on one daemon.
  push:
    - artifact: burst.mjs
      ref: log-burst
    - artifact: py/handler.py
      ref: pylog-burst
  apply:
    - burst.yaml
    - file: py/handler.yaml
      transform: "sed -e 's/name: log-burst/name: pylog-burst/' -e 's#:log-burst#:pylog-burst#'"
  ready:
    kind: function
    names:
      - log-burst
      - pylog-burst
    tries: 60
  venom: e2e/funclog.venom.yml

egress:
  description: The egress-probe JS function proves ADR-0117 (F81) egress enforcement on real containerd — default-deny with no EgressPolicy, allow via a wildcard-domain / CIDR EgressPolicy, and the audit trail.
  module: github.com/pyvvo/funcd-typescript
  dir: examples/egress-probe
  stage:
    - probe.mjs
    - funcdctl.yaml
    - function.yaml
    - egresspolicy-wildcard.yaml   # applied MID-SUITE by the Venom allow-cases (deny-then-allow ordering)
    - egresspolicy-cidr.yaml       # applied MID-SUITE by the Venom CIDR allow-case
    - funcdconfig.yaml             # the ONLY lane funcdconfig with server.network.egress on (F80+F81 armed)
  push:
    - artifact: probe.mjs
      ref: egress-probe
  # Only the Function is applied at deploy. The EgressPolicies are applied IN-VM by the Venom suite so the
  # default-deny (no policy) case is observable BEFORE any allow-list exists — the deny-then-allow ordering.
  apply:
    - function.yaml
  ready:
    kind: function
    names:
      - egress-probe
    tries: 60
  venom: e2e/egress.venom.yml

sql:
  description: SQL databases on real containerd (ADR-0232/0233/0234/0235) — a Drizzle TypeScript owner and a SQLModel Python reader of one rqlite engine, a refused write, an all-or-nothing batch, rows that survive an engine kill and a daemon restart, a 100 MB database backed up to an S3 server in the VM and restored under a new name, lost engine data reported and restored in place, and a new row that starts a Function through a Sensor.
  module: github.com/pyvvo/funcd-functions
  dir: apps/todo
  # funcd-bundle writes dist/ beside the Python project, so the lane builds in a writable copy of the module.
  copy: true
  # funcd-bundle installs the bundle in the local python:3.14-slim-bookworm image: that tag first points at the digest
  # the python314 runtime image pins.
  # versitygw (Apache-2.0), the S3 server of the backup steps, is built for the VM at the app-todo lane's pinned version.
  build:
    - docker pull python:3.14-slim-bookworm@sha256:48b13b003dda20b16f9442b8475aa05fe21bf6579a8c881db92ffb4d8fd20f83 && docker tag python:3.14-slim-bookworm@sha256:48b13b003dda20b16f9442b8475aa05fe21bf6579a8c881db92ffb4d8fd20f83 python:3.14-slim-bookworm
    - cd functions/py && uv run --locked funcd-bundle
    - CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) GOBIN= go install github.com/versity/versitygw/cmd/versitygw@v1.8.0 && cp "$(go env GOPATH)/bin/linux_$(go env GOARCH)/versitygw" dr/versitygw
  stage:
    - sql/notes-db.yaml
    - sql/notes.yaml
    - sql/notes-report.yaml
    - sql/backup.yaml
    - sql/backup-b1.yaml
    - sql/notes-db-restored.yaml
    - sql/restore-copy.yaml
    - sql/notes-restored.yaml
    - sql/restore-in-place.yaml
    - sql/changes.yaml
    # The todo App's S3 server key, workload Secrets and test identity.
    - dr
    - from: apps/todo/sql/funcdconfig.yaml
      module: github.com/pyvvo/funcd-functions
      to: funcdconfig.yaml
    - functions/ts/notes.mjs
    - functions/ts/notes.funcdctl.yaml
    - functions/py/dist/notes_report
  tokens:
    admin: sql-lane-admin
    developer: sql-lane-developer
  push:
    - artifact: functions/ts/notes.mjs
      ref: notes
    - artifact: functions/py/dist/notes_report
      ref: notes-report
      entry: notes_report.py
  apply:
    - sql/notes-db.yaml
    - sql/notes.yaml
    - sql/notes-report.yaml
  ready:
    kind: function
    names:
      - notes
      - notes-report
    tries: 90
  venom: e2e/sql.venom.yml

app-todo:
  description: The todo App of funcd-functions, deployed from its pushed template on real containerd (ADR-0217/0218), and the App features on it — pinned digests, a TypeScript→Python Workflow, a zoned cron timer, hooks, kept stores, a dry run, drift and pause, a config roll, rollback, liveness and dependency health, a late call, a refused binding, a requirement and a blob upload; then the disaster-recovery drill of FEAT-0009 — a backup to an S3 server in the VM, a lost data directory restored, held boot and release, the App's own backups and restores, a pre-upgrade generation, and the blob store on S3.
  module: github.com/pyvvo/funcd-functions
  dir: apps/todo
  # The build writes the S3 server into dr/, so the lane builds in a writable copy of the module.
  copy: true
  optional: true
  stage:
    - app
    - values
    - web
    - fixtures
    - grants.yaml
    - secret.yaml
    - funcdconfig.yaml
    - functions/ts/api-1.0.0.mjs
    - functions/ts/api-1.0.0.funcdctl.yaml
    - functions/ts/api-1.1.0.mjs
    - functions/ts/api-1.1.0.funcdctl.yaml
    - functions/ts/migrate-1.0.0.mjs
    - functions/ts/migrate-1.0.0.funcdctl.yaml
    - functions/ts/migrate-1.1.0.mjs
    - functions/ts/migrate-1.1.0.funcdctl.yaml
    - functions/ts/collect.mjs
    - functions/ts/collect.funcdctl.yaml
    - functions/py/planner.py
    - functions/py/planner.funcdctl.yaml
    - functions/py/rank.py
    - functions/py/rank.funcdctl.yaml
    - functions/py/warm.py
    - functions/py/warm.funcdctl.yaml
    - functions/py/intake.py
    - functions/py/intake.funcdctl.yaml
    # Version 1.1.0 is the same resources with the app.yaml of 1.1.0.
    - from: apps/todo/app/resources
      module: github.com/pyvvo/funcd-functions
      to: app-1.1.0/resources
    - from: apps/todo/app-1.1.0.yaml
      module: github.com/pyvvo/funcd-functions
      to: app-1.1.0/app.yaml
    # The App that todo requires when it is deployed with values/shared.yaml (ADR-0219).
    - from: apps/todo-shared/app
      module: github.com/pyvvo/funcd-functions
      to: todo-shared
    # The disaster-recovery block: its config, test keys and tokens, and the S3 server that serves its backup target.
    - dr
    # The reset of the shared lane VM, which the DR block's total loss runs.
    - from: scripts/lane-reset.sh
      to: dr/lane-reset.sh
  # versitygw (Apache-2.0), the S3 server of the DR block, built for the VM at a pinned version.
  build:
    - CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) GOBIN= go install github.com/versity/versitygw/cmd/versitygw@v1.8.0 && cp "$(go env GOPATH)/bin/linux_$(go env GOARCH)/versitygw" dr/versitygw
  # The objects the App needs beside it; the Venom suite pushes, locks and deploys the App itself.
  apply:
    - grants.yaml
    - secret.yaml
  venom: e2e/app-todo.venom.yml
