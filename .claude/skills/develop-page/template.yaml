# The shape of a feature's Usage page, docs/guide/develop/<group>/<feature>/index.md. The develop-page skill writes
# pages to it, .claude/rules/docs-guide.md holds the writing rules, and pkg/funcd's TestDevelopPagesFollowTheTemplate
# holds every feature page to its sections. It fixes outcomes and an order, not a full outline: a section appears
# only when it explains a real task, decision or behavior of the feature.
first:
  heading: Usage
  holds: >-
    State the purpose and task briefly, then reach the first runnable example. Link the Platform page rather
    than repeating its concepts. Give the prerequisites, the working directory, every input, the
    commands; the expected result; and a step that checks it. A setting that the example needs for access or
    persistence is stated before the step it affects. The example runs the way its type needs: funcdctl dev for a
    service or a workload, a resource manifest such as a namespace or a grant applied to a running platform, the
    tool itself for a tool, and funcd --config for the server's configuration. Each language that has a lane example
    gets its own "### TypeScript" or "### Python" section after the text both languages share, and the two sections
    perform the same task. Keep only explanation needed for the task; link reference detail. Brevity must preserve
    complete English, required setup, access, waits, verification, recovery and data-loss behavior.
  example:
    service: a handler that uses the service, its manifest, the command that runs it, a call, and the answer that shows the result
    workload: a small workload, the command that starts or applies it, a call or a watch, and its expected status; include or link its manifest where the task needs it
    tool: one task done with the tool, its command and its output; the installation is linked, not repeated
    cross-cutting: the actions that produce the feature's result, such as a grant applied and the call that it allows
free:
  holds: >-
    One task per section, under a heading that names the task, such as "Renew a claim", between the first section and
    the optional ones: prose and included regions, each language's code under its own heading after the text both
    share. A task that a reader meets when calls race, such as a conditional write, gets its own section. Remove
    explanations that repeat another section or merely describe the code.
optional:
  - heading: Access
    holds: >-
      Only for a feature whose calls an authorizer checks. First what a Function gets by itself from its declaration,
      binding or ownership, each with its Cedar action, linking the Security page; then, when a role exists and is
      needed, the smallest built-in role, its scope and a tested RolesAssignment, included as YAML; then the policy
      that funcd supplies, quoted in a cedar block titled for what it is, such as "Built-in KV policy"; then the scope
      rules and a denial that a reader may meet. The automatic part says what a Function can do in ordinary words; the
      policy's internal names stay in its block. A feature with no role or no policy leaves that part out.
  - heading: Limits and quotas
    holds: The limits a reader meets, from doc tags and constants, with a link to the Spec tab.
  - heading: Data storage
    holds: >-
      Only for a feature that stores data on the server: where it is stored, the default, whether it survives a
      restart, and the settings that change or override that.
  - heading: Status
    holds: >-
      A compact table of phases or conditions, reasons and meanings, with the command that checks them. Keep
      exceptions that change the next action, such as Ready without an exposed address, and necessary recovery steps.
  - heading: Changes and deletion
    holds: What an update or a delete does to running work and data.
  - heading: CLI errors
    holds: >-
      Local command or setup failures, in a table with the message or cause and the action to take. HTTP response
      errors and server-validation errors belong in the separate API Reference, even when a CLI prints them.
      Omit this section when no relevant local CLI failure exists.
  - heading: Errors
    legacy: true
    holds: >-
      An unchanged page may retain this heading until it is rewritten. New and rewritten pages use CLI errors
      for local failures and move HTTP/API catalogues to the reference.
  - heading: Run it locally
    holds: >-
      What is specific to local development: its prerequisites and behavior, how it differs from a deployed service,
      its local state and how to clean it up. It does not repeat the first example.
  - heading: Deploy it
    holds: >-
      Run the first example on a platform and verify its result. Push an artifact only when required; apply resource
      manifests with funcdctl apply; start funcd with --config for the server's configuration.
last:
  heading: Examples
  holds: >-
    Required when the page includes a lane example: one link or more, each to a folder that a lane in
    scripts/lanes.yaml runs, on its repository's main branch; each folder exists in the module that go.mod pins.
refused:
  - Read and write
  - Quotas
  - Variants
  - Methods
  - API
