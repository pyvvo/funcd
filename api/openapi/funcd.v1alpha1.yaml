          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
        plan:
          $ref: "#/components/schemas/AppPlan"
          description: "What the write would make the rollout do, set only in the answer to a dry-run write (dryRun=true) and never stored. It leaves timing out: a hold, a pause or an unmet requirement does not show."
        requiredBy:
          description: The Apps of this namespace whose spec.requires names this App, sorted by name.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        requires:
          description: The state of each spec.requires entry, in its order.
          items:
            $ref: "#/components/schemas/AppRequirementState"
          type:
            - array
            - "null"
        version:
          description: The spec.version of the current revision.
          type: string
      type: object
    AssignmentEntry:
      additionalProperties: false
      properties:
        principal:
          $ref: "#/components/schemas/PrincipalRef"
          description: Who the entry grants its role to. When unset, spec.principal.
        roleRef:
          $ref: "#/components/schemas/RoleRef"
          description: The role the entry grants.
        scope:
          $ref: "#/components/schemas/ScopeRef"
          description: Where the entry's role applies. When unset, spec.scope.
      required:
        - roleRef
      type: object
    Backup:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/BackupSpec"
        status:
          $ref: "#/components/schemas/BackupStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    BackupEncryption:
      additionalProperties: false
      properties:
        recipients:
          description: "The age recipients, each entry one recipient: at least 2 distinct ones, such as an owner's and a recovery one, all X25519 or all hybrid (age1pq1). Every member file of each Backup is sealed to all of them, so the identity of any one opens it. The copy's manifest.yaml, which names the members, their files' sizes and these recipients' fingerprints, is not sealed."
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - recipients
      type: object
    BackupMember:
      additionalProperties: false
      properties:
        bytes:
          description: The size of the member's sealed copy on the target, in bytes.
          format: int64
          type: integer
        kind:
          description: "The member's kind: KVStore, Bucket, Lake, SQLDatabase, or Function for a Function's local volume."
          type: string
        name:
          description: "The member's name: the store's, or for a volume, its Function's."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        volume:
          description: With kind Function, the name of the Function's local volume that the member is.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - kind
        - name
      type: object
    BackupSchedule:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/BackupScheduleSpec"
        status:
          $ref: "#/components/schemas/BackupScheduleStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    BackupScheduleSpec:
      additionalProperties: false
      properties:
        encryption:
          $ref: "#/components/schemas/BackupEncryption"
          description: "The age recipients that seal the member files of each Backup. It is required: a schedule with fewer than 2 recipients is refused."
        paused:
          description: While true, the schedule creates no Backup and rpoRisk stays false; a Backup created by hand still runs. Once it is false again, the slots missed meanwhile collapse into one Backup.
          type: boolean
        schedule:
          description: "The cron slots at which the schedule creates a Backup: 5 fields (minute hour day-of-month month day-of-week) or a macro such as @daily, in timeZone. Slots missed during downtime, a pause or a hold collapse into one Backup, and a slot that comes while one of the schedule's Backups is Pending or Running creates none."
          type: string
        scope:
          $ref: "#/components/schemas/BackupScope"
          description: "The stores each Backup copies, in one form: the lists kvStores, buckets, lakes, databases and volumes, or app, or resourceGroup. funcd resolves it at each run: a member or App it names that is missing then fails the Backup with reason MemberNotFound, and a scope of more than workloadBackup.maxCopyMembers members fails it with no copy written. In an App's spec.backupSchedules entry, an empty scope backs up that App."
        target:
          $ref: "#/components/schemas/BackupTarget"
          description: "Where each Backup writes its copy: an S3 bucket and the Secret of its write key."
        timeZone:
          description: The IANA time zone of schedule, such as Europe/Paris; UTC when empty.
          type: string
        ttl:
          description: "How long funcd keeps each Backup's record after its creation; 0s or unset means 720h. Only the record goes: the copy stays on the target until the target's own lifecycle rule expires it. A Backup may set a shorter spec.ttl, never a longer one."
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
      required:
        - schedule
        - scope
        - target
      type: object
    BackupScheduleStatus:
      additionalProperties: false
      properties:
        active:
          description: A Backup of the schedule that is Pending or Running, empty when none is.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        earliestRestorePoint:
          description: "When the oldest of the schedule's Succeeded Backups that still exist started: the oldest point a Restore can go back to."
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        lastScheduleTime:
          description: The newest slot the schedule has taken, whether it created a Backup or, finding one of its Backups still Pending or Running, created none.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        lastSuccessTime:
          description: When the newest of the schedule's Succeeded Backups that still exist completed.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
        rpoRisk:
          description: "True when the schedule has fallen behind: the first slot after the start of its newest Succeeded Backup, or after its creation when there is none, has passed with that slot's Backup Failed or missing, or a second slot has passed. It stays false while the schedule is paused. funcd logs workload backup rpo at risk when it turns true."
          type: boolean
      type: object
    BackupScope:
      additionalProperties: false
      properties:
        app:
          description: "An App of the namespace: each Backup copies the stores of its kv, buckets, lakes and sql entries, ref entries included, and the local volumes of the Functions it declares. Set it alone, with no other scope field."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        buckets:
          description: "Buckets of the namespace to copy, by name, each once. A Bucket's copy holds none of the data of the Lakes located on its prefixes: each of them is copied as a member of its own."
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        databases:
          description: SQLDatabases of the namespace to copy, by name, each once. A database whose engine is not Ready fails the Backup with reason EngineNotReady.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        kvStores:
          description: KVStores of the namespace to copy, by name, each once.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        lakes:
          description: Lakes of the namespace to copy, by name, each once. A Lake located on a prefix of a listed Bucket is copied without being named here. A Lake that deletes files during each of a run's copies, as a busy one may, fails the Backup with reason LakeUnstable, and so does a Bucket that brings it in.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        resourceGroup:
          description: "A resource group of the namespace: each Backup copies its KVStores, Buckets, Lakes and SQLDatabases, but not its Functions' local volumes. Set it alone, with no other scope field."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        volumes:
          description: Local volumes of the namespace's Functions to copy, each as <function>/<name>, both DNS-1123 labels, and listed once. A volume is read live, file by file, so its copy is not a single point in time.
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    BackupSpec:
      additionalProperties: false
      properties:
        schedule:
          description: "The BackupSchedule of the namespace whose scope, target and recipients the run uses, read when the run starts: a schedule gone by then fails the Backup with reason ScheduleNotFound. The schedule's status counts every Backup that names it."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        ttl:
          description: How long funcd keeps the record after its creation; 0s or unset means the schedule's ttl, or 720h when the schedule does not exist. A ttl longer than the schedule's is refused.
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
      required:
        - schedule
      type: object
    BackupStatus:
      additionalProperties: false
      properties:
        completionTime:
          description: When the run ended, Succeeded or Failed.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        expireTime:
          description: "When funcd deletes this record, once the run has ended: the Backup's creation plus its spec.ttl, else plus its schedule's ttl. The copy on the target stays until the target's own lifecycle rule removes it."
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        members:
          description: "The stores the copy holds, which a Restore names as they are listed here. A Bucket's member holds none of the data of the Lakes located on its prefixes: each of them is a member of its own."
          items:
            $ref: "#/components/schemas/BackupMember"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        path:
          description: The copy's directory on the target, <namespace>/<backup>-<uid>/.
          type: string
        phase:
          description: "Pending, then Running, then Succeeded or Failed, in one attempt: funcd does not retry a failed Backup. A Backup that was Running when funcd stopped ends at the next start, Succeeded with reason FoundOnTarget when its copy is whole on the target, else Failed with reason Interrupted."
          enum:
            - Pending
            - Running
            - Paused
            - Succeeded
            - Failed
            - Cancelled
          type: string
        recipients:
          description: Fingerprints of the age recipients the copy is sealed to, sorted. A Restore whose identity matches none of them fails, its message naming both sets of fingerprints. A Backup recorded with reason FoundOnTarget lists none.
          items:
            type: string
          type:
            - array
            - "null"
        startTime:
          description: When the run began.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        target:
          description: "The target URL the run wrote to: its schedule's spec.target.url at the time. A Restore reads the copy there."
          type: string
      type: object
    BackupTarget:
      additionalProperties: false
      properties:
        credentialsSecret:
          description: "A Secret of the namespace with AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and, optionally, AWS_SESSION_TOKEN: the key each Backup writes with. It needs only put and list on the bucket."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        url:
          description: "The s3:// URL of the bucket that receives the copies, its options as query parameters, such as s3://backups?region=eu-west-3. The bucket of blob.target is refused, and another bucket on its endpoint is accepted with reason SameProvider on the schedule's Ready condition: one failure of that provider takes both. The bucket must accept a create-if-absent put (If-None-Match: *): a bucket that refuses it fails each Backup with reason TargetUnconditional."
          type: string
      required:
        - url
        - credentialsSecret
      type: object
    BlobEvent:
      additionalProperties: false
      properties:
        name:
          description: "The event's name, unique among the source's events: the type of each CloudEvent it fires, and the event a Sensor dependency names."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        "on":
          description: The object changes that fire the event. Created, the only one, fires for each new object and again when an object is rewritten with another size or modification time; empty means Created.
          items:
            type: string
          type:
            - array
            - "null"
        prefix:
          description: "The key prefix the event watches: only objects whose key starts with it fire, and empty means the whole Bucket. When the source is created or this prefix changes, the objects already under it fire too, to the Sensors subscribed then: an object that no Sensor got counts as seen."
          type: string
      required:
        - name
      type: object
    BlobRef:
      additionalProperties: false
      properties:
        bucket:
          description: The Bucket that holds the Site's bundles, in the Site's namespace.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        prefix:
          description: "The prefix of that Bucket under which the Site stores each bundle, at <prefix>/sha256-<hex>/, and the config.json that runtimeConfig generates. It cannot change once the Site exists: a new prefix needs a new Site."
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - bucket
        - prefix
      type: object
    BlobServiceSpec:
      additionalProperties: false
      properties:
        binding:
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - binding
      type: object
    BlobSource:
      additionalProperties: false
      properties:
        bucket:
          description: The Bucket, in this namespace, whose objects fire the events. Until it exists, the source is not Ready, with reason BucketNotFound, and watches nothing.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        events:
          description: "The source's events: at least one, with unique names, each watching the objects under its prefix."
          items:
            $ref: "#/components/schemas/BlobEvent"
          type:
            - array
            - "null"
      required:
        - bucket
        - events
      type: object
    Bucket:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/BucketSpec"
        status:
          $ref: "#/components/schemas/BucketStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    BucketPrefix:
      additionalProperties: false
      properties:
        name:
          description: The prefix's name, unique within the Bucket. Over S3, it is the first segment of each object's key.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        owner:
          $ref: "#/components/schemas/PrefixOwner"
          description: The one Function or Lake that may write the prefix, besides the writers that a RolesAssignment names. In a Bucket that a Function or a Lake declares by name, an omitted owner is that Function or Lake. The prefix that a Site serves its bundle from must have no owner, since the Site writes its builds there; the prefixes of a Site's ingress rules may have one.
        quota:
          $ref: "#/components/schemas/SizeQuota"
          description: "A cap on the prefix's total size: a write into the prefix must fit both this cap and the Bucket's, and while it is set funcd refuses to sign a presigned PUT URL into the prefix, with 403. It also caps a Lake's files under the prefix, though not the Lake's catalog."
      required:
        - name
      type: object
    BucketQuota:
      additionalProperties: false
      properties:
        maxBytes:
          description: The same cap as a number of bytes. Set maxSize or maxBytes, not both.
          format: int64
          minimum: 0
          type: integer
        maxObjectBytes:
          description: The largest object a write may store, in bytes. A larger write gets 413, or EntityTooLarge over S3, and while it is set funcd refuses to sign a presigned PUT URL for the Bucket, with 403. 0 sets no cap of the Bucket's own, so only funcd's upload limits apply, such as s3gateway.maxUploadBytes.
          format: int64
          minimum: 0
          type: integer
        maxSize:
          description: The cap on the total size held, above zero. Set maxSize or maxBytes, not both; neither means no cap. A write that would pass the cap gets 507.
          pattern: ^[0-9]{1,15}((Ki|Mi|Gi|Ti)B?)?$
          patternDescription: "a size: 1 to 15 digits and an optional binary unit, Ki, Mi, Gi or Ti, with or without a B (512Ki, 2GiB)"
          type: string
      type: object
    BucketSpec:
      additionalProperties: false
      properties:
        prefixes:
          description: The Bucket's prefixes, each a key space with its own owner and cap. Prefix names are unique within the Bucket. A Function or a Lake that binds a prefix the Bucket does not list waits, with the reason BucketNotFound.
          items:
            $ref: "#/components/schemas/BucketPrefix"
          type:
            - array
            - "null"
        quota:
          $ref: "#/components/schemas/BucketQuota"
          description: Caps on the Bucket's total size and on each object. While the Bucket has a size cap, funcd refuses to sign a presigned PUT URL for it, with 403.
      required:
        - prefixes
      type: object
    BucketStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    BuiltinStep:
      additionalProperties: false
      properties:
        pass:
          description: "A ${{ }} JavaScript expression whose value is the step's output, over input, the run input, and step.<name>.output of each step it follows. It is checked only when the step runs: an error fails the step. Exactly one of wait and pass."
          type: string
        wait:
          description: "How long the step waits before it succeeds with its input as its output: a duration such as 30s, checked at apply, or a ${{ }} expression that must yield one when the step runs. The wait counts toward the run's timeout, and a cancel ends it. Exactly one of wait and pass."
          type: string
      type: object
    Condition:
      additionalProperties: false
      properties:
        lastTransitionTime:
          description: When the status last changed.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        message:
          description: A sentence that explains the status.
          type: string
        observedGeneration:
          description: The object's generation when funcd set the condition.
          format: int64
          type: integer
        reason:
          description: A short CamelCase reason for the status.
          type: string
        status:
          description: Whether the condition holds.
          type: string
        type:
          description: What the condition reports, such as Ready.
          type: string
      required:
        - type
        - status
      type: object
    ConfigMap:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/ConfigMapSpec"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    ConfigMapSpec:
      additionalProperties: false
      properties:
        data:
          additionalProperties:
            type: string
          description: "Keys and their string values, for settings that are not secret. Each key is an environment variable name: ASCII letters, digits and _, not starting with a digit. Each worker of a Function that lists the ConfigMap in bindings.config gets each key as an environment variable when it starts, except a key that starts with FUNCD_ or that a bound Secret also holds. A Lake that lists it gives its engine only the keys that the Lake's bindings.config lets through."
          type: object
      type: object
    DeadLetter:
      additionalProperties: false
      properties:
        action:
          type: string
        attempts:
          format: int64
          type: integer
        event:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        failedAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        id:
          type: string
        namespace:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        payload: {}
        reason:
          type: string
        sensor:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        source:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - id
        - namespace
        - sensor
        - source
        - event
        - action
        - payload
        - attempts
        - reason
        - failedAt
      type: object
    DeadLetterListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/DeadLetter"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Dependency:
      additionalProperties: false
      properties:
        event:
          description: The name of one of that EventSource's events, which is the type of each CloudEvent the dependency receives.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        name:
          description: The dependency's name, unique among the Sensor's dependencies; an action's on names it.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        source:
          description: The name of an EventSource in the Sensor's namespace.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - name
        - source
        - event
      type: object
    EdgeAuth:
      additionalProperties: false
      properties:
        mode:
          description: "authenticated admits only a caller whose token, sent as Authorization: Bearer or X-Api-Key, may get the namespace's Functions; others get 401 or 403, and every caller gets 401 while server.auth.edge is off. open, or empty, admits anyone."
          enum:
            - ""
            - authenticated
            - open
          type: string
      type: object
    EdgeDefaults:
      additionalProperties: false
      properties:
        auth:
          $ref: "#/components/schemas/EdgeAuth"
          description: "The default edge authentication of the namespace's Routes and of its Functions' and Sites' own addresses, used where a rule, its Route and spec.ingress.auth set none; unset is open. It is a default, not a floor: a rule or a Route that sets open stays open."
      type: object
    EgressPolicy:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/EgressPolicySpec"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    EgressPolicySpec:
      additionalProperties: false
      properties:
        appliesTo:
          description: The Functions of the namespace, by name, that the rules apply to; empty applies them to every Function of the namespace.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        rules:
          description: One to 64 rules, each allowing outbound TCP connections; the rules of every EgressPolicy of the namespace add up. With server.network.egress on, on Linux with containerd, a connection that nothing allows is refused; otherwise the rules change nothing.
          items:
            $ref: "#/components/schemas/EgressRule"
          type:
            - array
            - "null"
      required:
        - rules
      type: object
    EgressRule:
      additionalProperties: false
      properties:
        ports:
          description: The destination ports the rule allows, each 1 to 65535, at most 32; empty allows every port.
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        to:
          $ref: "#/components/schemas/EgressTo"
          description: "Where the rule allows connections to: at least one domain or CIDR, and at most 64 of them together. A connection matches the rule when it goes to one of them on one of the rule's ports."
      required:
        - to
      type: object
    EgressTo:
      additionalProperties: false
      properties:
        cidrs:
          description: Address ranges, such as 10.0.0.0/8, that the dialled address must fall in. A host reached by name needs a domains entry too, since funcd answers a worker's lookup only for a name that a domain rule applying to it allows.
          items:
            type: string
          type:
            - array
            - "null"
        domains:
          description: "Host names in lower case: exact, such as api.x.com, or a wildcard, such as *.x.com, which matches every name under x.com but not x.com. A connection matches a name only at an address that the worker's own lookup of it through funcd returned, within the answer's TTL, and never at an address that is not globally reachable, such as a private one, which needs a cidrs entry."
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    EventSource:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/EventSourceSpec"
        status:
          $ref: "#/components/schemas/EventSourceStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    EventSourceSpec:
      additionalProperties: false
      properties:
        blob:
          $ref: "#/components/schemas/BlobSource"
          description: Events that fire on new and rewritten objects of a Bucket in this namespace, which funcd lists every eventing.blobPollInterval. A firing's data has the fields bucket, key, size, version and time, the object's modification time. Exactly one of timer, blob and sql.
        sql:
          $ref: "#/components/schemas/SQLSource"
          description: Events that fire on row changes in a SQLDatabase of this namespace. A firing's data has the fields op, table, rowId and index, and before, after and commitTimestamp when the change carries them; when before and after together pass 256 KiB, both are dropped and truncated is true. Exactly one of timer, blob and sql.
        timer:
          $ref: "#/components/schemas/TimerSource"
          description: Events that fire on a schedule, each on its own interval or cron expression; a firing's data is an empty object. Exactly one of timer, blob and sql.
      type: object
    EventSourceStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    Evidence:
      additionalProperties: false
      properties:
        bucketOrphans:
          items:
            type: string
          type:
            - array
            - "null"
        counts:
          additionalProperties:
            format: int64
            type: integer
          type: object
        deadLetters:
          items:
            type: string
          type:
            - array
            - "null"
        functionsNotReady:
          items:
            type: string
          type:
            - array
            - "null"
        held:
          type: boolean
        marker:
          $ref: "#/components/schemas/Marker"
        namespaces:
          items:
            $ref: "#/components/schemas/NamespaceHold"
          type:
            - array
            - "null"
        orphans:
          items:
            type: string
          type:
            - array
            - "null"
        pausedRuns:
          items:
            type: string
          type:
            - array
            - "null"
        pending:
          additionalProperties:
            additionalProperties:
              format: int64
              type: integer
            type: object
          type: object
        quarantine:
          items:
            $ref: "#/components/schemas/QuarantineEntry"
          type:
            - array
            - "null"
        releasedAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        report: {}
        sqlOrphans:
          items:
            type: string
          type:
            - array
            - "null"
        volumeOrphans:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - held
      type: object
    Failure:
      additionalProperties: false
      properties:
        error:
          type: string
        time:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
      required:
        - time
        - error
      type: object
    FaultError:
      additionalProperties: false
      properties:
        detail:
          type: string
        instance:
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
        - detail
      type: object
    Function:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/FunctionSpec"
        status:
          $ref: "#/components/schemas/FunctionStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    FunctionBindings:
      additionalProperties: false
      properties:
        blob:
          description: The Bucket prefixes the code reaches through ctx.blob, and over S3 while the S3 gateway is on, each under its alias. The binding grants reads; only the prefix's owner and the writers that a RolesAssignment names may write. A Bucket or prefix that does not exist yet holds the Function in Pending with BucketNotFound.
          items:
            $ref: "#/components/schemas/FunctionBlob"
          type:
            - array
            - "null"
        config:
          description: ConfigMaps whose keys each worker gets as environment variables when it starts, a later ConfigMap's value winning for a key that both hold. A key that starts with FUNCD_, or that a bound Secret holds, is left out, and a missing ConfigMap holds the Function Failed with ConfigResolveFailed.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        kv:
          description: The KV tables the code reaches through ctx.kv, each under its alias. The binding grants reads; only the table's owner and the writers that a RolesAssignment names may write. A store or table that does not exist yet holds the Function in Pending with KVStoreNotFound.
          items:
            $ref: "#/components/schemas/FunctionKV"
          type:
            - array
            - "null"
        lake:
          description: The Lakes the code queries, each under its alias. The Function waits in Pending with LakeNotReady until every bound Lake is Ready.
          items:
            $ref: "#/components/schemas/FunctionLake"
          type:
            - array
            - "null"
        links:
          description: "The Functions the code calls, each under its alias: through ctx.invoke one whose protocol is cloudevent, through ctx.fetch one whose protocol is http. Each target must exist in the namespace when this Function is applied, the namespace's links form no cycle, and a Function that a link targets cannot be deleted until the link goes."
          items:
            $ref: "#/components/schemas/FunctionLink"
          type:
            - array
            - "null"
        secret:
          description: Secrets whose keys the code reads through ctx.secret, on each read and with no cache, a later Secret's value winning for a key that both hold. No value reaches the worker's environment, and no worker starts until each one can be read.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        sql:
          description: The SQLDatabases the code queries through ctx.sql, each under its alias. The binding grants reads; only the database's owner and the writers that a RolesAssignment names may write. A database that does not exist yet holds the Function in Pending with SQLDatabaseNotFound.
          items:
            $ref: "#/components/schemas/FunctionSQL"
          type:
            - array
            - "null"
      type: object
    FunctionBlob:
      additionalProperties: false
      properties:
        alias:
          description: The binding's name, unique in the list; code that reaches the prefix through ctx.blob passes it.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        bucket:
          description: The Bucket, in the same namespace, that holds the prefix.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        prefix:
          description: The prefix, by its name in the Bucket's prefixes.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - alias
        - bucket
        - prefix
      type: object
    FunctionKV:
      additionalProperties: false
      properties:
        alias:
          description: The binding's name, unique in the list, which the code passes to ctx.kv.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        store:
          description: The KVStore, in the same namespace, that holds the table.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        table:
          description: The table, by its name in the store's tables.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - alias
        - store
        - table
      type: object
    FunctionLake:
      additionalProperties: false
      properties:
        alias:
          description: The binding's name, unique in the list. Each worker reads the Lake's address and its token from FUNCD_LAKE_<ALIAS>_URL and FUNCD_LAKE_<ALIAS>_TOKEN, the alias upper-cased.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        lake:
          description: The Lake to query, in the same namespace.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - alias
        - lake
      type: object
    FunctionLink:
      additionalProperties: false
      properties:
        alias:
          description: The link's name, unique in the list, which the code passes to ctx.invoke or ctx.fetch.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        target:
          description: The Function to call, in the same namespace.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        timeout:
          description: "Bounds the synchronous call, a cold-start wake included: 0s to 5m; 0s or unset means the 30s link default."
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
      required:
        - alias
        - target
      type: object
    FunctionSQL:
      additionalProperties: false
      properties:
        alias:
          description: The binding's name, unique in the list, which the code passes to ctx.sql.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        database:
          description: The SQLDatabase to query, in the same namespace.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - alias
        - database
      type: object
    FunctionSpec:
      additionalProperties: false
      properties:
        bindings:
          $ref: "#/components/schemas/FunctionBindings"
          description: "What the code may use: KV tables, Bucket prefixes, SQL databases, Lakes and other Functions, each under an alias, and ConfigMaps and Secrets. A binding is the grant: a call on an alias with no binding is refused with 403. Each store, Lake, ConfigMap and Secret it names must be declared at the root, in this spec's kv, buckets, sql, lakes, configMaps or secrets, or in the App's for an App's part."
        buckets:
          description: "The Buckets the Function declares: by name it creates and owns one, and a Bucket of that name that it does not own holds it in Pending with StoreNotOwned; by ref it uses an existing one. spec.bindings.blob binds only a declared Bucket, and a prefix with no owner gets the Function as its owner. An App's part declares none and binds those that the App declares."
          items:
            additionalProperties: false
            properties:
              deletion:
                description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                enum:
                  - retain
                  - delete
                type: string
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              prefixes:
                description: The Bucket's prefixes, each a key space with its own owner and cap. Prefix names are unique within the Bucket. A Function or a Lake that binds a prefix the Bucket does not list waits, with the reason BucketNotFound.
                items:
                  $ref: "#/components/schemas/BucketPrefix"
                type:
                  - array
                  - "null"
              quota:
                $ref: "#/components/schemas/BucketQuota"
                description: Caps on the Bucket's total size and on each object. While the Bucket has a size cap, funcd refuses to sign a presigned PUT URL for it, with 403.
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            type: object
          type:
            - array
            - "null"
        configMaps:
          description: "The ConfigMaps the Function declares: by name it defines one from its data, which goes with the Function, by ref it uses an existing one. spec.bindings.config binds only a declared ConfigMap, and a defined one that the spec no longer defines is deleted once the Function is Ready again and nothing else names it. An App's part declares none."
          items:
            additionalProperties: false
            properties:
              data:
                additionalProperties:
                  type: string
                description: "Keys and their string values, for settings that are not secret. Each key is an environment variable name: ASCII letters, digits and _, not starting with a digit. Each worker of a Function that lists the ConfigMap in bindings.config gets each key as an environment variable when it starts, except a key that starts with FUNCD_ or that a bound Secret also holds. A Lake that lists it gives its engine only the keys that the Lake's bindings.config lets through."
                type: object
              name:
                description: The ConfigMap's name, at most 52 characters. It is stored as <name>-<hash of data>, and the config of each part that names it is set to that stored name.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            type: object
          type:
            - array
            - "null"
        handler:
          description: The name of the export that the shim calls in the code, such as handle. A Function without one, or whose code has no such export, fails with ShapeInvalid.
          pattern: ^[A-Za-z_][A-Za-z0-9_.]*$
          type: string
        image:
          description: "The OCI reference of the code's artifact: a registry reference with a tag or a digest, or an oci-layout:// reference to a layout on the server's disk. A Function whose image is missing, or cannot be resolved or pulled, starts no worker."
          type: string
        imageDigest:
          description: The sha256 digest that funcd pulls the image by and checks it against. Unset, funcd resolves the image to its digest when it creates the Revision of a new spec and keeps that digest, so a tag that moves later changes nothing.
          pattern: ^sha256:[a-f0-9]{64}$
          type: string
        ingress:
          $ref: "#/components/schemas/Ingress"
          description: The Function's own address at the edge. With no host and no path, it answers by name at /function/<name>; a host or a path gives it a Route of its own in place of that address, which its IngressReady condition reports. Its path may not be /function or under it.
        kv:
          description: "The KVStores the Function declares: by name it creates and owns one, and a store of that name that it does not own holds it in Pending with StoreNotOwned; by ref it uses an existing one. spec.bindings.kv binds only a declared store. An App's part declares none and binds those that the App declares."
          items:
            additionalProperties: false
            properties:
              deletion:
                description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                enum:
                  - retain
                  - delete
                type: string
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              quota:
                $ref: "#/components/schemas/KVStoreQuota"
                description: Caps on the store's total size, on each value and on each key.
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              tables:
                description: The store's tables. A table is a key space that only its owner and the writers that a RolesAssignment names may write. Table names are unique within the store, and a store with no table has nothing a Function can write.
                items:
                  $ref: "#/components/schemas/KVTable"
                type:
                  - array
                  - "null"
            type: object
          type:
            - array
            - "null"
        lakes:
          description: "The Lakes the Function declares: by name it creates one that goes with the Function, by ref it uses an existing one. spec.bindings.lake binds only a declared Lake, and a Lake declared by name declares nothing at its own root: it binds the Function's buckets, configMaps and secrets. An App's part declares none."
          items:
            additionalProperties: false
            properties:
              bindings:
                $ref: "#/components/schemas/LakeBindings"
                description: "What the Lake's engine uses: Bucket prefixes, and the ConfigMaps and Secrets of its environment."
              buckets:
                description: "The Buckets that a Lake applied on its own declares: by name the Lake creates the Bucket, an omitted prefix owner being the Lake, and a Bucket of that name that is not the Lake's holds it in Pending with StoreNotOwned; by ref it binds an existing one. Each Bucket that the Lake's bindings.blob names must be declared here. A lake that another resource declares sets none."
                items:
                  additionalProperties: false
                  properties:
                    deletion:
                      description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                      enum:
                        - retain
                        - delete
                      type: string
                    name:
                      description: The object's name. It takes the namespace and resource group of the resource that declares it.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                    prefixes:
                      description: The Bucket's prefixes, each a key space with its own owner and cap. Prefix names are unique within the Bucket. A Function or a Lake that binds a prefix the Bucket does not list waits, with the reason BucketNotFound.
                      items:
                        $ref: "#/components/schemas/BucketPrefix"
                      type:
                        - array
                        - "null"
                    quota:
                      $ref: "#/components/schemas/BucketQuota"
                      description: Caps on the Bucket's total size and on each object. While the Bucket has a size cap, funcd refuses to sign a presigned PUT URL for it, with 403.
                    ref:
                      description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                  type: object
                type:
                  - array
                  - "null"
              configMaps:
                description: "The ConfigMaps that a Lake applied on its own declares: by name the Lake defines one, and a ConfigMap of its stored name that is not the Lake's holds it in Pending with StoreNotOwned; by ref it binds an existing one. Each ConfigMap that the Lake's bindings.config names must be declared here. A lake that another resource declares sets none."
                items:
                  additionalProperties: false
                  properties:
                    data:
                      additionalProperties:
                        type: string
                      description: "Keys and their string values, for settings that are not secret. Each key is an environment variable name: ASCII letters, digits and _, not starting with a digit. Each worker of a Function that lists the ConfigMap in bindings.config gets each key as an environment variable when it starts, except a key that starts with FUNCD_ or that a bound Secret also holds. A Lake that lists it gives its engine only the keys that the Lake's bindings.config lets through."
                      type: object
                    name:
                      description: The ConfigMap's name, at most 52 characters. It is stored as <name>-<hash of data>, and the config of each part that names it is set to that stored name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                    ref:
                      description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                  type: object
                type:
                  - array
                  - "null"
              ingress:
                $ref: "#/components/schemas/Ingress"
                description: Exposes the Lake gateway at the edge, only when enabled is true and while the Lake is Ready. The path defaults to /lake/<name>, or / with a host. Setting auth is refused, since the Lake gateway checks each caller itself.
              location:
                $ref: "#/components/schemas/LakeLocation"
                description: The Bucket prefix that holds the Lake's files, one of the Lake's bindings.blob. The Lake waits in Pending, with the reason PrefixNotOwned, until the prefix's owner is this Lake. The Lake's catalog is kept outside the Bucket, under the same location, so a Lake located where another was finds that Lake's files and catalog.
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              resources:
                $ref: "#/components/schemas/ResourceSpec"
                description: The cpu and memory of the Lake's engine. An empty cpu or memory sets no limit on it, and a change replaces the running engine.
              secrets:
                description: The Secrets that a Lake applied on its own declares, with the keys its engine reads. Each Secret that the Lake's bindings.secret names must be declared here, and the Lake waits in Pending, with SecretNotFound or SecretKeyMissing, while one is missing or lacks a key. A lake that another resource declares sets none.
                items:
                  additionalProperties: false
                  properties:
                    description:
                      description: What the Secret is for, for the installer who provides it.
                      type: string
                    keys:
                      description: "The keys read from the Secret: its data must hold each of them."
                      items:
                        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                        type: string
                      minItems: 1
                      type: array
                    name:
                      description: The name of a Secret in the namespace of the resource that declares it. funcd holds its value; the resource never writes it.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                  required:
                    - name
                    - keys
                  type: object
                type:
                  - array
                  - "null"
            type: object
          type:
            - array
            - "null"
        pooling:
          $ref: "#/components/schemas/Pooling"
          description: Whether the Function shares a worker with other Functions; unset, it runs in workers of its own.
        protocol:
          description: "How funcd calls the code. cloudevent, the default, passes each call to the handler as a CloudEvent. http passes each edge request to the handler, an http(app) export: only the edge and another Function's ctx.fetch over a link reach it, and it needs a node runtime and no pooling.worker."
          enum:
            - ""
            - cloudevent
            - http
          type: string
        replicas:
          description: "How many workers run while the Function is awake: at least 1 once a call wakes it, and at least scaling.minReplicas. Every call goes to the lowest listening replica, and the others are spares. With minReplicas 0, replicas above 0 also starts workers before the first call, but not after a sleep. A local volume allows at most 1."
          format: int64
          maximum: 15
          minimum: 0
          type: integer
        resources:
          $ref: "#/components/schemas/ResourceSpec"
          description: The CPU and memory caps of each of the Function's workers; a field left empty takes functions.defaultResources. Only the containerd runtime enforces them, and they cannot be set with pooling.worker.
        runtime:
          description: The runtime that runs the code, such as nodejs22 or python314. A Function without one fails with ShapeInvalid, and one whose runtime this node cannot run fails with RuntimeUnavailable.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        scaling:
          $ref: "#/components/schemas/Scaling"
          description: "Scale to zero: with minReplicas 0, the default, and an idleTimeout, a Function with no traffic goes Idle and its workers stop until the next call wakes it."
        secrets:
          description: The Secrets of the namespace that the bindings may name, each with the keys the code reads; spec.bindings.secret names only a declared Secret. The Function waits in Pending, with SecretNotFound or SecretKeyMissing, until each one exists with every declared key. An App's part declares none and binds those that the App declares.
          items:
            additionalProperties: false
            properties:
              description:
                description: What the Secret is for, for the installer who provides it.
                type: string
              keys:
                description: "The keys read from the Secret: its data must hold each of them."
                items:
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                  type: string
                minItems: 1
                type: array
              name:
                description: The name of a Secret in the namespace of the resource that declares it. funcd holds its value; the resource never writes it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            required:
              - name
              - keys
            type: object
          type:
            - array
            - "null"
        sql:
          description: "The SQLDatabases the Function declares: by name it creates and owns one, and a database of that name that it does not own holds it in Pending with StoreNotOwned; by ref it uses an existing one. spec.bindings.sql binds only a declared database, and a database with no owner gets the Function as its owner. An App's part declares none and binds those that the App declares."
          items:
            additionalProperties: false
            properties:
              deletion:
                description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                enum:
                  - retain
                  - delete
                type: string
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              owner:
                description: The one Function that may write the database, in its namespace, besides the writers that a RolesAssignment names. In a database that a Function declares by name, it defaults to that Function, and in a Workflow's sql it names a step. With no owner, only those writers can write it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              quota:
                $ref: "#/components/schemas/SizeQuota"
                description: A cap on the database's total size, the bytes of its pages in use. Once it is reached, an execute gets 507 unless each of its statements is a DELETE or a DROP. A change keeps the engine running.
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              resources:
                $ref: "#/components/schemas/ResourceSpec"
                description: The cpu and memory of the database's engine. An empty memory means 256Mi, and an empty cpu sets no cpu limit. A change replaces the running engine.
            type: object
          type:
            - array
            - "null"
        timeout:
          description: "Bounds an external invoke until its response starts: 0s to 1h; 0s or unset means invoke.defaultTimeout."
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
        volumes:
          description: The directories the Function's workers mount. Apply refuses a Function with one unless runtime.mode is containerd and volumes.capacity or volumes.capacityBytes is set. A Function with a volume runs solo, even with pooling.worker.
          items:
            $ref: "#/components/schemas/VolumeEntry"
          type:
            - array
            - "null"
      type: object
    FunctionStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        currentRevision:
          description: The Revision of the latest spec, named after the Function and its generation. While it differs from servingRevision, its workers come up beside the serving ones.
          type: string
        drainingRevision:
          description: "The Revision that the last switch moved the calls from, while any of its workers still drain: each stops once it is idle, no sooner than runtime.handOutSettle after the switch, or at runtime.drainGrace with its calls cut. Cleared with drainingSince once none drains. A worker that an open workflow run pins is not counted and stays until the run ends. A pooled Function leaves it empty."
          type: string
        drainingSince:
          description: When the last switch moved the calls off drainingRevision; cleared with it.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
        pool:
          description: The pool worker the Function runs in, as <runtime>/<worker>/<access>, where access is a hash of its bindings, owned data, grants and resource group. Empty when it runs solo.
          type: string
        replicas:
          description: How many of the serving revision's workers are ready.
          format: int64
          type: integer
        servingRevision:
          description: The Revision whose workers take the calls; calls move to currentRevision once its workers are ready. Empty until a first worker is ready, and again while the Function wants no worker, such as while it sleeps.
          type: string
      type: object
    FunctionStep:
      additionalProperties: false
      properties:
        bindings:
          $ref: "#/components/schemas/StepBindings"
          description: "What the step's code uses, copied onto an image step's Function: each store, lake, ConfigMap and Secret it names must be declared at the root of the Workflow or of its App. A ref step ignores it: the Function it names keeps its own."
        image:
          description: The artifact of the step's own Function, <workflow>-<step>, which funcd creates with the runtime the artifact declares and its handle export. That name must fit in 63 characters. Exactly one of image and ref.
          type: string
        pooling:
          $ref: "#/components/schemas/WorkflowPooling"
          description: "Replaces the Workflow's pooling for this step's Function, as a whole: a field it leaves unset takes its default, not the Workflow's value. A ref step ignores it."
        ref:
          description: The name of an existing Function in the namespace that the step calls; funcd does not create or change it, and a run waits while it is missing. A Function whose protocol is http fails the step. Exactly one of image and ref.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        retry:
          $ref: "#/components/schemas/StepRetry"
          description: How a failed call is tried again. A 5xx answer, a timeout or a transport error is retried, while a 4xx answer or an output over workflow.payloadLimit fails the step at once. Unset, the step gets workflow.defaultRetry attempts with workflow.defaultRetryBackoff; the onFailure step is called once.
        timeout:
          description: "The per-step invocation bound: 0s to 24h; 0s or unset means workflow.defaultStepTimeout."
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
      type: object
    Gateway:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        status:
          $ref: "#/components/schemas/GatewayStatus"
      required:
        - metadata
        - apiVersion
        - kind
      type: object
    GatewayStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    Grant:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/GrantSpec"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    GrantSpec:
      additionalProperties: false
      type: object
    HoldReleaseInputBody:
      additionalProperties: false
      properties:
        advance:
          description: blob EventSources, <namespace>/<name>, whose listed keys are marked seen instead of replayed
          items:
            type: string
          type:
            - array
            - "null"
        namespaces:
          description: "namespaces whose hold a restore left is released, instead of the platform's: restore run's data marker, and the marker of an in-place Restore that has ended"
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
      type: object
    Identity:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/IdentitySpec"
        status:
          $ref: "#/components/schemas/IdentityStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    IdentitySpec:
      additionalProperties: false
      properties:
        credentialSecretName:
          description: "The Secret, in the Identity's namespace, that funcd writes the credential to and deletes with the Identity: the S3 key pair as accessKeyId and secretAccessKey, and the Lake token as lakeToken. Empty means the Identity's name. funcd leaves alone a Secret of that name that no Identity of this name controls, and the Identity then stays Pending with reason SecretNotOwned; a Secret left by a deleted Identity of the same name is issued again."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        rotate:
          description: "Raise it above status.observedRotate to rotate the credential: funcd writes a new secretAccessKey and lakeToken under the same access key id, and the old ones stop authenticating, with no overlap."
          format: int64
          type: integer
        type:
          description: "What the Identity stands for: external, a caller outside funcd that authenticates with the credential funcd issues. The credential grants nothing: a RolesAssignment or a Policy grants the Identity its access."
          enum:
            - external
          type: string
      required:
        - type
      type: object
    IdentityStatus:
      additionalProperties: false
      properties:
        accessKeyId:
          description: The access key id of the issued key pair, also in the Secret. funcd derives it from the Identity's namespace and name, so it stays the same when the credential rotates.
          type: string
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        observedRotate:
          description: "The spec.rotate value that funcd last acted on: a rotation is done once it equals spec.rotate."
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    Ingress:
      additionalProperties: false
      properties:
        auth:
          $ref: "#/components/schemas/RouteAuth"
          description: How the edge checks callers at the resource's own address; unset, the namespace's spec.edgeDefaults.auth decides, else open. A Lake refuses it, since the Lake gateway checks each caller.
        enabled:
          description: Turns the resource's own address on or off. Unset, it is on unless the namespace's spec.defaultExposure is explicit; a Lake's address is on only when this is true.
          type: boolean
        host:
          description: The exact host of the resource's own address. Empty is the namespace's host, <namespace>.<server.baseDomain>, or, in the default namespace, any host that no other namespace reserves.
          type: string
        path:
          description: The edge path of the resource's own address, which begins with / and does not end with / unless it is /. Empty is / when host is set, else /function/<name>, /site/<name> or /lake/<name> by kind.
          type: string
      type: object
    Invocation:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        status:
          $ref: "#/components/schemas/InvocationStatus"
      required:
        - metadata
        - apiVersion
        - kind
      type: object
    InvocationStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        endTime:
          description: When the call ended, after its last attempt.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        error:
          description: Why the call failed, on a Failed record; empty when it succeeded.
          type: string
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
        startTime:
          description: When the call started; for a Sensor's action, its first attempt.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
      type: object
    KVServiceSpec:
      additionalProperties: false
      properties:
        binding:
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - binding
      type: object
    KVStore:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/KVStoreSpec"
        status:
          $ref: "#/components/schemas/KVStoreStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    KVStoreHandover:
      additionalProperties: false
      properties:
        workflow:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - workflow
      type: object
    KVStoreQuota:
      additionalProperties: false
      properties:
        maxBytes:
          description: The same cap as a number of bytes. Set maxSize or maxBytes, not both.
          format: int64
          minimum: 0
          type: integer
        maxKeyBytes:
          description: The longest key, in bytes. 0 means 1024 (1 KiB).
          format: int64
          maximum: 64000
          minimum: 0
          type: integer
        maxSize:
          description: The cap on the total size held, above zero. Set maxSize or maxBytes, not both; neither means no cap. A write that would pass the cap gets 507.
          pattern: ^[0-9]{1,15}((Ki|Mi|Gi|Ti)B?)?$
          patternDescription: "a size: 1 to 15 digits and an optional binary unit, Ki, Mi, Gi or Ti, with or without a B (512Ki, 2GiB)"
          type: string
        maxValueBytes:
          description: The largest value a write may store, in bytes. 0 means 1048576 (1 MiB).
          format: int64
          maximum: 1048576
          minimum: 0
          type: integer
      type: object
    KVStoreSpec:
      additionalProperties: false
      properties:
        quota:
          $ref: "#/components/schemas/KVStoreQuota"
          description: Caps on the store's total size, on each value and on each key.
        tables:
          description: The store's tables. A table is a key space that only its owner and the writers that a RolesAssignment names may write. Table names are unique within the store, and a store with no table has nothing a Function can write.
          items:
            $ref: "#/components/schemas/KVTable"
          type:
            - array
            - "null"
      type: object
    KVStoreStatus:
      additionalProperties: false
      properties:
        bindings:
          description: The number of Function spec.bindings.kv entries that name the store.
          format: int64
          type: integer
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
        tables:
          description: The number of tables the store declares.
          format: int64
          type: integer
      type: object
    KVTable:
      additionalProperties: false
      properties:
        name:
          description: The table's name, unique within the store.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        owner:
          description: The Function that owns the table, in the store's namespace. The owner writes the table, and so does a principal that a RolesAssignment grants kv::write on the table, its store or its namespace, such as the KV Data Writer role. In a store that a Function declares, the owner defaults to that Function; in one that a Workflow declares, it names a step, and the Function that funcd creates for that step is the owner; in a KVStore applied on its own, a table with no owner is written only through such a grant. Every Function, the owner included, reaches the table through an entry of its spec.bindings.kv.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - name
      type: object
    Lake:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/LakeSpec"
        status:
          $ref: "#/components/schemas/LakeStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    LakeBindings:
      additionalProperties: false
      properties:
        blob:
          description: The Bucket prefixes the engine may read, each under an alias. It writes only a prefix whose owner is this Lake, and the Lake's location must be one of them.
          items:
            $ref: "#/components/schemas/FunctionBlob"
          type:
            - array
            - "null"
        config:
          description: ConfigMaps whose data the engine gets as environment variables. Only QUACK_TOKEN and the DUCKDB_ keys pass, DUCKDB_EXTENSION_DIRECTORY excepted, and a bound Secret's value wins over a ConfigMap's for the same key. A missing ConfigMap holds the Lake in Pending, with the reason BindingResolveFailed.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        secret:
          description: "Secrets whose data the engine gets as environment variables, such as its QUACK_TOKEN; the same keys pass as for config. funcd asks Cedar, as the Lake, for secret::read on each: a forbidden Secret holds the Lake in Pending, with the reason BindingResolveFailed, as does a missing one in a lake that another resource declares. A changed value replaces the engine."
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
      required:
        - blob
      type: object
    LakeLocation:
      additionalProperties: false
      properties:
        bucket:
          description: The Bucket that holds the Lake's files, in the Lake's namespace.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        prefix:
          description: The prefix of that Bucket, which this Lake must own.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - bucket
        - prefix
      type: object
    LakeSpec:
      additionalProperties: false
      properties:
        bindings:
          $ref: "#/components/schemas/LakeBindings"
          description: "What the Lake's engine uses: Bucket prefixes, and the ConfigMaps and Secrets of its environment."
        buckets:
          description: "The Buckets that a Lake applied on its own declares: by name the Lake creates the Bucket, an omitted prefix owner being the Lake, and a Bucket of that name that is not the Lake's holds it in Pending with StoreNotOwned; by ref it binds an existing one. Each Bucket that the Lake's bindings.blob names must be declared here. A lake that another resource declares sets none."
          items:
            additionalProperties: false
            properties:
              deletion:
                description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                enum:
                  - retain
                  - delete
                type: string
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              prefixes:
                description: The Bucket's prefixes, each a key space with its own owner and cap. Prefix names are unique within the Bucket. A Function or a Lake that binds a prefix the Bucket does not list waits, with the reason BucketNotFound.
                items:
                  $ref: "#/components/schemas/BucketPrefix"
                type:
                  - array
                  - "null"
              quota:
                $ref: "#/components/schemas/BucketQuota"
                description: Caps on the Bucket's total size and on each object. While the Bucket has a size cap, funcd refuses to sign a presigned PUT URL for it, with 403.
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            type: object
          type:
            - array
            - "null"
        configMaps:
          description: "The ConfigMaps that a Lake applied on its own declares: by name the Lake defines one, and a ConfigMap of its stored name that is not the Lake's holds it in Pending with StoreNotOwned; by ref it binds an existing one. Each ConfigMap that the Lake's bindings.config names must be declared here. A lake that another resource declares sets none."
          items:
            additionalProperties: false
            properties:
              data:
                additionalProperties:
                  type: string
                description: "Keys and their string values, for settings that are not secret. Each key is an environment variable name: ASCII letters, digits and _, not starting with a digit. Each worker of a Function that lists the ConfigMap in bindings.config gets each key as an environment variable when it starts, except a key that starts with FUNCD_ or that a bound Secret also holds. A Lake that lists it gives its engine only the keys that the Lake's bindings.config lets through."
                type: object
              name:
                description: The ConfigMap's name, at most 52 characters. It is stored as <name>-<hash of data>, and the config of each part that names it is set to that stored name.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            type: object
          type:
            - array
            - "null"
        ingress:
          $ref: "#/components/schemas/Ingress"
          description: Exposes the Lake gateway at the edge, only when enabled is true and while the Lake is Ready. The path defaults to /lake/<name>, or / with a host. Setting auth is refused, since the Lake gateway checks each caller itself.
        location:
          $ref: "#/components/schemas/LakeLocation"
          description: The Bucket prefix that holds the Lake's files, one of the Lake's bindings.blob. The Lake waits in Pending, with the reason PrefixNotOwned, until the prefix's owner is this Lake. The Lake's catalog is kept outside the Bucket, under the same location, so a Lake located where another was finds that Lake's files and catalog.
        resources:
          $ref: "#/components/schemas/ResourceSpec"
          description: The cpu and memory of the Lake's engine. An empty cpu or memory sets no limit on it, and a change replaces the running engine.
        secrets:
          description: The Secrets that a Lake applied on its own declares, with the keys its engine reads. Each Secret that the Lake's bindings.secret names must be declared here, and the Lake waits in Pending, with SecretNotFound or SecretKeyMissing, while one is missing or lacks a key. A lake that another resource declares sets none.
          items:
            additionalProperties: false
            properties:
              description:
                description: What the Secret is for, for the installer who provides it.
                type: string
              keys:
                description: "The keys read from the Secret: its data must hold each of them."
                items:
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                  type: string
                minItems: 1
                type: array
              name:
                description: The name of a Secret in the namespace of the resource that declares it. funcd holds its value; the resource never writes it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            required:
              - name
              - keys
            type: object
          type:
            - array
            - "null"
      required:
        - bindings
        - location
      type: object
    LakeStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        endpoint:
          description: While the Lake is Ready, the host and port of its Lake gateway, which a Function that binds the Lake gets as FUNCD_LAKE_<ALIAS>_URL. In any other phase it is empty or holds the engine's own address.
          type: string
        function:
          description: funcd sets it to <name>-duckdb, after the Lake's name. funcd makes no object of that name and does not read it.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
