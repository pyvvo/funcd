    NamespaceSpec:
      additionalProperties: false
      properties:
        defaultExposure:
          description: "Whether the namespace's Functions and Sites answer at their own address, such as /function/<name>, while their spec.ingress.enabled is unset: implicit, or empty, turns it on, and explicit turns it off. Routes you write and Routes an App declares stay on, though in the default namespace explicit refuses one with no host (HostRequired)."
          enum:
            - ""
            - implicit
            - explicit
          type: string
        edgeDefaults:
          $ref: "#/components/schemas/EdgeDefaults"
          description: The namespace's edge defaults, which apply where a Route or a Function's or Site's spec.ingress sets no value of its own.
        volumeBudget:
          description: "The most volume space the namespace's Functions may reserve: each local volume's size from apply until the volume is removed, and each worker's emptyDir while the worker exists. Apply refuses a local volume that does not fit (VolumeBudget), and a worker whose emptyDir does not fit is not created. Set volumeBudget or volumeBudgetBytes, not both; neither, or 0, means no budget."
          pattern: ^[0-9]{1,15}((Ki|Mi|Gi|Ti)B?)?$
          patternDescription: "a size: 1 to 15 digits and an optional binary unit, Ki, Mi, Gi or Ti, with or without a B (512Ki, 2GiB)"
          type: string
        volumeBudgetBytes:
          description: The same budget as volumeBudget, as a number of bytes. Set volumeBudget or volumeBudgetBytes, not both; 0 means no budget.
          format: int64
          minimum: 0
          type: integer
