          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
        proxyPort:
          description: The port of the Lake gateway. funcd binds it again after a restart, so the address that Functions binding the Lake hold keeps working; when the port is taken, funcd binds a new one, and their address changes.
          format: int64
          type: integer
      type: object
