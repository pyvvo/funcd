          description: the entry's since, as hold status lists it; the newest entry when absent
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        volume:
          description: the volume, with kind Function
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - kind
        - namespace
        - name
      type: object
    ReplaySeed:
      additionalProperties: false
      properties:
        allowDrift:
          description: Lets the replay re-run an image step whose artifact digest changed since the source run, on the current artifact; a child workflow's steps count too. false, the default, fails the replay with DigestDrift instead.
          type: boolean
        from:
          description: "The step to re-run from: it and every step that depends on it run again, a step the source never ran runs too, and the others keep the source's outputs. It is not the onFailure step, and no step outside that set may have failed or been cancelled in the source."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        run:
          description: "The finished run to replay: a run of the same Workflow in this namespace that workflow.retention has not removed yet."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - run
        - from
      type: object
    ResourceGroup:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/ResourceGroupSpec"
        status:
          $ref: "#/components/schemas/ResourceGroupStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    ResourceGroupSpec:
      additionalProperties: false
      properties:
        description:
          description: Free text about the group; funcd does not read it.
          type: string
      type: object
    ResourceGroupStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    ResourceSpec:
      additionalProperties: false
      properties:
        cpu:
          description: The CPU cap of the worker or engine it sizes, as a number of cores of at least 0.01, such as 0.5 or 2. Empty takes the default of the resource that declares it, or no cap when there is none. Only the containerd runtime enforces it.
          type: string
        memory:
          description: "The memory cap of the worker or engine it sizes, such as 256Mi or 4GiB: 1 to 15 digits and an optional binary unit, Ki, Mi, Gi or Ti, with or without a B, above zero. Empty takes the default of the resource that declares it, or no cap when there is none. Only the containerd runtime enforces it, and there a worker that passes it is killed."
          type: string
      type: object
    Restore:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/RestoreSpec"
        status:
          $ref: "#/components/schemas/RestoreStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    RestoreMember:
      additionalProperties: false
      properties:
        as:
          description: "The destination: the name of an existing, empty store of the member's kind in the namespace, or for a volume, of a Function whose local volume of that name is empty. A SQLDatabase is empty with no table, view, index or trigger and no Function binding it. Exactly one of as, asLocation and inPlace; a Lake takes asLocation or inPlace."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        asLocation:
          $ref: "#/components/schemas/LakeLocation"
          description: "For a Lake: the bucket and prefix that receive its copy, where no Lake is located and nothing is stored yet; a Lake located there afterwards reads it. The bucket must exist and may not be one this Restore restores in place. Exactly one of as, asLocation and inPlace."
        inPlace:
          description: "Load the member back into its own store, replacing its data; a Function's volume is loaded only when empty or named by its Function's DataMissing condition. The Restore then needs update on the Namespace, as an admin has, and another in-place Restore of the namespace is refused until it ends. It first takes the export Backup that status.export names, which needs the restored Backup's schedule, then holds the namespace while it loads: a failed load keeps the hold until funcdctl hold release --namespace. Exactly one of as, asLocation and inPlace."
          type: boolean
        kind:
          description: "The member's kind, as the Backup's status.members lists it: KVStore, Bucket, Lake, SQLDatabase, or Function for a Function's local volume."
          type: string
        name:
          description: "The member's name, as the Backup's status.members lists it: the store's, or for a volume, its Function's. A member the copy does not hold fails the Restore with reason MemberNotFound."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        volume:
          description: With kind Function, which needs it, the name of the Function's local volume that the member is. Any other kind takes none.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - kind
        - name
      type: object
    RestoreSource:
      additionalProperties: false
      properties:
        credentialsSecret:
          description: "A Secret of the namespace with AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and, optionally, AWS_SESSION_TOKEN: the key the Restore reads the copy with, at the Backup's status.target. A read-only key is enough."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        identitySecret:
          description: "A Secret of the namespace whose AGE_IDENTITY key holds age identities, X25519 or hybrid and not passphrase-encrypted, one of them for a recipient the Backup is sealed to. It is required: a Restore without it is refused."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - credentialsSecret
      type: object
    RestoreSpec:
      additionalProperties: false
      properties:
        backup:
          description: The Backup to load, in the Restore's namespace. The Restore waits while it is Pending or Running, and fails with reason BackupNotReady when it is missing or Failed.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        members:
          description: "The members of the Backup to load, at least one and each once, loaded in this order after funcd has checked the whole copy and every destination. A Bucket's member leaves its destination's Lake prefixes as they are: to restore those Lakes, name them as members too."
          items:
            $ref: "#/components/schemas/RestoreMember"
          type:
            - array
            - "null"
        source:
          $ref: "#/components/schemas/RestoreSource"
          description: The Secrets that read the Backup's copy and open its seal.
      required:
        - backup
        - source
        - members
      type: object
    RestoreStatus:
      additionalProperties: false
      properties:
        completionTime:
          description: When the Restore ended, Succeeded or Failed.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        export:
          description: The Backup that an in-place Restore takes before it loads, <restore>-before, of the restored Backup's schedule. Empty when no member is in place.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Pending while it waits for its Backup and, in place, for its export; Running while it checks the whole copy and loads; then Succeeded or Failed. A Restore that was Running when funcd stopped ends Failed with reason Interrupted.
          enum:
            - Pending
            - Running
            - Paused
            - Succeeded
            - Failed
            - Cancelled
          type: string
        startTime:
          description: When the Restore turned Running, once its Backup and any export had Succeeded.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
      type: object
    Revision:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/RevisionSpec"
        status:
          $ref: "#/components/schemas/RevisionStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    RevisionPin:
      additionalProperties: false
      properties:
        function:
          description: The name of a Function the run's steps call.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        functionUID:
          description: "That Function's UID when the run started: a Function re-created under the name is not the pinned one, and a step that calls it fails."
          type: string
        imageDigest:
          description: The digest of that Revision's image; empty for a file:// artifact, which has none.
          type: string
        revision:
          description: "The Revision the run calls: the Function's current revision when the run started."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - function
        - functionUID
        - revision
      type: object
    RevisionSpec:
      additionalProperties: false
      properties:
        function:
          $ref: "#/components/schemas/ObjectRef"
          description: The Function whose spec this Revision snapshots.
        handler:
          description: "The export that the Revision's workers call: the Function's spec.handler when funcd created the Revision."
          pattern: ^[A-Za-z_][A-Za-z0-9_.]*$
          type: string
        image:
          description: "The artifact that the Revision's workers run: the Function's spec.image when funcd created the Revision."
          type: string
        imageDigest:
          description: "The digest that the Revision's workers pull the image by: the Function's spec.imageDigest, or the digest that its image resolved to when funcd created the Revision. It never changes, even when a tag moves."
          pattern: ^sha256:[a-f0-9]{64}$
          type: string
        number:
          description: The generation of the Function's spec that this Revision snapshots.
          format: int64
          minimum: 1
          type: integer
        runtime:
          description: "The runtime that the Revision's workers run: the Function's spec.runtime when funcd created the Revision."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - function
        - number
      type: object
    RevisionStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    Role:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/RoleSpec"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    RoleRef:
      additionalProperties: false
      properties:
        kind:
          description: "Where the role comes from: BuiltinRole for one of funcd's built-in roles, Role for a Role of the RolesAssignment's namespace."
          enum:
            - BuiltinRole
            - Role
          type: string
        name:
          description: The role's name. A built-in role is one of Blob Data Reader, Blob Data Writer, KV Data Reader, KV Data Writer, SQL Data Reader, SQL Data Writer, Lake Query Reader, Lake Contributor, Function Invoker, Reader, Contributor and Owner; the last three cover Bucket and KV data only. A name that matches no role grants nothing.
          type: string
      required:
        - kind
        - name
      type: object
    RoleSpec:
      additionalProperties: false
      properties:
        actions:
          description: The actions the role grants, at least one, such as s3::read, kv::write or lake::query. An action that funcd does not know grants nothing.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - actions
      type: object
    RolesAssignment:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/RolesAssignmentSpec"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    RolesAssignmentSpec:
      additionalProperties: false
      properties:
        assignments:
          description: "The grants, at least one: each entry grants one role to a principal at a scope. funcd refuses an entry that sets no principal while spec.principal is unset, and likewise for the scope."
          items:
            $ref: "#/components/schemas/AssignmentEntry"
          type:
            - array
            - "null"
        principal:
          $ref: "#/components/schemas/PrincipalRef"
          description: The principal of each entry that sets none.
        scope:
          $ref: "#/components/schemas/ScopeRef"
          description: The scope of each entry that sets none.
      required:
        - assignments
      type: object
    Route:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/RouteSpec"
        status:
          $ref: "#/components/schemas/RouteStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    RouteAuth:
      additionalProperties: false
      properties:
        mode:
          description: "How the edge checks callers. authenticated requires a bearer token, or an X-Api-Key header, of an identity that RBAC lets get Functions in the namespace: 401 without a valid one, 403 when it may not. open lets anonymous callers in. Empty takes the enclosing stance, if any, else the namespace's spec.edgeDefaults.auth.mode, else open."
          enum:
            - ""
            - authenticated
            - open
          type: string
      type: object
    RouteBackend:
      additionalProperties: false
      properties:
        function:
          description: A Function of the Route's namespace that the rule calls; the Route is not Ready (BackendNotFound) while it is missing. A request whose rest of the path lies under /health/ gets 404 and reaches no worker.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        site:
          description: "A Site of this Route's namespace: the rule serves the build that Site serves now, and its config.json at <path>/config.json, following each new build. A Prefix rule; the Route may not carry the Site's own name."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        static:
          $ref: "#/components/schemas/StaticBackend"
          description: Serves the objects of a Bucket prefix directly, with no Function. It answers GET and HEAD, and 405 to any other method.
      type: object
    RouteRule:
      additionalProperties: false
      properties:
        auth:
          $ref: "#/components/schemas/RouteAuth"
          description: The edge authentication of this rule's requests. Unset uses the Route's auth, then the Namespace's spec.edgeDefaults.auth, then open.
        backend:
          $ref: "#/components/schemas/RouteBackend"
          description: "What the rule serves: set exactly one of function, static and site."
        methods:
          description: The request methods the rule matches; empty matches every method.
          items:
            enum:
              - GET
              - HEAD
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            type: string
          type:
            - array
            - "null"
        path:
          description: The path the rule matches, starting with /. In the default namespace, a Route with no host may not have a rule at or under /function, the path that calls Functions by name (ReservedPath).
          type: string
        pathType:
          description: Prefix, the default, matches path and every path under it by whole segments, so /api matches /api/x but not /apix; a trailing slash changes nothing, and / matches every path. Exact matches path alone. The backend receives the rest of the path, or / for an Exact rule.
          enum:
            - ""
            - Prefix
            - Exact
          type: string
      required:
        - path
        - backend
      type: object
    RouteSpec:
      additionalProperties: false
      properties:
        auth:
          $ref: "#/components/schemas/RouteAuth"
          description: The edge authentication of the rules that set none. Unset uses the Namespace's spec.edgeDefaults.auth, else open.
        enabled:
          description: "false turns the Route off: it serves nothing, leaves its paths to other Routes and reports Disabled. Unset is true, except on a Route that a Site or a Function owns in a namespace whose defaultExposure is explicit."
          type: boolean
        host:
          description: The host the rules answer on, matched in lower case and without a port or a trailing dot. Empty is the namespace host, <namespace>.<server.baseDomain>, or, in the default namespace, every host except another namespace's own host, <other>.<server.baseDomain> or a name under it, while that namespace uses it; a host that another namespace's Route names is not excluded, and the longer matching path wins there. In the default namespace, an explicit defaultExposure refuses an empty host (HostRequired). A host that names another namespace, <other>.<server.baseDomain> or a name under it, is refused (HostReserved) while that namespace uses it, and always for a rule at or under /function.
          type: string
        rules:
          description: "The path rules, at least one; two rules may not have the same path and the same methods. Across all Routes, the longest matching path wins, and a rule with a host wins a tie. A Route serves all its rules or none: a missing backend or one conflicting rule keeps every rule off."
          items:
            $ref: "#/components/schemas/RouteRule"
          type:
            - array
            - "null"
      required:
        - rules
      type: object
    RouteStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        host:
          description: "The host the Route claims, whether or not it is Ready: spec.host in lower case without a port or a trailing dot, else the namespace host. It is empty for any host, as for a Route of the default namespace with no host, and while a backend is missing."
          type: string
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    RunStepStatus:
      additionalProperties: false
      properties:
        attempts:
          description: The calls made to the step's Function, each carrying its number in the X-Funcd-Attempt header; 0 for a builtin or workflow step.
          format: int64
          type: integer
        endedAt:
          description: When the step succeeded, failed or was cancelled while running.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
        error:
          description: "Why the step failed, or that it was cancelled while running: the first line of the cause, cut at 512 bytes."
          type: string
        name:
          description: The step's name.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        phase:
          description: Where the step is. It is Skipped when its when.condition is false, its join cannot be met or a step it depends on failed; a running step that a failure elsewhere stops goes back to Pending.
          enum:
            - Pending
            - Running
            - Succeeded
            - Failed
            - Skipped
            - Cancelled
          type: string
        revision:
          description: The step's image with the digest it resolved to when the run started; empty for a builtin or workflow step. A replay compares it to detect a changed artifact.
          type: string
        startedAt:
          description: When the step started running.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
      required:
        - name
      type: object
    RuntimeClass:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/RuntimeClassSpec"
        status:
          $ref: "#/components/schemas/RuntimeClassStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    RuntimeClassSpec:
      additionalProperties: false
      properties:
        handler:
          pattern: ^[A-Za-z_][A-Za-z0-9_.]*$
          type: string
      type: object
    RuntimeClassStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    SQLDatabase:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/SQLDatabaseSpec"
        status:
          $ref: "#/components/schemas/SQLDatabaseStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    SQLDatabaseSpec:
      additionalProperties: false
      properties:
        owner:
          description: The one Function that may write the database, in its namespace, besides the writers that a RolesAssignment names. In a database that a Function declares by name, it defaults to that Function, and in a Workflow's sql it names a step. With no owner, only those writers can write it.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        quota:
          $ref: "#/components/schemas/SizeQuota"
          description: A cap on the database's total size, the bytes of its pages in use. Once it is reached, an execute gets 507 unless each of its statements is a DELETE or a DROP. A change keeps the engine running.
        resources:
          $ref: "#/components/schemas/ResourceSpec"
          description: The cpu and memory of the database's engine. An empty memory means 256Mi, and an empty cpu sets no cpu limit. A change replaces the running engine.
      type: object
    SQLDatabaseStatus:
      additionalProperties: false
      properties:
        bindings:
          description: The number of Functions whose spec.bindings.sql names the database.
          format: int64
          type: integer
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    SQLEvent:
      additionalProperties: false
      properties:
        name:
          description: "The event's name, unique among the source's events: the type of each CloudEvent it fires, and the event a Sensor dependency names."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        "on":
          description: "The row changes that fire the event: Insert, Update or Delete. Empty means all three."
          items:
            type: string
          type:
            - array
            - "null"
        table:
          description: The table whose row changes fire the event, matched by its exact name, case included.
          type: string
      required:
        - name
        - table
      type: object
    SQLSource:
      additionalProperties: false
      properties:
        database:
          description: The SQLDatabase, in this namespace, whose row changes fire the events. Until it exists, the source is not Ready, with reason DatabaseNotFound.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        events:
          description: "The source's events: at least one, with unique names, each watching one table."
          items:
            $ref: "#/components/schemas/SQLEvent"
          type:
            - array
            - "null"
      required:
        - database
        - events
      type: object
    Scaling:
      additionalProperties: false
      properties:
        idleTimeout:
          description: "The idle time before a worker is reclaimed: 0s to 24h; 0s or unset disables reclaim."
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
        maxReplicas:
          description: "Above 0, the most that minReplicas may be; 0, the default, sets no bound. It starts no worker: replicas and minReplicas alone decide how many run."
          format: int64
          maximum: 15
          minimum: 0
          type: integer
        minReplicas:
          description: The fewest workers the Function keeps. 0, the default, lets idleTimeout scale it to zero; above 0, it never sleeps. It may not exceed maxReplicas when that is above 0, and a local volume allows at most 1.
          format: int64
          maximum: 15
          minimum: 0
          type: integer
      type: object
    ScopeRef:
      additionalProperties: false
      properties:
        kind:
          description: "What the grant covers: with Namespace, every resource of the RolesAssignment's namespace; with another kind, the one resource that name gives, in that namespace."
          enum:
            - Namespace
            - BucketPrefix
            - KVStore
            - Lake
            - SQLDatabase
          type: string
        name:
          description: "The resource for each kind: <bucket>/<prefix> for one prefix of a Bucket, <store> for every table of a KVStore or <store>/<table> for one, <lake> for a Lake and <database> for a SQLDatabase. A Namespace scope covers the whole namespace, whatever its name."
          type: string
      required:
        - kind
      type: object
    Secret:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/SecretSpec"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    SecretSpec:
      additionalProperties: false
      properties:
        data:
          additionalProperties:
            contentEncoding: base64
            type: string
          description: "The Secret's values by key, each in base64. Each key is an environment-variable name: a letter or an underscore, then letters, digits and underscores; a key that starts with FUNCD_ never reaches a workload. Each value must be UTF-8 text with no NUL byte: a Function or a Lake that binds a Secret holding another value does not start."
          type: object
        type:
          description: funcd does not read it.
          enum:
            - Opaque
          type: string
      type: object
    Sensor:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/SensorSpec"
        status:
          $ref: "#/components/schemas/SensorStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    SensorSpec:
      additionalProperties: false
      properties:
        do:
          description: "The actions the Sensor runs: at least one, with unique names. An event runs every action whose on names its dependency; a failed action is tried eventing.deliveryAttempts times in all, then stored as a dead letter, which funcdctl eventing dlq list shows; while eventing.maxQueuedPerSensor deliveries wait, a new one becomes a dead letter with no attempt."
          items:
            $ref: "#/components/schemas/Action"
          type:
            - array
            - "null"
        "on":
          description: "The events the Sensor subscribes to, as named dependencies: at least one, with unique names."
          items:
            $ref: "#/components/schemas/Dependency"
          type:
            - array
            - "null"
      required:
        - "on"
        - do
      type: object
    SensorStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    Service:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/ServiceSpec"
        status:
          $ref: "#/components/schemas/ServiceStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    ServiceSpec:
      additionalProperties: false
      properties:
        blob:
          $ref: "#/components/schemas/BlobServiceSpec"
        kv:
          $ref: "#/components/schemas/KVServiceSpec"
        type:
          enum:
            - kv
            - blob
          type: string
      type: object
    ServiceStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    Site:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/SiteSpec"
        status:
          $ref: "#/components/schemas/SiteStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    SiteBindings:
      additionalProperties: false
      properties:
        blob:
          description: "Exactly one entry: the Bucket and the prefix that hold the Site's bundles."
          items:
            $ref: "#/components/schemas/BlobRef"
          type:
            - array
            - "null"
      required:
        - blob
      type: object
    SiteIngress:
      additionalProperties: false
      properties:
        auth:
          $ref: "#/components/schemas/RouteAuth"
          description: How the edge checks callers at the resource's own address; unset, the namespace's spec.edgeDefaults.auth decides, else open. A Lake refuses it, since the Lake gateway checks each caller.
        baseHref:
          description: Serve a copy of the bundle's index whose <base href> is the Site's mount, so a bundle built with relative URLs runs at any path, deep links included.
          type: boolean
        enabled:
          description: Turns the resource's own address on or off. Unset, it is on unless the namespace's spec.defaultExposure is explicit; a Lake's address is on only when this is true.
          type: boolean
        host:
          description: The exact host of the resource's own address. Empty is the namespace's host, <namespace>.<server.baseDomain>, or, in the default namespace, any host that no other namespace reserves.
          type: string
        path:
          description: The edge path of the resource's own address, which begins with / and does not end with / unless it is /. Empty is / when host is set, else /function/<name>, /site/<name> or /lake/<name> by kind.
          type: string
        rules:
          description: More Bucket prefixes the Site serves, each at its own path, with the bundle's host, auth and enabled. A rule may sit below the bundle's path, since the longest matching path wins, and a missing file there is 404, never the bundle's index.
          items:
            $ref: "#/components/schemas/SiteRule"
          type:
            - array
            - "null"
      type: object
    SiteRule:
      additionalProperties: false
      properties:
        bucket:
          description: A Bucket of the Site's namespace, which buckets need not declare; empty means the Bucket of bindings.blob. While it does not exist, the Site's Route serves nothing, the bundle included, and the Site is not Ready.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        path:
          description: The path where the prefix is served, matching it and every path below it. It begins with / and may not be /, another rule's path or the bundle's path, which is ingress.path or its default. With runtimeConfig, it may not be the path of config.json either.
          type: string
        prefix:
          description: "The prefix of that Bucket served at path: <path>/<key> reads the object <prefix>/<key> as the Bucket holds it, since nothing is copied."
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - path
        - prefix
      type: object
    SiteRuntimeConfig:
      additionalProperties: false
      properties:
        configMap:
          description: A ConfigMap of the Site's namespace whose data adds keys to config.json; a key of values wins over the same key here. In an App, it may name one of the App's configMaps entries. While it does not exist, the Site is not Ready, though its bundle still deploys and its last config.json, if any, keeps serving; a change to it rewrites only the file.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        values:
          additionalProperties:
            type: string
          description: "Keys and the string values that config.json gives them; a key here wins over the same key from configMap. Each key is an environment variable name: ASCII letters, digits and _, not starting with a digit. The file holds at most 32768 bytes (32 KiB): values that alone pass it are refused, and a file that configMap takes past it leaves the Site not Ready, serving its last config.json, if any."
          type: object
      type: object
    SiteSpec:
      additionalProperties: false
      properties:
        bindings:
          $ref: "#/components/schemas/SiteBindings"
          description: "Where the Site stores and serves its bundles: one Bucket prefix, in blob."
        buckets:
          description: "Exactly the one Bucket that bindings.blob names, never with deletion: delete; a Site in an App sets none and refers to that Bucket by ref. By name, the Site creates the Bucket with that prefix, without an owner, and the prefixes listed here, which may not repeat it; a Bucket of that name that the Site did not create leaves the Site not Ready. By ref, the Site is Ready only once the Bucket holds that prefix without an owner, and it never changes the Bucket."
          items:
            additionalProperties: false
            properties:
              deletion:
                description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                enum:
                  - retain
                  - delete
                type: string
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              prefixes:
                description: The Bucket's prefixes, each a key space with its own owner and cap. Prefix names are unique within the Bucket. A Function or a Lake that binds a prefix the Bucket does not list waits, with the reason BucketNotFound.
                items:
                  $ref: "#/components/schemas/BucketPrefix"
                type:
                  - array
                  - "null"
              quota:
                $ref: "#/components/schemas/BucketQuota"
                description: Caps on the Bucket's total size and on each object. While the Bucket has a size cap, funcd refuses to sign a presigned PUT URL for it, with 403.
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            type: object
          type:
            - array
            - "null"
        image:
          description: "The OCI artifact of the Site's static files, which funcdctl push --site makes, named by a tag or a digest. funcd resolves a tag to a digest when the spec changes, so a tag that moves after a deploy changes nothing until the spec changes again. Each deployed bundle stays in the Bucket, so pointing image back at an earlier one serves it again without an upload. A bundle with a _runtime entry at its root does not deploy: funcd keeps that name for the files it generates."
          type: string
        index:
          description: The bundle's file served for /, by its file name for any other path that ends in /, and with spa for a path that matches no file. It is a path in the bundle, with no leading /; a bundle without it does not deploy, and the previous one keeps serving. Empty means site.defaultIndex, index.html by default.
          type: string
        ingress:
          $ref: "#/components/schemas/SiteIngress"
          description: "Where the edge serves the Site: its own address and its rules, through a Route of the Site's name that the Site writes. A Route of that name that the Site does not own leaves the Site not Ready."
        runtimeConfig:
          $ref: "#/components/schemas/SiteRuntimeConfig"
          description: "Values each deployment sets without a rebuild, served as config.json beside the bundle. The file is public: never put a secret in it."
        spa:
          description: "Serve the index, with status 200, for a path under the bundle's path that matches no file, so that a client-side router handles it. ingress.rules never fall back to it: a missing file there is 404."
          type: boolean
      required:
        - image
        - ingress
      type: object
    SiteStatus:
      additionalProperties: false
      properties:
        bytes:
          description: The total size, in bytes, of the files that objects counts.
          format: int64
          type: integer
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        digest:
          description: The digest of the bundle that the Site's Route is set to serve, empty before the first deploy. A deploy that fails leaves the previous bundle's digest.
          pattern: ^sha256:[a-f0-9]{64}$
          type: string
        objects:
          description: The number of that bundle's files in the Bucket, without the files funcd generates for the Site. It reads 0 while the Site cannot resolve its image or use its Bucket.
          format: int64
          type: integer
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
        servingPrefix:
          description: "Where that bundle's files are in the Bucket: <prefix>/sha256-<hex>/, from the prefix of spec.bindings.blob and the digest."
          type: string
      type: object
    SizeQuota:
      additionalProperties: false
      properties:
        maxBytes:
          description: The same cap as a number of bytes. Set maxSize or maxBytes, not both.
          format: int64
          minimum: 0
          type: integer
        maxSize:
          description: The cap on the total size held, above zero. Set maxSize or maxBytes, not both; neither means no cap. A write that would pass the cap gets 507.
          pattern: ^[0-9]{1,15}((Ki|Mi|Gi|Ti)B?)?$
          patternDescription: "a size: 1 to 15 digits and an optional binary unit, Ki, Mi, Gi or Ti, with or without a B (512Ki, 2GiB)"
          type: string
      type: object
    StaticBackend:
      additionalProperties: false
      properties:
        bucket:
          description: A Bucket of the Route's namespace whose objects the rule serves; the Route is not Ready (BucketNotFound) while it is missing.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        index:
          description: The object, relative to prefix, served at the rule's root; index.html when empty. A path ending in / gets the file of the index's name in that folder. It may not start with /.
          type: string
        prefix:
          description: The key prefix in the Bucket that the rule serves, ending in /; empty serves the whole Bucket. A request reads the object at this prefix plus the rest of its path.
          type: string
        spa:
          description: Serve the index, with 200, for a path that matches no object, so that a client-side router handles it; when false, such a path gets 404.
          type: boolean
      required:
        - bucket
      type: object
    StepBindings:
      additionalProperties: false
      properties:
        blob:
          description: The Bucket prefixes the step's code reaches through ctx.blob, and over S3 while the S3 gateway is on, each under its alias; each Bucket must be declared at the root, in buckets. The binding grants reads; only the prefix's owner and the writers that a RolesAssignment names may write.
          items:
            $ref: "#/components/schemas/FunctionBlob"
          type:
            - array
            - "null"
        config:
          description: ConfigMaps whose keys each worker of the step gets as environment variables when it starts; each must be declared at the root, in configMaps. A key that starts with FUNCD_, or that a bound Secret holds, is left out.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        kv:
          description: The KV tables the step's code reaches through ctx.kv, each under its alias; each store must be declared at the root, in kv. The binding grants reads; only the table's owner and the writers that a RolesAssignment names may write.
          items:
            $ref: "#/components/schemas/FunctionKV"
          type:
            - array
            - "null"
        lake:
          description: The Lakes the step's code queries, each under its alias; each must be declared at the root, in lakes. The step's Function waits until every bound Lake is Ready.
          items:
            $ref: "#/components/schemas/FunctionLake"
          type:
            - array
            - "null"
        secret:
          description: Secrets whose keys the step's code reads through ctx.secret, on each read; each must be declared at the root, in secrets. No value reaches the worker's environment.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        sql:
          description: The SQLDatabases the step's code queries through ctx.sql, each under its alias; each must be declared at the root, in sql. The binding grants reads; only the database's owner and the writers that a RolesAssignment names may write.
          items:
            $ref: "#/components/schemas/FunctionSQL"
          type:
            - array
            - "null"
      type: object
    StepRetry:
      additionalProperties: false
      properties:
        backoff:
          description: "The base of the exponential retry backoff: 0s to 1h; 0s or unset means workflow.defaultRetryBackoff."
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
        maxAttempts:
          description: "How many calls the step may make, the first included: 1 means no retry. Unset means workflow.defaultRetry. A call that a funcd restart cuts runs again, even past this count."
          format: int64
          maximum: 100
          minimum: 1
          type: integer
      type: object
    StepWhen:
      additionalProperties: false
      properties:
        condition:
          description: A ${{ }} JavaScript expression that yields true or false, over input, the run input, and step.<name>.output of each step it follows. It is type-checked against the steps' contracts before the Workflow is Ready; one that cannot be evaluated when the step is reached fails the run.
          type: string
      required:
        - condition
      type: object
    Stream:
      additionalProperties: false
      properties:
        lastFailure:
          $ref: "#/components/schemas/Failure"
        lastSuccessTime:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          patternDescription: an RFC3339 UTC timestamp with exactly 3 fractional digits (2026-10-07T20:03:35.965Z)
          type: string
      type: object
    TimerEvent:
      additionalProperties: false
      properties:
        cron:
          description: "A cron expression: 5 fields (minute hour day-of-month month day-of-week) or a macro such as @daily. Exactly one of interval and cron."
          type: string
        interval:
          description: "The tick period: 100ms to 24h. Exactly one of interval and cron."
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
        name:
          description: "The event's name, unique among the source's events: the type of each CloudEvent it fires, and the event a Sensor dependency names."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        timeZone:
          description: The IANA time zone of cron, such as Europe/Paris; UTC when empty. Only with cron.
          type: string
      required:
        - name
      type: object
    TimerSource:
      additionalProperties: false
      properties:
        events:
          description: "The timer's events: at least one, with unique names, each firing on its own schedule."
          items:
            $ref: "#/components/schemas/TimerEvent"
          type:
            - array
            - "null"
      required:
        - events
      type: object
    VolumeEntry:
      additionalProperties: false
      properties:
        deletion:
          description: "Only for a local volume declared by name: retain, the default, keeps the volume and its files with no owner when the Function drops it or is deleted, so that a ref can take it again; delete removes them."
          enum:
            - retain
            - delete
          type: string
        name:
          description: The volume's name, unique in the list; set name or ref, not both. The code reads the directory's path from FUNCD_VOLUME_<NAME>, the name or ref upper-cased.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        ref:
          description: "Instead of name: a retained local volume that this Function, or an earlier Function of the same name, dropped with retain, and that the Function takes over; with no such volume, it waits in Pending with VolumeNotFound. Only a local volume takes a ref; it sets no deletion and states the retained volume's own size, since apply refuses another size."
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        size:
          description: The volume's size, the most its directory may hold, above zero; set size or sizeBytes, not both. Apply refuses a local volume whose size changes, or that does not fit both the capacity that volumes.capacity or volumes.capacityBytes sets and the namespace's spec.volumeBudget.
          pattern: ^[0-9]{1,15}((Ki|Mi|Gi|Ti)B?)?$
          patternDescription: "a size: 1 to 15 digits and an optional binary unit, Ki, Mi, Gi or Ti, with or without a B (512Ki, 2GiB)"
          type: string
        sizeBytes:
          description: The same size as a number of bytes. Set size or sizeBytes, not both.
          format: int64
          minimum: 1
          type: integer
        type:
          description: emptyDir is a new empty directory for each worker, removed with it; local is one durable directory that keeps its files through a crash, a redeploy and a scale to zero. A Function with a local volume runs at most 1 replica, and while it redeploys, its old and new workers hold the volume at once.
          enum:
            - emptyDir
            - local
          type: string
      required:
        - type
      type: object
    WorkerNode:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        status:
          $ref: "#/components/schemas/WorkerNodeStatus"
      required:
        - metadata
        - apiVersion
        - kind
      type: object
    WorkerNodeStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
      type: object
    Workflow:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/WorkflowSpec"
        status:
          $ref: "#/components/schemas/WorkflowStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    WorkflowContract:
      additionalProperties: false
      properties:
        dialect:
          description: The URI of the JSON Schema dialect that input and output follow. funcd checks nothing against it.
          type: string
        input:
          description: The JSON Schema of the input. A declared one must be an object, and each property it does not require must declare a default.
        output:
          description: The JSON Schema of the output. A declared one must be an object, and each property it does not require must declare a default.
      type: object
    WorkflowPooling:
      additionalProperties: false
      properties:
        minReplicas:
          description: The workers kept warm for each image step's Function. 0, the default, scales a step's Function to zero after 5 minutes without a call, so its next call waits for a cold start.
          format: int64
          maximum: 15
          minimum: 0
          type: integer
        mode:
          description: shared, the default, runs each image step's Function in the pool worker that worker names, shared with the steps of the same runtime that bind and own the same data; isolated gives each step's Function a worker of its own. Only the process runtime pools, for node runtimes and, with Python 3.14 or later, python ones; elsewhere shared runs each step's Function solo too.
          enum:
            - shared
            - isolated
          type: string
        worker:
          description: The pool worker's name when mode is shared; empty means the Workflow's name. isolated ignores it.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      type: object
    WorkflowRef:
      additionalProperties: false
      properties:
        ref:
          description: The child Workflow's name, in the same namespace; it must be set. A run waits while the child is missing or not Ready, then runs it as it was when the run started.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      type: object
    WorkflowRun:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/WorkflowRunSpec"
        status:
          $ref: "#/components/schemas/WorkflowRunStatus"
      required:
        - metadata
        - spec
        - apiVersion
        - kind
      type: object
    WorkflowRunLinks:
      additionalProperties: false
      properties:
        active:
          description: The runs not finished yet, newest first.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        cancelled:
          description: The number of runs that ended Cancelled since the Workflow was created. Deleting a run does not lower it.
          format: int64
          type: integer
        failed:
          description: The number of runs that ended Failed since the Workflow was created. Deleting a run does not lower it.
          format: int64
          type: integer
        succeeded:
          description: The number of runs that ended Succeeded since the Workflow was created. Deleting a run does not lower it.
          format: int64
          type: integer
      type: object
    WorkflowRunSpec:
      additionalProperties: false
      properties:
        cancel:
          description: "When true, the run is cancelled: nothing more starts, the calls in flight are closed and their late answers dropped, though a call may already have done its work, and the run ends Cancelled without calling its onFailure step. It wins over paused, a finished run ignores it, and funcdctl workflow cancel sets it."
          type: boolean
        input:
          description: "The run input: the first step receives it, and expressions read it as input. Over workflow.payloadLimit bytes, or off the input schema in the Workflow's status.contract, it is refused at apply or fails the run when it starts. It is fixed once the run is created; a replay sets none and takes its source's."
        paused:
          description: "When true, the run pauses: no step or retry starts, the calls in flight finish, and paused time does not count toward the run's timeout. A run created paused waits to start, and a finished run ignores it. funcdctl workflow pause and resume set and clear it."
          type: boolean
        replay:
          $ref: "#/components/schemas/ReplaySeed"
          description: "Starts the run from a finished run, as funcdctl workflow replay does: replay.from and each step that depends on it run again, and the others keep the source's outputs. It is fixed once the run is created and leaves input empty; a source that cannot seed the run fails it, and its ReplaySeeded condition says why."
        workflow:
          description: The Workflow to run, in the run's namespace, fixed once the run is created. The run stays Pending while that Workflow, a child it calls or a step's Function is missing or not ready.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
      required:
        - workflow
      type: object
    WorkflowRunStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: "Where the run is in its lifecycle: Pending until it starts. Succeeded, Failed and Cancelled are final."
          enum:
            - Pending
            - Running
            - Paused
            - Succeeded
            - Failed
            - Cancelled
          type: string
        pins:
          description: "The Function revisions the run calls, pinned before it starts: one for each Function its steps call, ref targets and child workflows' steps included. Until the run ends or is cancelled, funcd keeps these revisions, and an edit to the Workflow or a Function does not change the code the run calls."
          items:
            $ref: "#/components/schemas/RevisionPin"
          type:
            - array
            - "null"
        steps:
          description: "Each step of the run in spec order, the onFailure step included: its phase, attempts, times and error."
          items:
            $ref: "#/components/schemas/RunStepStatus"
          type:
            - array
            - "null"
        traceId:
          description: The run's W3C trace ID, 32 lowercase hex characters, which every step call joins, a child workflow's included. funcdctl workflow logs reads the run's logs by it.
          type: string
        workflowUID:
          description: The UID of the Workflow when the run started. A started run whose Workflow is deleted, or re-created under a new UID, is cancelled.
          type: string
      type: object
    WorkflowSpec:
      additionalProperties: false
      properties:
        buckets:
          description: "The Buckets for the steps to bind. An entry with a name defines a bucket, each prefix owner naming a step or a declared lake; a ref entry binds an existing one. An App's spec.workflows[] entry must leave it empty: its steps bind what the App declares."
          items:
            additionalProperties: false
            properties:
              deletion:
                description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                enum:
                  - retain
                  - delete
                type: string
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              prefixes:
                description: The Bucket's prefixes, each a key space with its own owner and cap. Prefix names are unique within the Bucket. A Function or a Lake that binds a prefix the Bucket does not list waits, with the reason BucketNotFound.
                items:
                  $ref: "#/components/schemas/BucketPrefix"
                type:
                  - array
                  - "null"
              quota:
                $ref: "#/components/schemas/BucketQuota"
                description: Caps on the Bucket's total size and on each object. While the Bucket has a size cap, funcd refuses to sign a presigned PUT URL for it, with 403.
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            type: object
          type:
            - array
            - "null"
        configMaps:
          description: "The ConfigMaps for the steps to bind: an entry with a name defines one, deleted with the Workflow, and a ref entry binds an existing one. An App's spec.workflows[] entry must leave it empty: its steps bind what the App declares."
          items:
            additionalProperties: false
            properties:
              data:
                additionalProperties:
                  type: string
                description: "Keys and their string values, for settings that are not secret. Each key is an environment variable name: ASCII letters, digits and _, not starting with a digit. Each worker of a Function that lists the ConfigMap in bindings.config gets each key as an environment variable when it starts, except a key that starts with FUNCD_ or that a bound Secret also holds. A Lake that lists it gives its engine only the keys that the Lake's bindings.config lets through."
                type: object
              name:
                description: The ConfigMap's name, at most 52 characters. It is stored as <name>-<hash of data>, and the config of each part that names it is set to that stored name.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            type: object
          type:
            - array
            - "null"
        contract:
          $ref: "#/components/schemas/WorkflowContract"
          description: A contract the author declares for the run input and output. funcd checks its schemas at apply, but runs are checked against the contract it derives from the steps, in status.contract, not against this one.
        kv:
          description: "The KV stores for the steps to bind. An entry with a name defines a store, each table owner naming a step; a ref entry binds an existing one. An App's spec.workflows[] entry must leave it empty: its steps bind what the App declares."
          items:
            additionalProperties: false
            properties:
              deletion:
                description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                enum:
                  - retain
                  - delete
                type: string
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              quota:
                $ref: "#/components/schemas/KVStoreQuota"
                description: Caps on the store's total size, on each value and on each key.
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              tables:
                description: The store's tables. A table is a key space that only its owner and the writers that a RolesAssignment names may write. Table names are unique within the store, and a store with no table has nothing a Function can write.
                items:
                  $ref: "#/components/schemas/KVTable"
                type:
                  - array
                  - "null"
            type: object
          type:
            - array
            - "null"
        lakes:
          description: "The Lakes for the steps to bind: an entry with a name defines one, deleted with the Workflow, and a ref entry binds an existing one. A defined lake may not share a step's name, and its buckets, ConfigMaps and Secrets are declared at the Workflow's root. An App's spec.workflows[] entry must leave it empty: its steps bind what the App declares."
          items:
            additionalProperties: false
            properties:
              bindings:
                $ref: "#/components/schemas/LakeBindings"
                description: "What the Lake's engine uses: Bucket prefixes, and the ConfigMaps and Secrets of its environment."
              buckets:
                description: "The Buckets that a Lake applied on its own declares: by name the Lake creates the Bucket, an omitted prefix owner being the Lake, and a Bucket of that name that is not the Lake's holds it in Pending with StoreNotOwned; by ref it binds an existing one. Each Bucket that the Lake's bindings.blob names must be declared here. A lake that another resource declares sets none."
                items:
                  additionalProperties: false
                  properties:
                    deletion:
                      description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                      enum:
                        - retain
                        - delete
                      type: string
                    name:
                      description: The object's name. It takes the namespace and resource group of the resource that declares it.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                    prefixes:
                      description: The Bucket's prefixes, each a key space with its own owner and cap. Prefix names are unique within the Bucket. A Function or a Lake that binds a prefix the Bucket does not list waits, with the reason BucketNotFound.
                      items:
                        $ref: "#/components/schemas/BucketPrefix"
                      type:
                        - array
                        - "null"
                    quota:
                      $ref: "#/components/schemas/BucketQuota"
                      description: Caps on the Bucket's total size and on each object. While the Bucket has a size cap, funcd refuses to sign a presigned PUT URL for it, with 403.
                    ref:
                      description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                  type: object
                type:
                  - array
                  - "null"
              configMaps:
                description: "The ConfigMaps that a Lake applied on its own declares: by name the Lake defines one, and a ConfigMap of its stored name that is not the Lake's holds it in Pending with StoreNotOwned; by ref it binds an existing one. Each ConfigMap that the Lake's bindings.config names must be declared here. A lake that another resource declares sets none."
                items:
                  additionalProperties: false
                  properties:
                    data:
                      additionalProperties:
                        type: string
                      description: "Keys and their string values, for settings that are not secret. Each key is an environment variable name: ASCII letters, digits and _, not starting with a digit. Each worker of a Function that lists the ConfigMap in bindings.config gets each key as an environment variable when it starts, except a key that starts with FUNCD_ or that a bound Secret also holds. A Lake that lists it gives its engine only the keys that the Lake's bindings.config lets through."
                      type: object
                    name:
                      description: The ConfigMap's name, at most 52 characters. It is stored as <name>-<hash of data>, and the config of each part that names it is set to that stored name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                    ref:
                      description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                  type: object
                type:
                  - array
                  - "null"
              ingress:
                $ref: "#/components/schemas/Ingress"
                description: Exposes the Lake gateway at the edge, only when enabled is true and while the Lake is Ready. The path defaults to /lake/<name>, or / with a host. Setting auth is refused, since the Lake gateway checks each caller itself.
              location:
                $ref: "#/components/schemas/LakeLocation"
                description: The Bucket prefix that holds the Lake's files, one of the Lake's bindings.blob. The Lake waits in Pending, with the reason PrefixNotOwned, until the prefix's owner is this Lake. The Lake's catalog is kept outside the Bucket, under the same location, so a Lake located where another was finds that Lake's files and catalog.
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              resources:
                $ref: "#/components/schemas/ResourceSpec"
                description: The cpu and memory of the Lake's engine. An empty cpu or memory sets no limit on it, and a change replaces the running engine.
              secrets:
                description: The Secrets that a Lake applied on its own declares, with the keys its engine reads. Each Secret that the Lake's bindings.secret names must be declared here, and the Lake waits in Pending, with SecretNotFound or SecretKeyMissing, while one is missing or lacks a key. A lake that another resource declares sets none.
                items:
                  additionalProperties: false
                  properties:
                    description:
                      description: What the Secret is for, for the installer who provides it.
                      type: string
                    keys:
                      description: "The keys read from the Secret: its data must hold each of them."
                      items:
                        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                        type: string
                      minItems: 1
                      type: array
                    name:
                      description: The name of a Secret in the namespace of the resource that declares it. funcd holds its value; the resource never writes it.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                  required:
                    - name
                    - keys
                  type: object
                type:
                  - array
                  - "null"
            type: object
          type:
            - array
            - "null"
        onFailure:
          description: The name of a function step that funcd calls once, without retry, when a run fails. Its input is an object of workflow, run, failedStep, reason and input, the run input. It is not part of the step order, so it sets no dependsOn, when or params and no step depends on it; its result never changes the run's phase, and a cancelled run does not call it.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        pooling:
          $ref: "#/components/schemas/WorkflowPooling"
          description: How the image steps' Functions share workers and stay warm. A step's function.pooling replaces it for that step.
        secrets:
          description: "The Secrets the steps bind, with the keys they read. Until each Secret exists and holds its keys, the Workflow is not Ready and no run of it starts. An App's spec.workflows[] entry must leave it empty: its steps bind what the App declares."
          items:
            additionalProperties: false
            properties:
              description:
                description: What the Secret is for, for the installer who provides it.
                type: string
              keys:
                description: "The keys read from the Secret: its data must hold each of them."
                items:
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                  type: string
                minItems: 1
                type: array
              name:
                description: The name of a Secret in the namespace of the resource that declares it. funcd holds its value; the resource never writes it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            required:
              - name
              - keys
            type: object
          type:
            - array
            - "null"
        sql:
          description: "The SQL databases for the steps to bind. An entry with a name defines a database, its owner naming a step or a declared lake; a ref entry binds an existing one. An App's spec.workflows[] entry must leave it empty: its steps bind what the App declares."
          items:
            additionalProperties: false
            properties:
              deletion:
                description: retain (the default) keeps the store and its data when the resource that declares it drops it or is deleted; delete removes them.
                enum:
                  - retain
                  - delete
                type: string
              name:
                description: The object's name. It takes the namespace and resource group of the resource that declares it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              owner:
                description: The one Function that may write the database, in its namespace, besides the writers that a RolesAssignment names. In a database that a Function declares by name, it defaults to that Function, and in a Workflow's sql it names a step. With no owner, only those writers can write it.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              quota:
                $ref: "#/components/schemas/SizeQuota"
                description: A cap on the database's total size, the bytes of its pages in use. Once it is reached, an execute gets 507 unless each of its statements is a DELETE or a DROP. A change keeps the engine running.
              ref:
                description: The name of an existing object of this kind in the namespace of the resource that declares it. A ref entry sets no other field.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              resources:
                $ref: "#/components/schemas/ResourceSpec"
                description: The cpu and memory of the database's engine. An empty memory means 256Mi, and an empty cpu sets no cpu limit. A change replaces the running engine.
            type: object
          type:
            - array
            - "null"
        steps:
          description: The steps each run executes, at least one. They run in list order unless dependsOn says otherwise, and the first step takes the run input.
          items:
            $ref: "#/components/schemas/WorkflowStep"
          type:
            - array
            - "null"
        timeout:
          description: "The wall-clock bound on a whole run, paused time excluded: 0s to 168h; 0s or unset means no bound."
          pattern: ^([0-9]+h([0-9]+m)?([0-9]+s)?([0-9]+ms)?|[0-9]+m([0-9]+s)?([0-9]+ms)?|[0-9]+s([0-9]+ms)?|[0-9]+ms)$
          patternDescription: "a duration: whole numbers with the units h, m, s and ms, largest unit first (10m, 1h30m, 500ms)"
          type: string
      required:
        - steps
      type: object
    WorkflowStatus:
      additionalProperties: false
      properties:
        conditions:
          description: The conditions that explain the phase.
          items:
            $ref: "#/components/schemas/Condition"
          type:
            - array
            - "null"
        contract:
          $ref: "#/components/schemas/WorkflowContract"
          description: "The run input and output schemas funcd derives once every step type-checks: the first step's input, and the output of the step that ends the run, or an object keyed by step name when several do. A new run's input is checked against it."
        observedGeneration:
          description: The generation of the spec that funcd last acted on.
          format: int64
          type: integer
        phase:
          description: Where the object is in its lifecycle.
          enum:
            - Pending
            - Deploying
            - Ready
            - Idle
            - Degraded
            - Failed
            - Terminating
          type: string
        runs:
          $ref: "#/components/schemas/WorkflowRunLinks"
          description: "The Workflow's runs: those not finished yet by name, and how many ended in each final phase."
        steps:
          description: Each function and workflow step at the last type check, with its resolved image and its contract. A ref step whose Function is missing or serves HTTP has no entry.
          items:
            $ref: "#/components/schemas/WorkflowStepStatus"
          type:
            - array
            - "null"
      type: object
    WorkflowStep:
      additionalProperties: false
      properties:
        builtin:
          $ref: "#/components/schemas/BuiltinStep"
          description: "A step that funcd runs itself, with no Function: a wait or a pass. Exactly one of function, builtin and workflow."
        dependsOn:
          description: The steps this step follows; empty means the step listed before it, not counting the onFailure step. With one parent the step's input is that parent's output, with several an object of their outputs keyed by step name. Each name is another step, not the onFailure step, and the steps form no cycle.
          items:
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            type: string
          type:
            - array
            - "null"
        function:
          $ref: "#/components/schemas/FunctionStep"
          description: "A step that calls a Function: one funcd creates from an image for this step, or an existing one by ref. Exactly one of function, builtin and workflow."
        join:
          description: "How the step waits on its parents: all, the default, runs it when every parent succeeded and skips it otherwise; any waits until every parent has ended, then runs it on the outputs of those that succeeded, or skips it if none did."
          enum:
            - all
            - any
          type: string
        name:
          description: The step's name, unique among the steps. dependsOn, onFailure, store owners and step.<name>.output in expressions refer to the step by it, and an image step's Function is named <workflow>-<step>.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          type: string
        params:
          description: "A JSON object merged over the step's input, its keys winning: a function step gets the result as its input, and a workflow step passes it to the child run. Its values must fit the step's input contract, and a field it sets need not come from a parent. A wait ignores it, and the onFailure step sets none."
        when:
          $ref: "#/components/schemas/StepWhen"
          description: "A condition the step runs on: when it is false, the step is Skipped, and so are the steps after it that need it to succeed. The onFailure step has none."
        workflow:
          $ref: "#/components/schemas/WorkflowRef"
          description: "A step that runs another Workflow as a child run: the step's input, params included, is the child's input, and the child's output is the step's output. A child that does not succeed fails the step, and a Workflow that reaches itself through such steps is never Ready. Exactly one of function, builtin and workflow."
      required:
        - name
      type: object
    WorkflowStepStatus:
      additionalProperties: false
      properties:
        contract:
          $ref: "#/components/schemas/WorkflowContract"
          description: "The step's input and output schemas: read from its image, or the child Workflow's status.contract for a workflow step."
        image:
          description: "The image the step's contract comes from, as <image>@<digest> once it resolves to a digest: a ref step's Function's image, and workflow://<child> for a workflow step."
