apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: billing
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: registry.example.com/billing:1.0.0
  configMaps:
    - name: billing-settings
      data:
        CURRENCY: EUR
        INVOICE_DAY: "1"
  bindings:
    config:
      - billing-settings
