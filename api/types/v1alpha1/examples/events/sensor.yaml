# region ticker
apiVersion: funcd.io/v1alpha1
kind: EventSource
metadata:
  name: ticker
  namespace: default
  resourceGroup: rg1
spec:
  timer:
    events:
      - name: tick
        interval: 10s
---
# region sensor
apiVersion: funcd.io/v1alpha1
kind: Sensor
metadata:
  name: burst-on-tick
  namespace: default
  resourceGroup: rg1
spec:
  on:
    - name: tick
      source: ticker
      event: tick
  do:
    - name: burst
      on: tick
      function: log-burst
# endregion sensor
# endregion ticker
