apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: app-secret
  namespace: default
  resourceGroup: rg1
spec:
  data:
    API_KEY: czNjcjN0
---
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: env-echo
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: registry.example.com/env-echo:1.0.0
  secrets:
    - name: app-secret
      keys:
        - API_KEY
  bindings:
    secret:
      - app-secret
---
# region policy
apiVersion: funcd.io/v1alpha1
kind: Policy
metadata:
  name: forbid-app-secret
  namespace: default
  resourceGroup: rg1
spec:
  cedar: |
    forbid(
      principal == Function::"default/env-echo",
      action == Action::"secret::read",
      resource == Secret::"default/app-secret"
    );
# endregion policy
