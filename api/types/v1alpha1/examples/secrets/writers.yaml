# region owner
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: oauth
  namespace: default
  resourceGroup: rg1
spec:
  owner: refresher
  data:
    TOKEN: dDE=
# endregion owner
---
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: refresher
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: registry.example.com/refresher:1.0.0
  secrets:
    - name: oauth
      keys:
        - TOKEN
  bindings:
    secret:
      - oauth
---
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: api
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: registry.example.com/api:1.0.0
  secrets:
    - name: oauth
      keys:
        - TOKEN
  bindings:
    secret:
      - oauth
---
# region rolesassignment
apiVersion: funcd.io/v1alpha1
kind: RolesAssignment
metadata:
  name: api-writes-oauth
  namespace: default
  resourceGroup: rg1
spec:
  principal:
    kind: Function
    name: api
  assignments:
    - roleRef:
        kind: BuiltinRole
        name: Secret Data Writer
      scope:
        kind: Secret
        name: oauth
# endregion rolesassignment
