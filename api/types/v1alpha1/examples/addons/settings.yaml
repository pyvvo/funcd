apiVersion: funcd.io/v1alpha1
kind: Addon
metadata:
  name: rauthy
spec:
  runtimes:
    - name: rauthy
      image: ghcr.io/pyvvo/funcd-rauthy@sha256:7686fef5edcb27399e23f8386fecb03b13f909966d2c3c4708095e2c31ccfe2d
      workloads:
        - Engine
      attributes:
        kind: IdentityProvider
        port: 8080
        basePath: /auth/v1
        readiness:
          path: /auth/v1/ping
        settings:
          - kind: RauthyPasswordPolicy
            target: spec.config.provider
            function:
              image: ghcr.io/example/rauthy-settings@sha256:b8390e254d5f99832bdcfa0567d144725d1d96907c9da01dc5917f71c3989cba
            constraints:
              count:
                perTarget: 1
---
apiVersion: funcd.io/v1alpha1
kind: IdentityProvider
metadata:
  name: login
  namespace: default
  resourceGroup: default
spec: {}
---
# region policy
apiVersion: funcd.io/v1alpha1
kind: RauthyPasswordPolicy
metadata:
  name: strict
  namespace: default
  resourceGroup: default
spec:
  config:
    provider: login
    lengthMin: 16
    lengthMax: 64
# endregion policy
