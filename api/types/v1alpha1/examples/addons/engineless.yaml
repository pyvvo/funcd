# region addon
apiVersion: funcd.io/v1alpha1
kind: Addon
metadata:
  name: infrastack
spec:
  runtimes:
    - name: infrastack
      workloads:
        - Engineless
      attributes:
        kind: InfraStack
        resync: 30m
        function:
          image: ghcr.io/example/infrastack-reconciler@sha256:73b6ae022fd1e39cc9a4c710911a7f6a1dfe85886193a7b0234ee3381652d9da
# endregion addon
---
# region stack
apiVersion: funcd.io/v1alpha1
kind: InfraStack
metadata:
  name: bunny-edge
  namespace: default
  resourceGroup: default
spec:
  deletion: delete
  bindings:
    job:
      - alias: stack
        job: bunny-edge
  config:
    variables:
      zone: funcd-tunnel
# endregion stack
