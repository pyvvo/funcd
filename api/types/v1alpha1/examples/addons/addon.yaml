# region addon
apiVersion: funcd.io/v1alpha1
kind: Addon
metadata:
  name: rauthy
spec:
  kind: IdentityProvider
  image: ghcr.io/pyvvo/funcd-rauthy@sha256:7686fef5edcb27399e23f8386fecb03b13f909966d2c3c4708095e2c31ccfe2d
  runtimes:
    - containerd
  port: 8080
  basePath: /auth/v1
  privatePaths:
    - /auth/v1/clients_dyn
  readiness:
    path: /auth/v1/ping
  storage:
    path: /app/data
    uid: 10001
    gid: 10001
  config:
    type: object
    additionalProperties: false
    properties:
      publicHost:
        type: string
      https:
        type: boolean
    required:
      - publicHost
      - https
  env:
    PUB_URL: ${{ config.publicHost }}
    PROXY_MODE: '${{ config.https ? "true" : "false" }}'
  secretKeys:
    - ENC_KEYS
    - ENC_KEY_ACTIVE
  snapshot:
    path: /app/data/state_machine/backups
  restore:
    path: /app/data/restore
    env:
      HQL_BACKUP_RESTORE: ${{ "file:" + restore.file }}
  settings:
    - kind: RauthyPasswordPolicy
      target: spec.config.provider
      resync: 10m
      function:
        ref: rauthy-settings
      schema:
        type: object
        additionalProperties: false
        properties:
          provider:
            type: string
          lengthMin:
            type: integer
            minimum: 8
        required:
          - provider
          - lengthMin
      constraints:
        count:
          perTarget: 1
        immutable:
          - spec.config.provider
# endregion addon
